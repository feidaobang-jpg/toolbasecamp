name: Deploy Tool Basecamp

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            public:
              - 'public/**'
            server:
              - 'server/**'
            deploy:
              - 'deploy/**'
            portal_dev:
              - 'deploy/next-tools.ref'
            portal_chef:
              - 'deploy/cyberchef.ref'
            portal_news:
              - 'scripts/news/**'
              - 'deploy/nginx-toolbasecamp-news.conf'
              - 'deploy/patch-nginx-news.sh'
              - 'deploy/news-portal-inject.snippet'
              - 'deploy/install-news-cron.sh'
            portal_pcbuilds:
              - 'scripts/pc-builds/**'
              - 'deploy/install-pc-builds.sh'
              - 'deploy/fix-pcbuilds-api.sh'
            workflow:
              - '.github/workflows/deploy.yml'

      - name: Set full deploy
        id: full
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "yes=1" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.changes.outputs.workflow }}" == "true" ]]; then
            echo "yes=1" >> $GITHUB_OUTPUT
          fi

      - name: Print deploy scope
        run: |
          echo "event=${{ github.event_name }}"
          echo "full=${{ steps.full.outputs.yes }}"
          echo "public=${{ steps.changes.outputs.public }}"
          echo "server=${{ steps.changes.outputs.server }}"
          echo "deploy=${{ steps.changes.outputs.deploy }}"
          echo "portal_dev=${{ steps.changes.outputs.portal_dev }}"
          echo "portal_chef=${{ steps.changes.outputs.portal_chef }}"
          echo "portal_news=${{ steps.changes.outputs.portal_news }}"
          echo "portal_pcbuilds=${{ steps.changes.outputs.portal_pcbuilds }}"
          if [[ "${{ steps.full.outputs.yes }}" == "1" ]]; then
            echo "Full deploy  - all steps enabled."
          elif [[ "${{ steps.changes.outputs.public }}" == "true" \
             && "${{ steps.changes.outputs.server }}" != "true" \
             && "${{ steps.changes.outputs.deploy }}" != "true" \
             && "${{ steps.changes.outputs.portal_dev }}" != "true" \
             && "${{ steps.changes.outputs.portal_chef }}" != "true" \
             && "${{ steps.changes.outputs.portal_news }}" != "true" \
             && "${{ steps.changes.outputs.portal_pcbuilds }}" != "true" ]]; then
            echo "Static-only change  - skip next-tools / CyberChef / API restart."
          fi

      - name: Validate secrets
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          DO_HOST="$(trim "$DO_HOST")"
          DO_USER="$(trim "$DO_USER")"
          if [[ -z "$DO_HOST" || -z "$DO_USER" ]]; then
            echo "::error::DO_HOST and DO_USER must be set (no extra blank lines)."
            exit 1
          fi
          echo "DO_HOST=$DO_HOST" >> "$GITHUB_ENV"
          echo "DO_USER=$DO_USER" >> "$GITHUB_ENV"
          echo "Deploy target: ${DO_USER}@${DO_HOST}"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync static site
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.public == 'true'
        run: |
          VER="$(git rev-parse --short HEAD)"
          # Bust CSS/JS cache in HTML via UTF-8-safe Python (perl -pi under LANG=C corrupts CJK).
          VER="$VER" python3 deploy/bust-html-cache.py
          grep -q 'recipe-ingredient-tags' public/html/life/ai-recipe.html
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            public/ \
            "${DO_USER}@${DO_HOST}:/var/www/toolbasecamp/"

      - name: Rsync API server
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.server == 'true'
        run: |
          git rev-parse HEAD > server/DEPLOY_SHA
          rsync -avz --delete --exclude venv \
            --exclude var/ --exclude tmp_music/ --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            server/ \
            "${DO_USER}@${DO_HOST}:/opt/toolbasecamp-api/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" \
            'mkdir -p /var/lib/toolbasecamp/public-music /var/lib/toolbasecamp/image-results /opt/toolbasecamp-api/tmp_music && test -f /opt/toolbasecamp-api/user_records.py && test -f /opt/toolbasecamp-api/DEPLOY_SHA && echo "API files OK $(cat /opt/toolbasecamp-api/DEPLOY_SHA)"'

      - name: Rsync deploy scripts
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.deploy == 'true'
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            deploy/ \
            "${DO_USER}@${DO_HOST}:/opt/toolbasecamp-deploy/"

      - name: Rsync news crawler
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.portal_news == 'true' || steps.changes.outputs.deploy == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" "mkdir -p /opt/toolbasecamp-news /var/www/toolbasecamp-news"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude '.venv' --exclude '__pycache__' \
            scripts/news/ \
            "${DO_USER}@${DO_HOST}:/opt/toolbasecamp-news/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" "chmod +x /opt/toolbasecamp-news/run_news.sh"

      - name: Rsync PC builds crawler
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.portal_pcbuilds == 'true' || steps.changes.outputs.deploy == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" "mkdir -p /opt/toolbasecamp-pcbuilds /var/www/toolbasecamp/data"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude '.venv' --exclude '__pycache__' \
            scripts/pc-builds/ \
            "${DO_USER}@${DO_HOST}:/opt/toolbasecamp-pcbuilds/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" "chmod +x /opt/toolbasecamp-pcbuilds/run_pc.sh"

      - name: Install news portal (cron + nginx)
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.portal_news == 'true' || steps.changes.outputs.deploy == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" 'bash -s' << 'REMOTE'
          set -euo pipefail
          if [[ ! -f /opt/toolbasecamp-news/build_news.py ]]; then
            echo "news crawler missing - skip"
            exit 0
          fi
          # Ensure deploy scripts present for patch/cert
          if [[ ! -f /opt/toolbasecamp-deploy/patch-nginx-news.sh ]]; then
            echo "patch-nginx-news.sh missing - skip nginx (deploy rsync needed)"
            exit 0
          fi
          bash /opt/toolbasecamp-deploy/install-news-cron.sh
          bash /opt/toolbasecamp-deploy/patch-nginx-news.sh
          REMOTE

      - name: Install PC builds crawler
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.portal_pcbuilds == 'true' || steps.changes.outputs.deploy == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" 'bash -s' << 'REMOTE'
          set -euo pipefail
          if [[ ! -f /opt/toolbasecamp-pcbuilds/build_pc.py ]]; then
            echo "pc builds crawler missing - skip"
            exit 0
          fi
          if [[ -f /opt/toolbasecamp-deploy/install-pc-builds.sh ]]; then
            bash /opt/toolbasecamp-deploy/install-pc-builds.sh
          else
            echo "install-pc-builds.sh missing - skip"
          fi
          REMOTE

      - name: Build next-tools dev portal
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.portal_dev == 'true'
        run: |
          NEXT_TOOLS_REF="$(tr -d '\r\n' < deploy/next-tools.ref)"
          echo "Building next-tools ref: ${NEXT_TOOLS_REF}"
          git clone --depth 1 --branch "${NEXT_TOOLS_REF}" \
            https://github.com/willjayyyy/next-tools.git /tmp/next-tools
          cd /tmp/next-tools
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Download CyberChef release
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.portal_chef == 'true'
        run: |
          CHEF_REF="$(tr -d '\r\n' < deploy/cyberchef.ref)"
          echo "Downloading CyberChef release: ${CHEF_REF}"
          mkdir -p /tmp/cyberchef-bundle
          ASSET_URL="$(curl -fsSL "https://api.github.com/repos/gchq/CyberChef/releases/tags/${CHEF_REF}" \
            | jq -r '.assets[0].browser_download_url')"
          if [[ -z "$ASSET_URL" || "$ASSET_URL" == "null" ]]; then
            echo "::error:: No release asset for ${CHEF_REF}"
            exit 1
          fi
          curl -fsSL -o /tmp/cyberchef-bundle.zip "$ASSET_URL"
          unzip -q /tmp/cyberchef-bundle.zip -d /tmp/cyberchef-bundle
          CHEF_INDEX="$(find /tmp/cyberchef-bundle -type f \( -name index.html -o -name index.html.gz \) | head -1)"
          CHEF_DIR="$(dirname "$CHEF_INDEX")"
          if [[ -z "$CHEF_DIR" || ! -f "$CHEF_DIR/index.html" && ! -f "$CHEF_DIR/index.html.gz" ]]; then
            echo "::error:: index.html / index.html.gz not found in release zip"
            find /tmp/cyberchef-bundle -maxdepth 3 -type f | head -20 || true
            exit 1
          fi
          if [[ -f "$CHEF_DIR/index.html.gz" && ! -f "$CHEF_DIR/index.html" ]]; then
            gunzip -f "$CHEF_DIR/index.html.gz"
          fi
          echo "CHEF_DIR=$CHEF_DIR" >> "$GITHUB_ENV"

      - name: Rsync dev portal
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.portal_dev == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" "mkdir -p /var/www/toolbasecamp-dev"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            /tmp/next-tools/dist/ \
            "${DO_USER}@${DO_HOST}:/var/www/toolbasecamp-dev/"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            deploy/dev-portal-SOURCE.txt \
            "${DO_USER}@${DO_HOST}:/var/www/toolbasecamp-dev/SOURCE.txt"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            /tmp/next-tools/LICENSE \
            "${DO_USER}@${DO_HOST}:/var/www/toolbasecamp-dev/LICENSE"

      - name: Rsync chef portal
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.portal_chef == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" "mkdir -p /var/www/toolbasecamp-chef"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            "${CHEF_DIR}/" \
            "${DO_USER}@${DO_HOST}:/var/www/toolbasecamp-chef/"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            deploy/chef-portal-SOURCE.txt \
            "${DO_USER}@${DO_HOST}:/var/www/toolbasecamp-chef/SOURCE.txt"

      - name: Install API deps and restart
        if: steps.full.outputs.yes == '1' || steps.changes.outputs.server == 'true' || steps.changes.outputs.deploy == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DO_USER}@${DO_HOST}" 'bash -s' << 'REMOTE'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y python3 python3-venv python3-pip libreoffice-writer rsync >/dev/null 2>&1 || true
          if ! command -v mysql >/dev/null 2>&1; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server >/dev/null 2>&1 || true
          fi
          systemctl start mysql 2>/dev/null || systemctl start mariadb 2>/dev/null || true
          if [[ ! -f /etc/toolbasecamp-api.env && -f /opt/toolbasecamp-deploy/install-mysql.sh ]]; then
            bash /opt/toolbasecamp-deploy/install-mysql.sh
          fi
          APP_DIR=/opt/toolbasecamp-api
          mkdir -p "$APP_DIR"
          [[ -d "$APP_DIR/venv" ]] || python3 -m venv "$APP_DIR/venv"
          "$APP_DIR/venv/bin/pip" install -q -U pip
          "$APP_DIR/venv/bin/pip" install -q -r "$APP_DIR/requirements.txt"
          # rembg is optional (large); install best-effort so core API still deploys
          if [[ -f "$APP_DIR/requirements-general-cutout.txt" ]]; then
            "$APP_DIR/venv/bin/pip" install -q -r "$APP_DIR/requirements-general-cutout.txt" \
              || echo "WARN: rembg install failed  - general cutout will return 503 until installed"
          fi
          "$APP_DIR/venv/bin/pip" uninstall -y passlib 2>/dev/null || true
          rm -rf "$APP_DIR/__pycache__"
          (
            cd "$APP_DIR"
            "$APP_DIR/venv/bin/python" -c "from main import hash_password, verify_password; h=hash_password('deploy_check'); assert verify_password('deploy_check', h)"
            "$APP_DIR/venv/bin/python" -c "from main import app; paths=[getattr(r,'path','') for r in app.routes]; assert '/recipe/generate' in paths and '/recipe/detect' in paths, 'missing recipe routes: ' + str(paths); assert '/records/days' in paths, 'missing records routes: ' + str(paths); assert '/records/todos' in paths, 'missing todos routes: ' + str([p for p in paths if 'todo' in p or 'record' in p]); assert '/records/rents' in paths, 'missing rents routes: ' + str([p for p in paths if 'rent' in p or 'record' in p]); assert '/records/online-games' in paths, 'missing online-games routes: ' + str([p for p in paths if 'online' in p or 'record' in p]); assert '/records/online-games/{game_id}/draft-scores' in paths, 'missing online draft-scores: ' + str([p for p in paths if 'online' in p]); assert '/records/online-games/{game_id}/delete' in paths, 'missing online delete: ' + str([p for p in paths if 'online' in p]); assert '/records/clocks/{clock_id}/reset' in paths, 'missing clock reset route: ' + str([p for p in paths if 'clock' in p]); assert '/records/clocks/{clock_id}/logs' in paths, 'missing clock logs route: ' + str([p for p in paths if 'clock' in p]); assert '/watermark/image/process' in paths, 'missing watermark routes: ' + str([p for p in paths if 'water' in p]); assert '/wan/i2v/submit' in paths and '/wan/status' in paths, 'missing wan i2v routes: ' + str([p for p in paths if 'wan' in p]); assert '/image/general-cutout/segment' in paths, 'missing general cutout route: ' + str([p for p in paths if 'image' in p or 'cutout' in p]); assert '/life-plans/generate' in paths and '/life-plans/status' in paths and '/life-plans/drug-label' in paths, 'missing life-plans routes: ' + str([p for p in paths if 'life' in p]); assert '/stats/hit' in paths and '/stats' in paths and '/stats/event' in paths and '/stats/overview' in paths, 'missing site stats routes: ' + str([p for p in paths if 'stat' in p]); assert '/nbcheck/status' in paths and '/nbcheck/refresh' in paths and '/nbcheck/{list_id}' in paths, 'missing nbcheck routes: ' + str([p for p in paths if 'nbcheck' in p]); assert '/wallet/admin/users' in paths and '/wallet/redeem' in paths, 'missing wallet routes: ' + str([p for p in paths if 'wallet' in p]); from life_plans import PLAN_KINDS; assert 'day_trip' in PLAN_KINDS and 'travel_pack' in PLAN_KINDS and 'fitness_week' in PLAN_KINDS and 'job_apply_week' in PLAN_KINDS and 'pet_travel' in PLAN_KINDS and 'shopping' not in PLAN_KINDS and 'wishlist' not in PLAN_KINDS, 'unexpected life-plan kinds: ' + str(sorted(PLAN_KINDS)); import wan_video; assert wan_video.wan_configured or True"
          )
          cp /opt/toolbasecamp-deploy/toolbasecamp-api.service /etc/systemd/system/toolbasecamp-api.service
          systemctl daemon-reload
          systemctl enable toolbasecamp-api
          # API first: nginx API patch + DB + nuclear restart (do not let portal scripts block this)
          bash /opt/toolbasecamp-deploy/patch-nginx-api.sh || true
          bash /opt/toolbasecamp-deploy/ensure-api-db.sh || true
          bash /opt/toolbasecamp-deploy/restart-api-core.sh
          # From here, portal/fix scripts are best-effort; final wallet check re-enables -e
          set +e
          # Portal / secondary nginx (best-effort; must not block API deploy)
          bash /opt/toolbasecamp-deploy/patch-nginx-main-cache.sh || true
          bash /opt/toolbasecamp-deploy/patch-nginx-main.sh || true
          bash /opt/toolbasecamp-deploy/install-portal-home-bar-dev.sh || true
          bash /opt/toolbasecamp-deploy/patch-nginx-dev.sh || true
          bash /opt/toolbasecamp-deploy/install-stirling-tessdata.sh || true
          bash /opt/toolbasecamp-deploy/patch-stirling-config.sh || true
          if [[ ! -f /opt/toolbasecamp-deploy/pdf-on-nas.flag ]]; then
            bash /opt/toolbasecamp-deploy/install-stirling-pdf.sh || true
            bash /opt/toolbasecamp-deploy/install-stirling-warmup-cron.sh || true
            bash /opt/toolbasecamp-deploy/patch-nginx-pdf.sh || true
          else
            echo "pdf-on-nas.flag set  - skip Stirling PDF on VPS"
            bash /opt/toolbasecamp-deploy/stop-vps-pdf-after-nas-migration.sh || true
          fi
          if [[ ! -f /var/www/toolbasecamp-chef/index.html ]]; then
            bash /opt/toolbasecamp-deploy/install-cyberchef-release.sh || true
          fi
          bash /opt/toolbasecamp-deploy/patch-nginx-chef.sh || true
          bash /opt/toolbasecamp-deploy/install-hoppscotch.sh || true
          bash /opt/toolbasecamp-deploy/patch-nginx-hoppscotch.sh || true
          if [[ ! -f /opt/toolbasecamp-deploy/translate-on-nas.flag ]]; then
            bash /opt/toolbasecamp-deploy/install-libretranslate.sh || true
            bash /opt/toolbasecamp-deploy/build-libretranslate-app-patch.sh || true
            bash /opt/toolbasecamp-deploy/patch-nginx-translate.sh || true
          else
            echo "translate-on-nas.flag set  - skip LibreTranslate on VPS"
            bash /opt/toolbasecamp-deploy/stop-vps-translate-after-nas-migration.sh || true
          fi
          if [[ -f /opt/toolbasecamp-news/build_news.py ]]; then
            bash /opt/toolbasecamp-deploy/install-news-cron.sh || true
            bash /opt/toolbasecamp-deploy/patch-nginx-news.sh || true
          else
            echo "news crawler not present  - skip news portal"
          fi
          bash /opt/toolbasecamp-deploy/install-mysql-backup-cron.sh || true
          bash /opt/toolbasecamp-deploy/install-api-health-cron.sh || true
          echo "=== Nuclear restart before start ==="
          systemctl stop toolbasecamp-api 2>/dev/null || true
          sleep 1
          fuser -k 8001/tcp 2>/dev/null || true
          pkill -9 -f '/opt/toolbasecamp-api/venv/bin/python' 2>/dev/null || true
          pkill -9 -f 'run.py' 2>/dev/null || true
          sleep 2
          # Port must be free before start, otherwise systemd may leave an old orphan listening.
          for _ in 1 2 3 4 5; do
            if ss -lnt 2>/dev/null | grep -q ':8001'; then
              echo "port 8001 still busy  - killing again"
              fuser -k -9 8001/tcp 2>/dev/null || true
              pkill -9 -f '/opt/toolbasecamp-api/venv/bin/python' 2>/dev/null || true
              sleep 2
            else
              break
            fi
          done
          rm -rf /opt/toolbasecamp-api/__pycache__ /opt/toolbasecamp-api/*/__pycache__ 2>/dev/null || true
          find /opt/toolbasecamp-api -name '*.pyc' -delete 2>/dev/null || true
          systemctl reset-failed toolbasecamp-api 2>/dev/null || true
          systemctl start toolbasecamp-api
          sleep 2
          systemctl is-active toolbasecamp-api
          ss -lntp 2>/dev/null | grep 8001 || netstat -lntp 2>/dev/null | grep 8001 || true
          # Always nuke once more  - DEPLOY_SHA on disk can update while an orphan keeps old PLAN_KINDS.
          echo "=== Force life-plans process reload ==="
          bash /opt/toolbasecamp-deploy/fix-life-plans-api.sh || true
          bash /opt/toolbasecamp-deploy/fix-fx-api.sh || true
          bash /opt/toolbasecamp-deploy/fix-stats-api.sh || true
          bash /opt/toolbasecamp-deploy/fix-auth-api.sh || true
          bash /opt/toolbasecamp-deploy/fix-records-api.sh || true
          bash /opt/toolbasecamp-deploy/fix-stocks-api.sh || true
          bash /opt/toolbasecamp-deploy/fix-nbcheck-api.sh || true
          bash /opt/toolbasecamp-deploy/fix-news-api.sh || true
          bash /opt/toolbasecamp-deploy/fix-pcbuilds-api.sh || true
          # Re-assert wallet after optional fix scripts (they may restart API)
          bash /opt/toolbasecamp-deploy/restart-api-core.sh
          # Prove the *listening* process is the new code (not a stale orphan)
          HEALTH_JSON="$(curl -sf http://127.0.0.1:8001/health || true)"
          echo "health immediately after start: $HEALTH_JSON"
          if ! echo "$HEALTH_JSON" | grep -F '"general_cutout_api":true' >/dev/null \
            || ! echo "$HEALTH_JSON" | grep -F '"life_plans_api":true' >/dev/null \
            || ! echo "$HEALTH_JSON" | grep -F '"life_plans_ready":true' >/dev/null \
            || ! echo "$HEALTH_JSON" | grep -F '"life_plans_prompt_rev":9' >/dev/null \
            || ! echo "$HEALTH_JSON" | grep -F '"life_plans_guest_ok":true' >/dev/null; then
            echo "stale process detected right after start  - running fix scripts"
            bash /opt/toolbasecamp-deploy/fix-general-cutout-api.sh || true
            bash /opt/toolbasecamp-deploy/fix-life-plans-api.sh
          fi
          HEALTH_OK=0
          for i in 1 2 3 4 5 6 7 8; do
            HEALTH_JSON="$(curl -sf http://127.0.0.1:8001/health || true)"
            echo "health try $i: $HEALTH_JSON"
            if echo "$HEALTH_JSON" | grep -F '"recipe_api":true' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_api":true' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_todos":true' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_rents":true' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_online_games":true' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_online_draft":true' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_online_delete":true' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_online_draft_rev":3' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"auth_phone_login":true' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"auth_phone_rev":3' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_rent_pay_rev":4' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_rent_due_max":31' >/dev/null \
              && echo "$HEALTH_JSON" | grep -F '"records_clock_reset":true' >/dev/null \
