          echo "HTTPS $HTTP_CODE"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning:: news portal HTTPS returned $HTTP_CODE  - add Cloudflare DNS: news A record (orange cloud), then re-run deploy."
            exit 0
          fi
          if ! grep -qi '??\|Tool Basecamp' /tmp/news-public.html; then
            echo "::warning:: news URL did not look like news portal HTML."
            exit 0
          fi
