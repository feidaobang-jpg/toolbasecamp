        if: steps.full.outputs.yes == '1' || steps.changes.outputs.portal_news == 'true' || steps.changes.outputs.deploy == 'true'
        run: |
          sleep 3
          HTTP_CODE="$(curl -s -o /tmp/news-public.html -w '%{http_code}' \
