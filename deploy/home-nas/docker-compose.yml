services:
  # The NAS/WSL tunnel stays: it also carries the home-PC ComfyUI endpoint
  # (comfy.zhengxiaohui.cn). Retired with the 2026-10 portal shutdown:
  # tbc-stirling-pdf / tbc-pdf-proxy (pdf.zhengxiaohui.cn) and
  # tbc-libretranslate / tbc-translate-proxy (translate.zhengxiaohui.cn).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tbc-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --protocol http2
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      # Avoid Windows/Clash proxy breaking tunnel QUIC/TCP to Cloudflare edge
      NO_PROXY: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    dns:
      - 1.1.1.1
      - 8.8.8.8
