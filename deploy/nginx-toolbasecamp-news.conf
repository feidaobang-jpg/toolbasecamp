server {
    listen 80;
    listen [::]:80;
    server_name news.zhengxiaohui.cn;

    root /var/www/toolbasecamp-news;
    index index.html;

    include snippets/toolbasecamp-api.conf;

    location / {
        try_files $uri $uri/ =404;
        gzip off;
        sub_filter '</head>' 'NEWS_HEAD_INJECT</head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    error_page 403 404 = @news_missing;
    location @news_missing {
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>News not ready</title></head><body><h1>News portal not initialized</h1><p>Run:<br><code>sudo bash /opt/toolbasecamp-deploy/patch-nginx-news.sh</code><br>then<br><code>sudo /opt/toolbasecamp-news/run_news.sh</code></p></body></html>';
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/xml;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name news.zhengxiaohui.cn;

    ssl_certificate /etc/letsencrypt/live/zhengxiaohui.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhengxiaohui.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/toolbasecamp-news;
    index index.html;

    include snippets/toolbasecamp-api.conf;

    location / {
        try_files $uri $uri/ =404;
        gzip off;
        sub_filter '</head>' 'NEWS_HEAD_INJECT</head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    error_page 403 404 = @news_missing;
    location @news_missing {
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>News not ready</title></head><body><h1>News portal not initialized</h1><p>Run:<br><code>sudo bash /opt/toolbasecamp-deploy/patch-nginx-news.sh</code><br>then<br><code>sudo /opt/toolbasecamp-news/run_news.sh</code></p></body></html>';
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/xml;
}
