# pdf / translate live on home NAS via Cloudflare Tunnel (toolbasecamp.com).
# Serve ICP hostnames here so the main site can drop the old domain.
map $http_upgrade $nas_connection {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pdf.zhengxiaohui.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pdf.zhengxiaohui.cn;

    ssl_certificate /etc/letsencrypt/live/zhengxiaohui.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhengxiaohui.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200m;

    location / {
        proxy_pass https://pdf.toolbasecamp.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host pdf.toolbasecamp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nas_connection;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 30s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name translate.zhengxiaohui.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name translate.zhengxiaohui.cn;

    ssl_certificate /etc/letsencrypt/live/zhengxiaohui.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhengxiaohui.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass https://translate.toolbasecamp.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host translate.toolbasecamp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nas_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
