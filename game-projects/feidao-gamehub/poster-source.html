<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 900px; overflow: hidden; }
  body {
    background: #f7f1e3;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    position: relative;
  }
  h1 {
    position: absolute; top: 52px; left: 0; right: 0; text-align: center;
    font-size: 78px; letter-spacing: 6px; color: #3a3122; font-weight: 800;
  }
  .sub {
    position: absolute; top: 172px; left: 0; right: 0; text-align: center;
    font-size: 31px; letter-spacing: 7px; color: #9c9280; font-weight: 600;
  }
  .row { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 62px; }
  .row1 { top: 250px; }
  .row2 { top: 552px; gap: 96px; }
  .card {
    width: 292px; height: 232px; background: #fff; border-radius: 12px; padding: 9px 9px 0;
    box-shadow: 0 10px 22px rgba(58, 49, 34, .18); position: relative;
  }
  .shot { width: 100%; height: 172px; border-radius: 6px; overflow: hidden; position: relative; background: #ddd; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap {
    position: absolute; left: 9px; right: 9px; bottom: 9px; height: 46px; border-radius: 0 0 6px 6px;
    background: linear-gradient(180deg, rgba(10,22,38,.88), rgba(8,18,32,.96));
    padding: 6px 10px 0;
  }
  .cap b { display: block; color: #f2f6ff; font-size: 15px; letter-spacing: 1px; }
  .cap span { display: block; color: #8fa3bd; font-size: 10px; letter-spacing: 1px; margin-top: 2px; }
  .r1 { transform: rotate(-4deg); }
  .r2 { transform: rotate(3deg) translateY(-14px); }
  .r3 { transform: rotate(-2deg) translateY(6px); }
  .r4 { transform: rotate(3deg); }
  .r5 { transform: rotate(-3deg) translateY(-8px); }
  .names {
    position: absolute; bottom: 46px; left: 0; right: 0; text-align: center;
    font-size: 30px; font-weight: 800; color: #4f8a5b; letter-spacing: 2px;
  }
  /* 源图自带标题条的两张卡不再叠标题，避免出现两条 */
  .card.bare .cap { display: none; }
  .card.bare .shot { height: 214px; }
</style>
</head>
<body>
  <h1>飞刀班长游戏合集</h1>
  <div class="sub">6 款自制游戏 · 点开即玩</div>
  <div class="row row1">
    <div class="card r1"><div class="shot"><img src="./package/assets/feidao-jackal-3d.png"></div><div class="cap"><b>赤色要塞 3D</b><span>点击即玩 · 飞刀班长</span></div></div>
    <div class="card r2"><div class="shot"><img src="./package/assets/feidao-cadillacs-3d.png"></div><div class="cap"><b>恐龙快打 3D</b><span>点击即玩 · 飞刀班长</span></div></div>
    <div class="card r3 bare"><div class="shot"><img src="./package/assets/feidao-tank-3d.png"></div><div class="cap"><b>坦克大战 3D</b><span>点击即玩 · 飞刀班长</span></div></div>
  </div>
  <div class="row row2">
    <div class="card r4 bare"><div class="shot"><img src="./package/assets/feidao-mario-3d.png"></div><div class="cap"><b>超级玛丽 3D：1-1 至 1-4</b><span>点击即玩 · 飞刀班长</span></div></div>
    <div class="card r5"><div class="shot"><img src="./package/assets/feidao-gunfire.jpg"></div><div class="cap"><b>枪火集结</b><span>点击即玩 · 飞刀班长</span></div></div>
  </div>
  <div class="names">虫潮围城 · 坦克大战 · 赤色要塞 · 超级玛丽 · 恐龙快打 · 枪火集结</div>
</body>
</html>
