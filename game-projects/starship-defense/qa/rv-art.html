<!doctype html><meta charset="utf-8"><title>房车美术回归与采集</title>
<style>body{margin:0;background:#101820;color:#eee;font:14px system-ui}nav{padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{padding:9px;cursor:pointer}iframe{width:100%;height:720px;border:0}pre{white-space:pre-wrap;padding:12px}</style>
<nav><button id="street">街道对照</button><button id="front">房车正面</button><button id="combat">住宅区实战（20秒）</button><button id="drive">驾驶与转镜头（20秒）</button><button id="views">四个视角回归</button><button id="restore">退出与重进回归</button><button id="behaviour">碰撞存档与服务回归</button><button id="record">录制20秒实机</button></nav>
<iframe id="game" src="../../../public/html/game/starship-defense/index.html?qa=1"></iframe><pre id="result">等待游戏加载。本页仅供开发验证；重定位和模拟按键均明确标识，不随Toy发布。</pre>
<script>
const frame=document.querySelector('iframe'),out=document.querySelector('pre'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let running=false;
if(new URLSearchParams(location.search).has('baseline'))frame.src='/baseline/public/html/game/starship-defense/index.html?qa=1';
const get=()=>frame.contentWindow.__gameQA,win=()=>frame.contentWindow;
function mute(q){q.AudioSys.init();if(q.AudioSys.master)q.AudioSys.master.gain.value=0;}
function position(scene='street'){
 const q=get();if(!q)throw Error('游戏未就绪');q.rvBreakout.start();mute(q);q.Game.state='paused';q.Game.msgTimer=0;frame.contentDocument.getElementById('msg').classList.add('hidden');
 const p=scene==='combat'?[-55,1568]:scene==='front'?[0,1608]:[0,1555],r=q.rvBreakout.state;r.rv.mesh.position.set(p[0],0,p[1]);r.lastPos={x:p[0],z:p[1]};q.player.pos.copy(r.rv.mesh.position);q.setCameraView(0,false);q.setCamYaw(scene==='front'?Math.PI*.77:scene==='combat'?-.6:.28);q.camState.init=false;
 for(let i=0;i<60;i++)q.updCamera(1/60);q.rvBreakout.renderFrame?.(0);q.renderer.render(q.scene,q.camera);out.textContent='已设置同一站位：'+scene+'；暂停状态，QA重定位。';return q;
}
function key(code,down){const w=win();w.dispatchEvent(new w.KeyboardEvent(down?'keydown':'keyup',{code,key:code.replace('Key','').toLowerCase(),bubbles:true}));}
async function measure(kind){if(running)return;running=true;try{const q=position(kind==='combat'?'combat':'street');q.Game.state='battle';await sleep(2000);q.startMeasure();key(kind==='combat'?'KeyJ':'KeyW',true);await sleep(8000);if(kind!=='combat'){key('KeyW',false);key('KeyE',true);}await sleep(10000);key('KeyW',false);key('KeyE',false);key('KeyJ',false);const metrics=q.endMeasure();q.Game.state='paused';out.textContent=JSON.stringify({kind,method:'QA起点重定位，随后实际RAF和DOM键盘事件驱动，性能采样与录像分开',metrics,rv:{hp:q.rvBreakout.state.rv.hp,position:q.rvBreakout.state.rv.mesh.position.toArray(),distance:q.rvBreakout.state.traveled},errors:win().__rvArtErrors||[]},null,2);}catch(e){out.textContent=JSON.stringify({error:e.message});}finally{running=false;}}
document.querySelector('#street').onclick=()=>position();document.querySelector('#front').onclick=()=>position('front');document.querySelector('#combat').onclick=()=>measure('combat');document.querySelector('#drive').onclick=()=>measure('drive');
document.querySelector('#views').onclick=async()=>{const q=position('front'),results=[];for(let i=0;i<4;i++){if(i===3)q.setCamMode('first',false);else q.setCameraView(i,false);q.Game.state='battle';key('KeyE',true);await sleep(2200);key('KeyE',false);q.Game.state='paused';results.push({view:i,camera:q.camera.position.toArray(),finite:q.camera.position.toArray().every(Number.isFinite),hp:q.rvBreakout.state.rv.hp});await sleep(600);}out.textContent=JSON.stringify({views:results,errors:win().__rvArtErrors||[]},null,2);};
document.querySelector('#restore').onclick=()=>{const q=get();if(q.rvBreakout.state.active)q.rvBreakout.stop();const before={fog:q.scene.fog.color.getHex(),near:q.scene.fog.near,far:q.scene.fog.far,exposure:q.renderer.toneMappingExposure,resources:{...q.renderer.info.memory}};const results=[];for(let i=0;i<3;i++){q.rvBreakout.start();q.rvBreakout.save();const save=q.rvBreakout.read();q.rvBreakout.stop();results.push({saved:!!save,active:q.rvBreakout.state.active,artRoots:q.scene.children.filter(o=>o.name==='rv-sunset-atmosphere').length,fog:q.scene.fog.color.getHex(),exposure:q.renderer.toneMappingExposure});}out.textContent=JSON.stringify({before,cycles:results,errors:win().__rvArtErrors||[]},null,2);};
document.querySelector('#behaviour').onclick=()=>{try{const q=position(),r=q.rvBreakout,tests=[],check=(name,ok,data)=>{tests.push({name,pass:!!ok,data});if(!ok)throw Error(name);};check('36只分区僵尸保持不变',q.monsters.length===36&&q.monsters.every(m=>m.rvZombie));const seen=new Set(['0,1524']),queue=[[0,1524]];for(let i=0;i<queue.length;i++){const [x,z]=queue[i];for(const [dx,dz] of [[2,0],[-2,0],[0,2],[0,-2]]){const nx=x+dx,nz=z+dz,k=nx+','+nz;if(!seen.has(k)&&!r.blocked(nx,nz,3)){seen.add(k);queue.push([nx,nz]);}}}const reachable=[...r.sites,...r.zones].map(n=>({name:n.name,reachable:queue.some(([x,z])=>Math.hypot(x-n.x,z-n.z)<8)}));check('所有补给设施和感染区仍可驾车到达',reachable.every(n=>n.reachable),reachable);check('房屋碰撞和主路保留',r.blocked(-79,1558,3)&&!r.blocked(0,1640,3));r.state.rv.mesh.position.set(112,0,1545);q.player.pos.copy(r.state.rv.mesh.position);r.state.lastPos={x:112,z:1545};r.state.rv.hp=800;r.state.scrap=500;r.job('repair');for(let i=0;i<130;i++)r.update(.05);check('修理厂真实作业规则保留',r.state.rv.hp===1250&&r.state.scrap===460);r.save();const saved=r.read();r.stop();r.start(saved);q.Game.state='paused';mute(q);check('城镇存档保留位置和资源',r.state.rv.hp===1250&&r.state.scrap===460&&r.state.rv.mesh.position.x===112);out.textContent=JSON.stringify({tests,errors:win().__rvArtErrors||[]},null,2);}catch(e){out.textContent=JSON.stringify({failed:e.message});}};
document.querySelector('#record').onclick=async()=>{const q=position('combat'),canvas=frame.contentDocument.getElementById('c3d'),stream=canvas.captureStream(30),chunks=[],recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:6000000});recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='rv-art-realtime.webm';a.textContent='下载刚录制的实机录像';document.querySelector('nav').append(a);stream.getTracks().forEach(t=>t.stop());};recorder.start();q.Game.state='battle';key('KeyJ',true);await sleep(6000);key('KeyJ',false);key('KeyE',true);await sleep(6000);key('KeyE',false);key('KeyW',true);await sleep(8000);key('KeyW',false);q.Game.state='paused';recorder.stop();out.textContent='20秒实时游戏画面录制完成；QA住宅区起点，键盘射击、转向与驾驶，无音轨。';};
frame.onload=()=>{win().__rvArtErrors=[];win().addEventListener('error',e=>win().__rvArtErrors.push(e.message));};
</script>
