<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>10月11日玩家反馈回归</title>
<style>body{font:15px sans-serif;background:#edf4df;margin:12px}button{padding:12px}iframe{display:block;border:0;width:1100px;height:620px}pre{white-space:pre-wrap}</style>
<button id="run">运行反馈回归</button><button id="phone">手机布局</button><button id="desktop">电脑布局</button><iframe id="game" src="../../public/html/game/starship-defense/index.html?qa=1"></iframe><pre id="results">加载游戏后运行</pre>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('pre');
const setPos=(q,x,z)=>{q.Input.reset();q.player.dead=false;q.player.inVehicle=null;q.player.pos.set(x,q.groundY(x,z),z);q.player.mesh.position.copy(q.player.pos);q.player.vy=0;q.player.onGround=true;};
document.querySelector('#run').onclick=()=>{
 const results=[],check=(name,pass,detail)=>results.push({name,pass,detail});
 try{
 const q=frame.contentWindow.__gameQA;q.newGame(true);q.Game.state='paused';q.clearEntities(true);
 for(const [x,z] of [[-63,230],[0,240],[63,230],[0,298],[0,30]]){
  setPos(q,x,z);const v=q.spawnVehicle('tank');v.mesh.position.copy(q.player.pos);q.enterVehicle(v);q.exitVehicle();
  const p=q.player.pos,ground=q.groundY(p.x,p.z);
  check(`坦克下车 ${x},${z}`,Math.abs(p.y-ground)<.01&&q.player.onGround&&!q.collideWalls(p.x,p.z,.5,p.y),{y:p.y,ground,onGround:q.player.onGround});
  q.clearEntities(true);
 }
 const points=[[-104,208,-106,190],[-68,235,-105,200],[0,240,0,165],[68,235,105,200],[0,295,0,165],[-105,200,0,295],[0,165,0,295],[105,200,0,295],[-63,230,63,230]];
 for(const [x,z,tx,tz] of points){
  q.clearEntities(true);const m=q.spawnMonster('mob',x,z);m.emerge=0;m.mesh.position.y=q.groundY(x,z);const target=q.player.pos.clone().set(tx,q.groundY(tx,tz),tz);
  let steps=0;for(;steps<1600&&m.mesh.position.distanceTo(target)>3;steps++){
   const dir=q.navDir(m,target)||target.clone().sub(m.mesh.position).setY(0).normalize();q.moveMonster(m,dir,.05,1,m.navWaypoint);
  }
  check(`追击 ${x},${z} 到 ${tx},${tz}`,m.mesh.position.distanceTo(target)<3,{steps,end:m.mesh.position.toArray()});
 }
 q.clearEntities(true);setPos(q,0,30);q.player.grenadeCd=0;
 const gold=q.Game.gold,items=JSON.stringify(q.Game.items),first=q.throwGrenade();let repeated=0;
 for(let i=0;i<40;i++)if(q.throwGrenade())repeated++;
 check('连按仅发一枚',first&&repeated===0,{repeated});
 for(let i=0;i<29;i++)q.updPlayer(.1);check('2.9秒仍冷却',!q.throwGrenade(),q.player.grenadeCd);
 q.updPlayer(.11);check('3秒后可继续无限投掷',q.throwGrenade()&&gold===q.Game.gold&&items===JSON.stringify(q.Game.items));
 q.updHUD(.01);check('触屏和HUD显示冷却',frame.contentDocument.querySelector('#vU').textContent.includes('3')&&frame.contentDocument.querySelector('#itemTxt').textContent.includes('3'));
 q.player.reset(q.Game.cls);check('重开清除冷却',q.throwGrenade());
 q.clearEntities(true);setPos(q,-85,230);q.Game.state='paused';q.updHUD(.01);q.updCamera(.1);
 }catch(e){results.push({pass:false,error:e.stack});}
 out.textContent=JSON.stringify({passed:results.filter(r=>r.pass).length,total:results.length,results},null,2);
};
document.querySelector('#phone').onclick=()=>{frame.style.width='390px';frame.style.height='844px';frame.contentWindow.__gameQA.setDeviceMode('touch');};
document.querySelector('#desktop').onclick=()=>{frame.style.width='1100px';frame.style.height='620px';frame.contentWindow.__gameQA.setDeviceMode('desktop');};
</script></html>
