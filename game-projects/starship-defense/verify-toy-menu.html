<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Toy 首页尺寸验证</title>
<style>body{margin:12px;font:14px sans-serif;background:#eaf0df}button{padding:10px}iframe{display:block;border:0;margin-top:8px;width:390px;height:844px}p{margin:8px 0}</style>
<button id="portrait">390×844 竖屏容器</button><button id="landscape">844×346 横屏容器</button><button id="desktop">1100×620 电脑容器</button>
<p id="source"></p><iframe title="Toy官方外壳中的游戏"></iframe>
<script>
const frame=document.querySelector('iframe'),url=new URLSearchParams(location.search).get('toy')||'https://www.bilibili.com/toy/chongchao-qianshao/index.html';
if(!/^https:\/\/www\.bilibili\.com\/toy\/(?:chongchao-qianshao|preview\/preview_[a-zA-Z0-9]+)\/index\.html$/.test(url))throw Error('仅允许虫潮公开Toy或官方预览地址');
frame.src=url;document.querySelector('#source').textContent=url;
function size(w,h){frame.style.width=w+'px';frame.style.height=h+'px';}
document.querySelector('#portrait').onclick=()=>size(390,844);
document.querySelector('#landscape').onclick=()=>size(844,346);
document.querySelector('#desktop').onclick=()=>size(1100,620);
</script></html>
