<script>const cc={"zh": "WEBVTT\n\n1\n00:00:00.220 --> 00:00:01.740\n只剩三张兵力票，\n\n2\n00:00:02.033 --> 00:00:02.840\n还能赢吗？\n\n3\n00:00:03.332 --> 00:00:04.728\n这场据点争夺，\n\n4\n00:00:04.970 --> 00:00:06.140\n最后真的险胜了。\n\n5\n00:00:07.387 --> 00:00:09.582\n这是虫潮围城的战地模式。\n\n6\n00:00:10.087 --> 00:00:12.682\n旧镇、通信站、补给仓库，\n\n7\n00:00:12.974 --> 00:00:14.269\n抢的就是这三个点。\n\n8\n00:00:15.520 --> 00:00:16.540\n控制两个点，\n\n9\n00:00:16.682 --> 00:00:18.740\n就会持续扣掉对面的兵力票。\n\n10\n00:00:19.220 --> 00:00:20.265\n光顾着追人，\n\n11\n00:00:20.495 --> 00:00:21.390\n旗子被偷，\n\n12\n00:00:21.582 --> 00:00:22.502\n照样会输。\n\n13\n00:00:22.995 --> 00:00:24.228\n喜欢这个玩法，\n\n14\n00:00:24.432 --> 00:00:25.490\n顺手点个赞。\n\n15\n00:00:26.753 --> 00:00:28.586\n这次没有买兵和升级。\n\n16\n00:00:29.091 --> 00:00:30.936\n五种兵种用固定装备，\n\n17\n00:00:31.216 --> 00:00:32.661\n开局我选工程兵，\n\n18\n00:00:33.016 --> 00:00:34.198\n先开坦克推进。\n\n19\n00:00:35.453 --> 00:00:37.836\n这段是另开一局补拍的载具战。\n\n20\n00:00:38.341 --> 00:00:39.798\n坦克沿着道路推进，\n\n21\n00:00:40.053 --> 00:00:41.323\n挨打会掉装甲，\n\n22\n00:00:41.528 --> 00:00:43.086\n步兵也在往旗点靠。\n\n23\n00:00:44.353 --> 00:00:45.386\n回到主战局，\n\n24\n00:00:45.666 --> 00:00:46.848\n第一波我就倒了。\n\n25\n00:00:47.341 --> 00:00:50.598\n但不用一直从老家跑：选已经占住的仓库，\n\n26\n00:00:50.753 --> 00:00:51.873\n换成医疗兵，\n\n27\n00:00:51.978 --> 00:00:53.061\n再部署到前线。\n\n28\n00:00:54.320 --> 00:00:55.878\n残血的时候按支援，\n\n29\n00:00:56.207 --> 00:00:57.440\n血量就能补回来。\n\n30\n00:00:57.932 --> 00:00:59.128\n活着留在圈里，\n\n31\n00:00:59.370 --> 00:01:01.328\n比冲出去再送一次更有用。\n\n32\n00:01:02.587 --> 00:01:04.769\n中间的通信站反复易手。\n\n33\n00:01:05.274 --> 00:01:06.732\n我贴着掩体交火，\n\n34\n00:01:06.937 --> 00:01:08.369\n再扔手雷压住路口。\n\n35\n00:01:08.874 --> 00:01:10.907\n对面也会开车和反扑，\n\n36\n00:01:11.137 --> 00:01:12.507\n真不能一直硬冲。\n\n37\n00:01:13.753 --> 00:01:14.486\n到最后，\n\n38\n00:01:14.753 --> 00:01:16.348\n两边兵力都见底了。\n\n39\n00:01:16.841 --> 00:01:18.811\n我们守住通信站和仓库，\n\n40\n00:01:19.091 --> 00:01:20.398\n对面票数归零，\n\n41\n00:01:20.603 --> 00:01:21.761\n我方剩三票。\n\n42\n00:01:23.020 --> 00:01:25.952\n结算挺有意思：我方击杀九十四，\n\n43\n00:01:26.208 --> 00:01:27.302\n对面一百零五。\n\n44\n00:01:27.808 --> 00:01:29.090\n杀得更多的一边，\n\n45\n00:01:29.320 --> 00:01:30.190\n反而输了。\n\n46\n00:01:30.682 --> 00:01:32.102\n抢点和保住自己，\n\n47\n00:01:32.332 --> 00:01:33.227\n都得算进去。\n\n48\n00:01:34.487 --> 00:01:36.257\n这一局靠占点赢下来了，\n\n49\n00:01:36.599 --> 00:01:38.569\n正面硬冲还是很容易倒。\n\n50\n00:01:39.074 --> 00:01:42.057\n下次我想试试兵种配合和侧翼夺点。\n\n51\n00:01:42.562 --> 00:01:45.232\n虫潮围城现在可以在百宝箱试玩，\n\n52\n00:01:45.512 --> 00:01:47.507\n想玩什么也可以填愿望单。\n", "en": "WEBVTT\n\n1\n00:00:00.220 --> 00:00:01.740\nOnly three tickets left.\n\n2\n00:00:02.033 --> 00:00:02.840\nCould we still win?\n\n3\n00:00:03.332 --> 00:00:04.728\nThis conquest match\n\n4\n00:00:04.970 --> 00:00:06.140\nended in a very close victory.\n\n5\n00:00:07.387 --> 00:00:09.582\nThis is the Battlefield mode in Swarm Siege.\n\n6\n00:00:10.087 --> 00:00:12.682\nOld Town, Comms Station and Supply Depot:\n\n7\n00:00:12.974 --> 00:00:14.269\nthese are the three objectives.\n\n8\n00:00:15.520 --> 00:00:16.540\nControl two objectives\n\n9\n00:00:16.682 --> 00:00:18.740\nand the enemy keeps losing tickets.\n\n10\n00:00:19.220 --> 00:00:20.265\nChase enemies while\n\n11\n00:00:20.495 --> 00:00:21.390\nyour flags get taken,\n\n12\n00:00:21.582 --> 00:00:22.502\nand you can still lose.\n\n13\n00:00:22.995 --> 00:00:24.228\nIf you like this mode,\n\n14\n00:00:24.432 --> 00:00:25.490\nleave a like.\n\n15\n00:00:26.753 --> 00:00:28.586\nThere is no troop purchasing or leveling up here.\n\n16\n00:00:29.091 --> 00:00:30.936\nFive classes have fixed loadouts.\n\n17\n00:00:31.216 --> 00:00:32.661\nI choose Engineer at the start\n\n18\n00:00:33.016 --> 00:00:34.198\nand push forward in a tank.\n\n19\n00:00:35.453 --> 00:00:37.836\nThis vehicle footage is from a separate match.\n\n20\n00:00:38.341 --> 00:00:39.798\nThe tank advances along the road.\n\n21\n00:00:40.053 --> 00:00:41.323\nIts armor drops when it takes hits.\n\n22\n00:00:41.528 --> 00:00:43.086\nInfantry are moving toward the objectives too.\n\n23\n00:00:44.353 --> 00:00:45.386\nBack in the main match,\n\n24\n00:00:45.666 --> 00:00:46.848\nI went down in the first push.\n\n25\n00:00:47.341 --> 00:00:50.598\nSelect our captured depot instead of running from HQ,\n\n26\n00:00:50.753 --> 00:00:51.873\nswitch to Medic,\n\n27\n00:00:51.978 --> 00:00:53.061\nand redeploy near the front.\n\n28\n00:00:54.320 --> 00:00:55.878\nUse support when hurt\n\n29\n00:00:56.207 --> 00:00:57.440\nto recover health.\n\n30\n00:00:57.932 --> 00:00:59.128\nStaying alive inside the objective\n\n31\n00:00:59.370 --> 00:01:01.328\nhelps more than rushing out and dying again.\n\n32\n00:01:02.587 --> 00:01:04.769\nThe central Comms Station changes hands repeatedly.\n\n33\n00:01:05.274 --> 00:01:06.732\nI fight from cover\n\n34\n00:01:06.937 --> 00:01:08.369\nand throw a grenade toward the junction.\n\n35\n00:01:08.874 --> 00:01:10.907\nThe enemy uses vehicles and counterattacks too.\n\n36\n00:01:11.137 --> 00:01:12.507\nI cannot just keep charging straight in.\n\n37\n00:01:13.753 --> 00:01:14.486\nBy the end,\n\n38\n00:01:14.753 --> 00:01:16.348\nboth teams were almost out of tickets.\n\n39\n00:01:16.841 --> 00:01:18.811\nWe held Comms Station and Supply Depot.\n\n40\n00:01:19.091 --> 00:01:20.398\nThe enemy reached zero;\n\n41\n00:01:20.603 --> 00:01:21.761\nwe had three left.\n\n42\n00:01:23.020 --> 00:01:25.952\nThe result is interesting: our team scored 94 kills,\n\n43\n00:01:26.208 --> 00:01:27.302\nand theirs scored 105.\n\n44\n00:01:27.808 --> 00:01:29.090\nThe team with more kills\n\n45\n00:01:29.320 --> 00:01:30.190\nstill lost.\n\n46\n00:01:30.682 --> 00:01:32.102\nObjectives and staying alive\n\n47\n00:01:32.332 --> 00:01:33.227\nboth matter.\n\n48\n00:01:34.487 --> 00:01:36.257\nWe won this match through objective control,\n\n49\n00:01:36.599 --> 00:01:38.569\nbut direct charges were still deadly.\n\n50\n00:01:39.074 --> 00:01:42.057\nNext time I want to try class teamwork and flanking.\n\n51\n00:01:42.562 --> 00:01:45.232\nYou can now play 虫潮围城, Swarm Siege, on the Treasure Box website.\n\n52\n00:01:45.512 --> 00:01:47.507\nYou can also submit a game idea to the wishlist.\n"};let urls=[];function select(v){const p=document.getElementById('player');p.pause();urls.forEach(u=>URL.revokeObjectURL(u));urls=[];const tracks=Object.entries(cc).map(([l,s])=>{const u=URL.createObjectURL(new Blob([s],{type:'text/vtt'}));urls.push(u);return '<track kind="subtitles" src="'+u+'" srclang="'+l+'" label="'+(l==='zh'?'中文':'English')+'" '+(l==='zh'?'default':'')+'>';}).join('');p.innerHTML=v==='youtube'?'<source src="../../final/youtube-zh/gameplay-youtube-final.mp4" type="video/mp4">'+tracks:'<source src="../../final/bilibili-zh/gameplay-zh-final.mp4" type="video/mp4">';p.load();}</script></main></html>
