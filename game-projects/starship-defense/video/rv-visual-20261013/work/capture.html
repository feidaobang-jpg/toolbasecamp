<!doctype html><meta charset="utf-8"><title>房车新旧画面对比采集</title>
<style>body{margin:0;background:#10202a;color:white;font:16px system-ui}nav{padding:12px;display:flex;gap:8px}button{padding:12px}iframe{width:1920px;height:1080px;border:0;display:block}pre{white-space:pre-wrap;max-height:200px;overflow:auto;padding:12px}</style>
<nav><button id="old">载入旧版0.36.9</button><button id="new">载入新版0.37.4</button><button id="beauty">同站位画面录制</button><button id="orbit">同角度绕车（24秒）</button><button id="journey">新版正常驾驶与搜索</button><button id="stop">停止并保存</button></nav>
<iframe id="game" src="/public/html/game/starship-defense/index.html?qa=1"></iframe><pre id="result">加载中</pre>
<script>
const frame=document.querySelector('iframe'),out=document.querySelector('pre'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let version='new',running=false,recorder=null,chunks=[],stream=null,audioDest=null,started=0,events=[],held=new Set(),abort=false;
const w=()=>frame.contentWindow,q=()=>w().__gameQA,d=()=>frame.contentDocument;
const save=(name,data)=>fetch('/capture/'+name,{method:'POST',body:data});
const note=text=>out.textContent=text;
function key(code,down){const target=w();target.dispatchEvent(new target.KeyboardEvent(down?'keydown':'keyup',{code,key:code.replace('Key','').toLowerCase(),bubbles:true}));}
function keys(wanted){for(const k of [...held])if(!wanted.includes(k)){key(k,false);held.delete(k);}for(const k of wanted)if(!held.has(k)){key(k,true);held.add(k);}}
async function press(k){key(k,true);await sleep(80);key(k,false);}
function snapshot(){const z=q(),s=z.rvBreakout.state,v=s.rv;return {t:(performance.now()-started)/1000,game:s.elapsed,version,state:z.Game.state,testMode:z.Game.testMode,active:s.active,over:s.over,dead:z.player.dead,x:v?.mesh.position.x,z:v?.mesh.position.z,px:z.player.pos.x,pz:z.player.pos.z,hp:v?.hp,person:z.player.hp,inVehicle:!!z.player.inVehicle,yaw:z.getCamYaw(),scrap:s.scrap,fuel:s.fuel,looted:s.looted,defeated:s.defeated?.length,search:s.search};}
async function mark(name){events.push({name,...snapshot()});q().renderer.render(q().scene,q().camera);await new Promise(r=>d().getElementById('c3d').toBlob(async b=>{await save(version+'-'+name+'.png',b);r();}));note(JSON.stringify(events.at(-1),null,2));}
function audio(){const a=q().AudioSys;a.init();a.resume();a.master.disconnect();audioDest=a.ctx.createMediaStreamDestination();a.master.connect(audioDest);a.master.gain.value=.65;}
async function begin(name){audio();const canvas=d().getElementById('c3d');stream=canvas.captureStream(30);audioDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));chunks=[];events=[];started=performance.now();const mime='video/webm;codecs=vp9,opus';recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:18000000,audioBitsPerSecond:192000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.start(1000);recorder.name=name;}
async function finish(){keys([]);if(recorder&&recorder.state!=='inactive'){await new Promise(r=>{recorder.onstop=r;recorder.stop();});await save(recorder.name+'.webm',new Blob(chunks,{type:'video/webm'}));await save(recorder.name+'.json',JSON.stringify({version,duration:(performance.now()-started)/1000,canvas:{width:d().getElementById('c3d').width,height:d().getElementById('c3d').height},method:(recorder.name.includes('beauty')||recorder.name.includes('orbit'))?'real-time render; same-position QA staging, no modified model or lighting':'normal new game; real-time adaptive keyboard input; no health/resource/position modification',events,final:snapshot()},null,2));stream.getTracks().forEach(t=>t.stop());}q().Game.state='paused';q().AudioSys.ctx?.suspend();running=false;note('已完成并保存 '+recorder?.name);}
async function load(v){if(running)throw Error('请先停止');version=v;frame.src=(v==='old'?'/baseline':'')+'/public/html/game/starship-defense/index.html?qa=1';note('正在载入'+v);}
document.querySelector('#old').onclick=()=>load('old');document.querySelector('#new').onclick=()=>load('new');
frame.onload=()=>{const ready=setInterval(()=>{if(q()){clearInterval(ready);q().setDeviceMode('desktop');note('已就绪：'+version);}},200);};
async function beauty(){if(running)return;running=true;abort=false;try{const a=q();a.rvBreakout.start();a.Game.state='paused';a.Game.msgTimer=0;d().getElementById('msg').classList.add('hidden');const s=a.rvBreakout.state;s.rv.mesh.position.set(0,0,1555);s.lastPos={x:0,z:1555};a.player.pos.copy(s.rv.mesh.position);a.setCameraView(0,false);a.setCamYaw(.28);a.camState.init=false;for(let i=0;i<60;i++)a.updCamera(1/60);a.rvBreakout.renderFrame?.(0);a.renderer.render(a.scene,a.camera);await begin(version+'-beauty');await mark('street');await sleep(4500);a.Game.state='battle';keys(['KeyE']);await sleep(7000);keys([]);await mark('orbit');keys(['KeyW']);await sleep(4200);keys([]);await mark('drive');keys(['KeyQ']);await sleep(3600);keys([]);await mark('side');await sleep(3000);keys(['KeyE']);await sleep(5000);keys([]);await sleep(5000);await mark('last');await finish();}catch(e){note(e.stack);await finish();}}
function route(goal){const a=q(),b=a.rvBreakout,s=b.state,from=a.player.inVehicle?s.rv.mesh.position:a.player.pos,radius=a.player.inVehicle?2.7:.85,step=4,x0=-172,z0=1504,W=87,H=91;const ix=x=>Math.max(0,Math.min(W-1,Math.round((x-x0)/step))),iz=z=>Math.max(0,Math.min(H-1,Math.round((z-z0)/step))),start=iz(from.z)*W+ix(from.x),end=iz(goal.z)*W+ix(goal.x),dist=new Float64Array(W*H).fill(Infinity),parent=new Int32Array(W*H).fill(-1),closed=new Uint8Array(W*H),open=[start];dist[start]=0;const h=k=>Math.abs(k%W-end%W)+Math.abs(Math.floor(k/W)-Math.floor(end/W));let found=false;while(open.length){open.sort((a,b)=>dist[b]+h(b)-dist[a]-h(a));const k=open.pop();if(closed[k])continue;closed[k]=1;if(k===end){found=true;break;}const x=k%W,z=Math.floor(k/W);for(const [dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,zz=z+dz;if(xx<0||xx>=W||zz<0||zz>=H)continue;const j=zz*W+xx;if(closed[j]||b.blocked(x0+xx*step,z0+zz*step,radius))continue;const dd=dist[k]+1;if(dd<dist[j]){dist[j]=dd;parent[j]=k;open.push(j);}}}if(!found)throw Error('没有可通行路线');const path=[];for(let k=end;k!==start&&k>=0;k=parent[k])path.push({x:x0+k%W*step,z:z0+Math.floor(k/W)*step});path.reverse();const slim=[];for(let i=0;i<path.length;i++){const p=path[i-1],n=path[i+1];if(!p||!n||p.x!==n.x&&p.z!==n.z)slim.push(path[i]);}slim.push(goal);return slim;}
async function navigate(goal,label){keys([]);let path=route(goal),i=0,lastMove=Date.now(),last=null;const end=Date.now()+90000;while(Date.now()<end&&!abort){const s=snapshot();if(s.over||s.dead)throw Error('本局结束');const pos=s.inVehicle?{x:s.x,z:s.z}:{x:s.px,z:s.pz};if(Math.hypot(goal.x-pos.x,goal.z-pos.z)<(s.inVehicle?3.3:1.6)){keys([]);await mark(label);return;}let t=path[i];if(Math.hypot(t.x-pos.x,t.z-pos.z)<(s.inVehicle?3.4:1.8)&&i<path.length-1)t=path[++i];const dx=t.x-pos.x,dz=t.z-pos.z,f=dx*Math.sin(s.yaw)+dz*Math.cos(s.yaw),r=-dx*Math.cos(s.yaw)+dz*Math.sin(s.yaw),want=[];if(Math.abs(f)>1)want.push(f>0?'KeyW':'KeyS');if(Math.abs(r)>1)want.push(r>0?'KeyD':'KeyA');keys(want);if(last&&Math.hypot(last.x-pos.x,last.z-pos.z)>.8)lastMove=Date.now();if(Date.now()-lastMove>4500){keys([]);path=route(goal);i=0;lastMove=Date.now();}last=pos;await sleep(140);}if(!abort)throw Error('路线超时：'+label);}
async function journey(){if(running)return;running=true;abort=false;try{if(version!=='new')throw Error('实战只用新版');const a=q();if(a.rvBreakout.state.active)a.rvBreakout.stop();d().getElementById('btnRV').click();d().getElementById('rvStart').click();await sleep(150);if(!d().getElementById('confirmPanel').classList.contains('hidden'))d().getElementById('confirmOk').click();await sleep(1000);if(a.Game.testMode)throw Error('非正常规则');await begin('new-journey');await mark('start');await sleep(2200);await navigate({x:0,z:1554},'main-street');await navigate({x:-68,z:1587},'homes-arrive');await sleep(8000);await mark('combat');await press('KeyI');await navigate({x:-55,z:1585},'homes-on-foot');await press('KeyI');await sleep(6000);await mark('searched');const s=snapshot();await navigate({x:s.x,z:s.z},'return-to-rv');await press('KeyI');await sleep(1200);await mark('boarded');await navigate({x:0,z:1625},'street-return');await sleep(3000);keys(['KeyE']);await sleep(4500);keys([]);await mark('ending');await sleep(4500);await finish();}catch(e){events.push({error:e.stack,...snapshot()});await finish();}}
document.querySelector('#beauty').onclick=beauty;document.querySelector('#journey').onclick=journey;document.querySelector('#stop').onclick=()=>{abort=true;keys([]);finish();};
document.querySelector('#orbit').onclick=async()=>{if(running)return;running=true;abort=false;try{const a=q();a.rvBreakout.start();a.Game.state='paused';a.Game.msgTimer=0;const s=a.rvBreakout.state;s.rv.mesh.position.set(0,0,1555);s.lastPos={x:0,z:1555};a.player.pos.copy(s.rv.mesh.position);a.setCameraView(0,false);a.setCamYaw(2.6);a.camState.init=false;for(let i=0;i<60;i++)a.updCamera(1/60);a.renderer.render(a.scene,a.camera);await begin(version+'-orbit');await mark('orbit-start');await new Promise(resolve=>{const start=performance.now();let previous=start;function step(now){const elapsed=(now-start)/1000;a.setCamYaw(2.6+Math.PI*2*Math.min(elapsed/24,1));a.updCamera(Math.min((now-previous)/1000,.05));previous=now;a.renderer.render(a.scene,a.camera);if(elapsed<24&&!abort)requestAnimationFrame(step);else resolve();}requestAnimationFrame(step);});await mark('orbit-end');await finish();}catch(e){note(e.stack);await finish();}};
</script>
