<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏试玩 — 百宝箱</title>
    <meta name="description" content="在百宝箱试玩坦克大战等游戏，支持电脑键盘与手机触屏。">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="vendor/font-awesome/css/all.min.css?v=nosTW1" rel="stylesheet">
    <link rel="stylesheet" href="css/site-mobile-nav.css?v=nosTW1">
    <link rel="stylesheet" href="css/base.css?v=nosTW1">
  <link rel="stylesheet" href="css/site-shell.css?v=nosTW1">
  <link rel="stylesheet" href="css/tools-hub.css?v=toy-first1">
  <link rel="stylesheet" href="css/creator-follow.css?v=bilibili1">
  <link rel="stylesheet" href="css/game-vote.css?v=vote-layout4">
</head>
<body id="top" class="site-page site-page--hub">
    <header class="site-header site-header--shrink">
        <div class="site-header-inner">
            <a href="index.html" class="site-brand">
                <div class="site-logo logo-text">TB</div>
                <h1 class="site-name site-title">百宝箱</h1>
            </a>
            <nav data-nav="main" data-base-path="" class="site-nav-main"></nav>
            <div id="site-header-mobile-slot" class="site-header-mobile-slot"></div>
        </div>
    </header>

    <div class="site-hub-layout">
        <main class="site-main site-main--hub">
            <div id="hub-shell" class="hub-shell">
                <div class="hub-body">
                    <div class="hub-center hub-center-wide" id="hub-center">
                        <div id="hub-mobile-toolbar" class="hub-mobile-toolbar" aria-hidden="true"></div>
                        <div class="hub-center-inner">
                            <div id="game-vote-board"></div>
                            <section class="creator-follow" aria-labelledby="creator-follow-title">
                                <div class="creator-follow-copy">
                                    <h2 id="creator-follow-title" data-i18n="creator.gamesTitle">喜欢这些小游戏？来 B 站找我</h2>
                                    <p data-i18n="creator.gamesDesc">飞刀班长 · 分享 AI 游戏开发过程、玩法演示和更新视频。</p>
                                </div>
                                <a class="tb-btn" href="https://space.bilibili.com/16214353" target="_blank" rel="noopener noreferrer" title="在新标签页打开飞刀班长的 B 站主页" data-i18n-title="creator.openTip">
                                    <span data-i18n="creator.link">作者的 B 站</span>
                                    <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                                </a>
                            </section>
                            <div id="toy-games"><div id="main-content"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/locales/zh-CN.js?v=mario3d-v2"></script>
    <script src="js/i18n.js?v=game-clicks1"></script>
    <script src="js/astra-games-catalog.js?v=cfb7f37d20"></script>
    <script src="js/config.js?v=mario3d-v2"></script>
    <script id="tb-stats-script" src="js/tb-stats.js?v=game-clicks1"></script>
    <script src="js/common_ui.js?v=nosTW1"></script>
    <script src="js/game-vote-client.js?v=gamewish2"></script>
    <script src="js/games-vote-board.js?v=wish-row-main1"></script>
    <script src="js/games-hub.js?v=toy-default1"></script>
    <script>
      (function () {
        function go() {
            if (typeof renderGamesVoteBoard === 'function') renderGamesVoteBoard();
            if (typeof renderGamesHub === 'function') renderGamesHub();
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
        else go();
      })();
    </script>
</body>
</html>
