<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook - 工具大本营</title>
    <meta name="description" content="Leave feedback, suggestions, or greetings on the 工具大本营留言板." data-i18n-content="site.description">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="vendor/font-awesome/css/all.min.css?v=nosTW1" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css?v=nosTW1">
  <link rel="stylesheet" href="css/site-shell.css?v=nosTW1">
  <link rel="stylesheet" href="css/content-page.css?v=nosTW1">
    <link rel="stylesheet" href="css/site-mobile-nav.css?v=nosTW1">
    <link rel="stylesheet" href="css/guestbook.css?v=nosTW1">
    <script src="js/locales/en.js?v=i2i-name1"></script>
    <script src="js/locales/zh-CN.js?v=i2i-name1"></script>
    <script src="js/i18n.js?v=nosTW1"></script>
    <script src="js/config.js?v=nosTW1"></script>
    <script src="js/common_ui.js?v=nosTW1"></script>
</head>
<body class="site-page">
    <header class="site-header site-header--sticky">
        <div class="site-header-inner">
            <a href="index.html" class="site-brand">
                <div class="site-logo logo-text">TB</div>
                <h1 class="site-name site-title">工具大本营</h1>
            </a>
            <nav data-nav="main" data-base-path="" class="site-nav-main"></nav>
            <div id="site-header-mobile-slot" class="site-header-mobile-slot"></div>
        </div>
    </header>

    <main class="site-main site-main--content">
        <div class="content-hero">
            <h1 class="content-hero-title">
                <span class="content-hero-accent"></span>
                <span data-i18n="guestbook.title">Guestbook</span>
            </h1>
            <p class="auth-head-sub" data-i18n="guestbook.subtitle">Share ideas, feedback, or a quick hello.</p>
        </div>

        <section class="content-section">
            <h2 class="content-section-title" data-i18n="guestbook.writeTitle">Write a message</h2>
            <div id="gb-login-hint" class="content-hint-box hidden">
                <i class="fas fa-user-circle mr-1"></i>
                <span data-i18n="guestbook.postingAs">Posting as</span> <span id="gb-login-name" class="gb-login-name"></span>
            </div>
            <div id="gb-guest-fields" class="gb-field">
                <label for="gb-guest-name" class="auth-field-label" data-i18n="guestbook.displayName">Display name</label>
                <input id="gb-guest-name" type="text" maxlength="20" data-i18n-placeholder="guestbook.guestPlaceholder"
                    class="content-input">
            </div>
            <div class="gb-field">
                <label for="gb-content" class="auth-field-label" data-i18n="guestbook.message">Message</label>
                <textarea id="gb-content" rows="4" maxlength="500" data-i18n-placeholder="guestbook.messagePlaceholder"
                    class="content-textarea"></textarea>
                <div class="content-char-count"><span id="gb-char-count">0</span>/500</div>
            </div>
            <div id="gb-status" class="content-status hidden"></div>
            <button id="gb-submit" type="button" class="tb-btn" data-i18n="guestbook.post">Post message</button>
        </section>

        <section>
            <div class="gb-section-head">
                <h2 data-i18n="guestbook.allMessages">All messages</h2>
            </div>
            <div id="gb-list" class="gb-list">
                <div id="gb-loading" class="gb-loading">
                    <i class="fas fa-spinner fa-spin"></i> <span data-i18n="guestbook.loading">Loading...</span>
                </div>
            </div>
            <div id="gb-load-more-wrap" class="gb-load-more-wrap hidden">
                <button id="gb-load-more" type="button" class="tb-btn" data-i18n="guestbook.loadMore">Load more</button>
            </div>
            <div id="gb-empty" class="hidden gb-empty">
                <i class="fas fa-comment-dots gb-empty-icon"></i>
                <span data-i18n="guestbook.empty">No messages yet — be the first!</span>
            </div>
        </section>
    </main>

    <script src="js/guestbook.js?v=nosTW1"></script>
</body>
</html>
