<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>收件箱 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="../../../vendor/font-awesome/css/all.min.css?v=nosTW2" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/base.css?v=nosTW2" />
  <link rel="stylesheet" href="../../../css/admin-shell.css?v=nosTW4" />
  <link rel="stylesheet" href="../../../css/admin/chat-inbox.css?v=nosTW2" />
  <script src="../../../js/locales/en.js?v=i2i-name1"></script>
  <script src="../../../js/locales/zh-CN.js?v=i2i-name1"></script>
  <script src="../../../js/i18n.js?v=nosTW2"></script>
  <script src="../../../js/config.js?v=nosTW2"></script>
  <script src="../../../js/common_ui.js?v=nosTW2"></script>
  <style>
    .chat-bubble-me { background: #2563eb; color: #fff; }
    .chat-bubble-them { background: #f3f4f6; color: #111827; }
    .thread-active { background: #eff6ff; border-color: #93c5fd; }
  </style>
</head>
<body class="admin-page">
  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="../private.html" class="admin-back">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
      </a>
      <h1 class="admin-title" data-i18n="privateHub.ops.chatInboxTitle">收件箱</h1>
      <span id="inbox-unread" class="admin-inbox-unread"></span>
      <div class="admin-header-actions">
        <span id="auth-label" class="admin-auth-label"></span>
      </div>
    </div>
  </header>

  <main class="admin-main admin-main--inbox">
    <div id="boot-loading" class="admin-card admin-card--center">加载中…</div>
    <div id="gate" class="admin-card admin-card--center hidden" hidden>
      <p id="gate-msg" class="admin-gate-msg" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
      <a id="gate-login" href="../../auth/login.html?next=%2Fhtml%2Fadmin%2Fprivate%2Fchat-inbox.html" class="tb-btn" data-i18n="auth.login">登录</a>
    </div>

    <div id="app" class="inbox-app hidden" hidden>
      <aside class="inbox-panel">
        <div class="inbox-panel-head">
          <span class="inbox-panel-title" data-i18n="chat.inboxThreads">会话</span>
          <button type="button" id="btn-refresh-threads" class="inbox-refresh-btn" data-i18n="chat.refresh">刷新</button>
        </div>
        <div id="thread-list" class="inbox-thread-list"></div>
      </aside>
      <section class="inbox-panel">
        <div class="inbox-chat-head">
          <div id="thread-title" class="inbox-chat-title" data-i18n="chat.inboxPick">选择左侧会话</div>
          <div id="chat-status" class="inbox-chat-status"></div>
        </div>
        <div id="chat-log" class="inbox-chat-log"></div>
        <div id="composer" class="inbox-composer hidden">
          <textarea id="chat-input" rows="2" maxlength="2000"
            data-i18n-placeholder="chat.placeholder" placeholder="输入消息…"></textarea>
          <button type="button" id="chat-send" class="tb-btn" data-i18n="chat.send">发送</button>
        </div>
      </section>
    </div>
  </main>
  <script src="../../../js/admin/admin-gate.js?v=nosTW5"></script>
  <script src="../../../js/admin/chat-inbox.js?v=nosTW5"></script>
</body>
</html>
