<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>图生 3D - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="../../../../vendor/font-awesome/css/all.min.css?v=homepc16" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../css/base.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/docs/docs-common.css?v=imgSq5" />
  <link rel="stylesheet" href="../../../../css/admin/home-pc.css?v=i23d10" />
  <script src="../../../../js/locales/en.js?v=i23d12"></script>
  <script src="../../../../js/locales/zh-CN.js?v=i23d12"></script>
  <script src="../../../../js/i18n.js?v=homepc26"></script>
  <script src="../../../../js/config.js?v=i23d1"></script>
  <script src="../../../../js/common_ui.js?v=homepc4"></script>
  <script src="../../../../js/shared/image-upload-compress.js?v=imgup2"></script>
  <!-- three@0.170.0：本地 vendor，避免刷新卡在 cdn.jsdelivr.net -->
  <script type="importmap">
  {
    "imports": {
      "three": "../../../../vendor/three/0.170.0/build/three.module.js",
      "three/addons/": "../../../../vendor/three/0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="home-pc-page">
  <div class="home-pc-container">
    <aside id="home-pc-sidebar" class="sidebar" aria-label="家里电脑"></aside>
    <div class="home-pc-content">
      <header class="home-pc-header">
        <div class="home-pc-header-inner">
          <a href="../../private.html" class="home-pc-back">
            <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
          </a>
          <h1 class="home-pc-title" data-i18n="privateHub.homePc.i23dTitle">图生 3D</h1>
          <div class="home-pc-header-actions">
            <span id="auth-label" class="home-pc-auth-label"></span>
            <a id="login-link" href="../../../auth/login.html" class="home-pc-login-link hidden" data-i18n="auth.login">登录</a>
          </div>
        </div>
      </header>
      <main class="home-pc-main">
        <div id="boot-loading" class="home-pc-card home-pc-card--center" data-i18n="privateHub.homePc.loading">加载中…</div>
        <div id="gate" class="home-pc-card home-pc-card--center hidden" hidden>
          <p id="gate-msg" class="home-pc-gate-msg" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
          <a id="gate-login" href="../../../auth/login.html" class="tb-btn" data-i18n="auth.login">去登录</a>
        </div>
        <div id="app" class="home-pc-wrap hidden" hidden>
          <p class="home-pc-desc" id="i23d-hint" data-i18n="privateHub.homePc.i23dHint">本机图生 3D：Hunyuan3D-2。</p>
          <div id="api-status" class="home-pc-status home-pc-status--checking" role="status"></div>
          <p id="engine-line" class="home-pc-desc" style="margin-top:-8px"></p>

          <div class="tool-container">
            <div class="input-section">
              <span class="home-pc-field-label" data-i18n="privateHub.homePc.i23dImageLabel">参考图</span>
              <div class="drop-zone tb-input-image" id="drop-zone">
                <div class="drop-icon">+</div>
                <div class="drop-title" data-i18n="privateHub.homePc.i23dDropTitle">点击或拖入图片</div>
                <div class="drop-hint" data-i18n="privateHub.homePc.i23dDropHint">建议卡通/白底物体；实景可先图生图转卡通。大图会自动压缩。</div>
              </div>
              <input type="file" id="file-input" accept="image/*" hidden />
              <div id="ref-preview-wrap" class="i23d-ref-preview tb-input-image-preview" hidden>
                <div class="home-pc-img-card">
                  <img id="ref-preview" alt="" />
                  <div class="action-row">
                    <button type="button" id="ref-clear-btn" class="tb-btn" data-i18n="privateHub.homePc.clear">清空</button>
                  </div>
                </div>
              </div>

              <div class="home-pc-field" style="margin-top:12px">
                <span class="home-pc-field-label" data-i18n="privateHub.homePc.i23dEnginesLabel">引擎</span>
                <div id="engine-checks" class="trailer-aspect-row" style="margin-top:8px;flex-wrap:wrap;gap:10px"></div>
              </div>

              <div class="form-row">
                <div class="input-control">
                  <label for="mesh-detail-input" data-i18n="privateHub.homePc.i23dMeshDetailLabel">面数（游戏向）</label>
                  <select id="mesh-detail-input" class="text-input">
                    <option value="game" selected data-i18n="privateHub.homePc.i23dMeshDetailGame">游戏低模（约 ≤6k 面）</option>
                    <option value="mid" data-i18n="privateHub.homePc.i23dMeshDetailMid">中等（约 ≤30k 面）</option>
                    <option value="high" data-i18n="privateHub.homePc.i23dMeshDetailHigh">高模（不额外减面）</option>
                  </select>
                  <p class="small-hint" style="margin:6px 0 0" data-i18n="privateHub.homePc.i23dMeshDetailHint">低模更适合 Godot/手游；高模文件大、预览也更慢。</p>
                </div>
              </div>

              <div class="form-row">
                <div class="input-control">
                  <label for="seed-input" data-i18n="privateHub.homePc.txt2imgSeedLabel">种子（可选）：</label>
                  <input id="seed-input" class="text-input" type="text" data-i18n-placeholder="privateHub.homePc.txt2imgSeedPlaceholder" placeholder="留空随机" />
                </div>
              </div>
              <div>
                <label for="prompt-input" data-i18n="privateHub.homePc.i23dPromptLabel">备注（可选）</label>
                <textarea id="prompt-input" rows="2" data-i18n-placeholder="privateHub.homePc.i23dPromptPlaceholder" placeholder="仅记入历史，不参与多数引擎推理…"></textarea>
              </div>
            </div>

            <div class="action-row home-pc-tool-actions">
              <button type="button" id="start-btn" class="tb-btn" data-i18n="privateHub.homePc.generate">生成</button>
              <button type="button" id="cancel-btn" class="tb-btn" style="display:none" data-i18n="privateHub.homePc.cancelTask">取消任务</button>
              <button type="button" id="download-btn" class="tb-btn" style="display:none" data-i18n="privateHub.homePc.download">下载</button>
              <button type="button" id="clear-btn" class="tb-btn" data-i18n="privateHub.homePc.clear">清空</button>
            </div>

            <div id="progress-wrap" class="progress-wrap" style="display:none">
              <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px;color:#666">
                <span id="progress-status">生成中…</span>
                <span id="progress-percent">—</span>
              </div>
              <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar" style="width:40%"></div>
              </div>
            </div>

            <div id="result-box" class="home-pc-result-box" style="display:none">
              <h3 class="home-pc-result-title" data-i18n="privateHub.homePc.i23dResultTitle">生成结果</h3>
              <p id="meta-line" class="home-pc-result-meta"></p>
              <div id="compare-mesh-list" class="i23d-mesh-grid" style="display:none"></div>
              <p id="viewer-hint" class="i23d-viewer-hint" style="display:none" data-i18n="privateHub.homePc.i23dViewerHint">点击上方成功卡片，下方每次只预览一个模型</p>
              <div id="viewer-shade-bar" class="action-row i23d-viewer-shade-bar" style="display:none" role="toolbar">
                <button type="button" class="tb-btn i23d-shade-btn is-active" data-shade="clay" data-i18n="privateHub.homePc.i23dShadeClay">白模</button>
                <button type="button" class="tb-btn i23d-shade-btn" data-shade="wire" data-i18n="privateHub.homePc.i23dShadeWire">线框</button>
                <button type="button" class="tb-btn i23d-shade-btn" data-shade="material" data-i18n="privateHub.homePc.i23dShadeMaterial">原材质</button>
                <button type="button" class="tb-btn" id="viewer-orient-btn" data-i18n="privateHub.homePc.i23dOrientBtn">摆正</button>
              </div>
              <div id="viewer" class="i23d-viewer">
                <div id="viewer-loading" class="i23d-viewer-loading" hidden>
                  <div class="i23d-viewer-spinner" aria-hidden="true"></div>
                  <p id="viewer-loading-text" data-i18n="privateHub.homePc.i23dViewerLoading">加载 3D 模型…</p>
                </div>
              </div>
            </div>

            <div class="action-row home-pc-log-toolbar" style="margin-top:16px">
              <button type="button" class="tb-btn" id="copy-log-btn" data-i18n="privateHub.homePc.copyLog">复制日志</button>
              <button type="button" class="tb-btn" id="open-dir-btn" data-i18n="privateHub.homePc.openLogDir">打开输出目录</button>
            </div>
            <div id="log-container" class="home-pc-log-box">
              <h4 data-i18n="privateHub.homePc.logTitle">执行日志</h4>
              <pre id="log-output"></pre>
            </div>

            <div style="margin-top:20px">
              <h3 data-i18n="privateHub.homePc.i23dHistoryTitle">历史记录</h3>
              <p class="small-hint" data-i18n="privateHub.homePc.i23dHistoryHint">打开可回填备注并加载 mesh；可下载 / 删除。</p>
              <div class="action-row" style="margin-bottom:8px">
                <button type="button" id="history-refresh-btn" class="tb-btn" data-i18n="privateHub.homePc.trailerHistoryRefresh">刷新</button>
              </div>
              <div id="history-list" class="home-pc-history-list"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../../../js/admin/home-pc/home-pc-nav.js?v=homepc21"></script>
  <script src="../../../../js/admin/admin-gate.js?v=nosTW5"></script>
  <script src="../../../../js/admin/private-page-guard.js?v=nosTW5"></script>
  <script src="../../../../js/admin/home-pc/home-pc-api.js?v=histPlay1"></script>
  <script src="../../../../js/admin/home-pc/home-pc-boot.js?v=homepc11"></script>
  <script type="module" src="../../../../js/admin/home-pc/image-to-3d.js?v=i23d12"></script>
</body>
</html>
