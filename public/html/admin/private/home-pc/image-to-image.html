<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>图生图 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="../../../../vendor/tailwindcss.js?v=homepc1"></script>
  <link href="../../../../vendor/font-awesome/css/all.min.css?v=homepc1" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../css/base.css?v=homepc1" />
  <link rel="stylesheet" href="../../../../css/docs/docs-common.css?v=homepc8" />
  <link rel="stylesheet" href="../../../../css/media/image-tools.css?v=homepc8" />
  <link rel="stylesheet" href="../../../../css/admin/home-pc.css?v=homepc9" />
  <script src="../../../../js/locales/en.js?v=homepc8"></script>
  <script src="../../../../js/locales/zh-CN.js?v=homepc8"></script>
  <script src="../../../../js/i18n.js?v=homepc8"></script>
  <script src="../../../../js/config.js?v=homepc1"></script>
  <script src="../../../../js/common_ui.js?v=homepc4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 md:gap-8 min-w-0">
      <a href="../../private.html" class="flex items-center gap-2 flex-shrink-0 text-sm text-gray-600 hover:text-blue-600">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
      </a>
      <h1 class="text-base sm:text-lg font-bold text-gray-900 truncate" data-i18n="privateHub.homePc.img2imgTitle">图生图</h1>
      <div class="ml-auto flex items-center gap-3 text-sm">
        <span id="auth-label" class="text-gray-500"></span>
        <a id="login-link" href="../../../auth/login.html" class="text-blue-600 hover:underline hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>
  <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 w-full max-w-5xl mx-auto">
    <div id="boot-loading" class="bg-white rounded-2xl border border-gray-100 p-8 text-center text-sm text-gray-500" data-i18n="privateHub.homePc.loading">加载中…</div>
    <div id="gate" class="bg-white rounded-2xl border border-gray-100 p-8 text-center hidden">
      <p id="gate-msg" class="text-gray-600 mb-4" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
      <a id="gate-login" href="../../../auth/login.html" class="tb-btn inline-flex" data-i18n="auth.login">去登录</a>
    </div>
    <div id="app" class="home-pc-wrap hidden">
      <p class="home-pc-desc" data-i18n="privateHub.homePc.img2imgHint">默认 Qwen Image Edit 指令改图（漫画转真人、换背景等）。可选 Z-Image Turbo 轻量重绘（易改构图，Denoise 可调）。</p>
      <div id="api-status" class="home-pc-status home-pc-status--checking" data-needs-qwen="1" role="status"></div>
      <div class="tool-container">
          <div class="input-section">
            <span class="home-pc-field-label" data-i18n="privateHub.homePc.img2imgRefLabel">参考图</span>
            <div class="drop-zone" id="drop-zone">
              <div class="drop-icon">+</div>
              <div class="drop-title" data-i18n="privateHub.homePc.img2imgDropTitle">点击或拖入参考图</div>
              <div class="drop-hint" data-i18n="privateHub.homePc.img2imgDropHint">支持 JPG、PNG、WebP</div>
            </div>
            <input type="file" id="file-input" accept="image/*" hidden />
            <div class="home-pc-source-grid" id="preview-wrap" hidden></div>
            <div>
              <label for="prompt-input" data-i18n="privateHub.homePc.img2imgPromptLabel">正向提示词：</label>
              <textarea id="prompt-input" data-i18n-placeholder="privateHub.homePc.img2imgPromptPlaceholder" placeholder="例：只把西瓜换成菠萝，人物、背景、其余物体保持不变"></textarea>
            </div>
            <div class="form-row">
              <div class="input-control">
                <label for="engine-select" data-i18n="privateHub.homePc.img2imgEngineLabel">引擎：</label>
                <select id="engine-select" class="text-input home-pc-select">
                  <option value="qwen" selected data-i18n="privateHub.homePc.img2imgEngineQwen">Qwen 指令改图（推荐）</option>
                  <option value="z_image" data-i18n="privateHub.homePc.img2imgEngineZImage">Z-Image Turbo 重绘</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="input-control" id="denoise-wrap" hidden>
                <label for="denoise-input" data-i18n="privateHub.homePc.img2imgDenoiseLabel">重绘幅度 Denoise（0.05–1）：</label>
                <input id="denoise-input" class="text-input" type="number" step="0.05" min="0.05" max="1" value="0.4" />
              </div>
              <div class="input-control">
                <label for="seed-input" data-i18n="privateHub.homePc.img2imgSeedLabel">种子（可选）：</label>
                <input id="seed-input" class="text-input" type="text" data-i18n-placeholder="privateHub.homePc.img2imgSeedPlaceholder" placeholder="留空随机" />
              </div>
            </div>
          </div>

          <div class="action-row home-pc-tool-actions">
            <button id="gen-btn" class="tb-btn">生成</button>
            <button type="button" id="download-btn" class="tb-btn" style="display:none;">下载 PNG</button>
            <button id="clear-btn" class="tb-btn">清空</button>
          </div>

          <div id="progress-wrap" class="progress-wrap" style="display:none;">
            <div style="display:flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: #666;">
              <span id="progress-status">生成中…</span>
              <span id="progress-percent">—</span>
            </div>
            <div class="progress-bar-bg">
              <div id="progress-bar" class="progress-bar" style="width: 45%;"></div>
            </div>
          </div>

          <div id="result-box" class="video-box home-pc-result-box" style="display:none;">
            <h3 class="home-pc-result-title" data-i18n="privateHub.homePc.img2imgResultTitle">生成结果</h3>
            <p id="meta-line" class="home-pc-result-meta"></p>
            <div class="home-pc-result-img-wrap">
              <img id="result-img" alt="" />
            </div>
          </div>

          <div id="log-container" class="home-pc-log-box">
            <h4 data-i18n="privateHub.homePc.img2imgLogTitle">日志</h4>
            <pre id="log-output" style="margin:0; white-space: pre-wrap;"></pre>
          </div>
        </div>
    </div>
  </main>
  <script src="../../../../js/admin/private-page-guard.js?v=homepc8"></script>
  <script src="../../../../js/admin/home-pc/home-pc-api.js?v=homepc9"></script>
  <script src="../../../../js/admin/home-pc/home-pc-boot.js?v=homepc8"></script>
  <script src="../../../../js/admin/home-pc/home-pc-upload.js?v=homepc8"></script>
  <script src="../../../../js/admin/home-pc/image-to-image.js?v=homepc8"></script>
</body>
</html>
