<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>音乐 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="../../../../vendor/font-awesome/css/all.min.css?v=homepc16" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../css/base.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/docs/docs-common.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/admin/home-pc.css?v=homepc70" />
  <script src="../../../../js/locales/en.js?v=ttvname1"></script>
  <script src="../../../../js/locales/zh-CN.js?v=ttvname1"></script>
  <script src="../../../../js/i18n.js?v=homepc26"></script>
  <script src="../../../../js/config.js?v=music1"></script>
  <script src="../../../../js/common_ui.js?v=homepc4"></script>
</head>
<body class="home-pc-page">
  <div class="home-pc-container">
    <aside id="home-pc-sidebar" class="sidebar" aria-label="家里电脑"></aside>
    <div class="home-pc-content">
      <header class="home-pc-header">
        <div class="home-pc-header-inner">
          <a href="../../private.html" class="home-pc-back">
            <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
          </a>
          <h1 class="home-pc-title" data-i18n="privateHub.homePc.musicTitle">音乐</h1>
          <div class="home-pc-header-actions">
            <span id="auth-label" class="home-pc-auth-label"></span>
            <a id="login-link" href="../../../auth/login.html" class="home-pc-login-link hidden" data-i18n="auth.login">登录</a>
          </div>
        </div>
      </header>
      <main class="home-pc-main">
        <div id="boot-loading" class="home-pc-card home-pc-card--center" data-i18n="privateHub.homePc.loading">加载中…</div>
        <div id="gate" class="home-pc-card home-pc-card--center hidden" hidden>
          <p id="gate-msg" class="home-pc-gate-msg" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
          <a id="gate-login" href="../../../auth/login.html" class="tb-btn" data-i18n="auth.login">去登录</a>
        </div>
        <div id="app" class="home-pc-wrap hidden" hidden>
          <p class="home-pc-desc" id="music-hint" data-i18n="privateHub.homePc.musicHint">本地 ACE-Step 1.5：游戏纯 BGM 或带歌词流行歌。</p>
          <div id="api-status" class="home-pc-status home-pc-status--checking" data-api-only="1" role="status"></div>
          <p id="engine-line" class="home-pc-desc" style="margin-top:-8px"></p>
          <div class="tool-container">
            <div class="input-section">
              <div class="form-row">
                <div class="input-control">
                  <label for="mode-select" data-i18n="privateHub.homePc.musicModeLabel">模式</label>
                  <select id="mode-select" class="text-input"></select>
                </div>
                <div class="input-control" id="preset-wrap">
                  <label for="preset-select" data-i18n="privateHub.homePc.musicPresetLabel">BGM 预设</label>
                  <select id="preset-select" class="text-input"></select>
                </div>
                <div class="input-control">
                  <label for="duration-input" data-i18n="privateHub.homePc.musicDurationLabel">时长（秒）</label>
                  <input id="duration-input" class="text-input" type="number" min="10" max="240" step="5" value="60" />
                </div>
              </div>
              <div>
                <label for="prompt-input" data-i18n="privateHub.homePc.musicPromptLabel">风格 / 主题描述</label>
                <textarea id="prompt-input" data-i18n-placeholder="privateHub.homePc.musicPromptPlaceholder" placeholder="例如：轻松循环的解谜游戏配乐…"></textarea>
              </div>
              <div id="song-fields">
                <div class="form-row">
                  <div class="input-control">
                    <label for="lang-select" data-i18n="privateHub.homePc.musicLangLabel">人声语言</label>
                    <select id="lang-select" class="text-input">
                      <option value="zh">中文</option>
                      <option value="en">English</option>
                      <option value="ja">日本語</option>
                    </select>
                  </div>
                  <div class="input-control" style="display:flex;align-items:flex-end;padding-bottom:4px">
                    <label class="home-pc-check">
                      <input type="checkbox" id="auto-lyrics" />
                      <span data-i18n="privateHub.homePc.musicAutoLyrics">空歌词时自动写词（DeepSeek）</span>
                    </label>
                  </div>
                </div>
                <div>
                  <label for="lyrics-input" data-i18n="privateHub.homePc.musicLyricsLabel">歌词</label>
                  <textarea id="lyrics-input" rows="8" data-i18n-placeholder="privateHub.homePc.musicLyricsPlaceholder" placeholder="[Verse]&#10;…&#10;[Chorus]&#10;…"></textarea>
                </div>
              </div>
              <div class="form-row">
                <div class="input-control">
                  <label for="bpm-input" data-i18n="privateHub.homePc.musicBpmLabel">BPM（0=自动）</label>
                  <input id="bpm-input" class="text-input" type="number" min="0" max="300" step="1" value="0" />
                </div>
              </div>
            </div>

            <div class="action-row home-pc-tool-actions">
              <button type="button" id="gen-btn" class="tb-btn" data-i18n="privateHub.homePc.musicGenerate">生成</button>
              <button type="button" id="download-btn" class="tb-btn" style="display:none" data-i18n="privateHub.homePc.musicDownload">下载</button>
              <button type="button" id="clear-btn" class="tb-btn" data-i18n="privateHub.homePc.musicClear">清空</button>
            </div>

            <div id="progress-wrap" class="progress-wrap" style="display:none">
              <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px;color:#666">
                <span id="progress-status">生成中…</span>
                <span id="progress-percent">—</span>
              </div>
              <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar" style="width:40%"></div>
              </div>
            </div>

            <div id="result-box" class="video-box home-pc-result-box" style="display:none">
              <h3 class="home-pc-result-title" data-i18n="privateHub.homePc.musicResultTitle">生成结果</h3>
              <p id="meta-line" class="home-pc-result-meta"></p>
              <audio id="result-audio" controls style="width:100%;margin-top:8px"></audio>
              <pre id="lyrics-preview" class="home-pc-log-box" style="margin-top:12px;max-height:180px;display:none"></pre>
            </div>

            <div class="action-row home-pc-log-toolbar" style="margin-top:16px">
              <button type="button" class="tb-btn" id="copy-log-btn" data-i18n="privateHub.homePc.copyLog">复制日志</button>
              <button type="button" class="tb-btn" id="open-dir-btn" data-i18n="privateHub.homePc.openLogDir">打开输出目录</button>
            </div>
            <div id="log-container" class="home-pc-log-box">
              <h4 data-i18n="privateHub.homePc.logTitle">执行日志</h4>
              <pre id="log-output"></pre>
            </div>

            <div style="margin-top:20px">
              <h3 data-i18n="privateHub.homePc.musicHistoryTitle">历史记录</h3>
              <p class="small-hint" data-i18n="privateHub.homePc.musicHistoryHint">可直接播放/下载；打开会回填模式、描述与歌词。</p>
              <div id="history-list" class="home-pc-history-list"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../../../js/admin/home-pc/home-pc-nav.js?v=homepc21"></script>
  <script src="../../../../js/admin/admin-gate.js?v=nosTW5"></script>
  <script src="../../../../js/admin/private-page-guard.js?v=nosTW5"></script>
  <script src="../../../../js/admin/home-pc/home-pc-api.js?v=apiOnly1"></script>
  <script src="../../../../js/admin/home-pc/home-pc-boot.js?v=homepc11"></script>
  <script src="../../../../js/admin/home-pc/music.js?v=histPlay1"></script>
</body>
</html>
