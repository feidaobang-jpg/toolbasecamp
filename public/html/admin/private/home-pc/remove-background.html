<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>去背景 / 批量处理 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="../../../../vendor/tailwindcss.js?v=homepc1"></script>
  <link href="../../../../vendor/font-awesome/css/all.min.css?v=homepc1" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../css/base.css?v=homepc1" />
  <link rel="stylesheet" href="../../../../css/admin/home-pc.css?v=homepc1" />
  <script src="../../../../js/locales/en.js?v=homepc1"></script>
  <script src="../../../../js/locales/zh-CN.js?v=homepc1"></script>
  <script src="../../../../js/i18n.js?v=homepc1"></script>
  <script src="../../../../js/config.js?v=homepc1"></script>
  <script src="../../../../js/common_ui.js?v=homepc1"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 md:gap-8 min-w-0">
      <a href="../private.html" class="flex items-center gap-2 flex-shrink-0 text-sm text-gray-600 hover:text-blue-600">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
      </a>
      <h1 class="text-base sm:text-lg font-bold text-gray-900 truncate" data-i18n="privateHub.homePc.removeBgTitle">去背景 / 批量处理</h1>
      <div class="ml-auto flex items-center gap-3 text-sm">
        <span id="auth-label" class="text-gray-500"></span>
        <a id="login-link" href="../../../auth/login.html" class="text-blue-600 hover:underline hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>
  <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 w-full max-w-5xl mx-auto">
    <div id="boot-loading" class="bg-white rounded-2xl border border-gray-100 p-8 text-center text-sm text-gray-500" data-i18n="privateHub.homePc.loading">加载中…</div>
    <div id="gate" class="bg-white rounded-2xl border border-gray-100 p-8 text-center hidden">
      <p id="gate-msg" class="text-gray-600 mb-4" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
      <a id="gate-login" href="../../../auth/login.html" class="tb-btn inline-flex" data-i18n="auth.login">去登录</a>
    </div>
    <div id="app" class="home-pc-wrap hidden">
      <p class="home-pc-desc" data-i18n="privateHub.homePc.apiHint">连接家里电脑的 ComfyUI API（comfy.zhengxiaohui.cn）。请先在本机启动 ComfyUI 与 comfyui-api-server。</p>
      <div id="api-status" class="home-pc-status home-pc-status--checking" role="status"></div>
      <div class="tool-container">
                    <!-- 拖放区域 -->
                    <div class="drop-zone">
                        <div class="drop-zone-text">
                            <p>将图片拖放到此处</p>
                            <p>或者</p>
                            <button id="browse-btn-inner" class="browse-btn">选择图片</button>
                            <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
                        </div>
                    </div>
                    
                    <div class="input-section" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        <select id="size-type-select" style="padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                            <option value="width">宽度：</option>
                            <option value="height">高度：</option>
                        </select>
                        <input type="number" id="target-width-input" placeholder="请输入尺寸" value="240" style="width: 50px; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                        <div class="width-presets" style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="preset-btn" onclick="document.getElementById('target-width-input').value=32">32</button>
                            <button class="preset-btn" onclick="document.getElementById('target-width-input').value=48">48</button>
                            <button class="preset-btn" onclick="document.getElementById('target-width-input').value=64">64</button>
                            <button class="preset-btn" onclick="document.getElementById('target-width-input').value=100">100</button>
                            <button class="preset-btn" onclick="document.getElementById('target-width-input').value=240">240</button>
                        </div>
                        <style>
                            /* 隐藏数字输入框的上下箭头 */
                            #target-width-input::-webkit-outer-spin-button,
                            #target-width-input::-webkit-inner-spin-button {
                                -webkit-appearance: none;
                                margin: 0;
                            }
                            #target-width-input[type=number] {
                                -moz-appearance: textfield;
                                appearance: textfield;
                            }
                            
                            .preset-btn {
                                padding: 4px 12px;
                                background: #007bff;
                                color: white;
                                border: none;
                                border-radius: 4px;
                                cursor: pointer;
                                font-size: 12px;
                                transition: background-color 0.2s;
                            }
                            .preset-btn:hover {
                                background: #0056b3;
                            }
                        </style>
                    </div>
                    
                    <div class="input-section" style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <label>
                            <input type="checkbox" id="remove-bg-checkbox" checked> 移除背景
                        </label>
                        <label>
                            <input type="checkbox" id="trim-edges-checkbox" checked> 裁切边缘（如果不勾选移除背景则背景必须是透明的）
                        </label>
                    </div>
                    
                    <!-- 选择图片预览区域 -->
                    <div class="selection-preview-section">
                        <h3>选择的图片</h3>
                        <div class="image-selection-preview" id="image-selection-preview">
                            <!-- 选择的图片预览将在这里显示 -->
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button id="process-btn" class="primary-btn">开始处理</button>
                        <button id="save-all-btn" class="success-btn hidden">打包 ZIP 下载</button>
                        <button id="clear-btn" class="secondary-btn">清空</button>
                    </div>
                    
                    <div class="result-section" id="result-container">
                        <h3>处理结果</h3>
                        <div class="image-preview-container" id="image-preview-container">
                            <!-- 图片预览将在这里显示 -->
                        </div>
                    </div>
                </div>
    </div>
  </main>
  <script src="../../../../js/admin/private-page-guard.js?v=homepc1"></script>
  <script src="../../../../js/admin/home-pc/home-pc-api.js?v=homepc1"></script>
  <script src="../../../../js/admin/home-pc/home-pc-boot.js?v=homepc1"></script>
  <script src="../../../../js/admin/home-pc/remove-background.js?v=homepc1"></script>
</body>
</html>
