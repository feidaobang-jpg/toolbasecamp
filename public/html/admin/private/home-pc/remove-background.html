<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>去背景 / 批量处理 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="../../../../vendor/tailwindcss.js?v=homepc1"></script>
  <link href="../../../../vendor/font-awesome/css/all.min.css?v=homepc1" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../css/base.css?v=homepc1" />
  <link rel="stylesheet" href="../../../../css/admin/home-pc.css?v=homepc5" />
  <script src="../../../../js/locales/en.js?v=homepc5"></script>
  <script src="../../../../js/locales/zh-CN.js?v=homepc5"></script>
  <script src="../../../../js/i18n.js?v=homepc5"></script>
  <script src="../../../../js/config.js?v=homepc1"></script>
  <script src="../../../../js/common_ui.js?v=homepc4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 md:gap-8 min-w-0">
      <a href="../../private.html" class="flex items-center gap-2 flex-shrink-0 text-sm text-gray-600 hover:text-blue-600">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
      </a>
      <h1 class="text-base sm:text-lg font-bold text-gray-900 truncate" data-i18n="privateHub.homePc.removeBgTitle">去背景 / 批量处理</h1>
      <div class="ml-auto flex items-center gap-3 text-sm">
        <span id="auth-label" class="text-gray-500"></span>
        <a id="login-link" href="../../../auth/login.html" class="text-blue-600 hover:underline hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>
  <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 w-full max-w-5xl mx-auto">
    <div id="boot-loading" class="bg-white rounded-2xl border border-gray-100 p-8 text-center text-sm text-gray-500" data-i18n="privateHub.homePc.loading">加载中…</div>
    <div id="gate" class="bg-white rounded-2xl border border-gray-100 p-8 text-center hidden">
      <p id="gate-msg" class="text-gray-600 mb-4" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
      <a id="gate-login" href="../../../auth/login.html" class="tb-btn inline-flex" data-i18n="auth.login">去登录</a>
    </div>
    <div id="app" class="home-pc-wrap hidden">
      <p class="home-pc-desc" data-i18n="privateHub.homePc.removeBgHint">工作流 rembg.json（InspyrenetRembg，模型自动下载）。勾选「移除背景」走 ComfyUI；缩放/裁边在浏览器本地完成。</p>
      <div id="api-status" class="home-pc-status home-pc-status--checking" role="status"></div>
      <div class="tool-container">
                    <!-- 拖放区域 -->
                    <div class="drop-zone">
                        <div class="drop-zone-text">
                            <p>将图片拖放到此处</p>
                            <p>或者</p>
                            <button id="browse-btn-inner" class="tb-btn tb-btn-sm">选择图片</button>
                            <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
                        </div>
                    </div>
                    
                    <div class="input-section home-pc-size-row">
                        <select id="size-type-select" class="home-pc-select">
                            <option value="width">宽度：</option>
                            <option value="height">高度：</option>
                        </select>
                        <input type="number" id="target-width-input" class="home-pc-num-input" placeholder="请输入尺寸" value="240">
                        <div class="width-presets action-row">
                            <button type="button" class="tb-btn tb-btn-sm" onclick="document.getElementById('target-width-input').value=32">32</button>
                            <button type="button" class="tb-btn tb-btn-sm" onclick="document.getElementById('target-width-input').value=48">48</button>
                            <button type="button" class="tb-btn tb-btn-sm" onclick="document.getElementById('target-width-input').value=64">64</button>
                            <button type="button" class="tb-btn tb-btn-sm" onclick="document.getElementById('target-width-input').value=100">100</button>
                            <button type="button" class="tb-btn tb-btn-sm" onclick="document.getElementById('target-width-input').value=240">240</button>
                        </div>
                    </div>
                    
                    <div class="input-section home-pc-check-row">
                        <label>
                            <input type="checkbox" id="remove-bg-checkbox" checked> 移除背景
                        </label>
                        <label>
                            <input type="checkbox" id="trim-edges-checkbox" checked> 裁切边缘（如果不勾选移除背景则背景必须是透明的）
                        </label>
                    </div>
                    
                    <!-- 选择图片预览区域 -->
                    <div class="selection-preview-section">
                        <h3>选择的图片</h3>
                        <div class="image-selection-preview" id="image-selection-preview">
                            <!-- 选择的图片预览将在这里显示 -->
                        </div>
                    </div>

                    <div class="action-row home-pc-tool-actions">
                        <button id="process-btn" class="tb-btn">开始处理</button>
                        <button id="save-all-btn" class="tb-btn hidden">打包 ZIP 下载</button>
                        <button id="clear-btn" class="tb-btn">清空</button>
                    </div>
                    
                    <div class="result-section" id="result-container">
                        <h3>处理结果</h3>
                        <div class="image-preview-container" id="image-preview-container">
                            <!-- 图片预览将在这里显示 -->
                        </div>
                    </div>
                </div>
    </div>
  </main>
  <script src="../../../../js/admin/private-page-guard.js?v=homepc4"></script>
  <script src="../../../../js/admin/home-pc/home-pc-api.js?v=homepc3"></script>
  <script src="../../../../js/admin/home-pc/home-pc-boot.js?v=homepc3"></script>
  <script src="../../../../js/admin/home-pc/remove-background.js?v=homepc3"></script>
</body>
</html>
