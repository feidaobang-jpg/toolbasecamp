<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>去背景（抠图） - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="../../../../vendor/font-awesome/css/all.min.css?v=homepc16" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../css/base.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/docs/docs-common.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/media/image-tools.css?v=cutouthp1" />
  <link rel="stylesheet" href="../../../../css/admin/home-pc.css?v=cutouthp2" />
  <script src="../../../../js/locales/en.js?v=cutouthp5"></script>
  <script src="../../../../js/locales/zh-CN.js?v=cutouthp5"></script>
  <script src="../../../../js/i18n.js?v=homepc26"></script>
  <script src="../../../../js/config.js?v=homepc21"></script>
  <script src="../../../../js/common_ui.js?v=homepc4"></script>
</head>
<body class="home-pc-page">
  <div class="home-pc-container">
    <aside id="home-pc-sidebar" class="sidebar" aria-label="家里电脑"></aside>
    <div class="home-pc-content">
      <header class="home-pc-header">
        <div class="home-pc-header-inner">
          <a href="../../private.html" class="home-pc-back">
            <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
          </a>
          <h1 class="home-pc-title" data-i18n="privateHub.homePc.removeBgTitle">去背景（抠图）</h1>
          <div class="home-pc-header-actions">
            <span id="auth-label" class="home-pc-auth-label"></span>
            <a id="login-link" href="../../../auth/login.html" class="home-pc-login-link hidden" data-i18n="auth.login">登录</a>
          </div>
        </div>
      </header>
      <main class="home-pc-main">
        <div id="boot-loading" class="home-pc-card home-pc-card--center" data-i18n="privateHub.homePc.loading">加载中…</div>
        <div id="gate" class="home-pc-card home-pc-card--center hidden" hidden>
          <p id="gate-msg" class="home-pc-gate-msg" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
          <a id="gate-login" href="../../../auth/login.html" class="tb-btn" data-i18n="auth.login">去登录</a>
        </div>
        <div id="app" class="home-pc-wrap hidden" hidden>
          <p class="home-pc-desc" data-i18n="privateHub.homePc.removeBgHint">工作流 rembg.json（InspyrenetRembg）。可选绿幕或透明。</p>
          <div id="api-status" class="home-pc-status home-pc-status--checking" role="status"></div>
          <div class="tool-card">
            <div class="drop-zone" id="drop-zone">
              <div class="drop-icon">+</div>
              <div class="drop-title" data-i18n="privateHub.homePc.dropTitle">点击或拖入图片</div>
              <div class="drop-hint" data-i18n="privateHub.homePc.dropHint">JPG / PNG / WebP</div>
            </div>
            <input type="file" id="file-input" accept="image/*" hidden />
            <div class="img-tool-source" id="source-wrap" hidden>
              <img id="source-img" alt="" />
            </div>
            <div class="home-pc-field" style="margin: 12px 0 4px">
              <span class="home-pc-field-label" data-i18n="privateHub.homePc.removeBgModeLabel">输出背景</span>
              <div class="action-row" id="bg-mode-row" style="margin-top: 8px">
                <label class="home-pc-radio">
                  <input type="radio" name="bg-mode" value="green" checked />
                  <span data-i18n="privateHub.homePc.removeBgModeGreen">绿幕</span>
                </label>
                <label class="home-pc-radio">
                  <input type="radio" name="bg-mode" value="transparent" />
                  <span data-i18n="privateHub.homePc.removeBgModeTransparent">透明</span>
                </label>
              </div>
              <p class="small-hint" data-i18n="privateHub.homePc.removeBgModeHint">绿幕适合生图参考与后期抠像；透明适合贴纸导出。</p>
            </div>
            <div class="action-row">
              <button type="button" class="tb-btn" id="run-btn" disabled data-i18n="privateHub.homePc.removeBgRun">开始抠图</button>
              <button type="button" class="tb-btn" id="download-btn" disabled data-i18n="privateHub.homePc.removeBgDownload">下载</button>
              <button type="button" class="tb-btn" id="clear-btn" data-i18n="privateHub.homePc.removeBgClear">清除</button>
            </div>
            <div class="img-cloud-busy" id="busy" hidden aria-live="polite">
              <span class="img-cloud-spinner" aria-hidden="true"></span>
              <span id="busy-text" data-i18n="privateHub.homePc.processing">处理中…</span>
            </div>
            <div class="error-box" id="error-box" role="alert"></div>
            <div class="img-tool-preview cutout-preview" id="preview-wrap" hidden>
              <img id="result-img" alt="" />
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../../../js/admin/home-pc/home-pc-nav.js?v=homepc21"></script>
  <script src="../../../../js/admin/admin-gate.js?v=nosTW5"></script>
  <script src="../../../../js/admin/private-page-guard.js?v=nosTW5"></script>
  <script src="../../../../js/admin/home-pc/home-pc-api.js?v=homepc7"></script>
  <script src="../../../../js/admin/home-pc/home-pc-boot.js?v=homepc7"></script>
  <script src="../../../../js/shared/image-upload-compress.js?v=imgup2"></script>
  <script src="../../../../js/admin/home-pc/remove-background.js?v=cutouthp5"></script>
</body>
</html>
