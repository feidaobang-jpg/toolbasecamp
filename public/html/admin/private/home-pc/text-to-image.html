<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>文生图 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="../../../../vendor/font-awesome/css/all.min.css?v=homepc16" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../css/base.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/docs/docs-common.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/admin/home-pc.css?v=homepc21" />
  <script src="../../../../js/locales/en.js?v=homepc10"></script>
  <script src="../../../../js/locales/zh-CN.js?v=homepc10"></script>
  <script src="../../../../js/i18n.js?v=homepc7"></script>
  <script src="../../../../js/config.js?v=homepc21"></script>
  <script src="../../../../js/common_ui.js?v=homepc4"></script>
</head>
<body class="home-pc-page">
  <div class="home-pc-container">
    <aside id="home-pc-sidebar" class="sidebar" aria-label="家里电脑"></aside>
    <div class="home-pc-content">
        <header class="home-pc-header">
    <div class="home-pc-header-inner">
      <a href="../../private.html" class="home-pc-back">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
      </a>
      <h1 class="home-pc-title" data-i18n="privateHub.homePc.txt2imgTitle">文生图</h1>
      <div class="home-pc-header-actions">
        <span id="auth-label" class="home-pc-auth-label"></span>
        <a id="login-link" href="../../../auth/login.html" class="home-pc-login-link hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>
          <main class="home-pc-main">
    <div id="boot-loading" class="home-pc-card home-pc-card--center" data-i18n="privateHub.homePc.loading">加载中…</div>
    <div id="gate" class="home-pc-card home-pc-card--center hidden" hidden>
      <p id="gate-msg" class="home-pc-gate-msg" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
      <a id="gate-login" href="../../../auth/login.html" class="tb-btn" data-i18n="auth.login">去登录</a>
    </div>
    <div id="app" class="home-pc-wrap hidden" hidden>
      <p class="home-pc-desc" data-i18n="privateHub.homePc.txt2imgHint">工作流 z_image_turbo.json。模型：z_image_turbo_bf16、qwen_3_4b、ae.safetensors。</p>
      <div id="api-status" class="home-pc-status home-pc-status--checking" role="status"></div>
      <div class="tool-container">
          <div class="input-section">
            <div>
              <label for="prompt-input" data-i18n="privateHub.homePc.txt2imgPromptLabel">正向提示词：</label>
              <textarea id="prompt-input" data-i18n-placeholder="privateHub.homePc.txt2imgPromptPlaceholder" placeholder="描述画面内容…"></textarea>
            </div>
            <div class="form-row">
              <div class="input-control">
                <label for="width-input" data-i18n="privateHub.homePc.txt2imgWidthLabel">宽度：</label>
                <input id="width-input" class="text-input" type="number" min="256" max="2048" step="64" value="1024" />
              </div>
              <div class="input-control">
                <label for="height-input" data-i18n="privateHub.homePc.txt2imgHeightLabel">高度：</label>
                <input id="height-input" class="text-input" type="number" min="256" max="2048" step="64" value="1024" />
              </div>
              <div class="input-control">
                <label for="seed-input" data-i18n="privateHub.homePc.txt2imgSeedLabel">种子（可选）：</label>
                <input id="seed-input" class="text-input" type="text" data-i18n-placeholder="privateHub.homePc.txt2imgSeedPlaceholder" placeholder="留空随机" />
              </div>
            </div>
          </div>

          <div class="action-row home-pc-tool-actions">
            <button id="gen-btn" class="tb-btn">生成</button>
            <button type="button" id="download-btn" class="tb-btn" style="display:none;" data-i18n="privateHub.homePc.download">Download</button>
            <button id="clear-btn" class="tb-btn">清空</button>
          </div>

          <div id="progress-wrap" class="progress-wrap" style="display:none;">
            <div style="display:flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: #666;">
              <span id="progress-status">生成中…</span>
              <span id="progress-percent">—</span>
            </div>
            <div class="progress-bar-bg">
              <div id="progress-bar" class="progress-bar" style="width: 45%;"></div>
            </div>
          </div>

          <div id="result-box" class="video-box home-pc-result-box" style="display:none;">
            <h3 class="home-pc-result-title" data-i18n="privateHub.homePc.txt2imgResultTitle">生成结果</h3>
            <p id="meta-line" class="home-pc-result-meta"></p>
            <div class="home-pc-result-img-wrap">
              <img id="result-img" alt="" />
            </div>
          </div>

          <div id="log-container" class="home-pc-log-box">
            <h4 data-i18n="privateHub.homePc.txt2imgLogTitle">日志</h4>
            <pre id="log-output"></pre>
          </div>
        </div>
    </div>
    </main>
    </div>
  </div>
  <script src="../../../../js/admin/home-pc/home-pc-nav.js?v=homepc21"></script>
  <script src="../../../../js/admin/admin-gate.js?v=nosTW5"></script>
  <script src="../../../../js/admin/private-page-guard.js?v=nosTW5"></script>
  <script src="../../../../js/admin/home-pc/home-pc-api.js?v=homepc7"></script>
  <script src="../../../../js/admin/home-pc/home-pc-boot.js?v=homepc7"></script>
  <script src="../../../../js/admin/home-pc/text-to-image.js?v=homepc7"></script>
</body>
</html>
