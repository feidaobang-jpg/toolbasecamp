<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>文字配图 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="../../../../vendor/font-awesome/css/all.min.css?v=homepc16" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../css/base.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/docs/docs-common.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/admin/home-pc.css?v=homepc18" />
  <script src="../../../../js/locales/en.js?v=homepc10"></script>
  <script src="../../../../js/locales/zh-CN.js?v=homepc10"></script>
  <script src="../../../../js/i18n.js?v=homepc7"></script>
  <script src="../../../../js/config.js?v=homepc1"></script>
  <script src="../../../../js/common_ui.js?v=homepc4"></script>
</head>
<body class="home-pc-page">
  <header class="home-pc-header">
    <div class="home-pc-header-inner">
      <a href="../../private.html" class="home-pc-back">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
      </a>
      <h1 class="home-pc-title" data-i18n="privateHub.homePc.textToImagesTitle">文字配图</h1>
      <div class="home-pc-header-actions">
        <span id="auth-label" class="home-pc-auth-label"></span>
        <a id="login-link" href="../../../auth/login.html" class="home-pc-login-link hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>
  <div class="home-pc-layout">
    <aside id="home-pc-sidebar" class="home-pc-sidebar" aria-label="家里电脑"></aside>
    <main class="home-pc-main">
    <div id="boot-loading" class="home-pc-card home-pc-card--center" data-i18n="privateHub.homePc.loading">加载中…</div>
    <div id="gate" class="home-pc-card home-pc-card--center hidden" hidden>
      <p id="gate-msg" class="home-pc-gate-msg" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
      <a id="gate-login" href="../../../auth/login.html" class="tb-btn" data-i18n="auth.login">去登录</a>
    </div>
    <div id="app" class="home-pc-wrap hidden" hidden>
      <p class="home-pc-desc" data-i18n="privateHub.homePc.textToImagesHint">DeepSeek 分句扩写后，每段调用 z_image_turbo.json 文生图（同上 Z-Image 三件套）。</p>
      <div id="api-status" class="home-pc-status home-pc-status--checking" role="status"></div>
      <div class="tool-container">
          <div class="input-section">
            <div>
              <label for="text-input">文字内容：</label>
              <textarea id="text-input" placeholder="每句话将生成一张图。例如：春天来了，樱花盛开。孩子们在草地上奔跑。"></textarea>
            </div>

            <div id="deepseek-notice" role="alert" style="display:none; margin: 10px 0; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5;"></div>

            <div class="form-row">
              <div class="input-control">
                <label for="aspect-select">配图尺寸（用途）：</label>
                <select id="aspect-select" class="text-input">
                  <option value="xhs_34" selected>小红书竖图 3:4（1080×1440）</option>
                  <option value="xhs_11">小红书方形 1:1（1080×1080）</option>
                  <option value="wx_post">微信推文配图 1:1（1080×1080）</option>
                  <option value="wx_emoji">微信表情包（512×512）</option>
                </select>
                <p class="small-hint">竖图适合小红书笔记；方形适合公众号头图；小图适合表情包素材（上传微信前可能还需裁切/抠图）。</p>
              </div>
            </div>
          </div>

          <div class="action-row home-pc-tool-actions">
            <button id="start-btn" class="tb-btn">开始生成配图</button>
            <button id="cancel-button" class="tb-btn" style="display:none;">取消任务</button>
            <button type="button" id="btn-download-all" class="tb-btn" style="display:none;" data-i18n="privateHub.homePc.downloadAll">下载全部</button>
            <button type="button" id="btn-copy-output" class="tb-btn" style="display:none;">复制输出目录</button>
            <button type="button" id="btn-open-output" class="tb-btn" style="display:none;">打开输出文件夹</button>
            <button id="clear-btn" class="tb-btn">清空</button>
          </div>

          <div id="progress-wrap" class="progress-wrap" style="display:none;">
            <div style="display:flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: #666;">
              <span id="progress-status">准备中…</span>
              <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
              <div id="progress-bar" class="progress-bar"></div>
            </div>
          </div>

          <div id="result-box" class="tti-gallery-wrap home-pc-result-box" style="display:none;">
            <h3 class="home-pc-result-title">生成结果 <span id="result-count" class="tti-count"></span></h3>
            <div id="image-gallery" class="tti-gallery"></div>
          </div>

          <div id="log-container" class="home-pc-log-box home-pc-log-box--tall">
            <h4>执行日志</h4>
            <pre id="log-output"></pre>
          </div>
        </div>
    </div>
    </main>
  </div>
  <script src="../../../../js/admin/home-pc/home-pc-nav.js?v=homepc18"></script>
  <script src="../../../../js/admin/admin-gate.js?v=nosTW5"></script>
  <script src="../../../../js/admin/private-page-guard.js?v=nosTW5"></script>
  <script src="../../../../js/admin/home-pc/home-pc-api.js?v=homepc7"></script>
  <script src="../../../../js/admin/home-pc/home-pc-boot.js?v=homepc7"></script>
  <script src="../../../../js/admin/home-pc/text-to-images.js?v=homepc7"></script>
</body>
</html>
