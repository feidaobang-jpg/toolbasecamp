<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>语音 / 声音克隆 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="../../../../vendor/font-awesome/css/all.min.css?v=homepc16" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../css/base.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/docs/docs-common.css?v=homepc16" />
  <link rel="stylesheet" href="../../../../css/admin/home-pc.css?v=homepc70" />
  <script src="../../../../js/locales/en.js?v=histPlay1"></script>
  <script src="../../../../js/locales/zh-CN.js?v=histPlay1"></script>
  <script src="../../../../js/i18n.js?v=homepc26"></script>
  <script src="../../../../js/config.js?v=tts1"></script>
  <script src="../../../../js/common_ui.js?v=homepc4"></script>
</head>
<body class="home-pc-page">
  <div class="home-pc-container">
    <aside id="home-pc-sidebar" class="sidebar" aria-label="家里电脑"></aside>
    <div class="home-pc-content">
      <header class="home-pc-header">
        <div class="home-pc-header-inner">
          <a href="../../private.html" class="home-pc-back">
            <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
          </a>
          <h1 class="home-pc-title" data-i18n="privateHub.homePc.ttsTitle">语音 / 声音克隆</h1>
          <div class="home-pc-header-actions">
            <span id="auth-label" class="home-pc-auth-label"></span>
            <a id="login-link" href="../../../auth/login.html" class="home-pc-login-link hidden" data-i18n="auth.login">登录</a>
          </div>
        </div>
      </header>
      <main class="home-pc-main">
        <div id="boot-loading" class="home-pc-card home-pc-card--center" data-i18n="privateHub.homePc.loading">加载中…</div>
        <div id="gate" class="home-pc-card home-pc-card--center hidden" hidden>
          <p id="gate-msg" class="home-pc-gate-msg" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
          <a id="gate-login" href="../../../auth/login.html" class="tb-btn" data-i18n="auth.login">去登录</a>
        </div>
        <div id="app" class="home-pc-wrap hidden" hidden>
          <p class="home-pc-desc" id="tts-hint" data-i18n="privateHub.homePc.ttsHint">本地 IndexTTS-2.5。上传参考人声可克隆。</p>
          <div id="api-status" class="home-pc-status home-pc-status--checking" role="status"></div>
          <p id="engine-line" class="home-pc-desc" style="margin-top:-8px"></p>
          <div class="tool-container">
            <div class="input-section">
              <div>
                <label for="text-input" data-i18n="privateHub.homePc.ttsTextLabel">合成文本</label>
                <textarea id="text-input" data-i18n-placeholder="privateHub.homePc.ttsTextPlaceholder" placeholder="输入要朗读的内容…"></textarea>
              </div>
              <div class="form-row">
                <div class="input-control">
                  <label for="engine-select" data-i18n="privateHub.homePc.ttsEngineLabel">引擎</label>
                  <select id="engine-select" class="text-input"></select>
                </div>
                <div class="input-control">
                  <label for="lang-select" data-i18n="privateHub.homePc.ttsLangLabel">语言</label>
                  <select id="lang-select" class="text-input"></select>
                </div>
                <div class="input-control">
                  <label for="voice-select" data-i18n="privateHub.homePc.ttsVoiceLabel">Edge 音色</label>
                  <select id="voice-select" class="text-input"></select>
                </div>
              </div>
              <div class="form-row">
                <div class="input-control">
                  <label for="speed-input" data-i18n="privateHub.homePc.ttsSpeedLabel">语速</label>
                  <input id="speed-input" class="text-input" type="number" min="0.5" max="2" step="0.1" value="1.0" />
                </div>
                <div class="input-control">
                  <label for="duration-input" data-i18n="privateHub.homePc.ttsDurationLabel">时长系数</label>
                  <input id="duration-input" class="text-input" type="number" min="0.5" max="2" step="0.1" value="1.0" />
                </div>
              </div>
              <div class="home-pc-field" style="margin: 12px 0 4px">
                <span class="home-pc-field-label" data-i18n="privateHub.homePc.ttsRefLabel">参考音频（克隆）</span>
                <div class="drop-zone" id="ref-drop" style="margin-top:8px;min-height:88px;padding:16px">
                  <div class="drop-title" data-i18n="privateHub.homePc.ttsRefDrop">点击或拖入参考音频</div>
                  <div class="drop-hint" data-i18n="privateHub.homePc.ttsRefHint">WAV/MP3，建议 5–15 秒</div>
                </div>
                <input type="file" id="ref-input" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg" hidden />
                <p id="ref-name" class="small-hint"></p>
              </div>
            </div>

            <div class="action-row home-pc-tool-actions">
              <button type="button" id="gen-btn" class="tb-btn" data-i18n="privateHub.homePc.ttsGenerate">生成</button>
              <button type="button" id="download-btn" class="tb-btn" style="display:none" data-i18n="privateHub.homePc.ttsDownload">下载</button>
              <button type="button" id="clear-btn" class="tb-btn" data-i18n="privateHub.homePc.ttsClear">清空</button>
            </div>

            <div id="progress-wrap" class="progress-wrap" style="display:none">
              <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px;color:#666">
                <span id="progress-status">生成中…</span>
                <span id="progress-percent">—</span>
              </div>
              <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar" style="width:40%"></div>
              </div>
            </div>

            <div id="result-box" class="video-box home-pc-result-box" style="display:none">
              <h3 class="home-pc-result-title" data-i18n="privateHub.homePc.ttsResultTitle">生成结果</h3>
              <p id="meta-line" class="home-pc-result-meta"></p>
              <audio id="result-audio" controls style="width:100%;margin-top:8px"></audio>
            </div>

            <div class="action-row home-pc-log-toolbar" style="margin-top:16px">
              <button type="button" class="tb-btn" id="copy-log-btn" data-i18n="privateHub.homePc.copyLog">复制日志</button>
              <button type="button" class="tb-btn" id="open-dir-btn" data-i18n="privateHub.homePc.openLogDir">打开输出目录</button>
            </div>
            <div id="log-container" class="home-pc-log-box">
              <h4 data-i18n="privateHub.homePc.logTitle">执行日志</h4>
              <pre id="log-output"></pre>
            </div>

            <div style="margin-top:20px">
              <h3 data-i18n="privateHub.homePc.ttsHistoryTitle">历史记录</h3>
              <p class="small-hint" data-i18n="privateHub.homePc.ttsHistoryHint">可直接播放/下载；打开会回填文本与引擎。</p>
              <div id="history-list" class="home-pc-history-list"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../../../js/admin/home-pc/home-pc-nav.js?v=homepc21"></script>
  <script src="../../../../js/admin/admin-gate.js?v=nosTW5"></script>
  <script src="../../../../js/admin/private-page-guard.js?v=nosTW5"></script>
  <script src="../../../../js/admin/home-pc/home-pc-api.js?v=histPlay1"></script>
  <script src="../../../../js/admin/home-pc/home-pc-boot.js?v=homepc11"></script>
  <script src="../../../../js/admin/home-pc/tts.js?v=histPlay1"></script>
</body>
</html>
