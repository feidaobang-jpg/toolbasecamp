<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>同学模块名单 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="../../../vendor/font-awesome/css/all.min.css?v=ms7" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/base.css?v=ms7" />
  <link rel="stylesheet" href="../../../css/admin-shell.css?v=ms7" />
  <link rel="stylesheet" href="../../../css/site-mobile-nav.css?v=ms7" />
  <script src="../../../js/locales/en.js?v=ms7"></script>
  <script src="../../../js/locales/zh-CN.js?v=ms7"></script>
  <script src="../../../js/i18n.js?v=ms7"></script>
  <script src="../../../js/config.js?v=ms7"></script>
  <script src="../../../js/common_ui.js?v=ms7"></script>
</head>
<body class="admin-page">
  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="../private.html" class="admin-back">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
      </a>
      <h1 class="admin-title" data-i18n="privateHub.ops.markSixMembersTitle">同学模块名单</h1>
      <div class="admin-header-actions">
        <span id="auth-label" class="admin-auth-label"></span>
        <a id="login-link" href="../../auth/login.html?next=%2Fhtml%2Fadmin%2Fprivate%2Fmark-six-members.html" class="admin-login-link hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>
  <main class="admin-main">
    <div id="boot-loading" class="admin-card admin-card--center" data-i18n="privateHub.homePc.loading">加载中…</div>
    <div id="gate" class="admin-card admin-card--center hidden" hidden>
      <p id="gate-msg" class="admin-gate-msg" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
      <a id="gate-login" href="../../auth/login.html?next=%2Fhtml%2Fadmin%2Fprivate%2Fmark-six-members.html" class="tb-btn" data-i18n="auth.login">去登录</a>
    </div>
    <div id="app" class="admin-app hidden" hidden>
      <p class="admin-page-head-sub" data-i18n="privateHub.ops.markSixMembersDesc">添加到名单的手机号登录后，可在顶栏看到「同学」入口。管理员始终可见。</p>
      <div class="admin-form-stack" style="max-width:420px;margin:16px 0;">
        <label class="admin-field">
          <span class="admin-field-label" data-i18n="privateHub.ops.markSixPhone">手机号</span>
          <input id="member-phone" class="admin-input" type="tel" maxlength="11" placeholder="11 位手机号" />
        </label>
        <label class="admin-field">
          <span class="admin-field-label" data-i18n="privateHub.ops.markSixNote">备注</span>
          <input id="member-note" class="admin-input" type="text" maxlength="64" placeholder="可选" />
        </label>
        <div class="action-row">
          <button type="button" class="tb-btn" id="member-add-btn" data-i18n="privateHub.ops.markSixAdd">添加</button>
        </div>
      </div>
      <p id="member-flash" class="home-pc-flash" style="display:none;"></p>
      <div id="member-list" class="admin-card" style="padding:0;overflow:hidden;"></div>
    </div>
  </main>
  <script src="../../../js/admin/admin-gate.js?v=ms7"></script>
  <script src="../../../js/admin/private-page-guard.js?v=ms7"></script>
  <script src="../../../js/admin/private/mark-six-members.js?v=ms7"></script>
</body>
</html>
