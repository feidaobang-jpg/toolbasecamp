<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>传统图片管理 - 自用</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="../../../vendor/tailwindcss.js?v=minimax1"></script>
  <link href="../../../vendor/font-awesome/css/all.min.css?v=minimax1" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/base.css?v=minimax1" />
  <link rel="stylesheet" href="../../../css/site-mobile-nav.css?v=minimax1" />
  <link rel="stylesheet" href="../../../css/tools-form.css?v=minimax1" />
  <link rel="stylesheet" href="../../../css/admin/ladder-update.css?v=tradimg1" />
  <script src="../../../js/locales/en.js?v=tradimg1"></script>
  <script src="../../../js/locales/zh-CN.js?v=tradimg1"></script>
  <script src="../../../js/i18n.js?v=minimax1"></script>
  <script src="../../../js/config.js?v=tradimg1"></script>
  <script src="../../../js/common_ui.js?v=minimax1"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 md:gap-8 min-w-0">
      <a href="../private.html" class="flex items-center gap-2 flex-shrink-0 text-sm text-gray-600 hover:text-blue-600">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">自用</span>
      </a>
      <h1 class="text-base sm:text-lg font-bold text-gray-900 truncate" data-i18n="privateHub.ops.stickersTitle">传统图片管理</h1>
      <div class="ml-auto flex items-center gap-3 text-sm">
        <span id="auth-label" class="text-gray-500"></span>
        <a id="login-link" href="../../auth/login.html" class="text-blue-600 hover:underline hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>

  <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 w-full">
    <div id="boot-loading" class="max-w-lg mx-auto bg-white rounded-2xl border border-gray-100 p-8 text-center text-sm text-gray-500" data-i18n="privateHub.ops.stickersLoading">加载中…</div>

    <div id="gate" class="max-w-lg mx-auto bg-white rounded-2xl border border-gray-100 p-8 text-center hidden">
      <p id="gate-msg" class="text-gray-600 mb-4" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
      <a id="gate-login" href="../../auth/login.html" class="tb-btn inline-flex" data-i18n="auth.login">去登录</a>
    </div>

    <div id="app" class="ladder-update-wrap hidden">
      <p class="ladder-update-desc" data-i18n="privateHub.ops.stickersDesc">
        批量上传传统图片（表情包、精美图等），公开到图片模块「传统图片」Tab；微信内可长按保存或转发。
      </p>

      <section class="ladder-section">
        <h2 class="ladder-section-title" data-i18n="privateHub.ops.stickersUploadTitle">批量上传</h2>
        <p class="ladder-section-desc" data-i18n="privateHub.ops.stickersUploadDesc">支持 PNG / JPG / GIF / WebP（可多选）。文件名「分类-名称.png」会自动解析分类；也可在下方填写统一分类。</p>
        <div class="ladder-toolbar action-row" style="align-items:center;flex-wrap:wrap">
          <label class="tb-btn" style="cursor:pointer;margin:0">
            <span data-i18n="privateHub.ops.stickersPick">选择图片</span>
            <input type="file" id="upload-input" accept="image/png,image/jpeg,image/gif,image/webp,.png,.jpg,.jpeg,.gif,.webp" multiple hidden />
          </label>
          <label class="text-sm text-gray-600" style="display:flex;align-items:center;gap:6px">
            <span data-i18n="privateHub.ops.stickersCategory">统一分类</span>
            <input type="text" id="upload-category" class="tb-input" style="width:10rem" maxlength="40" placeholder="" />
          </label>
          <button type="button" id="btn-refresh" class="tb-btn" data-i18n="privateHub.ops.stickersRefresh">刷新列表</button>
          <a class="ladder-row-link" href="../../../images.html" target="_blank" rel="noopener" data-i18n="privateHub.ops.stickersPublic">查看公开页</a>
        </div>
        <div id="upload-status" class="ladder-status"></div>
        <div id="upload-progress" class="ladder-status" hidden></div>
      </section>

      <section class="ladder-section">
        <h2 class="ladder-section-title" data-i18n="privateHub.ops.stickersListTitle">传统图片列表</h2>
        <div id="list-meta" class="ladder-status"></div>
        <div id="sticker-list" class="ladder-list"></div>
      </section>
    </div>
  </main>

  <script src="../../../js/admin/private-page-guard.js?v=minimax1"></script>
  <script src="../../../js/admin/stickers.js?v=tradimg3"></script>
</body>
</html>
