<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>回调企稳 - 股票后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../../css/base.css?v=nosTW1" />
  <link rel="stylesheet" href="../../../css/admin-shell.css?v=nosTW4" />
  <link rel="stylesheet" href="../../../css/site-mobile-nav.css?v=nosTW1" />
  <link rel="stylesheet" href="../../../css/admin/stock-picks.css?v=pullback1" />
  <script src="../../../js/locales/zh-CN.js?v=pullback1"></script>
  <script src="../../../js/i18n.js?v=nosTW1"></script>
  <script src="../../../js/config.js?v=nosTW1"></script>
  <script src="../../../js/common_ui.js?v=nosTW1"></script>
</head>
<body class="admin-page">
  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="../private.html" class="admin-back"><span data-i18n="privateHub.title">后台</span></a>
      <h1 class="admin-title" data-i18n="privateHub.stock.picksTitle">选股策略</h1>
      <div class="admin-header-actions">
        <span id="auth-label" class="admin-auth-label"></span>
        <a id="login-link" href="../../auth/login.html" class="admin-login-link hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>
  <main class="admin-main admin-main--wide">
    <div id="gate" class="admin-card admin-card--center admin-card--narrow hidden">
      <p id="gate-msg">需要管理员登录后查看</p>
      <a id="gate-login" href="../../auth/login.html" class="tb-btn">去登录</a>
    </div>
    <div id="app" class="stock-page-wrap hidden">
      <section class="stock-container">
        <div class="stock-strategy-heading">
          <div><h2 data-i18n="privateHub.stock.strategy">回调企稳</h2><p data-i18n="privateHub.stock.subtitle">趋势向上 · 缩量回调 · 企稳确认</p></div>
          <span class="stock-badge">中短线 · 模拟跟踪</span>
        </div>
        <p class="strategy-desc" data-i18n="privateHub.stock.validation">初始规则尚未完成历史回测和样本外验证，不代表已证实高胜率。</p>
        <div id="schedulerStatus" class="stock-job-status" aria-live="polite">正在读取自动运行状态…</div>
        <div class="toolbar action-row">
          <button id="btnRefresh" type="button" class="tb-btn" data-i18n="privateHub.stock.refresh">刷新</button>
          <button id="btnPreview" type="button" class="tb-btn" data-i18n="privateHub.stock.preview">筛选预览</button>
          <button id="btnCheck" type="button" class="tb-btn" data-i18n="privateHub.stock.check">运行检查</button>
          <button id="btnExport" type="button" class="tb-btn" data-i18n="privateHub.stock.export">导出复盘数据</button>
        </div>
        <p id="actionStatus" class="status" role="status"></p>
        <div id="recordsStats" class="records-stats" aria-live="polite"></div>
        <details class="stock-rules"><summary data-i18n="privateHub.stock.rules">规则与执行</summary><div id="rulesText"></div></details>
        <div id="screenResults" class="results"></div>
      </section>
      <section class="stock-container">
        <h2 data-i18n="privateHub.stock.records">模拟跟踪记录</h2>
        <p class="stock-explanation" data-i18n="privateHub.stock.recordHint">网站保存信号和模拟成交并计算扣费收益；AI读取记录分析原因、提出改进。</p>
        <div class="toolbar">
          <label for="recordsState">查看记录</label>
          <select id="recordsState" class="select-sm">
            <option value="" data-i18n="privateHub.stock.all">全部状态</option>
            <option value="open" data-i18n="privateHub.stock.open">持仓中</option>
            <option value="queued" data-i18n="privateHub.stock.queued">待模拟买入</option>
            <option value="closed" data-i18n="privateHub.stock.closed">已平仓</option>
            <option value="review" data-i18n="privateHub.stock.review">待复核</option>
            <option value="expired" data-i18n="privateHub.stock.expired">未成交</option>
            <option value="archive" data-i18n="privateHub.stock.archive">历史旧策略</option>
          </select>
          <span id="recordsStatus" class="status" role="status"></span>
        </div>
        <div class="records-table-wrap">
          <table class="records-table">
            <thead><tr>
              <th data-i18n="privateHub.stock.signal">信号时间</th>
              <th data-i18n="privateHub.stock.stock">股票 / 行业</th>
              <th data-i18n="privateHub.stock.entry">模拟买入</th>
              <th data-i18n="privateHub.stock.latest">最新 / 卖出</th>
              <th data-i18n="privateHub.stock.net">扣费收益</th>
              <th data-i18n="privateHub.stock.state">状态 / 原因</th>
            </tr></thead>
            <tbody id="recordsBody"></tbody>
          </table>
        </div>
        <div id="recordsPager"></div>
      </section>
    </div>
  </main>
  <script src="../../../js/admin/admin-gate.js?v=nosTW5"></script>
  <script src="../../../js/tb-pager.js?v=nosTW1"></script>
  <script src="../../../js/admin/stock-picks.js?v=pullback1"></script>
</body>
</html>
