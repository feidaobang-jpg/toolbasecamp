<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>歌曲管理 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link href="../../../vendor/font-awesome/css/all.min.css?v=nosTW1" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/base.css?v=pagerjump1" />
  <link rel="stylesheet" href="../../../css/admin-shell.css?v=nosTW4" />
  <link rel="stylesheet" href="../../../css/site-mobile-nav.css?v=nosTW1" />
  <link rel="stylesheet" href="../../../css/tools-form.css?v=nosTW1" />
  <link rel="stylesheet" href="../../../css/admin/ladder-update.css?v=pager20" />
  <script src="../../../js/locales/en.js?v=i2i-name1"></script>
  <script src="../../../js/locales/zh-CN.js?v=i2i-name1"></script>
  <script src="../../../js/i18n.js?v=nosTW1"></script>
  <script src="../../../js/config.js?v=nosTW1"></script>
  <script src="../../../js/common_ui.js?v=nosTW1"></script>
</head>
<body class="admin-page">
  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="../private.html" class="admin-back">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
      </a>
      <h1 class="admin-title" data-i18n="privateHub.ops.tradMusicTitle">歌曲管理</h1>
      <div class="admin-header-actions">
        <span id="auth-label" class="admin-auth-label"></span>
        <a id="login-link" href="../../auth/login.html" class="admin-login-link hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>

  <main class="admin-main admin-main--wide">
    <div id="boot-loading" class="admin-card admin-card--center admin-card--narrow" data-i18n="privateHub.ops.tradMusicLoading">加载中…</div>

    <div id="gate" class="admin-card admin-card--center admin-card--narrow hidden">
      <p id="gate-msg" class="admin-gate-msg" data-i18n="privateHub.needAdmin">需要管理员登录后查看</p>
      <a id="gate-login" href="../../auth/login.html" class="tb-btn" data-i18n="auth.login">去登录</a>
    </div>

    <div id="app" class="ladder-update-wrap hidden">
      <p class="ladder-update-desc" data-i18n="privateHub.ops.tradMusicDesc">
        管理公开音乐：传统歌曲可批量上传（自动生成试听版 + DeepSeek 歌词）；AI 公开歌曲可在此删除。
      </p>

      <div class="tb-tabs tb-tabs--underline" role="tablist">
        <button type="button" class="tb-tab active" data-song-tab="traditional" role="tab" aria-selected="true" data-i18n="privateHub.ops.tradMusicTradTab">传统音乐</button>
        <button type="button" class="tb-tab" data-song-tab="ai" role="tab" aria-selected="false" data-i18n="privateHub.ops.tradMusicAiTab">AI 音乐</button>
      </div>

      <div id="panel-traditional">
        <section class="ladder-section">
          <h2 class="ladder-section-title" data-i18n="privateHub.ops.tradMusicUploadTitle">批量上传</h2>
          <p class="ladder-section-desc" data-i18n="privateHub.ops.tradMusicUploadDesc">选择本地 MP3（可多选）。歌手与歌名只认文件名「歌手-歌名.mp3」，不会自动猜测。</p>
          <div class="ladder-toolbar action-row" style="align-items:center">
            <label class="tb-btn" style="cursor:pointer;margin:0">
              <span data-i18n="privateHub.ops.tradMusicPick">选择文件</span>
              <input type="file" id="upload-input" accept="audio/mpeg,.mp3" multiple hidden />
            </label>
            <label class="about-feature-desc" style="display:flex;align-items:center;gap:6px">
              <input type="checkbox" id="fetch-lyrics" />
              <span data-i18n="privateHub.ops.tradMusicFetchLyrics">上传时尝试获取歌词（DeepSeek，常不准，默认关闭）</span>
            </label>
            <button type="button" id="btn-refresh-trad" class="tb-btn" data-i18n="privateHub.ops.tradMusicRefresh">刷新列表</button>
            <button type="button" id="btn-reparse-trad" class="tb-btn" data-i18n="privateHub.ops.tradMusicReparse">按源文件名重解析</button>
            <a class="ladder-row-link" href="../../../music.html" target="_blank" rel="noopener" data-i18n="privateHub.ops.tradMusicPublic">查看公开页</a>
          </div>
          <div id="upload-status" class="ladder-status"></div>
          <div id="upload-progress" class="ladder-status" hidden></div>
        </section>

        <section class="ladder-section">
          <h2 class="ladder-section-title" data-i18n="privateHub.ops.tradMusicListTitle">传统歌曲列表</h2>
          <p class="ladder-section-desc" data-i18n="privateHub.ops.tradMusicListHint">文件名本身写错的，请点「改名」手改，或删除后按「歌手-歌名.mp3」重传。</p>
          <div id="list-meta-trad" class="ladder-status"></div>
          <div id="track-list-trad" class="ladder-list"></div>
          <div class="tb-pager" id="pager-trad" hidden></div>
        </section>
      </div>

      <div id="panel-ai" hidden>
        <section class="ladder-section">
          <h2 class="ladder-section-title" data-i18n="privateHub.ops.tradMusicAiListTitle">AI 公开歌曲</h2>
          <p class="ladder-section-desc" data-i18n="privateHub.ops.tradMusicAiListDesc">用户生成并公开到音乐列表的 AI 歌曲，可在此删除。</p>
          <div class="ladder-toolbar action-row">
            <button type="button" id="btn-refresh-ai" class="tb-btn" data-i18n="privateHub.ops.tradMusicRefresh">刷新列表</button>
            <a class="ladder-row-link" href="../../../html/media/ai-music.html" target="_blank" rel="noopener" data-i18n="privateHub.ops.tradMusicAiCreate">去生成页</a>
            <a class="ladder-row-link" href="../../../music.html" target="_blank" rel="noopener" data-i18n="privateHub.ops.tradMusicPublic">查看公开页</a>
          </div>
          <div id="list-meta-ai" class="ladder-status"></div>
          <div id="track-list-ai" class="ladder-list"></div>
          <div class="tb-pager" id="pager-ai" hidden></div>
        </section>
      </div>
    </div>
  </main>

  <script src="../../../js/admin/admin-gate.js?v=nosTW5"></script>
  <script src="../../../js/admin/private-page-guard.js?v=nosTW5"></script>
  <script src="../../../js/tb-pager.js?v=jump1"></script>
  <script src="../../../js/admin/traditional-music.js?v=editartist1"></script>
</body>
</html>
