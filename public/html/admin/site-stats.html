<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>站点统计 - 后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link href="../../vendor/font-awesome/css/all.min.css?v=nosTW1" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css?v=nosTW1" />
  <link rel="stylesheet" href="../../css/admin-shell.css?v=nosTW2" />
  <link rel="stylesheet" href="../../css/site-mobile-nav.css?v=nosTW1" />
  <link rel="stylesheet" href="../../css/admin/site-stats.css?v=nosTW2" />
</head>
<body class="admin-page">
  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="private.html" class="admin-back">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">后台</span>
      </a>
      <h1 class="admin-title" data-i18n="privateHub.ops.siteStatsTitle">站点统计</h1>
      <div class="admin-header-actions">
        <span id="auth-label" class="admin-auth-label"></span>
        <a id="login-link" href="../auth/login.html?next=%2Fhtml%2Fadmin%2Fsite-stats.html" class="admin-login-link hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>

  <main class="admin-main admin-main--stats">
    <div id="gate" class="admin-card admin-card--center hidden">
      <p id="gate-msg" class="admin-gate-msg">需要管理员登录后查看</p>
      <a href="../auth/login.html" class="tb-btn" data-i18n="auth.login">去登录</a>
    </div>

    <div id="app" class="admin-app hidden">
      <div class="stats-toolbar">
        <div>
          <h2 class="admin-page-head-title">每日运营概览</h2>
          <p class="admin-page-head-sub">选具体日期看访问、注册邀请、充值、消费与生图；也可切换近 N 天汇总</p>
        </div>
        <div class="stats-toolbar-actions">
          <div class="stats-day-chips" id="day-chips">
            <button type="button" class="day-chip" data-offset="0">今天</button>
            <button type="button" class="day-chip" data-offset="1">昨天</button>
            <button type="button" class="day-chip" data-offset="2">前天</button>
          </div>
          <div class="stats-field">
            <label for="stat-date">日期</label>
            <input type="date" id="stat-date" class="stats-input" />
          </div>
          <div class="stats-field">
            <label for="range-days">或区间</label>
            <select id="range-days" class="stats-select">
              <option value="">按日查看</option>
              <option value="7">近 7 天</option>
              <option value="30">近 30 天</option>
              <option value="90">近 90 天</option>
              <option value="365">近 1 年</option>
            </select>
          </div>
          <button type="button" id="refresh-btn" class="tb-btn">刷新</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label" id="label-day-pv">当日浏览</div>
          <div class="stat-value" id="day-pv">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" id="label-day-uv">当日访客</div>
          <div class="stat-value" id="day-uv">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累计浏览</div>
          <div class="stat-value" id="site-pv">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累计访客</div>
          <div class="stat-value" id="site-uv">—</div>
        </div>
      </div>

      <section class="stats-section">
        <h3 class="stats-section-title">业务指标</h3>
        <p class="stats-section-sub">来自注册、余额流水与佣金表（非匿名埋点）</p>
        <div class="stats-grid" id="biz-cards"></div>
      </section>

      <p id="range-label" class="stats-note"></p>
      <p id="error-box" class="error-box" hidden></p>

      <section class="stats-section">
        <h3 class="stats-section-title">国内 / 海外</h3>
        <p class="stats-section-sub">按访问 IP / Cloudflare 国家头粗分（仅中国大陆计为国内）。管理员与排除 IP 不计入。访客按首次出现地区。</p>
        <p id="geo-empty-note" class="stats-warn hidden"></p>
        <div class="stats-geo-grid">
          <div>
            <div class="stats-geo-card-title">浏览量占比</div>
            <div id="geo-pv-bars" class="stats-stack"></div>
            <p id="geo-pv-summary" class="stats-note"></p>
          </div>
          <div>
            <div class="stats-geo-card-title">访客占比</div>
            <div id="geo-uv-bars" class="stats-stack"></div>
            <p id="geo-uv-summary" class="stats-note"></p>
          </div>
        </div>
      </section>

      <section class="stats-section">
        <h3 class="stats-section-title">模块汇总（页面/工具打开）</h3>
        <div id="module-list" class="stats-stack"></div>
      </section>

      <section class="stats-section">
        <h3 class="stats-section-title">功能 / 页面排行</h3>
        <div class="stats-table-wrap">
          <table class="stats-table">
            <thead>
              <tr>
                <th>#</th>
                <th>事件</th>
                <th>次数</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="top-body"></tbody>
          </table>
        </div>
        <p id="top-empty" class="stats-empty hidden">该日/区间暂无页面事件数据</p>
      </section>
    </div>
  </main>

  <script src="../../js/locales/en.js?v=i2i-name1"></script>
  <script src="../../js/locales/zh-CN.js?v=i2i-name1"></script>
  <script src="../../js/i18n.js?v=nosTW1"></script>
  <script src="../../js/config.js?v=nosTW1"></script>
  <script src="../../js/admin/site-stats.js?v=nosTW1"></script>
</body>
</html>
