<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>站点统计 - 自用</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="../../vendor/tailwindcss.js?v=2"></script>
  <link href="../../vendor/font-awesome/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/site-mobile-nav.css" />
  <link rel="stylesheet" href="../../css/admin/site-stats.css?v=4" />
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 md:gap-8 min-w-0">
      <a href="private.html" class="flex items-center gap-2 flex-shrink-0 text-sm text-gray-600 hover:text-blue-600">
        <i class="fas fa-arrow-left"></i> <span data-i18n="privateHub.title">自用</span>
      </a>
      <h1 class="text-base sm:text-lg font-bold text-gray-900 truncate" data-i18n="privateHub.ops.siteStatsTitle">站点统计</h1>
      <div class="ml-auto flex items-center gap-3 text-sm">
        <span id="auth-label" class="text-gray-500"></span>
        <a id="login-link" href="../auth/login.html?next=%2Fhtml%2Fadmin%2Fsite-stats.html" class="text-blue-600 hover:underline hidden" data-i18n="auth.login">登录</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div id="gate" class="bg-white rounded-2xl border border-gray-100 p-8 text-center hidden">
      <p id="gate-msg" class="text-gray-600 mb-4">需要管理员登录后查看</p>
      <a href="../auth/login.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium">去登录</a>
    </div>

    <div id="app" class="hidden space-y-6">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-gray-900">每日运营概览</h2>
          <p class="text-sm text-gray-500 mt-1">选具体日期看访问、注册邀请、充值、消费与生图；也可切换近 N 天汇总</p>
        </div>
        <div class="flex flex-wrap items-end gap-3">
          <div class="flex items-center gap-2" id="day-chips">
            <button type="button" class="day-chip" data-offset="0">今天</button>
            <button type="button" class="day-chip" data-offset="1">昨天</button>
            <button type="button" class="day-chip" data-offset="2">前天</button>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1" for="stat-date">日期</label>
            <input type="date" id="stat-date" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white" />
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1" for="range-days">或区间</label>
            <select id="range-days" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white">
              <option value="">按日查看</option>
              <option value="7">近 7 天</option>
              <option value="30">近 30 天</option>
              <option value="90">近 90 天</option>
              <option value="365">近 1 年</option>
            </select>
          </div>
          <button type="button" id="refresh-btn" class="tb-btn text-sm px-3 py-2">刷新</button>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="stat-card">
          <div class="stat-label" id="label-day-pv">当日浏览</div>
          <div class="stat-value" id="day-pv">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" id="label-day-uv">当日访客</div>
          <div class="stat-value" id="day-uv">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累计浏览</div>
          <div class="stat-value" id="site-pv">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累计访客</div>
          <div class="stat-value" id="site-uv">—</div>
        </div>
      </div>

      <section class="bg-white rounded-2xl border border-gray-100 p-5">
        <h3 class="font-semibold text-gray-900 mb-1">业务指标</h3>
        <p class="text-xs text-gray-400 mb-4">来自注册、余额流水与佣金表（非匿名埋点）</p>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="biz-cards"></div>
      </section>

      <p id="range-label" class="text-xs text-gray-400"></p>
      <p id="error-box" class="error-box" hidden></p>

      <section class="bg-white rounded-2xl border border-gray-100 p-5">
        <h3 class="font-semibold text-gray-900 mb-1">国内 / 海外</h3>
        <p class="text-xs text-gray-400 mb-4">按访问 IP / Cloudflare 国家头粗分（仅中国大陆计为国内）。管理员与排除 IP 不计入。访客按首次出现地区。</p>
        <p id="geo-empty-note" class="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-lg px-3 py-2 mb-4 hidden"></p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <div class="text-sm text-gray-600 mb-2">浏览量占比</div>
            <div id="geo-pv-bars" class="space-y-2"></div>
            <p id="geo-pv-summary" class="text-xs text-gray-400 mt-2"></p>
          </div>
          <div>
            <div class="text-sm text-gray-600 mb-2">访客占比</div>
            <div id="geo-uv-bars" class="space-y-2"></div>
            <p id="geo-uv-summary" class="text-xs text-gray-400 mt-2"></p>
          </div>
        </div>
      </section>

      <section class="bg-white rounded-2xl border border-gray-100 p-5">
        <h3 class="font-semibold text-gray-900 mb-4">模块汇总（页面/工具打开）</h3>
        <div id="module-list" class="space-y-2"></div>
      </section>

      <section class="bg-white rounded-2xl border border-gray-100 p-5">
        <h3 class="font-semibold text-gray-900 mb-4">功能 / 页面排行</h3>
        <div class="overflow-x-auto">
          <table class="stats-table">
            <thead>
              <tr>
                <th>#</th>
                <th>事件</th>
                <th>次数</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="top-body"></tbody>
          </table>
        </div>
        <p id="top-empty" class="text-sm text-gray-400 py-6 text-center hidden">该日/区间暂无页面事件数据</p>
      </section>
    </div>
  </main>

  <script src="../../js/locales/en.js"></script>
  <script src="../../js/locales/zh-CN.js"></script>
  <script src="../../js/i18n.js?v=stats2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/admin/site-stats.js?v=7"></script>
</body>
</html>
