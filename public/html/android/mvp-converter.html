<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP 代码生成 - 工具大本营</title>
  <meta name="description" content="MVP 代码生成" />
  <link rel="stylesheet" href="../../css/base.css?v=minimax1" />
  <link rel="stylesheet" href="../../css/android/mvp-converter.css?v=minimax1" />
</head>
<body>
  <div class="container">
    <aside class="sidebar"></aside>
    <main class="content">
<div class="page active">
                <h2 data-i18n="tools.mvpConverter.title">MVP 代码生成</h2>
                <div class="tool-container">
                    <div class="input-section">
                        <div class="row">
                            <div class="field full-width">
                                <label for="api-info">API信息 (格式: 中文名称 路径):</label>
                                <input type="text" id="api-info" placeholder="例如: 变更学员 /api-user/user/assignStudent">
                            </div>
                            
                            <div class="field">
                                <label>返回结果类型:</label>
                                <div class="radio-group">
                                    <label class="radio-label">
                                        <input type="radio" name="result-type" value="object" checked>
                                        对象
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="result-type" value="string">
                                        String
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="result-type" value="list">
                                        List
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="field full-width">
                                <label for="input-params">输入参数 (每行一个):</label>
                                <textarea id="input-params" rows="8" placeholder="current
level"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="button-section">
                        <button type="button" class="tb-btn" id="generate-btn">生成</button>
                        <button type="button" class="tb-btn" id="clear-btn">清空</button>
                    </div>

                    <div class="output-sections">
                        
                        <div class="output-section">
                            <label for="api-service-output">API Service方法:</label>
                            <pre id="api-service-output" class="code-display"></pre>
                            <button type="button" class="tb-btn copy-btn" data-target="api-service-output">复制代码</button>
                        </div>

                        <div class="output-section">
                            <label for="api-class-output">API类:</label>
                            <pre id="api-class-output" class="code-display"></pre>
                            <button type="button" class="tb-btn copy-btn" data-target="api-class-output">复制代码</button>
                        </div>

                        <div class="output-section">
                            <label for="model-class-output">Model类:</label>
                            <pre id="model-class-output" class="code-display"></pre>
                            <button type="button" class="tb-btn copy-btn" data-target="model-class-output">复制代码</button>
                        </div>

                        <div class="output-section">
                            <label for="presenter-class-output">Presenter类:</label>
                            <pre id="presenter-class-output" class="code-display"></pre>
                            <button type="button" class="tb-btn copy-btn" data-target="presenter-class-output">复制代码</button>
                        </div>
                        
                        <div class="output-section">
                            <label for="view-interface-output">View接口:</label>
                            <pre id="view-interface-output" class="code-display"></pre>
                            <button type="button" class="tb-btn copy-btn" data-target="view-interface-output">复制代码</button>
                        </div>

                        <div class="output-section">
                            <label for="call-presenter-output">调用代码:</label>
                            <pre id="call-presenter-output" class="code-display"></pre>
                            <button type="button" class="tb-btn copy-btn" data-target="call-presenter-output">复制代码</button>
                        </div>

                        <div class="output-section">
                            <label for="ui-callback-output">UI回调:</label>
                            <pre id="ui-callback-output" class="code-display"></pre>
                            <button type="button" class="tb-btn copy-btn" data-target="ui-callback-output">复制代码</button>
                        </div>

                    </div>
                </div>
            </div>
    </main>
  </div>
  <script src="../../js/locales/en.js?v=adminhub1"></script>
  <script src="../../js/locales/zh-CN.js?v=adminhub1"></script>
  <script src="../../js/i18n.js?v=minimax1"></script>
  <script src="../../js/config.js?v=minimax1"></script>
  <script src="../../js/base.js?v=minimax1"></script>
  <script src="../../js/common_ui.js?v=adminhub1"></script>
  <script src="../../js/android/mvp-converter.js?v=minimax1"></script>
</body>
</html>
