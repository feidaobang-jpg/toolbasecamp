<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下拉刷新分页生成 - 工具大本营</title>
  <meta name="description" content="下拉刷新分页生成" />
  <link rel="stylesheet" href="../../css/base.css?v=9" />
  <link rel="stylesheet" href="../../css/android/refresh-page-generator.css?v=1" />
</head>
<body>
  <div class="container">
    <aside class="sidebar"></aside>
    <main class="content">
<div class="page active">
                <h2 data-i18n="tools.refreshPageGenerator.title">下拉刷新分页生成</h2>
                <div class="tool-container">
                    <div class="button-section">
                        <button type="button" class="tb-btn" id="generate-btn">生成</button>
                        <button type="button" class="tb-btn" id="clear-btn">清空</button>
                    </div>

                    <div class="output-sections">
                        <div class="output-section">
                            <label for="layout-output">布局:</label>
                            <pre id="layout-output" class="code-display"></pre>
                            <button type="button" class="tb-btn copy-btn" data-target="layout-output">复制代码</button>
                        </div>

                        <div class="output-section">
                            <label for="main-class-output">主类:</label>
                            <pre id="main-class-output" class="code-display"></pre>
                            <button type="button" class="tb-btn copy-btn" data-target="main-class-output">复制代码</button>
                        </div>
                    </div>
                </div>
            </div>
    </main>
  </div>
  <script src="../../js/locales/en.js"></script>
  <script src="../../js/locales/zh-CN.js"></script>
  <script src="../../js/i18n.js?v=stats1"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/base.js"></script>
  <script src="../../js/common_ui.js?v=6"></script>
  <script src="../../js/android/refresh-page-generator.js?v=1"></script>
</body>
</html>
