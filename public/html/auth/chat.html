<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系管理员 - 百宝箱</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link href="../../vendor/font-awesome/css/all.min.css?v=nosTW1" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css?v=nosTW1" />
  <link rel="stylesheet" href="../../css/site-shell.css?v=nosTW1">
  <link rel="stylesheet" href="../../css/auth-form.css?v=nosTW1">
  <script src="../../js/locales/en.js?v=brand1"></script>
  <script src="../../js/locales/zh-CN.js?v=brand1"></script>
  <script src="../../js/i18n.js?v=nosTW1"></script>
  <script src="../../js/config.js?v=nosTW1"></script>
  <script src="../../js/common_ui.js?v=nosTW1"></script>
  <style>
    #chat-log { scroll-behavior: smooth; }
    .chat-bubble-me { background: #2563eb; color: #fff; }
    .chat-bubble-them { background: #f3f4f6; color: #111827; }
  </style>
</head>
<body class="site-page">
  <header class="site-header site-header--sticky">
    <div class="site-header-inner">
      <a href="../../index.html" class="site-brand">
        <div class="site-logo logo-text">TB</div>
        <h1 class="site-name site-title">百宝箱</h1>
      </a>
      <nav data-nav="main" data-base-path="../../" class="site-nav-main"></nav>
      <div id="site-header-mobile-slot" class="site-header-mobile-slot"></div>
    </div>
  </header>

  <main class="chat-page">
    <div class="chat-shell">
      <div class="chat-shell-head">
        <div>
          <h2 class="chat-shell-title" data-i18n="chat.title">Contact admin</h2>
          <p class="chat-shell-sub" data-i18n="chat.subtitle">Private chat — only you and admins can see it.</p>
        </div>
        <span id="chat-status" class="chat-shell-status"></span>
      </div>
      <div id="chat-gate" class="chat-gate hidden">
        <p class="mb-3" data-i18n="chat.needLogin">Please sign in to chat with the admin.</p>
        <a id="chat-login" class="tb-btn" href="login.html" data-i18n="auth.login">Login</a>
      </div>
      <div id="chat-app" class="chat-app hidden">
        <div id="chat-log" class="chat-log"></div>
        <div class="chat-compose">
          <textarea id="chat-input" rows="2" maxlength="2000"
            data-i18n-placeholder="chat.placeholder" placeholder="Type a message…"></textarea>
          <button type="button" id="chat-send" class="tb-btn" data-i18n="chat.send">Send</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../../js/auth/chat.js?v=nosTW1"></script>
</body>
</html>
