<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系管理员 - Tool Basecamp</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="../../vendor/tailwindcss.js?v=btnGap1"></script>
  <link href="../../vendor/font-awesome/css/all.min.css?v=btnGap1" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css?v=btnGap1" />
  <link rel="stylesheet" href="../../css/site-mobile-nav.css?v=btnGap1" />
  <script src="../../js/locales/en.js?v=btnGap1"></script>
  <script src="../../js/locales/zh-CN.js?v=btnGap1"></script>
  <script src="../../js/i18n.js?v=btnGap1"></script>
  <script src="../../js/config.js?v=btnGap1"></script>
  <script src="../../js/common_ui.js?v=btnGap1"></script>
  <style>
    #chat-log { scroll-behavior: smooth; }
    .chat-bubble-me { background: #2563eb; color: #fff; }
    .chat-bubble-them { background: #f3f4f6; color: #111827; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-gray-100 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 md:gap-8 min-w-0">
      <a href="../../index.html" class="flex items-center gap-2 flex-shrink-0 min-w-0 max-w-[58vw] sm:max-w-none group">
        <div class="logo-text w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:bg-blue-700 transition-colors">TB</div>
        <h1 class="site-name text-base sm:text-xl font-bold text-gray-900 tracking-tight truncate">Tool Basecamp</h1>
      </a>
      <nav data-nav="main" data-base-path="../../" class="hidden md:flex items-center gap-8 text-[15px] font-medium text-gray-600"></nav>
      <div id="site-header-mobile-slot" class="flex items-center gap-1 flex-shrink-0 md:hidden ml-auto"></div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-lg mx-auto px-4 py-6 flex flex-col min-h-0" style="height: calc(100vh - 4rem);">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col flex-1 min-h-0 overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between gap-2">
        <div>
          <h2 class="text-base font-semibold text-gray-900" data-i18n="chat.title">Contact admin</h2>
          <p class="text-xs text-gray-500" data-i18n="chat.subtitle">Private chat — only you and admins can see it.</p>
        </div>
        <span id="chat-status" class="text-xs text-gray-400"></span>
      </div>
      <div id="chat-gate" class="hidden p-6 text-center text-sm text-gray-600">
        <p class="mb-3" data-i18n="chat.needLogin">Please sign in to chat with the admin.</p>
        <a id="chat-login" class="tb-btn inline-flex" href="login.html" data-i18n="auth.login">Login</a>
      </div>
      <div id="chat-app" class="hidden flex flex-col flex-1 min-h-0">
        <div id="chat-log" class="flex-1 overflow-y-auto px-4 py-3 space-y-2"></div>
        <div class="border-t border-gray-100 p-3 flex gap-2">
          <textarea id="chat-input" rows="2" maxlength="2000"
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm resize-none"
            data-i18n-placeholder="chat.placeholder" placeholder="Type a message…"></textarea>
          <button type="button" id="chat-send" class="tb-btn self-end whitespace-nowrap" data-i18n="chat.send">Send</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../../js/auth/chat.js?v=btnGap1"></script>
</body>
</html>
