<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - 百宝箱</title>
    <meta name="description" content="Log in to your Treasure Box account.">
<link rel="stylesheet" href="../../css/base.css?v=nosTW1">
  <link rel="stylesheet" href="../../css/site-shell.css?v=nosTW1">
  <link rel="stylesheet" href="../../css/auth-form.css?v=nosTW1">
    <link rel="stylesheet" href="../../css/site-mobile-nav.css?v=nosTW1">
    <link href="../../vendor/font-awesome/css/all.min.css?v=nosTW1" rel="stylesheet">
</head>
<body class="site-page">
    <header class="site-header">
        <div class="site-header-inner auth-header-inner">
            <a href="../../index.html" class="site-brand">
                <div class="site-logo logo-text">TB</div>
                <h1 class="site-name site-title">百宝箱</h1>
            </a>
            <a href="../../index.html" class="auth-back-home">
                <i class="fas fa-arrow-left mr-1"></i> <span data-i18n="auth.backHome">Back to home</span>
            </a>
        </div>
    </header>

    <main class="site-main site-main--center">
        <div class="auth-card">
            <div class="auth-card-body">
                <div class="auth-head">
                    <h2 class="auth-head-title" data-i18n="auth.welcomeBack">Welcome back</h2>
                    <p class="auth-head-sub" data-i18n="auth.loginSubtitle">???????</p>
                </div>

                <div class="auth-form-stack">
                    <div>
                        <label class="auth-field-label" data-i18n="auth.accountLabel">???</label>
                        <div class="auth-input-wrap">
                            <div class="auth-input-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <input id="account" type="text" autocomplete="username" inputmode="tel" class="auth-input" data-i18n-placeholder="auth.accountPlaceholder" placeholder="???" />
                        </div>
                        <p class="auth-field-hint" data-i18n="auth.loginPhoneNote">????????????????????</p>
                    </div>

                    <div>
                        <label class="auth-field-label" data-i18n="auth.password">Password</label>
                        <div class="auth-input-wrap">
                            <div class="auth-input-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input id="password" type="password" class="auth-input" data-i18n-placeholder="auth.passwordPlaceholder" placeholder="Your password" />
                        </div>
                    </div>

                    <div id="status" class="auth-status"></div>

                    <button id="btn-login" type="button" class="tb-btn w-full" data-i18n="auth.loginBtn">Log in</button>

                    <div class="auth-footer">
                        <span data-i18n="auth.noAccount">Don't have an account?</span>
                        <a href="register.html" class="auth-footer-link" data-i18n="auth.signup">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/locales/en.js?v=brand1"></script>
    <script src="../../js/locales/zh-CN.js?v=brand1"></script>
    <script src="../../js/i18n.js?v=nosTW1"></script>
    <script src="../../js/config.js?v=nosTW1"></script>
    <script src="../../js/common_ui.js?v=nosTW1"></script>
    <script src="../../js/auth/auth.js?v=nosTW1"></script>
</body>
</html>
