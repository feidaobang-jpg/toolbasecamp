<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Tool Basecamp</title>
    <meta name="description" content="Manage your Tool Basecamp account.">
    <script src="../../vendor/tailwindcss.js?v=2"></script>
    <link href="../../vendor/font-awesome/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/base.css?v=9">
    <link rel="stylesheet" href="../../css/site-mobile-nav.css">
    <script src="../../js/locales/en.js?v=nick1"></script>
    <script src="../../js/locales/zh-CN.js?v=nick1"></script>
    <script src="../../js/i18n.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/common_ui.js?v=chat4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 md:gap-8 min-w-0">
            <a href="../../index.html" class="flex items-center gap-2 flex-shrink-0 min-w-0 max-w-[58vw] sm:max-w-none group">
                <div class="logo-text w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:bg-blue-700 transition-colors">TB</div>
                <h1 class="site-name text-base sm:text-xl font-bold text-gray-900 tracking-tight truncate">Tool Basecamp</h1>
            </a>
            <nav data-nav="main" data-base-path="../../" class="hidden md:flex items-center gap-8 text-[15px] font-medium text-gray-600"></nav>
            <div id="site-header-mobile-slot" class="flex items-center gap-1 flex-shrink-0 md:hidden ml-auto">
                <a href="../../index.html" class="text-sm text-gray-600 whitespace-nowrap" data-i18n="auth.home">Home</a>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-8 flex flex-col items-center text-center border-b border-gray-50">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center text-blue-500 text-3xl mb-4" id="profile-avatar-fallback">
                    <i class="fas fa-user"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-900 mb-1" id="profile-display" data-i18n="auth.loading">Loading...</h2>
                <p class="text-sm text-gray-500 break-all" id="profile-account"></p>
                <span class="text-xs text-gray-400 mt-1">UID: <span id="profile-uid">--</span></span>
                <p class="mt-3 text-sm text-gray-600">
                    <span data-i18n="auth.aiBalance">Balance</span>：
                    <span id="profile-balance" class="font-semibold text-gray-900">--</span>
                </p>
            </div>

            <div class="px-6 py-4 space-y-3 border-b border-gray-50">
                <h3 class="text-sm font-semibold text-gray-900" data-i18n="auth.nicknameTitle">Nickname</h3>
                <p class="text-xs text-gray-500" data-i18n="auth.nicknameHint">Shown in chat and admin lists. Leave empty to use phone/email.</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="nickname-input" maxlength="32" autocomplete="nickname"
                        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"
                        data-i18n-placeholder="auth.nicknamePh" placeholder="Your nickname" />
                    <button type="button" id="btn-save-nickname" class="tb-btn whitespace-nowrap" data-i18n="auth.saveNickname">Save</button>
                </div>
                <div id="nickname-msg" class="text-sm hidden"></div>
            </div>

            <div class="px-6 pb-2 space-y-3 border-b border-gray-50" id="redeem-section">
                <h3 class="text-sm font-semibold text-gray-900" data-i18n="auth.redeemTitle">Redeem code</h3>
                <p class="text-xs text-gray-500" data-i18n="auth.redeemHint">Enter a code from an admin to top up your account balance.</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="redeem-code" maxlength="40" autocomplete="off"
                        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono uppercase"
                        data-i18n-placeholder="auth.redeemCode" placeholder="Redeem code" />
                    <button type="button" id="btn-redeem" class="tb-btn whitespace-nowrap" data-i18n="auth.redeemBtn">Redeem</button>
                </div>
                <div id="redeem-msg" class="text-sm hidden"></div>
            </div>

            <div class="p-6 space-y-3">
                <a href="chat.html" class="tb-btn w-full inline-flex items-center justify-center gap-2">
                    <i class="fas fa-comments"></i> <span data-i18n="nav.chat">私聊</span>
                </a>
                <button type="button" onclick="document.getElementById('modal-password').classList.remove('hidden')"
                    class="w-full py-2.5 px-4 bg-white border border-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-key text-gray-400"></i> <span data-i18n="auth.changePassword">Change password</span>
                </button>
                <button id="btn-logout-profile" type="button"
                    class="w-full py-2.5 px-4 bg-red-50 text-red-600 rounded-lg text-sm font-medium hover:bg-red-100 transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> <span data-i18n="auth.logout">Log out</span>
                </button>
            </div>

            <div class="px-6 pb-6 text-sm text-gray-500 flex justify-between border-t border-gray-50 pt-4">
                <span data-i18n="auth.memberSince">Member since</span>
                <span id="profile-created-at" class="font-mono text-gray-700">--</span>
            </div>
        </div>
    </main>

    <div id="modal-password" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75" onclick="document.getElementById('modal-password').classList.add('hidden')"></div>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4" data-i18n="auth.changePassword">Change password</h3>
                    <div class="space-y-4">
                        <div>
                            <label for="old-password" class="block text-sm font-medium text-gray-700" data-i18n="auth.currentPassword">Current password</label>
                            <input type="password" id="old-password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 sm:text-sm">
                        </div>
                        <div>
                            <label for="new-password" class="block text-sm font-medium text-gray-700" data-i18n="auth.newPassword">New password</label>
                            <input type="password" id="new-password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 sm:text-sm" data-i18n-placeholder="auth.passwordHint" placeholder="At least 6 characters">
                        </div>
                        <div>
                            <label for="confirm-password" class="block text-sm font-medium text-gray-700" data-i18n="auth.confirmPassword">Confirm new password</label>
                            <input type="password" id="confirm-password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 sm:text-sm">
                        </div>
                        <div id="pwd-msg" class="text-sm text-red-600 hidden"></div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse gap-2">
                    <button type="button" id="btn-save-pwd" class="w-full sm:w-auto inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-sm font-medium text-white hover:bg-blue-700" data-i18n="auth.save">
                        Save
                    </button>
                    <button type="button" class="mt-3 sm:mt-0 w-full sm:w-auto inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50"
                        onclick="document.getElementById('modal-password').classList.add('hidden')" data-i18n="auth.cancel">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            function tr(key, params) {
                return typeof t === 'function' ? t(key, params) : key;
            }

            function translateAuthError(msg) {
                if (!msg) return tr('auth.unknownError');
                var map = {
                    'Invalid email or password': 'auth.invalidCredentials',
                    'Invalid account or password': 'auth.invalidCredentials',
                    'Invalid email address': 'auth.invalidEmail',
                    'Invalid phone number': 'auth.invalidPhone',
                    'Password must be at least 6 characters': 'auth.passwordTooShort',
                    'Password must not exceed 72 characters': 'auth.passwordTooLong',
                    'Email already registered': 'auth.emailRegistered',
                    'Phone already registered': 'auth.phoneRegistered',
                    'This account cannot be registered': 'auth.accountBlocked',
                    'Registration failed. Please try again.': 'auth.registerFailed',
                    'Current password is incorrect': 'auth.currentPasswordWrong',
                    'New password must be at least 6 characters': 'auth.passwordTooShort',
                    'Authentication required': 'auth.authRequired',
                    'Session expired. Please log in again.': 'auth.sessionExpired',
                    'User not found': 'auth.userNotFound',
                    'Admin access required': 'auth.adminRequired',
                    'Update failed': 'auth.updateFailed',
                    'Invalid redeem code': 'auth.redeemInvalid',
                    'Redeem code already used': 'auth.redeemUsed',
                    'Redeem code is required': 'auth.redeemNeedCode',
                    'Admin accounts have unlimited balance; redeem is not needed.': 'auth.redeemAdminSkip',
                    'Nickname too long': 'auth.nicknameTooLong',
                    'Invalid nickname': 'auth.nicknameInvalid'
                };
                if (map[msg]) return tr(map[msg]);
                if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) return tr('auth.networkError');
                return msg;
            }

            function renderBalance(wallet) {
                var el = document.getElementById('profile-balance');
                var redeemSec = document.getElementById('redeem-section');
                if (!el) return;
                if (!wallet) {
                    el.textContent = '--';
                    return;
                }
                if (wallet.unlimited) {
                    el.textContent = tr('auth.aiBalanceUnlimited');
                    if (redeemSec) redeemSec.classList.add('hidden');
                    return;
                }
                var bal = Number(wallet.balanceCny);
                el.textContent = Number.isFinite(bal) ? ('¥' + bal.toFixed(2)) : '--';
                if (redeemSec) redeemSec.classList.remove('hidden');
            }

            const token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const AUTH_BASE_URL = (typeof siteConfig !== 'undefined' && siteConfig.apiBase)
                ? siteConfig.apiBase
                : ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                    ? 'http://127.0.0.1:8001'
                    : `${window.location.origin}/api`);

            async function fetchWithAuth(path, options = {}) {
                const res = await fetch(`${AUTH_BASE_URL}${path}`, {
                    ...options,
                    headers: {
                        Authorization: `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        ...(options.headers || {})
                    }
                });
                if (res.status === 401) {
                    localStorage.removeItem('auth_token');
                    window.location.href = 'login.html';
                    throw new Error('Unauthorized');
                }
                return res.json();
            }

            try {
                const data = await fetchWithAuth('/auth/me');
                if (!data.success) throw new Error(data.detail || tr('auth.loadProfileFailed'));
                const user = data.user;
                const login = user.phone || user.email || '';
                const display = user.display || user.nickname || login || '--';
                document.getElementById('profile-display').textContent = display;
                const accEl = document.getElementById('profile-account');
                if (accEl) {
                    if (user.nickname && login && user.nickname !== login) {
                        accEl.textContent = login;
                        accEl.classList.remove('hidden');
                    } else {
                        accEl.textContent = '';
                        accEl.classList.add('hidden');
                    }
                }
                const nickInput = document.getElementById('nickname-input');
                if (nickInput) nickInput.value = user.nickname || '';
                document.getElementById('profile-uid').textContent = user.id || '--';
                if (user.created_at) {
                    document.getElementById('profile-created-at').textContent =
                        String(user.created_at).replace('T', ' ').replace(/\.\d+$/, '');
                }
                renderBalance(user.aiWallet);
            } catch (e) {
                if (e.message !== 'Unauthorized') console.error(e);
            }

            document.getElementById('btn-save-nickname').addEventListener('click', async () => {
                const input = document.getElementById('nickname-input');
                const msgEl = document.getElementById('nickname-msg');
                const btn = document.getElementById('btn-save-nickname');
                const nick = (input && input.value || '').trim();
                msgEl.classList.add('hidden');
                btn.disabled = true;
                btn.textContent = tr('auth.saving');
                try {
                    const data = await fetchWithAuth('/auth/profile', {
                        method: 'PATCH',
                        body: JSON.stringify({ nickname: nick })
                    });
                    if (!data.success) throw new Error(data.detail || tr('auth.updateFailed'));
                    const user = data.user || {};
                    const login = user.phone || user.email || '';
                    const display = user.display || user.nickname || login || '--';
                    document.getElementById('profile-display').textContent = display;
                    const accEl = document.getElementById('profile-account');
                    if (accEl) {
                        if (user.nickname && login && user.nickname !== login) {
                            accEl.textContent = login;
                            accEl.classList.remove('hidden');
                        } else {
                            accEl.textContent = '';
                            accEl.classList.add('hidden');
                        }
                    }
                    msgEl.textContent = tr('auth.nicknameSaved');
                    msgEl.classList.remove('hidden', 'text-red-600');
                    msgEl.classList.add('text-emerald-600');
                } catch (e) {
                    msgEl.textContent = translateAuthError(e.message || '') || tr('auth.updateFailed');
                    msgEl.classList.remove('hidden', 'text-emerald-600');
                    msgEl.classList.add('text-red-600');
                } finally {
                    btn.disabled = false;
                    btn.textContent = tr('auth.saveNickname');
                }
            });

            document.getElementById('btn-redeem').addEventListener('click', async () => {
                const code = (document.getElementById('redeem-code').value || '').trim();
                const msgEl = document.getElementById('redeem-msg');
                const btn = document.getElementById('btn-redeem');
                msgEl.classList.add('hidden');
                if (!code) {
                    msgEl.textContent = tr('auth.redeemNeedCode');
                    msgEl.classList.remove('hidden');
                    msgEl.classList.remove('text-emerald-600');
                    msgEl.classList.add('text-red-600');
                    return;
                }
                btn.disabled = true;
                btn.textContent = tr('auth.processing');
                try {
                    const res = await fetch(`${AUTH_BASE_URL}/wallet/redeem`, {
                        method: 'POST',
                        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        const detail = Array.isArray(data.detail)
                            ? data.detail.map((x) => x.msg || JSON.stringify(x)).join('; ')
                            : (data.detail || tr('auth.unknownError'));
                        throw new Error(detail);
                    }
                    const amount = Number(data.creditedCny || 0).toFixed(2);
                    const balance = Number(data.balanceCny || 0).toFixed(2);
                    msgEl.textContent = tr('auth.redeemOk')
                        .replace('{amount}', amount)
                        .replace('{balance}', balance);
                    msgEl.classList.remove('hidden', 'text-red-600');
                    msgEl.classList.add('text-emerald-600');
                    document.getElementById('redeem-code').value = '';
                    renderBalance(data.aiWallet || { unlimited: false, balanceCny: data.balanceCny });
                } catch (e) {
                    msgEl.textContent = translateAuthError(e.message);
                    msgEl.classList.remove('hidden', 'text-emerald-600');
                    msgEl.classList.add('text-red-600');
                } finally {
                    btn.disabled = false;
                    btn.textContent = tr('auth.redeemBtn');
                }
            });

            document.getElementById('btn-logout-profile').addEventListener('click', () => {
                localStorage.removeItem('auth_token');
                window.location.href = 'login.html';
            });

            document.getElementById('btn-save-pwd').addEventListener('click', async () => {
                const oldPwd = document.getElementById('old-password').value;
                const newPwd = document.getElementById('new-password').value;
                const confirmPwd = document.getElementById('confirm-password').value;
                const msgEl = document.getElementById('pwd-msg');
                msgEl.classList.add('hidden');

                if (!oldPwd || !newPwd || !confirmPwd) {
                    msgEl.textContent = tr('auth.fillAllFields');
                    msgEl.classList.remove('hidden');
                    return;
                }
                if (newPwd !== confirmPwd) {
                    msgEl.textContent = tr('auth.passwordMismatch');
                    msgEl.classList.remove('hidden');
                    return;
                }
                if (newPwd.length < 6) {
                    msgEl.textContent = tr('auth.passwordTooShort');
                    msgEl.classList.remove('hidden');
                    return;
                }

                const btn = document.getElementById('btn-save-pwd');
                btn.disabled = true;
                btn.textContent = tr('auth.saving');

                try {
                    const res = await fetch(`${AUTH_BASE_URL}/auth/change-password`, {
                        method: 'POST',
                        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || tr('auth.updateFailed'));
                    alert(tr('auth.passwordUpdated'));
                    localStorage.removeItem('auth_token');
                    window.location.href = 'login.html';
                } catch (e) {
                    msgEl.textContent = translateAuthError(e.message);
                    msgEl.classList.remove('hidden');
                } finally {
                    btn.disabled = false;
                    btn.textContent = tr('auth.save');
                }
            });
        });
    </script>
</body>
</html>
