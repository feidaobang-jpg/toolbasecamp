<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信登录中 - Tool Basecamp</title>
    <meta name="description" content="微信登录回调处理中">
    <script src="../../vendor/tailwindcss.js?v=2"></script>
    <link rel="stylesheet" href="../../css/base.css?v=9">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center font-sans">
    <div class="w-full max-w-md mx-4 bg-white border border-gray-100 rounded-2xl shadow-sm p-6 text-center">
        <p id="msg" class="text-sm text-gray-600">登录处理中，请稍候...</p>
    </div>
    <script>
        (function () {
            var msg = document.getElementById('msg');
            var params = new URLSearchParams(window.location.search || '');
            var token = (params.get('token') || '').trim();
            var next = (params.get('next') || '').trim();

            function safeNext(path) {
                if (!path) return 'profile.html';
                if (path.startsWith('/') && !path.startsWith('//')) return path;
                return 'profile.html';
            }

            if (!token) {
                msg.textContent = '微信登录失败，请返回后重试。';
                return;
            }

            try {
                localStorage.setItem('auth_token', token);
            } catch (e) {
                msg.textContent = '无法写入登录态，请检查浏览器隐私设置。';
                return;
            }

            msg.textContent = '登录成功，正在跳转...';
            window.location.replace(safeNext(next));
        })();
    </script>
</body>
</html>
