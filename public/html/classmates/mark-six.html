<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>统计表 - 同学专区</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="../../vendor/font-awesome/css/all.min.css?v=ms2" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css?v=ms2" />
  <link rel="stylesheet" href="../../css/docs/docs-common.css?v=ms2" />
  <link rel="stylesheet" href="../../css/admin-shell.css?v=ms2" />
  <link rel="stylesheet" href="../../css/classmates/mark-six.css?v=ms2" />
  <script src="../../js/locales/en.js?v=ms2"></script>
  <script src="../../js/locales/zh-CN.js?v=ms2"></script>
  <script src="../../js/i18n.js?v=ms2"></script>
  <script src="../../js/config.js?v=ms2"></script>
  <script src="../../js/common_ui.js?v=ms2"></script>
</head>
<body class="admin-page ms-page">
  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="mark-six-list.html" class="admin-back">
        <i class="fas fa-arrow-left"></i> <span data-i18n="classmates.markSixTitle">六合彩统计</span>
      </a>
      <h1 class="admin-title" id="sheet-title">统计数据</h1>
      <div class="admin-header-actions"></div>
    </div>
  </header>
  <main class="admin-main admin-main--wide ms-main">
    <div id="boot-loading" class="admin-card admin-card--center">加载中…</div>
    <div id="gate" class="admin-card admin-card--center hidden" hidden>
      <p id="gate-msg" class="admin-gate-msg">需要登录且在同学名单中</p>
      <a id="gate-login" href="../auth/login.html" class="tb-btn">去登录</a>
    </div>
    <div id="app" class="admin-app ms-sheet-app hidden" hidden>
      <div class="ms-table-panel">
        <div class="ms-table-head">
          <span class="ms-th ms-th-num" data-i18n="classmates.colNumZodiac">序号/生肖</span>
          <span class="ms-th ms-th-val" data-i18n="classmates.colValue">数值</span>
          <span class="ms-th ms-th-act" data-i18n="classmates.colAdd">加</span>
          <span class="ms-th ms-th-act" data-i18n="classmates.colSub">减</span>
        </div>
        <div class="ms-table-body" id="table-body"></div>
        <div class="ms-table-foot">
          <span class="ms-foot-label" data-i18n="classmates.total">合计</span>
          <span class="ms-foot-total" id="total-label">0</span>
          <span class="ms-net" id="net-label" data-quality="优">网络:优</span>
          <div class="ms-foot-actions">
            <button type="button" class="ms-foot-btn" id="zodiac-btn" data-i18n="classmates.packZodiac">包生肖</button>
            <button type="button" class="ms-foot-btn" id="wave-btn" data-i18n="classmates.packWave">选波</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="amount-modal" class="ms-modal" hidden>
    <div class="ms-modal-card">
      <h3 class="ms-modal-title" id="amount-modal-title">添加数值</h3>
      <label class="ms-field-label" data-i18n="classmates.amountLabel">数值</label>
      <input id="amount-input" type="text" inputmode="decimal" autocomplete="off" />
      <div class="ms-modal-actions">
        <button type="button" class="ms-modal-cancel" id="amount-cancel" data-i18n="classmates.cancel">取消</button>
        <button type="button" class="ms-modal-ok" id="amount-ok" data-i18n="classmates.confirm">确定</button>
      </div>
    </div>
  </div>

  <div id="zodiac-modal" class="ms-modal" hidden>
    <div class="ms-modal-card">
      <h3 class="ms-modal-title" data-i18n="classmates.packZodiac">包生肖</h3>
      <div class="ms-chip-grid" id="zodiac-chips"></div>
      <label class="ms-field-label" data-i18n="classmates.zodiacAmountHint">输入金额（每个选中的生肖将获得该金额）</label>
      <input id="zodiac-input" type="text" inputmode="decimal" autocomplete="off" />
      <p class="ms-hint" id="zodiac-info"></p>
      <div class="ms-modal-actions">
        <button type="button" class="ms-modal-cancel" id="zodiac-cancel" data-i18n="classmates.cancel">取消</button>
        <button type="button" class="ms-modal-ok" id="zodiac-ok" data-i18n="classmates.confirm">确定</button>
      </div>
    </div>
  </div>

  <div id="wave-modal" class="ms-modal" hidden>
    <div class="ms-modal-card">
      <h3 class="ms-modal-title" data-i18n="classmates.packWaveTitle">包波</h3>
      <div class="ms-chip-grid" id="wave-chips"></div>
      <label class="ms-field-label" data-i18n="classmates.waveAmountHint">输入金额（每个选中的波色将获得该金额）</label>
      <input id="wave-input" type="text" inputmode="decimal" autocomplete="off" />
      <p class="ms-hint" id="wave-info"></p>
      <div class="ms-modal-actions">
        <button type="button" class="ms-modal-cancel" id="wave-cancel" data-i18n="classmates.cancel">取消</button>
        <button type="button" class="ms-modal-ok" id="wave-ok" data-i18n="classmates.confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="../../js/classmates/mark-six-guard.js?v=ms2"></script>
  <script src="../../js/classmates/mark-six.js?v=ms2"></script>
</body>
</html>
