<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>布局XML转findView - 工具大本营</title>
  <meta name="description" content="布局XML转findView" />
  <link rel="stylesheet" href="../../css/base.css?v=btnGap1" />
  <link rel="stylesheet" href="../../css/docs-common.css?v=btnGap1" />
  <link rel="stylesheet" href="../../css/dev/layout-converter.css?v=btnGap1" />
</head>
<body>
  <div class="container">
    <aside class="sidebar"></aside>
    <main class="content">
      <div class="page active" id="layout-convert">
                <h2 data-i18n="tools.layoutConverter.title">布局XML转findView</h2>
                <div class="tool-container">
                    <div class="input-section">
                        <label for="xml-input">请输入布局XML代码：</label>
                        <textarea id="xml-input" rows="12" placeholder="在此粘贴您的布局XML代码..."></textarea>
                    </div>
                    <div class="options-section">
                        <label class="checkbox-label">
                            <input type="checkbox" id="private-checkbox" checked> 使用private修饰符
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="butterknife-checkbox"> 使用ButterKnife
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="m-prefix-checkbox"> 变量名添加m前缀
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="kotlin-checkbox"> 生成Kotlin代码
                        </label>
                    </div>
                    <div class="button-section">
                        <button type="button" id="convert-btn" class="tb-btn">生成</button>
                        <button type="button" id="clear-btn" class="tb-btn">清空</button>
                    </div>
                    <div class="output-section">
                        <label for="result-output">转换结果：</label>
                        <pre id="result-output" class="code-display"></pre>
                        <button type="button" class="tb-btn copy-btn" data-target="result-output">复制代码</button>
                    </div>
                </div>
            </div>
    </main>
  </div>
  <script src="../../js/locales/en.js?v=btnGap1"></script>
  <script src="../../js/locales/zh-CN.js?v=btnGap1"></script>
  <script src="../../js/i18n.js?v=btnGap1"></script>
  <script src="../../js/config.js?v=btnGap1"></script>
  <script src="../../js/base.js?v=btnGap1"></script>
  <script src="../../js/common_ui.js?v=btnGap1"></script>
  <script src="../../js/dev/layout-converter.js?v=btnGap1"></script>
</body>
</html>
