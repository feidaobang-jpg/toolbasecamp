<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>牧场 · Cozy Ranch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#3f2a14;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;background:#44403c}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;z-index:2;display:flex;gap:10px;flex-wrap:wrap}
#hud b{color:#fde68a}
#audioBar{position:absolute;top:8px;right:8px;z-index:5;pointer-events:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:55%}
#audioBar .tb-btn{font-size:11px;padding:6px 10px;border:0;border-radius:999px;background:#2563eb;color:#fff;cursor:pointer}
#audioBar .game-volume{display:flex;align-items:center;gap:4px;font-size:10px;color:#94a3b8}
#audioBar input[type=range]{width:72px}
#bar{position:absolute;left:0;right:0;bottom:0;padding:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));z-index:3}
#bar button{font:inherit;border:0;border-radius:999px;padding:10px 12px;background:#2563eb;color:#fff;cursor:pointer;font-size:12px}
#bar button.on{outline:2px solid #fde68a}
#ui{position:absolute;inset:0;pointer-events:none;z-index:4}
#ui .panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,380px);background:rgba(15,23,42,.94);border:1px solid #334155;border-radius:14px;padding:18px 16px}
#ui h1{font-size:1.3rem;margin-bottom:6px;color:#fcd34d}
#ui h2{font-size:1.05rem;margin:0 0 10px;color:#fde68a}
#ui p{font-size:.85rem;line-height:1.45;color:#94a3b8;margin-bottom:8px}
#ui .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#ui button{font:inherit;border:0;border-radius:999px;padding:10px 16px;background:#2563eb;color:#fff;cursor:pointer;flex:1;min-width:100px}
#ui button.ghost{background:#1e293b;border:1px solid #475569}
#ui button:disabled{opacity:.45}
#ui .shop-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e293b;font-size:.84rem}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span>天 <b id="day">1</b></span><span>币 <b id="coins">40</b></span><span>饲料 <b id="feed">6</b></span><span>最高天 <b id="best">0</b></span></div>
  <div class="action-row" id="audioBar"></div>
  <div id="bar">
    <button id="toolFeed" class="on">喂养</button>
    <button id="toolCollect">采集</button>
    <button id="toolSleep">睡觉</button>
    <button id="toolShop">商店</button>
  </div>
  <div id="ui">
    <div class="panel" id="panelMenu">
      <h1>牧场</h1>
      <p>喂养牛羊，挤奶剪毛卖出。动物会成长，栏位可扩建。与农场玩法区分。</p>
      <p>点动物操作 · 工具栏切换</p>
      <div class="row"><button id="btnNew">新游戏</button><button class="ghost" id="btnContinue" disabled>继续</button></div>
    </div>
    <div class="panel hidden" id="panelShop">
      <h2>牧场商店 · 第 <span id="shopLv">1</span> 天</h2>
      <p id="shopMsg"></p><div id="shopList"></div>
      <div class="row"><button id="btnCloseShop">关闭</button><button class="ghost" id="btnSaveMenu">存档回菜单</button></div>
    </div>
    <div class="panel hidden" id="panelOver">
      <h2>牧场关张</h2><p id="overMsg"></p>
      <div class="row"><button id="btnRetry">再来</button><button class="ghost" id="btnOverMenu">菜单</button></div>
    </div>
  </div>
</div>
<script src="../../js/game/game-audio.js?v=18"></script>
<script>
(function(){
const KEY='tbc_cozy_ranch_v1';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=360,H=640,dpr=1,mode='menu',state=null,best=0,tool='feed';

function sfx(n){try{GameAudio&&GameAudio.sfx(n)}catch(e){}}
function unlock(){try{GameAudio&&GameAudio.unlock()}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function loadMeta(){const d=load();best=(d&&d.best)||0;document.getElementById('best').textContent=best;document.getElementById('btnContinue').disabled=!(d&&d.play)}
function persist(){if(!state)return;save({best:Math.max(best,state.day),play:state})}
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=Math.max(280,r.width);H=Math.max(400,r.height);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);
function hidePanels(){['panelMenu','panelShop','panelOver'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function show(id){hidePanels();document.getElementById(id).classList.remove('hidden')}

function mkAnimal(type){return {type,age:0,fed:0,ready:0,x:0.2+Math.random()*0.6,y:0.35+Math.random()*0.35}}

function newGame(from){
  unlock();
  if(from){state=JSON.parse(JSON.stringify(from))}
  else{
    state={day:1,coins:40,feed:6,slots:3,animals:[mkAnimal('cow'),mkAnimal('sheep')],prodLv:0};
  }
  mode='play';hidePanels();hud();sfx('place');
}

function hud(){if(!state)return;document.getElementById('day').textContent=state.day;document.getElementById('coins').textContent=state.coins;document.getElementById('feed').textContent=state.feed;document.getElementById('best').textContent=Math.max(best,state.day)}

function setTool(t){
  tool=t;
  document.getElementById('toolFeed').classList.toggle('on',t==='feed');
  document.getElementById('toolCollect').classList.toggle('on',t==='collect');
}

function openShop(){
  mode='shop';document.getElementById('shopLv').textContent=state.day;
  document.getElementById('shopMsg').textContent='金币 '+state.coins+' · 栏位 '+state.animals.length+'/'+state.slots;
  const list=document.getElementById('shopList');list.innerHTML='';
  [
    {id:'feed',name:'饲料 x4',cost:10},
    {id:'cow',name:'买牛',cost:35,ok:state.animals.length<state.slots},
    {id:'sheep',name:'买羊',cost:28,ok:state.animals.length<state.slots},
    {id:'slot',name:'扩建栏位',cost:30,ok:state.slots<8},
    {id:'prod',name:'产量升级',cost:22+state.prodLv*12,ok:state.prodLv<3}
  ].forEach(it=>{
    const ok=it.ok!==false;const row=document.createElement('div');row.className='shop-item';row.innerHTML='<span>'+it.name+(ok?'':'（不可）')+'</span>';
    const b=document.createElement('button');b.textContent=it.cost+' 币';b.disabled=!ok||state.coins<it.cost;
    b.onclick=()=>{
      unlock();if(state.coins<it.cost||!ok)return;state.coins-=it.cost;sfx('swap');
      if(it.id==='feed')state.feed+=4;
      if(it.id==='cow')state.animals.push(mkAnimal('cow'));
      if(it.id==='sheep')state.animals.push(mkAnimal('sheep'));
      if(it.id==='slot')state.slots++;
      if(it.id==='prod')state.prodLv++;
      persist();openShop();hud();
    };
    row.appendChild(b);list.appendChild(row);
  });
  show('panelShop');persist();
}

function animalPos(a){return {x:a.x*W,y:a.y*(H*0.55)+H*0.2,r:28}}

function onAnimal(a){
  if(mode!=='play'||!state)return;
  unlock();
  if(tool==='feed'){
    if(state.feed<=0||a.fed)return;
    state.feed--;a.fed=1;sfx('place');
  }else if(tool==='collect'){
    if(!a.ready)return;
    const pay=(a.type==='cow'?12:9)+state.prodLv*4+Math.min(6,a.age);
    state.coins+=pay;a.ready=0;sfx('win');
  }
  persist();hud();
}

function sleep(){
  if(mode!=='play'||!state)return;
  unlock();
  state.animals.forEach(a=>{
    if(a.fed){a.age++;a.ready=1;a.fed=0}
    else if(Math.random()<0.2){/* hungry skip */}
    a.x=0.15+Math.random()*0.7;a.y=0.3+Math.random()*0.4;
  });
  state.day++;best=Math.max(best,state.day);
  state.coins-=3+state.animals.length;
  if(state.coins<0||!state.animals.length){
    mode='over';save({best,play:null});
    document.getElementById('overMsg').textContent='经营了 '+state.day+' 天';
    show('panelOver');sfx('lose');return;
  }
  sfx('place');persist();hud();
}

function drawAnimal(a){
  const p=animalPos(a);const cow=a.type==='cow';
  ctx.fillStyle=cow?'#f5f5f4':'#e7e5e4';
  ctx.beginPath();ctx.ellipse(p.x,p.y,cow?22:16,cow?14:12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=cow?'#171717':'#a8a29e';
  if(cow){ctx.beginPath();ctx.arc(p.x-8,p.y-2,4,0,Math.PI*2);ctx.arc(p.x+6,p.y+3,3,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(p.x+(cow?18:12),p.y-6,cow?8:6,0,Math.PI*2);ctx.fill();
  if(a.ready){ctx.fillStyle='#38bdf8';ctx.font='11px system-ui';ctx.fillText(cow?'奶':'毛',p.x-8,p.y-22)}
  if(a.fed){ctx.fillStyle='#86efac';ctx.fillText('✓',p.x+10,p.y-20)}
}

function draw(){
  ctx.fillStyle='#57534e';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#65a30d';ctx.fillRect(0,H*0.18,W,H*0.55);
  ctx.strokeStyle='#a8a29e';ctx.lineWidth=4;ctx.strokeRect(12,H*0.18,W-24,H*0.55);
  // barn
  ctx.fillStyle='#b91c1c';ctx.beginPath();ctx.moveTo(20,H*0.18);ctx.lineTo(70,H*0.08);ctx.lineTo(120,H*0.18);ctx.fill();
  ctx.fillStyle='#7f1d1d';ctx.fillRect(30,H*0.18,80,50);
  if(!state)return;
  state.animals.forEach(drawAnimal);
  ctx.fillStyle='#e2e8f0';ctx.font='13px system-ui';
  ctx.fillText('工具: '+(tool==='feed'?'喂养':'采集')+' · 产量 Lv'+(state.prodLv+1),16,H-70);
}

function loop(){draw();requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{
  if(mode!=='play'||!state)return;
  const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  for(let i=state.animals.length-1;i>=0;i--){
    const p=animalPos(state.animals[i]);
    if(Math.hypot(x-p.x,y-p.y)<p.r){onAnimal(state.animals[i]);break}
  }
});

document.getElementById('toolFeed').onclick=()=>{setTool('feed');unlock()};
document.getElementById('toolCollect').onclick=()=>{setTool('collect');unlock()};
document.getElementById('toolSleep').onclick=()=>sleep();
document.getElementById('toolShop').onclick=()=>{unlock();openShop()};
document.getElementById('btnCloseShop').onclick=()=>{mode='play';hidePanels();persist()};
document.getElementById('btnNew').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnContinue').onclick=()=>{unlock();const d=load();if(d&&d.play)newGame(d.play)};
document.getElementById('btnSaveMenu').onclick=()=>{persist();mode='menu';show('panelMenu');loadMeta()};
document.getElementById('btnRetry').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnOverMenu').onclick=()=>{mode='menu';show('panelMenu');loadMeta()};

loadMeta();resize();if(window.GameAudio)GameAudio.boot('catchy');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
