<script src="../../js/game/game-audio.js?v=23"></script>
<script>
(function () {
'use strict';
const KEY = 'tbc_descent_v2';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const lifeBar = document.getElementById('lifeBar');

let W = 360, H = 640, dpr = 1;
let mode = 'menu'; // menu | play | over | win
let best = 0;
let state = null;
const keys = { l: false, r: false };
let holdL = false, holdR = false;

function sfx(n) { try { GameAudio && GameAudio.sfx(n); } catch (e) {} }
function unlock() { try { GameAudio && GameAudio.unlock(); } catch (e) {} }
function loadBest() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    best = d.best | 0;
  } catch (e) { best = 0; }
  document.getElementById('best').textContent = best;
}
function saveBest(floor) {
  if (floor > best) {
    best = floor;
    try { localStorage.setItem(KEY, JSON.stringify({ best })); } catch (e) {}
  }
  document.getElementById('best').textContent = best;
}

function resize() {
  const r = document.getElementById('wrap').getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(300, r.width);
  H = Math.max(420, r.height);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

function hidePanels() {
  ['panelMenu', 'panelOver', 'panelWin'].forEach(id => document.getElementById(id).classList.add('hidden'));
}
function show(id) {
  hidePanels();
  document.getElementById(id).classList.remove('hidden');
}

function floorGap(f) {
  return 52 + Math.min(28, f * 0.22);
}
function platW(f) {
  return Math.max(56, 110 - Math.min(40, f * 0.35));
}

function pickType(floor) {
  const r = Math.random();
  if (floor < 5) return r < 0.75 ? 'normal' : (r < 0.9 ? 'spring' : 'conveyR');
  if (floor < 15) {
    if (r < 0.5) return 'normal';
    if (r < 0.65) return 'spring';
    if (r < 0.78) return 'vanish';
    if (r < 0.88) return 'conveyL';
    if (r < 0.95) return 'conveyR';
    return 'spike';
  }
  if (floor < 40) {
    if (r < 0.38) return 'normal';
    if (r < 0.5) return 'spring';
    if (r < 0.62) return 'vanish';
    if (r < 0.72) return 'conveyL';
    if (r < 0.82) return 'conveyR';
    if (r < 0.9) return 'moving';
    return 'spike';
  }
  if (r < 0.28) return 'normal';
  if (r < 0.4) return 'spring';
  if (r < 0.52) return 'vanish';
  if (r < 0.62) return 'conveyL';
  if (r < 0.72) return 'conveyR';
  if (r < 0.82) return 'moving';
  return 'spike';
}

function mkPlat(floor, y) {
  let type = pickType(floor);
  if (floor === 100) type = 'normal';
  if (floor === 99 && type === 'spike') type = 'spring';
  const w = platW(floor) * (type === 'spike' ? 0.95 : 1);
  const x = 12 + Math.random() * Math.max(8, W - w - 24);
  const p = {
    floor, x, y, w, h: 14, type,
    alive: true, vx: 0, blink: 0, convey: 0
  };
  if (type === 'moving') p.vx = (Math.random() < 0.5 ? -1 : 1) * (50 + floor * 0.4);
  if (type === 'conveyL') p.convey = -90;
  if (type === 'conveyR') p.convey = 90;
  return p;
}

function newGame() {
  unlock();
  const startY = H * 0.28;
  state = {
    px: W * 0.5,
    py: startY,
    vx: 0,
    vy: 0,
    onPlat: null,
    life: 1,
    floor: 0,
    camY: 0,
    nextFloor: 1,
    nextY: startY + 70,
    plats: [],
    t: 0,
    won: false,
    shake: 0
  };
  // starter safe platforms
  for (let i = 0; i < 4; i++) {
    const y = startY + 55 + i * 58;
    const w = 120;
    state.plats.push({
      floor: 0, x: W * 0.5 - w / 2 + (i - 1.5) * 18, y, w, h: 14,
      type: i === 2 ? 'spring' : 'normal', alive: true, vx: 0, blink: 0, convey: 0
    });
    state.nextY = y + floorGap(1);
  }
  while (state.nextFloor <= 8) {
    state.plats.push(mkPlat(state.nextFloor, state.nextY));
    state.nextY += floorGap(state.nextFloor);
    state.nextFloor++;
  }
  mode = 'play';
  hidePanels();
  hud();
  sfx('start');
}

function hud() {
  if (!state) return;
  document.getElementById('floor').textContent = state.floor;
  document.getElementById('best').textContent = Math.max(best, state.floor);
  lifeBar.style.transform = 'scaleX(' + Math.max(0, Math.min(1, state.life)).toFixed(4) + ')';
}

function die(reason) {
  if (mode !== 'play' || !state) return;
  mode = 'over';
  saveBest(state.floor);
  document.getElementById('overTitle').textContent = '挑战失败';
  document.getElementById('overMsg').textContent = reason + ' · 到达 B' + state.floor + '（最�?B' + best + '�?;
  show('panelOver');
  sfx('lose');
}

function win() {
  if (state.won) return;
  state.won = true;
  mode = 'win';
  saveBest(100);
  document.getElementById('winMsg').textContent = '生命剩余 ' + Math.round(state.life * 100) + '% · 最高纪�?B' + best;
  show('panelWin');
  sfx('win');
}

function dir() {
  let d = 0;
  if (keys.l || holdL) d -= 1;
  if (keys.r || holdR) d += 1;
  return d;
}

function update(dt) {
  if (mode !== 'play' || !state) return;
  state.t += dt;
  state.shake = Math.max(0, state.shake - dt);
  const move = 220 + Math.min(40, state.floor * 0.3);
  state.vx = dir() * move;
  // gravity
  const g = 980;
  state.vy += g * dt;
  if (state.vy > 720) state.vy = 720;

  let nx = state.px + state.vx * dt;
  let ny = state.py + state.vy * dt;
  const pw = 18, ph = 28;

  // platform motion
  state.plats.forEach(p => {
    if (!p.alive) return;
    if (p.type === 'moving') {
      p.x += p.vx * dt;
      if (p.x < 8) { p.x = 8; p.vx = Math.abs(p.vx); }
      if (p.x + p.w > W - 8) { p.x = W - 8 - p.w; p.vx = -Math.abs(p.vx); }
    }
    if (p.type === 'vanish' && p.blink > 0) {
      p.blink -= dt;
      if (p.blink <= 0) p.alive = false;
    }
  });

  // land / stay on platforms
  const prevOn = state.onPlat;
  state.onPlat = null;
  if (state.vy >= 0) {
    const feet0 = state.py + ph / 2;
    const feet1 = ny + ph / 2;
    for (let i = 0; i < state.plats.length; i++) {
      const p = state.plats[i];
      if (!p.alive) continue;
      const top = p.y;
      const onX = nx + pw * 0.28 > p.x && nx - pw * 0.28 < p.x + p.w;
      const crossing = feet0 <= top + 3 && feet1 >= top;
      const resting = prevOn === p && Math.abs(feet0 - top) < 8 && onX;
      if (!(crossing || resting) || !onX) continue;

      if (p.type === 'spike') {
        state.px = nx; state.py = top - ph / 2;
        state.shake = 0.25;
        die('踩到钉子�?);
        return;
      }
      ny = top - ph / 2;
      state.onPlat = p;
      if (p.type === 'spring') {
        state.vy = -440 - Math.min(90, state.floor);
        state.onPlat = null;
        sfx('jump');
      } else {
        state.vy = 0;
        if (!prevOn || prevOn !== p) sfx('land');
      }
      if (p.type === 'vanish' && p.blink <= 0 && (!prevOn || prevOn !== p)) {
        p.blink = 0.45;
      }
      if (p.floor > state.floor) {
        state.floor = p.floor;
        sfx('place');
        if (state.floor >= 100) {
          state.px = nx; state.py = ny;
          hud();
          win();
          return;
        }
      }
      if (p.type !== 'spike' && (!prevOn || prevOn !== p)) {
        state.life = Math.min(1, state.life + 0.05);
      }
      break;
    }
  }

  if (state.onPlat && state.onPlat.convey) nx += state.onPlat.convey * dt;
  if (state.onPlat && state.onPlat.type === 'moving') nx += state.onPlat.vx * dt;

  state.px = Math.max(pw / 2, Math.min(W - pw / 2, nx));
  state.py = ny;

  // camera: keep player in upper-mid, world scrolls up as we fall
  const target = state.py - H * 0.32;
  if (target > state.camY) state.camY += (target - state.camY) * Math.min(1, 6 * dt);

  // spawn deeper floors
  while (state.nextY < state.camY + H + 240 && state.nextFloor <= 100) {
    state.plats.push(mkPlat(state.nextFloor, state.nextY));
    // occasional double platform for higher floors
    if (state.nextFloor > 20 && Math.random() < 0.18) {
      const extra = mkPlat(state.nextFloor, state.nextY);
      extra.x = (extra.x + W * 0.35) % Math.max(20, W - extra.w - 20);
      state.plats.push(extra);
    }
    state.nextY += floorGap(state.nextFloor);
    state.nextFloor++;
  }
  // goal floor marker platform
  if (state.nextFloor > 100 && !state.plats.some(p => p.floor === 100 && p._goal)) {
    /* already spawned via loop */
  }

  state.plats = state.plats.filter(p => p.alive && p.y > state.camY - 80);

  // life drain �?faster deeper
  const drain = 0.045 + state.floor * 0.00055;
  state.life -= drain * dt;
  if (state.life <= 0) {
    state.life = 0;
    die('生命耗尽');
    return;
  }

  // fell off screen
  if (state.py - state.camY > H + 50) {
    die('掉出屏幕');
    return;
  }
  hud();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function platColor(type) {
  if (type === 'spike') return '#ef4444';
  if (type === 'spring') return '#38bdf8';
  if (type === 'vanish') return '#fb923c';
  if (type === 'conveyL' || type === 'conveyR') return '#a78bfa';
  if (type === 'moving') return '#f472b6';
  return '#86efac';
}

function drawStick(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#f8fafc';
  ctx.fillStyle = '#f8fafc';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  // head
  ctx.beginPath();
  ctx.arc(0, -12, 6, 0, Math.PI * 2);
  ctx.fill();
  // body
  ctx.beginPath();
  ctx.moveTo(0, -6);
  ctx.lineTo(0, 8);
  ctx.stroke();
  // arms
  const swing = Math.sin((state ? state.t : 0) * 10) * 4 * (dir() || 0.2);
  ctx.beginPath();
  ctx.moveTo(0, -2);
  ctx.lineTo(-8, 4 + swing);
  ctx.moveTo(0, -2);
  ctx.lineTo(8, 4 - swing);
  ctx.stroke();
  // legs
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.lineTo(-6, 16);
  ctx.moveTo(0, 8);
  ctx.lineTo(6, 16);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  let ox = 0, oy = 0;
  if (state && state.shake > 0) {
    ox = (Math.random() - 0.5) * 8;
    oy = (Math.random() - 0.5) * 8;
  }
  ctx.save();
  ctx.translate(ox, oy);

  // sky / shaft shaft
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1e293b');
  g.addColorStop(1, '#020617');
  ctx.fillStyle = g;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // side walls
  ctx.fillStyle = '#334155';
  ctx.fillRect(0, 0, 8, H);
  ctx.fillRect(W - 8, 0, 8, H);
  ctx.fillStyle = '#0f172a';
  for (let i = 0; i < 12; i++) {
    const y = ((i * 70 - (state ? state.camY * 0.5 : 0) % 70));
    ctx.fillRect(0, y, 8, 36);
    ctx.fillRect(W - 8, y + 20, 8, 36);
  }

  if (!state) {
    ctx.restore();
    return;
  }

  const cam = state.camY;

  // floor labels in background
  ctx.fillStyle = 'rgba(148,163,184,.12)';
  ctx.font = 'bold 42px system-ui';
  ctx.textAlign = 'center';
  for (let f = Math.max(0, state.floor - 2); f <= state.floor + 6; f++) {
    const y = (state.plats.find(p => p.floor === f) || {}).y;
    if (y == null) continue;
    const sy = y - cam - 28;
    if (sy < -40 || sy > H + 40) continue;
    ctx.fillText('B' + f, W / 2, sy);
  }

  // platforms
  state.plats.forEach(p => {
    if (!p.alive) return;
    const py = p.y - cam;
    if (py < -50 || py > H + 50) return;
    let alpha = 1;
    if (p.type === 'vanish' && p.blink > 0) alpha = 0.35 + 0.65 * Math.abs(Math.sin(p.blink * 30));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = platColor(p.type);
    roundRect(p.x, py, p.w, p.h, 5);
    ctx.fill();
    // decorations
    if (p.type === 'spike') {
      ctx.fillStyle = '#7f1d1d';
      const n = Math.max(3, Math.floor(p.w / 12));
      for (let i = 0; i < n; i++) {
        const sx = p.x + 6 + i * (p.w - 12) / Math.max(1, n - 1);
        ctx.beginPath();
        ctx.moveTo(sx - 4, py);
        ctx.lineTo(sx, py - 10);
        ctx.lineTo(sx + 4, py);
        ctx.fill();
      }
    } else if (p.type === 'spring') {
      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x + 8, py + 4);
      for (let i = 0; i < 5; i++) ctx.lineTo(p.x + 8 + i * (p.w - 16) / 4, py + 4 + (i % 2 ? 6 : 0));
      ctx.stroke();
    } else if (p.type === 'conveyL' || p.type === 'conveyR') {
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.font = '12px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(p.type === 'conveyL' ? '◀◀◀' : '▶▶�?, p.x + p.w / 2, py + 11);
    } else if (p.type === 'moving') {
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.fillRect(p.x + p.w / 2 - 8, py + 5, 16, 3);
    }
    ctx.globalAlpha = 1;
    // tiny floor number
    if (p.floor > 0) {
      ctx.fillStyle = 'rgba(15,23,42,.55)';
      ctx.font = '10px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(String(p.floor), p.x + 4, py - 3);
    }
  });

  drawStick(state.px, state.py - cam);
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.l = true; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.r = true; e.preventDefault(); }
  if ((e.key === ' ' || e.key === 'Enter') && mode !== 'play') { unlock(); newGame(); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = false;
});

function bindHold(el, set) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); unlock(); set(true); el.classList.add('on'); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointerup', () => { set(false); el.classList.remove('on'); });
  el.addEventListener('pointercancel', () => { set(false); el.classList.remove('on'); });
  el.addEventListener('pointerleave', () => { set(false); el.classList.remove('on'); });
}
bindHold(document.getElementById('btnL'), v => { holdL = v; });
bindHold(document.getElementById('btnR'), v => { holdR = v; });

document.getElementById('btnNew').onclick = () => { unlock(); newGame(); };
document.getElementById('btnRetry').onclick = () => { unlock(); newGame(); };
document.getElementById('btnWinAgain').onclick = () => { unlock(); newGame(); };
document.getElementById('btnMenu').onclick = () => { mode = 'menu'; state = null; show('panelMenu'); loadBest(); };
document.getElementById('btnWinMenu').onclick = () => { mode = 'menu'; state = null; show('panelMenu'); loadBest(); };

loadBest();
resize();
if (window.GameAudio) GameAudio.boot('catchy');
requestAnimationFrame(loop);
})();
</script>
