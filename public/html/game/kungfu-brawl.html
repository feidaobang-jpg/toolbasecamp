<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>功夫 · Kung Fu Brawl</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto;background:#111827}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;z-index:2;display:flex;gap:10px;flex-wrap:wrap}
#hud b{color:#fde68a}
#audioBar{position:absolute;top:8px;right:8px;z-index:5;pointer-events:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:55%}
#audioBar .tb-btn{font-size:11px;padding:6px 10px;border:0;border-radius:999px;background:#2563eb;color:#fff;cursor:pointer}
#audioBar .game-volume{display:flex;align-items:center;gap:4px;font-size:10px;color:#94a3b8}
#audioBar input[type=range]{width:72px}
#touch{display:none;position:absolute;inset:0;pointer-events:none;z-index:3}
#touch .btn{pointer-events:auto;position:absolute;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
#touch .l{left:18px;bottom:40px;width:64px;height:64px}
#touch .r{left:90px;bottom:40px;width:64px;height:64px}
#touch .a{right:96px;bottom:40px;width:70px;height:70px;background:rgba(37,99,235,.5)}
#touch .b{right:18px;bottom:40px;width:70px;height:70px;background:rgba(37,99,235,.35)}
@media(pointer:coarse){#touch{display:block}}
#ui{position:absolute;inset:0;pointer-events:none;z-index:4}
#ui .panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,380px);background:rgba(15,23,42,.94);border:1px solid #334155;border-radius:14px;padding:18px 16px}
#ui h1{font-size:1.3rem;margin-bottom:6px;color:#f87171}
#ui h2{font-size:1.05rem;margin:0 0 10px;color:#fca5a5}
#ui p{font-size:.85rem;line-height:1.45;color:#94a3b8;margin-bottom:8px}
#ui .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#ui button{font:inherit;border:0;border-radius:999px;padding:10px 16px;background:#2563eb;color:#fff;cursor:pointer;flex:1;min-width:100px}
#ui button.ghost{background:#1e293b;border:1px solid #475569}
#ui button:disabled{opacity:.45}
#ui .shop-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e293b;font-size:.84rem}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span>分 <b id="score">0</b></span><span>关 <b id="level">1</b></span><span>币 <b id="coins">0</b></span><span>最高 <b id="best">0</b></span></div>
  <div class="action-row" id="audioBar"></div>
  <div id="touch">
    <div class="btn l" id="btnL">←</div><div class="btn r" id="btnR">→</div>
    <div class="btn a" id="btnA">拳</div><div class="btn b" id="btnB">挡</div>
  </div>
  <div id="ui">
    <div class="panel" id="panelMenu">
      <h1>功夫</h1>
      <p>横版对打：出拳连招、格挡减伤。清关敌人后升级攻击与气血。</p>
      <p>A/D 移动 · J 出拳 · K 格挡</p>
      <div class="row"><button id="btnNew">新游戏</button><button class="ghost" id="btnContinue" disabled>继续</button></div>
    </div>
    <div class="panel hidden" id="panelShop">
      <h2>武馆 · 第 <span id="shopLv">1</span> 关</h2>
      <p id="shopMsg"></p><div id="shopList"></div>
      <div class="row"><button id="btnNext">下一关</button><button class="ghost" id="btnSaveMenu">存档回菜单</button></div>
    </div>
    <div class="panel hidden" id="panelOver">
      <h2>落败</h2><p id="overMsg"></p>
      <div class="row"><button id="btnRetry">再来</button><button class="ghost" id="btnOverMenu">菜单</button></div>
    </div>
  </div>
</div>
<script src="../../js/game/game-audio.js?v=18"></script>
<script>
(function(){
const KEY='tbc_kungfu_v1';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=360,H=640,dpr=1,mode='menu',state=null,best=0;
const keys={};const hold={l:false,r:false,a:false,b:false};

function sfx(n){try{GameAudio&&GameAudio.sfx(n)}catch(e){}}
function unlock(){try{GameAudio&&GameAudio.unlock()}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function loadMeta(){const d=load();best=(d&&d.best)||0;document.getElementById('best').textContent=best;document.getElementById('btnContinue').disabled=!(d&&d.play)}
function persist(){if(!state)return;save({best:Math.max(best,state.score),play:{score:state.score,coins:state.coins,level:state.level,atk:state.atk,hp:state.hpMax}})}
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=Math.max(280,r.width);H=Math.max(400,r.height);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);
function hidePanels(){['panelMenu','panelShop','panelOver'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function show(id){hidePanels();document.getElementById(id).classList.remove('hidden')}
function gy(){return H*0.7}

function spawnEnemies(lv){
  const arr=[];const n=2+Math.min(4,lv);
  for(let i=0;i<n;i++)arr.push({x:W*0.55+i*50,y:gy(),hp:20+lv*6,max:20+lv*6,face:-1,cd:0.5+i*0.2,flash:0,alive:true});
  return arr;
}

function newGame(from){
  unlock();const p=from||{};
  state={
    score:p.score||0,coins:p.coins||0,level:p.level||1,
    atk:p.atk||0,hpMax:p.hp||50,hp:p.hp||50,
    x:W*0.25,y:gy(),face:1,atkT:0,block:false,combo:0,enemies:spawnEnemies(p.level||1),t:0
  };
  mode='play';hidePanels();hud();sfx('place');
}

function hud(){if(!state)return;document.getElementById('score').textContent=state.score|0;document.getElementById('level').textContent=state.level;document.getElementById('coins').textContent=state.coins|0;document.getElementById('best').textContent=Math.max(best,state.score)|0}

function openShop(){
  mode='shop';document.getElementById('shopLv').textContent=state.level;
  document.getElementById('shopMsg').textContent='金币 '+state.coins;
  const list=document.getElementById('shopList');list.innerHTML='';
  [{id:'atk',name:'攻击力',cost:16+state.atk*10,ok:state.atk<6},{id:'hp',name:'气血上限',cost:18,ok:state.hpMax<100}].forEach(it=>{
    const row=document.createElement('div');row.className='shop-item';row.innerHTML='<span>'+it.name+'</span>';
    const b=document.createElement('button');b.textContent=it.cost+' 币';b.disabled=!it.ok||state.coins<it.cost;
    b.onclick=()=>{unlock();if(state.coins<it.cost||!it.ok)return;state.coins-=it.cost;sfx('swap');if(it.id==='atk')state.atk++;if(it.id==='hp'){state.hpMax+=10;state.hp=state.hpMax}persist();openShop();hud()};
    row.appendChild(b);list.appendChild(row);
  });
  show('panelShop');persist();
}

function fail(){
  mode='over';best=Math.max(best,state.score);save({best,play:null});
  document.getElementById('overMsg').textContent='得分 '+state.score+' · 第 '+state.level+' 关';
  show('panelOver');sfx('lose');hud();
}

function update(dt){
  if(mode!=='play'||!state)return;
  state.t+=dt;state.atkT=Math.max(0,state.atkT-dt);
  const left=keys['a']||keys['A']||keys['ArrowLeft']||hold.l;
  const right=keys['d']||keys['D']||keys['ArrowRight']||hold.r;
  state.block=keys['k']||keys['K']||hold.b;
  if(left){state.x-=140*dt;state.face=-1}
  if(right){state.x+=140*dt;state.face=1}
  state.x=Math.max(30,Math.min(W-30,state.x));
  if((keys['j']||keys['J']||hold.a)&&state.atkT<=0&&!state.block){
    state.atkT=0.35;state.combo++;sfx('hit');hold.a=false;keys['j']=keys['J']=false;
    const reach=state.x+state.face*42;
    state.enemies.forEach(e=>{
      if(!e.alive)return;
      if(Math.abs(e.x-reach)<40&&Math.abs(e.y-state.y)<30){
        const dmg=8+state.atk*3+Math.min(6,state.combo);
        e.hp-=dmg;e.flash=0.15;e.x+=state.face*12;
        if(e.hp<=0){e.alive=false;state.score+=100;state.coins+=4;sfx('place')}
      }
    });
  }
  if(state.atkT<=0)state.combo=Math.max(0,state.combo-dt*2);

  state.enemies.forEach(e=>{
    if(!e.alive)return;
    e.flash=Math.max(0,e.flash-dt);e.cd-=dt;
    e.face=e.x<state.x?1:-1;
    if(Math.abs(e.x-state.x)>50)e.x+=e.face*70*dt;
    if(e.cd<=0&&Math.abs(e.x-state.x)<55){
      e.cd=0.9+Math.random()*0.4;
      if(state.block){state.hp-=2;sfx('swap')}
      else{state.hp-=6+state.level;sfx('hit')}
      if(state.hp<=0){state.hp=0;fail()}
    }
  });

  if(state.enemies.every(e=>!e.alive)){
    state.level++;state.coins+=10+state.level*2;state.score+=250;state.hp=Math.min(state.hpMax,state.hp+15);sfx('win');openShop();
  }
  hud();
}

function drawPerson(x,y,color,face,punch,block,flash){
  ctx.save();ctx.translate(x,y);
  if(flash)ctx.globalAlpha=0.6;
  ctx.fillStyle=color;ctx.fillRect(-12,-40,24,40);
  ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(0,-48,9,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=4;
  if(block){ctx.beginPath();ctx.moveTo(face*8,-30);ctx.lineTo(face*22,-18);ctx.stroke()}
  else if(punch){ctx.beginPath();ctx.moveTo(face*8,-28);ctx.lineTo(face*34,-24);ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(-10,-20);ctx.lineTo(-18,-6);ctx.moveTo(10,-20);ctx.lineTo(18,-6);ctx.stroke()}
  ctx.restore();
}

function draw(){
  ctx.fillStyle='#1e293b';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#334155';ctx.fillRect(0,gy(),W,H-gy());
  ctx.fillStyle='#0ea5e9';ctx.fillRect(0,0,W,H*0.35);
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(W*0.8,H*0.12,24,0,Math.PI*2);ctx.fill();
  // dojo posts
  ctx.fillStyle='#78350f';ctx.fillRect(20,gy()-90,10,90);ctx.fillRect(W-30,gy()-90,10,90);
  if(!state)return;
  // HP bars
  ctx.fillStyle='#450a0a';ctx.fillRect(12,28,120,8);ctx.fillStyle='#ef4444';ctx.fillRect(12,28,120*(state.hp/state.hpMax),8);
  state.enemies.forEach(e=>{
    if(!e.alive)return;
    drawPerson(e.x,e.y,'#f87171',e.face,e.cd>0.7,false,e.flash>0);
    ctx.fillStyle='#450a0a';ctx.fillRect(e.x-20,e.y-70,40,5);ctx.fillStyle='#fbbf24';ctx.fillRect(e.x-20,e.y-70,40*(e.hp/e.max),5);
  });
  drawPerson(state.x,state.y,'#38bdf8',state.face,state.atkT>0.15,state.block,false);
}

let last=performance.now();
function loop(n){const dt=Math.min(0.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key]=true});
window.addEventListener('keyup',e=>{keys[e.key]=false});
function bind(el,k){el.addEventListener('pointerdown',e=>{e.preventDefault();hold[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>hold[k]=false))}
bind(document.getElementById('btnL'),'l');bind(document.getElementById('btnR'),'r');bind(document.getElementById('btnA'),'a');bind(document.getElementById('btnB'),'b');

document.getElementById('btnNew').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnContinue').onclick=()=>{unlock();const d=load();if(d&&d.play)newGame(d.play)};
document.getElementById('btnNext').onclick=()=>{unlock();state.enemies=spawnEnemies(state.level);state.x=W*0.25;state.hp=state.hpMax;mode='play';hidePanels();persist();sfx('place')};
document.getElementById('btnSaveMenu').onclick=()=>{persist();mode='menu';show('panelMenu');loadMeta()};
document.getElementById('btnRetry').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnOverMenu').onclick=()=>{mode='menu';show('panelMenu');loadMeta()};

loadMeta();resize();if(window.GameAudio)GameAudio.boot('catchy');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
