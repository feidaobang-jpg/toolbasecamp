<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a231b">
<title>亮剑：攻打平安县城</title>
<link rel="stylesheet" href="style.css?v=0.2.0">
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="游戏画面"></canvas>
  <div id="look" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="danmaku" aria-hidden="true"></div>
  <div id="labels" aria-hidden="true"></div>

  <div id="hud" hidden>
    <div id="hud-left">
      <div id="hp-row"><span id="hp-pips" aria-label="耐久"></span><span id="lives"></span><span id="score"></span></div>
      <div id="objective"></div>
      <div id="cannon-row" hidden><span>炮组</span><i><b id="cannon-bar"></b></i></div>
    </div>
    <div id="hud-top">
      <span id="demo-badge" hidden>演示模式 · 无敌</span>
      <button id="btn-view" type="button" aria-label="切换视角"><b class="kb">C</b><span id="view-name">斜俯视</span></button>
      <button id="btn-pause" type="button" aria-label="暂停">Ⅱ 暂停</button>
      <button id="btn-full" type="button" aria-label="全屏">全屏</button>
    </div>
    <div id="marker" hidden><i></i><span></span></div>
    <div id="crosshair" hidden><i></i></div>
    <div id="cross-tip" hidden></div>
    <div id="aim-info" hidden></div>
    <div id="skills" aria-hidden="true"></div>
    <div id="keyhint"></div>
    <div id="boss" hidden><span>山本一木</span><i><b></b></i></div>
    <div id="dialog" hidden><b></b><span></span></div>
    <div id="prompt" hidden></div>
    <div id="stamp" hidden></div>
    <div id="toast" hidden></div>
  </div>

  <div id="touch" hidden>
    <div id="joy-zone"></div>
    <div id="joy-base"><div id="joy-knob"></div></div>
    <button class="tb" id="act-fire2" data-act="fire" type="button" aria-label="左手开火" hidden><span>开火</span></button>
    <button class="tb" id="act-fire" data-act="fire" type="button" aria-label="开火"><b class="kb">J</b><span>开火</span><em></em></button>
    <button class="tb" id="act-jump" data-act="jump" type="button" aria-label="跳跃"><b class="kb">K</b><span>跳</span></button>
    <button class="tb" id="act-ads" data-act="ads" type="button" aria-label="开镜"><b class="kb">O</b><span>开镜</span></button>
    <button class="tb" id="act-reload" data-act="reload" type="button" aria-label="换弹"><b class="kb">R</b><span>换弹</span></button>
    <button class="tb" id="act-nade" data-act="nade" type="button" aria-label="手榴弹"><b class="kb">L</b><span>手榴弹</span><em></em></button>
    <button class="tb" id="act-dash" data-act="dash" type="button" aria-label="亮剑"><b class="kb">U</b><span>亮剑</span><em></em></button>
    <button class="tb" id="act-cav" data-act="cav" type="button" aria-label="骑兵连"><b class="kb">I</b><span>骑兵连</span><em></em></button>
    <button class="tb" id="act-use" data-act="use" type="button" aria-label="互动" hidden><b class="kb">F</b><span>操炮</span></button>
  </div>

  <div id="fps" hidden></div>
  <div id="menu" class="overlay" hidden></div>
  <div id="pause" class="overlay" hidden></div>
  <div id="result" class="overlay" hidden></div>
  <div id="loading"><div class="ld-title">亮剑 · 攻打平安县城</div><div id="ld-text">正在集结队伍…</div><button id="ld-retry" type="button" hidden>重新加载</button></div>
</div>
<script>
// 模块脚本加载失败时给出提示，不白屏
window.addEventListener('error', function (e) {
  var t = document.getElementById('ld-text'), l = document.getElementById('loading'), b = document.getElementById('ld-retry');
  if (!l || l.hidden) return;
  if (t) t.textContent = '加载失败：' + ((e && e.message) || '资源读取出错') + '，请重试。';
  if (b) { b.hidden = false; b.onclick = function () { location.reload(); }; }
}, true);
</script>
<script type="module" src="js/main.js?v=0.2.0"></script>
</body>
</html>
