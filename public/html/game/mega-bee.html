<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>大蜜蜂 · Mega Bee</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020617;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;max-width:420px;margin:0 auto;background:#000}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;z-index:2;display:flex;gap:10px;flex-wrap:wrap}
#hud b{color:#fde68a}
#audioBar{position:absolute;top:8px;right:8px;z-index:5;pointer-events:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:55%}
#audioBar .tb-btn{font-size:11px;padding:6px 10px;border:0;border-radius:999px;background:#2563eb;color:#fff;cursor:pointer}
#audioBar .game-volume{display:flex;align-items:center;gap:4px;font-size:10px;color:#94a3b8}
#audioBar input[type=range]{width:72px}
#touch{display:none;position:absolute;inset:0;pointer-events:none;z-index:3}
#touch .pad{pointer-events:auto;position:absolute;left:16px;bottom:16px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}
#touch .stick{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);left:30px;top:30px}
#touch .fire{pointer-events:auto;position:absolute;right:18px;bottom:28px;width:72px;height:72px;border-radius:50%;background:rgba(37,99,235,.55);border:1px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center}
@media(pointer:coarse){#touch{display:block}}
#ui{position:absolute;inset:0;pointer-events:none;z-index:4}
#ui .panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,380px);background:rgba(15,23,42,.94);border:1px solid #334155;border-radius:14px;padding:18px 16px}
#ui h1{font-size:1.3rem;margin-bottom:6px;color:#facc15}
#ui h2{font-size:1.05rem;margin:0 0 10px;color:#fde047}
#ui p{font-size:.85rem;line-height:1.45;color:#94a3b8;margin-bottom:8px}
#ui .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#ui button{font:inherit;border:0;border-radius:999px;padding:10px 16px;background:#2563eb;color:#fff;cursor:pointer;flex:1;min-width:100px}
#ui button.ghost{background:#1e293b;border:1px solid #475569}
#ui button:disabled{opacity:.45}
#ui .shop-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e293b;font-size:.84rem}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span>分 <b id="score">0</b></span><span>波 <b id="wave">1</b></span><span>命 <b id="lives">3</b></span><span>最高 <b id="best">0</b></span></div>
  <div class="action-row" id="audioBar"></div>
  <div id="touch"><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="fire" id="btnFire">射</div></div>
  <div id="ui">
    <div class="panel" id="panelMenu">
      <h1>大蜜蜂</h1>
      <p>纵版蜜蜂阵型射击。清波次、打 Boss，升级火力与护盾。</p>
      <p>WASD 移动 · J/空格 开火 · 触屏摇杆+射</p>
      <div class="row"><button id="btnNew">新游戏</button><button class="ghost" id="btnContinue" disabled>继续</button></div>
    </div>
    <div class="panel hidden" id="panelShop">
      <h2>整备 · 波 <span id="shopLv">1</span></h2>
      <p id="shopMsg"></p><div id="shopList"></div>
      <div class="row"><button id="btnNext">下一波</button><button class="ghost" id="btnSaveMenu">存档回菜单</button></div>
    </div>
    <div class="panel hidden" id="panelOver">
      <h2>战机被击落</h2><p id="overMsg"></p>
      <div class="row"><button id="btnRetry">再来</button><button class="ghost" id="btnOverMenu">菜单</button></div>
    </div>
  </div>
</div>
<script src="../../js/game/game-audio.js?v=18"></script>
<script>
(function(){
const KEY='tbc_mega_bee_v1';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=360,H=640,dpr=1,mode='menu',state=null,best=0;
const keys={};let stick={x:0,y:0,active:false};let fireHold=false;

function sfx(n){try{GameAudio&&GameAudio.sfx(n)}catch(e){}}
function unlock(){try{GameAudio&&GameAudio.unlock()}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function loadMeta(){const d=load();best=(d&&d.best)||0;document.getElementById('best').textContent=best;document.getElementById('btnContinue').disabled=!(d&&d.play)}
function persist(){if(!state)return;save({best:Math.max(best,state.score),play:{score:state.score,coins:state.coins,wave:state.wave,lives:state.lives,pow:state.pow,shield:state.shieldLv}})}
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=Math.max(280,r.width);H=Math.max(400,r.height);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);
function hidePanels(){['panelMenu','panelShop','panelOver'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function show(id){hidePanels();document.getElementById(id).classList.remove('hidden')}

function mkWave(wave){
  const bees=[];const cols=6,rows=3+Math.min(2,(wave/2)|0);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    bees.push({bx:40+c*44,by:50+r*36,x:0,y:0,hp:1+(wave>3?1:0),dive:0,alive:true,boss:false});
  }
  if(wave%3===0)bees.push({bx:W/2,by:30,x:0,y:0,hp:30+wave*8,dive:0,alive:true,boss:true});
  return bees;
}

function newGame(from){
  unlock();const p=from||{};
  state={
    score:p.score||0,coins:p.coins||0,wave:p.wave||1,lives:p.lives||3,
    pow:p.pow||0,shieldLv:p.shield||0,shield:p.shield||0,
    px:W/2,py:H*0.82,bullets:[],ebullets:[],bees:mkWave(p.wave||1),
    t:0,fireCd:0,formationX:0,formationDir:1,inv:0
  };
  mode='play';hidePanels();hud();sfx('place');
}

function hud(){if(!state)return;document.getElementById('score').textContent=state.score|0;document.getElementById('wave').textContent=state.wave;document.getElementById('lives').textContent=state.lives;document.getElementById('best').textContent=Math.max(best,state.score)|0}

function openShop(){
  mode='shop';document.getElementById('shopLv').textContent=state.wave;
  document.getElementById('shopMsg').textContent='金币 '+state.coins;
  const list=document.getElementById('shopList');list.innerHTML='';
  [{id:'pow',name:'火力',cost:15+state.pow*12,ok:state.pow<4},{id:'shield',name:'护盾',cost:18+state.shieldLv*10,ok:state.shieldLv<3},{id:'life',name:'命 +1',cost:25,ok:state.lives<6}].forEach(it=>{
    const row=document.createElement('div');row.className='shop-item';row.innerHTML='<span>'+it.name+'</span>';
    const b=document.createElement('button');b.textContent=it.cost+' 币';b.disabled=!it.ok||state.coins<it.cost;
    b.onclick=()=>{unlock();if(state.coins<it.cost||!it.ok)return;state.coins-=it.cost;sfx('swap');if(it.id==='pow')state.pow++;if(it.id==='shield'){state.shieldLv++;state.shield++}if(it.id==='life')state.lives++;persist();openShop();hud()};
    row.appendChild(b);list.appendChild(row);
  });
  show('panelShop');persist();
}

function die(){
  if(state.inv>0)return;
  if(state.shield>0){state.shield--;state.inv=1;sfx('hit');return}
  state.lives--;state.inv=1.5;sfx('hit');
  if(state.lives<=0){
    mode='over';best=Math.max(best,state.score);save({best,play:null});
    document.getElementById('overMsg').textContent='得分 '+state.score+' · 波次 '+state.wave;
    show('panelOver');sfx('lose');
  }
  hud();
}

function update(dt){
  if(mode!=='play'||!state)return;
  state.t+=dt;state.fireCd=Math.max(0,state.fireCd-dt);state.inv=Math.max(0,state.inv-dt);
  let ix=stick.active?stick.x:0,iy=stick.active?stick.y:0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])ix-=1;
  if(keys['ArrowRight']||keys['d']||keys['D'])ix+=1;
  if(keys['ArrowUp']||keys['w']||keys['W'])iy-=1;
  if(keys['ArrowDown']||keys['s']||keys['S'])iy+=1;
  const m=Math.hypot(ix,iy)||1;ix/=m;iy/=m;
  state.px=Math.max(20,Math.min(W-20,state.px+ix*220*dt));
  state.py=Math.max(H*0.55,Math.min(H-30,state.py+iy*220*dt));

  const wantFire=fireHold||keys[' ']||keys['j']||keys['J'];
  if(wantFire&&state.fireCd<=0){
    state.fireCd=0.22-state.pow*0.03;
    const shots=1+state.pow;
    for(let i=0;i<shots;i++){
      const ox=(i-(shots-1)/2)*10;
      state.bullets.push({x:state.px+ox,y:state.py-16,vy:-420});
    }
    sfx('shoot');
  }

  state.formationX+=state.formationDir*40*dt;
  if(state.formationX>30||state.formationX<-30)state.formationDir*=-1;

  state.bees.forEach(b=>{
    if(!b.alive)return;
    if(b.dive>0){
      b.y+=140*dt;b.x+=Math.sin(state.t*6)*40*dt;
      if(b.y>H+40){b.dive=0;b.y=b.by;b.x=b.bx+state.formationX}
    }else{
      b.x=b.bx+state.formationX+(b.boss?Math.sin(state.t*2)*20:0);
      b.y=b.by+Math.sin(state.t*2+b.bx)*4;
      if(!b.boss&&Math.random()<0.0015*state.wave)b.dive=1;
      if(Math.random()<0.004+state.wave*0.0005)state.ebullets.push({x:b.x,y:b.y+10,vy:160+state.wave*10});
    }
    if(Math.hypot(b.x-state.px,b.y-state.py)<(b.boss?28:16))die();
  });

  state.bullets=state.bullets.filter(p=>{
    p.y+=p.vy*dt;if(p.y<-10)return false;
    for(const b of state.bees){
      if(!b.alive)continue;
      if(Math.hypot(p.x-b.x,p.y-b.y)<(b.boss?26:14)){
        b.hp--;if(b.hp<=0){b.alive=false;state.score+=b.boss?500:50;state.coins+=b.boss?8:1;sfx('place')}
        else sfx('hit');
        return false;
      }
    }
    return true;
  });
  state.ebullets=state.ebullets.filter(p=>{
    p.y+=p.vy*dt;if(p.y>H+10)return false;
    if(Math.hypot(p.x-state.px,p.y-state.py)<12){die();return false}
    return true;
  });

  if(state.bees.every(b=>!b.alive)){
    state.wave++;state.coins+=10;state.score+=200;sfx('win');openShop();
  }
  hud();
}

function drawBee(b){
  ctx.save();ctx.translate(b.x,b.y);
  if(b.boss){ctx.fillStyle='#facc15';ctx.beginPath();ctx.ellipse(0,0,28,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.fillRect(-18,-4,36,3);ctx.fillRect(-18,4,36,3)}
  else{ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.ellipse(0,0,12,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-8,-2,16,2);ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(-6,-6,6,4,0,0,Math.PI*2);ctx.fill()}
  ctx.restore();
}

function draw(){
  ctx.fillStyle='#020617';ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){ctx.fillStyle='#64748b';ctx.fillRect((i*47)%W,(i*89+ (state?state.t*20:0)*((i%3)+1))%H,1.5,1.5)}
  if(!state)return;
  state.bees.forEach(b=>{if(b.alive)drawBee(b)});
  ctx.fillStyle='#f87171';state.ebullets.forEach(p=>{ctx.fillRect(p.x-2,p.y-4,4,8)});
  ctx.fillStyle='#93c5fd';state.bullets.forEach(p=>{ctx.fillRect(p.x-2,p.y-6,4,10)});
  if(!(state.inv>0&&((state.t*12)|0)%2===0)){
    ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.moveTo(state.px,state.py-14);ctx.lineTo(state.px-12,state.py+12);ctx.lineTo(state.px+12,state.py+12);ctx.closePath();ctx.fill();
    if(state.shield>0){ctx.strokeStyle='rgba(250,250,200,.5)';ctx.beginPath();ctx.arc(state.px,state.py,18,0,Math.PI*2);ctx.stroke()}
  }
}

let last=performance.now();
function loop(n){const dt=Math.min(0.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key]=false});
(function(){const pad=document.getElementById('pad'),st=document.getElementById('stick');
function set(cx,cy){const r=pad.getBoundingClientRect();let x=(cx-r.left)/r.width*2-1,y=(cy-r.top)/r.height*2-1;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}stick={x,y,active:true};st.style.left=(30+x*26)+'px';st.style.top=(30+y*26)+'px'}
function end(){stick={x:0,y:0,active:false};st.style.left='30px';st.style.top='30px'}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);set(e.clientX,e.clientY)});
pad.addEventListener('pointermove',e=>{if(stick.active)set(e.clientX,e.clientY)});
pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
const f=document.getElementById('btnFire');
f.addEventListener('pointerdown',e=>{e.preventDefault();fireHold=true});
f.addEventListener('pointerup',()=>fireHold=false);f.addEventListener('pointercancel',()=>fireHold=false);
})();

document.getElementById('btnNew').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnContinue').onclick=()=>{unlock();const d=load();if(d&&d.play)newGame(d.play)};
document.getElementById('btnNext').onclick=()=>{unlock();state.bees=mkWave(state.wave);state.bullets=[];state.ebullets=[];state.shield=state.shieldLv;mode='play';hidePanels();persist();sfx('place')};
document.getElementById('btnSaveMenu').onclick=()=>{persist();mode='menu';show('panelMenu');loadMeta()};
document.getElementById('btnRetry').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnOverMenu').onclick=()=>{mode='menu';show('panelMenu');loadMeta()};

loadMeta();resize();if(window.GameAudio)GameAudio.boot('catchy');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
