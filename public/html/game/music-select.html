<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐选择 · Tool Basecamp</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="../../vendor/tailwindcss.js?v=26178e4"></script>
<link href="../../vendor/font-awesome/css/all.min.css?v=26178e4" rel="stylesheet">
<link rel="stylesheet" href="../../css/base.css?v=26178e4">
<style>
body{background:#f8fafc;min-height:100vh;margin:0;}
.music-wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;}
.music-wrap h1{font-size:1.35rem;margin:0 0 6px;color:#0f172a;font-weight:700;}
.music-wrap .sub{color:#64748b;font-size:0.9rem;margin:0 0 18px;line-height:1.5;}
.music-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
.music-controls .game-volume{display:flex;align-items:center;gap:8px;font-size:0.875rem;color:#475569;}
.music-controls input[type=range]{width:140px;}
.music-list{display:flex;flex-direction:column;gap:10px;}
.music-card{
  display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;
  padding:14px 16px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;
  cursor:pointer;transition:border-color .15s,box-shadow .15s;
}
.music-card:hover{border-color:#93c5fd;}
.music-card.is-active{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.2);}
.music-card .name{font-weight:700;color:#0f172a;font-size:1rem;}
.music-card .desc{font-size:0.85rem;color:#64748b;line-height:1.4;}
.music-card .meta{font-size:0.75rem;color:#2563eb;font-weight:600;}
.music-tip{margin-top:20px;font-size:0.8rem;color:#94a3b8;line-height:1.45;}
.music-nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
</style>
</head>
<body>
<header class="bg-white border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="../../index.html" class="flex items-center gap-2 group">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">TB</div>
      <span class="font-bold text-gray-900">Tool Basecamp</span>
    </a>
  </div>
</header>
<div class="music-wrap">
  <div class="music-nav">
    <a class="tb-btn" href="../../index.html" data-i18n="hub.music.backHome">Home</a>
    <a class="tb-btn" href="../../games.html" data-i18n="hub.music.backGames">Games</a>
  </div>
  <h1 data-i18n="hub.music.title">Music</h1>
  <p class="sub" data-i18n="hub.music.sub">Pick a background track for games. Choice is saved on this device.</p>
  <div class="music-controls">
    <button type="button" class="tb-btn" id="sound-btn" data-i18n="tools.game.soundOn">Mute</button>
    <label class="game-volume">
      <span data-i18n="tools.game.volume">Volume</span>
      <input type="range" id="volume-slider" min="0" max="100" value="50">
    </label>
  </div>
  <div class="music-list" id="music-list"></div>
  <p class="music-tip" data-i18n="hub.music.tip">Procedural chiptune loops (no copyrighted tracks). Tap a card to preview and apply.</p>
</div>
<script src="../../js/locales/en.js?v=26178e4"></script>
<script src="../../js/locales/zh-CN.js?v=26178e4"></script>
<script src="../../js/i18n.js?v=26178e4"></script>
<script src="../../js/game/game-audio.js?v=26178e4"></script>
<script>
(function () {
  function tr(k) {
    return typeof window.t === 'function' ? window.t(k) : k;
  }
  function applyStaticI18n() {
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var k = el.getAttribute('data-i18n');
      if (k) el.textContent = tr(k);
    });
  }
  function render() {
    var list = document.getElementById('music-list');
    if (!list || !window.GameAudio) return;
    var themes = GameAudio.listThemes();
    var cur = GameAudio.getTheme();
    list.innerHTML = '';
    themes.forEach(function (item) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'music-card' + (item.id === cur ? ' is-active' : '');
      btn.innerHTML =
        '<span class="name">' + tr(item.titleKey) + '</span>' +
        '<span class="desc">' + tr(item.descKey) + '</span>' +
        (item.id === cur ? '<span class="meta">' + tr('hub.music.playing') + '</span>' : '');
      btn.addEventListener('click', function () {
        GameAudio.unlock();
        GameAudio.setTheme(item.id, true);
        render();
      });
      list.appendChild(btn);
    });
  }
  function go() {
    applyStaticI18n();
    if (window.GameAudio) {
      GameAudio.bindControls();
      GameAudio.startBgm(GameAudio.getTheme());
    }
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else go();
  document.addEventListener('tb:locale', function () { applyStaticI18n(); render(); });
})();
</script>
</body>
</html>
