<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>雷电战机 · Sky Raid</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020617;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;max-width:420px;margin:0 auto;background:#000}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;z-index:2;display:flex;gap:10px;flex-wrap:wrap}
#hud b{color:#fde68a}
#audioBar{position:absolute;top:8px;right:8px;z-index:5;pointer-events:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:55%}
#audioBar .tb-btn{font-size:11px;padding:6px 10px;border:0;border-radius:999px;background:#2563eb;color:#fff;cursor:pointer}
#audioBar .game-volume{display:flex;align-items:center;gap:4px;font-size:10px;color:#94a3b8}
#audioBar input[type=range]{width:72px}
#touch{display:none;position:absolute;inset:0;pointer-events:none;z-index:3}
#touch .pad{pointer-events:auto;position:absolute;left:16px;bottom:16px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}
#touch .stick{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);left:30px;top:30px}
#touch .fire{pointer-events:auto;position:absolute;right:90px;bottom:28px;width:64px;height:64px;border-radius:50%;background:rgba(37,99,235,.55);color:#fff;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);font-size:12px}
#touch .bomb{pointer-events:auto;position:absolute;right:18px;bottom:28px;width:64px;height:64px;border-radius:50%;background:rgba(37,99,235,.35);color:#fff;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);font-size:12px}
@media(pointer:coarse){#touch{display:block}}
#ui{position:absolute;inset:0;pointer-events:none;z-index:4}
#ui .panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,380px);background:rgba(15,23,42,.94);border:1px solid #334155;border-radius:14px;padding:18px 16px}
#ui h1{font-size:1.3rem;margin-bottom:6px;color:#67e8f9}
#ui h2{font-size:1.05rem;margin:0 0 10px;color:#a5f3fc}
#ui p{font-size:.85rem;line-height:1.45;color:#94a3b8;margin-bottom:8px}
#ui .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#ui button{font:inherit;border:0;border-radius:999px;padding:10px 16px;background:#2563eb;color:#fff;cursor:pointer;flex:1;min-width:100px}
#ui button.ghost{background:#1e293b;border:1px solid #475569}
#ui button:disabled{opacity:.45}
#ui .shop-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e293b;font-size:.84rem}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span>分 <b id="score">0</b></span><span>关 <b id="level">1</b></span><span>弹 <b id="bombs">2</b></span><span>最高 <b id="best">0</b></span></div>
  <div class="action-row" id="audioBar"></div>
  <div id="touch"><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="fire" id="btnFire">射</div><div class="bomb" id="btnBomb">炸</div></div>
  <div id="ui">
    <div class="panel" id="panelMenu">
      <h1>雷电战机</h1>
      <p>纵版空战：敌机编队与子弹。商店强化机枪、护盾与炸弹。</p>
      <p>WASD · J 开火 · L 炸弹</p>
      <div class="row"><button id="btnNew">新游戏</button><button class="ghost" id="btnContinue" disabled>继续</button></div>
    </div>
    <div class="panel hidden" id="panelShop">
      <h2>航母补给 · 关 <span id="shopLv">1</span></h2>
      <p id="shopMsg"></p><div id="shopList"></div>
      <div class="row"><button id="btnNext">下一关</button><button class="ghost" id="btnSaveMenu">存档回菜单</button></div>
    </div>
    <div class="panel hidden" id="panelOver">
      <h2>任务失败</h2><p id="overMsg"></p>
      <div class="row"><button id="btnRetry">再来</button><button class="ghost" id="btnOverMenu">菜单</button></div>
    </div>
  </div>
</div>
<script src="../../js/game/game-audio.js?v=18"></script>
<script>
(function(){
const KEY='tbc_sky_raid_v1';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=360,H=640,dpr=1,mode='menu',state=null,best=0;
const keys={};let stick={x:0,y:0,active:false};let fireHold=false;

function sfx(n){try{GameAudio&&GameAudio.sfx(n)}catch(e){}}
function unlock(){try{GameAudio&&GameAudio.unlock()}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function loadMeta(){const d=load();best=(d&&d.best)||0;document.getElementById('best').textContent=best;document.getElementById('btnContinue').disabled=!(d&&d.play)}
function persist(){if(!state)return;save({best:Math.max(best,state.score),play:{score:state.score,coins:state.coins,level:state.level,lives:state.lives,gun:state.gun,shield:state.shieldLv,bombs:state.bombs}})}
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=Math.max(280,r.width);H=Math.max(400,r.height);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);
function hidePanels(){['panelMenu','panelShop','panelOver'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function show(id){hidePanels();document.getElementById(id).classList.remove('hidden')}

function startLevel(){
  state.enemies=[];state.bullets=[];state.eb=[];state.scroll=0;state.killed=0;state.goal=12+state.level*4;state.spawnT=0;state.boss=null;state.inv=0;
}

function newGame(from){
  unlock();const p=from||{};
  state={score:p.score||0,coins:p.coins||0,level:p.level||1,lives:p.lives||3,gun:p.gun||0,shieldLv:p.shield||0,shield:p.shield||0,bombs:p.bombs||2,px:W/2,py:H*0.8,t:0,fireCd:0};
  startLevel();mode='play';hidePanels();hud();sfx('place');
}

function hud(){if(!state)return;document.getElementById('score').textContent=state.score|0;document.getElementById('level').textContent=state.level;document.getElementById('bombs').textContent=state.bombs;document.getElementById('best').textContent=Math.max(best,state.score)|0}

function openShop(){
  mode='shop';document.getElementById('shopLv').textContent=state.level;
  document.getElementById('shopMsg').textContent='金币 '+state.coins;
  const list=document.getElementById('shopList');list.innerHTML='';
  [{id:'gun',name:'机枪',cost:14+state.gun*12,ok:state.gun<4},{id:'shield',name:'护盾',cost:16+state.shieldLv*10,ok:state.shieldLv<3},{id:'bomb',name:'炸弹 +1',cost:20,ok:state.bombs<5}].forEach(it=>{
    const row=document.createElement('div');row.className='shop-item';row.innerHTML='<span>'+it.name+'</span>';
    const b=document.createElement('button');b.textContent=it.cost+' 币';b.disabled=!it.ok||state.coins<it.cost;
    b.onclick=()=>{unlock();if(state.coins<it.cost||!it.ok)return;state.coins-=it.cost;sfx('swap');if(it.id==='gun')state.gun++;if(it.id==='shield'){state.shieldLv++;state.shield++}if(it.id==='bomb')state.bombs++;persist();openShop();hud()};
    row.appendChild(b);list.appendChild(row);
  });
  show('panelShop');persist();
}

function hurt(){
  if(state.inv>0)return;
  if(state.shield>0){state.shield--;state.inv=1;sfx('hit');return}
  state.lives--;state.inv=1.5;sfx('hit');
  if(state.lives<=0){mode='over';best=Math.max(best,state.score);save({best,play:null});document.getElementById('overMsg').textContent='得分 '+state.score;show('panelOver');sfx('lose')}
  hud();
}

function useBomb(){
  if(mode!=='play'||!state||state.bombs<=0)return;
  state.bombs--;sfx('win');
  state.enemies.forEach(e=>{e.hp-=8;if(e.hp<=0){e.dead=true;state.killed++;state.score+=40;state.coins++}});
  state.enemies=state.enemies.filter(e=>!e.dead);
  state.eb=[];if(state.boss){state.boss.hp-=25}
  hud();
}

function update(dt){
  if(mode!=='play'||!state)return;
  state.t+=dt;state.scroll+=80*dt;state.fireCd=Math.max(0,state.fireCd-dt);state.inv=Math.max(0,state.inv-dt);state.spawnT-=dt;
  let ix=stick.active?stick.x:0,iy=stick.active?stick.y:0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])ix-=1;if(keys['ArrowRight']||keys['d']||keys['D'])ix+=1;
  if(keys['ArrowUp']||keys['w']||keys['W'])iy-=1;if(keys['ArrowDown']||keys['s']||keys['S'])iy+=1;
  const m=Math.hypot(ix,iy)||1;state.px=Math.max(16,Math.min(W-16,state.px+ix/m*230*dt));state.py=Math.max(H*0.5,Math.min(H-24,state.py+iy/m*230*dt));
  if((fireHold||keys['j']||keys['J']||keys[' '])&&state.fireCd<=0){
    state.fireCd=0.18-state.gun*0.025;
    const n=1+state.gun;for(let i=0;i<n;i++)state.bullets.push({x:state.px+(i-(n-1)/2)*9,y:state.py-12,vy:-450});
    sfx('shoot');
  }
  if(keys['l']||keys['L']){keys['l']=keys['L']=false;useBomb()}

  if(state.spawnT<=0&&state.killed<state.goal&&!state.boss){
    state.spawnT=0.7+Math.random()*0.5;
    const kind=Math.random()<0.2?'tank':'plane';
    state.enemies.push({x:30+Math.random()*(W-60),y:-20,vy:60+Math.random()*40+state.level*5,hp:kind==='tank'?6:2,kind,dead:false,cd:1});
  }
  if(state.killed>=state.goal&&!state.boss){
    state.boss={x:W/2,y:60,hp:40+state.level*15,max:40+state.level*15,cd:0};
  }

  state.enemies.forEach(e=>{
    e.y+=e.vy*dt;e.cd-=dt;
    if(e.cd<=0){e.cd=1.2;state.eb.push({x:e.x,y:e.y,vy:200})}
    if(Math.hypot(e.x-state.px,e.y-state.py)<18)hurt();
  });
  state.enemies=state.enemies.filter(e=>e.y<H+30&&!e.dead);

  if(state.boss){
    state.boss.x=W/2+Math.sin(state.t*1.5)*80;state.boss.cd-=dt;
    if(state.boss.cd<=0){state.boss.cd=0.35;state.eb.push({x:state.boss.x-20,y:state.boss.y+20,vy:220});state.eb.push({x:state.boss.x+20,y:state.boss.y+20,vy:220})}
    if(Math.hypot(state.boss.x-state.px,state.boss.y-state.py)<30)hurt();
  }

  state.bullets=state.bullets.filter(p=>{
    p.y+=p.vy*dt;if(p.y<-10)return false;
    for(const e of state.enemies){if(!e.dead&&Math.hypot(p.x-e.x,p.y-e.y)<14){e.hp--;if(e.hp<=0){e.dead=true;state.killed++;state.score+=40;state.coins++;sfx('place')}else sfx('hit');return false}}
    if(state.boss&&Math.hypot(p.x-state.boss.x,p.y-state.boss.y)<28){state.boss.hp--;sfx('hit');if(state.boss.hp<=0){state.score+=800;state.coins+=15;state.level++;sfx('win');openShop()}return false}
    return true;
  });
  state.eb=state.eb.filter(p=>{p.y+=p.vy*dt;if(p.y>H+10)return false;if(Math.hypot(p.x-state.px,p.y-state.py)<10){hurt();return false}return true});
  hud();
}

function draw(){
  ctx.fillStyle='#0b1220';ctx.fillRect(0,0,W,H);
  const scroll=state?state.scroll:0;
  ctx.fillStyle='#1e3a2f';
  for(let i=0;i<8;i++){const y=((i*90+scroll)%(H+90))-45;ctx.fillRect(0,y,40,70);ctx.fillRect(W-40,y+20,40,70)}
  // stars even on menu
  ctx.fillStyle='#64748b';
  for(let i=0;i<28;i++){ctx.fillRect((i*53)%W,(i*97+scroll*0.5)%H,1.5,1.5)}
  if(!state)return;
  state.enemies.forEach(e=>{
    ctx.fillStyle=e.kind==='tank'?'#a3a3a3':'#f87171';
    if(e.kind==='tank'){ctx.fillRect(e.x-14,e.y-10,28,20);ctx.fillRect(e.x-4,e.y-18,8,10)}
    else{ctx.beginPath();ctx.moveTo(e.x,e.y+12);ctx.lineTo(e.x-12,e.y-10);ctx.lineTo(e.x+12,e.y-10);ctx.fill()}
  });
  if(state.boss){ctx.fillStyle='#ef4444';ctx.fillRect(state.boss.x-36,state.boss.y-16,72,32);ctx.fillStyle='#450a0a';ctx.fillRect(state.boss.x-40,state.boss.y-28,80,6);ctx.fillStyle='#fbbf24';ctx.fillRect(state.boss.x-40,state.boss.y-28,80*(state.boss.hp/state.boss.max),6)}
  ctx.fillStyle='#93c5fd';state.bullets.forEach(p=>ctx.fillRect(p.x-2,p.y-8,4,12));
  ctx.fillStyle='#fca5a5';state.eb.forEach(p=>ctx.fillRect(p.x-2,p.y-6,4,10));
  if(!(state.inv>0&&((state.t*12)|0)%2===0)){ctx.fillStyle='#22d3ee';ctx.beginPath();ctx.moveTo(state.px,state.py-16);ctx.lineTo(state.px-14,state.py+14);ctx.lineTo(state.px+14,state.py+14);ctx.fill()}
}

let last=performance.now();
function loop(n){const dt=Math.min(0.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key]=false});
(function(){const pad=document.getElementById('pad'),st=document.getElementById('stick');
function set(cx,cy){const r=pad.getBoundingClientRect();let x=(cx-r.left)/r.width*2-1,y=(cy-r.top)/r.height*2-1;const m=Math.hypot(x,y)||1;if(m>1){x/=m;y/=m}stick={x,y,active:true};st.style.left=(30+x*26)+'px';st.style.top=(30+y*26)+'px'}
function end(){stick={x:0,y:0,active:false};st.style.left='30px';st.style.top='30px'}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);set(e.clientX,e.clientY)});
pad.addEventListener('pointermove',e=>{if(stick.active)set(e.clientX,e.clientY)});
pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
document.getElementById('btnFire').addEventListener('pointerdown',e=>{e.preventDefault();fireHold=true});
document.getElementById('btnFire').addEventListener('pointerup',()=>fireHold=false);
document.getElementById('btnBomb').addEventListener('pointerdown',e=>{e.preventDefault();useBomb()});
})();

document.getElementById('btnNew').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnContinue').onclick=()=>{unlock();const d=load();if(d&&d.play)newGame(d.play)};
document.getElementById('btnNext').onclick=()=>{unlock();state.shield=state.shieldLv;startLevel();mode='play';hidePanels();persist();sfx('place')};
document.getElementById('btnSaveMenu').onclick=()=>{persist();mode='menu';show('panelMenu');loadMeta()};
document.getElementById('btnRetry').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnOverMenu').onclick=()=>{mode='menu';show('panelMenu');loadMeta()};

loadMeta();resize();if(window.GameAudio)GameAudio.boot('catchy');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
