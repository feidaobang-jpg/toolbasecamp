<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>幸运水果机 · Fruit Machine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a3d28;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;background:linear-gradient(180deg,#166534,#14532d 45%,#052e16);display:flex;flex-direction:column;padding:6px;gap:6px}
#board{flex:1 1 auto;min-height:0;position:relative;border-radius:14px;background:#14532d;border:4px solid #86efac;box-shadow:inset 0 0 0 3px #166534,0 6px 18px rgba(0,0,0,.35);overflow:hidden}
canvas{display:block;width:100%;height:100%}
/* 押注区压矮：固定偏矮，把空间留给跑灯盘 */
#panel{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;padding:6px 7px 7px;border-radius:12px;background:repeating-linear-gradient(-45deg,#86efac,#86efac 10px,#4ade80 10px,#4ade80 20px);border:3px solid #166534}
#scores{display:flex;gap:8px}
.scoreBox{flex:1;background:#0f172a;border:2px solid #334155;border-radius:8px;padding:4px 6px;text-align:center;display:flex;align-items:center;justify-content:space-between;gap:6px}
.scoreBox .lab{font-size:11px;color:#94a3b8}
.scoreBox b{font-size:18px;color:#fde68a;font-variant-numeric:tabular-nums}
#bets{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.bet{border:0;border-radius:8px;background:#0f172a;color:#fff;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 2px 0 #020617;cursor:pointer;min-height:0}
.bet:active{transform:translateY(1px);box-shadow:0 1px 0 #020617}
.bet .stake{font-size:10px;font-weight:700;color:#fde68a;line-height:1}
.bet canvas{width:26px;height:26px;display:block}
.bet .pay{font-size:10px;font-weight:800;color:#fbbf24;line-height:1}
.bet.on{outline:2px solid #fbbf24}
#controls{display:flex;align-items:center;gap:6px}
#btnGo{flex:0 0 auto;width:64px;height:40px;border-radius:999px;border:2px solid #fff7ed;background:linear-gradient(180deg,#fb923c,#c2410c);color:#fff;font-size:16px;font-weight:900;box-shadow:0 3px 0 #7c2d12;cursor:pointer}
#btnGo:active{transform:translateY(2px);box-shadow:0 1px 0 #7c2d12}
#btnGo:disabled{opacity:.55;cursor:not-allowed}
#btnMenu,#btnTest{flex:1;border:0;border-radius:999px;padding:9px 8px;background:#16a34a;color:#fff;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 2px 0 #14532d}
#btnTest{background:#1e40af;box-shadow:0 2px 0 #1e3a8a}
#btnTest.on{background:#f59e0b;box-shadow:0 2px 0 #b45309;color:#111}
#audioBar{flex:0 0 auto;display:flex;gap:4px;align-items:center;justify-content:flex-end;min-width:0}
#audioBar .tb-btn{font-size:10px;padding:5px 8px;border:0;border-radius:999px;background:#2563eb;color:#fff;cursor:pointer}
#audioBar .game-volume{display:flex;align-items:center;gap:3px;font-size:10px;color:#14532d;font-weight:700}
#audioBar input[type=range]{width:56px}
#ui{position:absolute;inset:0;pointer-events:none;z-index:8}
#ui .panel{pointer-events:auto;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(92%,360px);background:rgba(15,23,42,.96);border:1px solid #334155;border-radius:16px;padding:16px 14px}
#ui h1{font-size:1.25rem;color:#fbbf24;margin-bottom:8px}
#ui p{font-size:.82rem;line-height:1.5;color:#94a3b8;margin-bottom:7px}
#ui .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#ui button{font:inherit;flex:1;min-width:100px;border:0;border-radius:999px;padding:10px 12px;background:#2563eb;color:#fff;cursor:pointer}
#ui button.ghost{background:#1e293b;border:1px solid #475569}
.hidden{display:none!important}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;padding:10px 14px;border-radius:12px;background:rgba(15,23,42,.92);border:1px solid #fbbf24;color:#fde68a;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="board"><canvas id="c"></canvas></div>
  <div id="panel">
    <div id="scores">
      <div class="scoreBox"><span class="lab">赢分</span><b id="winScore">0</b></div>
      <div class="scoreBox"><span class="lab">总分</span><b id="credits">100</b></div>
    </div>
    <div id="bets"></div>
    <div id="controls">
      <button type="button" id="btnGo">开始</button>
      <button type="button" id="btnMenu">菜单</button>
      <button type="button" id="btnTest" title="提高礼炮/火车出现率">测试特奖</button>
      <div class="action-row" id="audioBar"></div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="ui">
    <div class="panel" id="panelMenu">
      <h1>幸运水果机</h1>
      <p>点下方图案押分，再按「开始」跑灯。停在押中的图案上按倍率得分。</p>
      <p><b>礼炮</b>（左右中格）：随机打中 3 个结果结算。<b>火车</b>（另一侧中格）：8 灯同行，停下时 8 格都算中奖。</p>
      <p>图标为程序绘制的街机风格，不是系统表情。仅供娱乐，无真钱。</p>
      <div class="row">
        <button id="btnPlay">开始</button>
        <button class="ghost" id="btnReset">重置 100 分</button>
      </div>
    </div>
  </div>
</div>
<script src="../../js/game/game-audio.js?v=20"></script>
<script>
(function () {
'use strict';
const KEY = 'tbc_fruit_machine_v2';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const KINDS = [
  { id: 'bar', label: 'BAR', pay: 50 },
  { id: 'seven', label: '77', pay: 40 },
  { id: 'star', label: '星', pay: 30 },
  { id: 'melon', label: '瓜', pay: 20 },
  { id: 'bell', label: '铃', pay: 20 },
  { id: 'lemon', label: '柠', pay: 15 },
  { id: 'orange', label: '橙', pay: 10 },
  { id: 'apple', label: '苹', pay: 5 }
];

/**
 * 24 格环：上7 + 右5 + 下7 + 左5
 * 右中 = index 9，左中 = index 21 → 礼炮 / 火车
 */
const RING = [
  'apple', 'orange', 'lemon', 'bell', 'melon', 'star', 'seven',
  'apple', 'bar', 'cannon', 'orange', 'lemon',
  'seven', 'star', 'melon', 'bell', 'lemon', 'orange', 'apple',
  'bar', 'seven', 'train', 'melon', 'star'
];

let W = 360, H = 360, dpr = 1;
let credits = 100;
let lastWin = 0;
let bets = Object.create(null);
KINDS.forEach(k => { bets[k.id] = 0; });
let cursor = 0;
let litSet = new Set(); // for train: multiple lights
let spinning = false;
let centerMsg = '0';
let testBoost = false; // 测试：抬高礼炮/火车概率
let animMode = 'single'; // single | train | cannon

function sfx(n) { try { GameAudio && GameAudio.sfx(n); } catch (e) {} }
function unlock() { try { GameAudio && GameAudio.unlock(); } catch (e) {} }

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (typeof d.credits === 'number') credits = d.credits;
    testBoost = !!d.testBoost;
  } catch (e) {}
  document.getElementById('credits').textContent = credits;
  document.getElementById('winScore').textContent = lastWin;
  syncTestBtn();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ credits, testBoost })); } catch (e) {}
}
function syncTestBtn() {
  const b = document.getElementById('btnTest');
  b.classList.toggle('on', testBoost);
  b.textContent = testBoost ? '测试中·高特奖' : '测试特奖';
}

function kindMeta(id) {
  if (id === 'cannon') return { id: 'cannon', label: '礼炮', pay: 0 };
  if (id === 'train') return { id: 'train', label: '火车', pay: 0 };
  return KINDS.find(k => k.id === id);
}

function totalBet() {
  return KINDS.reduce((s, k) => s + (bets[k.id] || 0), 0);
}

function resize() {
  const box = document.getElementById('board').getBoundingClientRect();
  dpr = Math.min(2, devicePixelRatio || 1);
  W = Math.max(240, box.width);
  H = Math.max(240, box.height);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { resize(); draw(); });

function cellRect(i) {
  const cols = 7, rows = 7, pad = 5;
  const cw = (W - pad * 2) / cols;
  const ch = (H - pad * 2) / rows;
  const map = [];
  for (let x = 0; x < cols; x++) map.push({ c: x, r: 0 });
  for (let y = 1; y < rows - 1; y++) map.push({ c: cols - 1, r: y });
  for (let x = cols - 1; x >= 0; x--) map.push({ c: x, r: rows - 1 });
  for (let y = rows - 2; y >= 1; y--) map.push({ c: 0, r: y });
  const m = map[i % 24];
  return { x: pad + m.c * cw, y: pad + m.r * ch, w: cw, h: ch };
}

/** 程序化街机图标（非 emoji） */
function drawIcon(c, kind, x, y, s) {
  c.save();
  c.translate(x, y);
  const r = s * 0.42;
  if (kind === 'apple') {
    c.fillStyle = '#dc2626';
    c.beginPath(); c.ellipse(0, 2, r * 0.9, r, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#16a34a';
    c.fillRect(-2, -r - 2, 3, 7);
    c.beginPath(); c.ellipse(5, -r, 5, 3, 0.5, 0, Math.PI * 2); c.fill();
  } else if (kind === 'orange') {
    c.fillStyle = '#ea580c';
    c.beginPath(); c.arc(0, 1, r * 0.95, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#c2410c'; c.lineWidth = 1;
    c.beginPath(); c.arc(0, 1, r * 0.55, 0.2, 1.2); c.stroke();
  } else if (kind === 'lemon') {
    c.fillStyle = '#eab308';
    c.beginPath(); c.ellipse(0, 1, r * 1.05, r * 0.7, 0.4, 0, Math.PI * 2); c.fill();
  } else if (kind === 'melon') {
    c.fillStyle = '#16a34a';
    c.beginPath(); c.arc(0, 2, r, Math.PI * 1.05, Math.PI * 1.95); c.fill();
    c.fillStyle = '#f87171';
    c.beginPath(); c.arc(0, 2, r * 0.72, Math.PI * 1.1, Math.PI * 1.9); c.fill();
    c.fillStyle = '#fff';
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.arc(i * 4, 4, 1.2, 0, Math.PI * 2); c.fill(); }
  } else if (kind === 'bell') {
    c.fillStyle = '#facc15';
    c.beginPath();
    c.moveTo(-r * 0.7, -2); c.quadraticCurveTo(0, -r - 2, r * 0.7, -2);
    c.lineTo(r * 0.85, r * 0.55); c.lineTo(-r * 0.85, r * 0.55); c.closePath(); c.fill();
    c.fillStyle = '#f59e0b';
    c.beginPath(); c.arc(0, r * 0.7, 3, 0, Math.PI * 2); c.fill();
  } else if (kind === 'star') {
    c.fillStyle = '#fbbf24';
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      const a2 = a + Math.PI / 5;
      c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      c.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
    }
    c.closePath(); c.fill();
  } else if (kind === 'seven') {
    c.fillStyle = '#ef4444';
    roundPath(c, -r, -r * 0.7, r * 2, r * 1.4, 4); c.fill();
    c.fillStyle = '#fff';
    c.font = 'bold ' + Math.max(10, s * 0.55) + 'px system-ui';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('77', 0, 1);
  } else if (kind === 'bar') {
    c.fillStyle = '#1e293b';
    roundPath(c, -r * 1.05, -r * 0.55, r * 2.1, r * 1.1, 3); c.fill();
    c.fillStyle = '#f8fafc';
    c.font = 'bold ' + Math.max(9, s * 0.38) + 'px system-ui';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('BAR', 0, 1);
  } else if (kind === 'cannon') {
    c.fillStyle = '#7c3aed';
    roundPath(c, -r, -r * 0.75, r * 2, r * 1.5, 5); c.fill();
    c.fillStyle = '#fde68a';
    c.font = 'bold ' + Math.max(9, s * 0.32) + 'px system-ui';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('礼炮', 0, 1);
  } else if (kind === 'train') {
    c.fillStyle = '#0369a1';
    roundPath(c, -r, -r * 0.75, r * 2, r * 1.5, 5); c.fill();
    c.fillStyle = '#e0f2fe';
    c.font = 'bold ' + Math.max(9, s * 0.32) + 'px system-ui';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('火车', 0, 1);
  }
  c.restore();
}

function roundPath(c, x, y, w, h, rad) {
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}

function drawCell(i, lit) {
  const kind = RING[i];
  const r = cellRect(i);
  const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
  if (kind === 'cannon') {
    g.addColorStop(0, lit ? '#c4b5fd' : '#5b21b6');
    g.addColorStop(1, lit ? '#8b5cf6' : '#3b0764');
  } else if (kind === 'train') {
    g.addColorStop(0, lit ? '#7dd3fc' : '#0369a1');
    g.addColorStop(1, lit ? '#38bdf8' : '#0c4a6e');
  } else {
    g.addColorStop(0, lit ? '#fef3c7' : '#1e293b');
    g.addColorStop(1, lit ? '#fde68a' : '#0f172a');
  }
  ctx.fillStyle = g;
  ctx.strokeStyle = lit ? '#fbbf24' : '#334155';
  ctx.lineWidth = lit ? 2.5 : 1;
  roundPath(ctx, r.x + 2, r.y + 2, r.w - 4, r.h - 4, 7);
  ctx.fill(); ctx.stroke();
  drawIcon(ctx, kind, r.x + r.w / 2, r.y + r.h / 2, Math.min(r.w, r.h) * 0.78);
}

function draw() {
  ctx.fillStyle = '#7f1d1d';
  ctx.fillRect(0, 0, W, H);
  const inner = { x: W * 0.155, y: H * 0.155, w: W * 0.69, h: H * 0.69 };
  const pat = ctx.createLinearGradient(0, 0, W, H);
  pat.addColorStop(0, '#b91c1c'); pat.addColorStop(1, '#450a0a');
  ctx.fillStyle = pat;
  roundPath(ctx, inner.x, inner.y, inner.w, inner.h, 10);
  ctx.fill();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold ' + Math.max(20, W * 0.07) + 'px "Segoe UI","PingFang SC",sans-serif';
  ctx.fillText('幸运水果机', W / 2, H * 0.36);
  // 小图标装饰（程序绘制）
  drawIcon(ctx, 'apple', W * 0.38, H * 0.46, 28);
  drawIcon(ctx, 'lemon', W * 0.62, H * 0.46, 28);

  const dw = W * 0.3, dh = H * 0.1;
  ctx.fillStyle = '#020617';
  roundPath(ctx, W / 2 - dw / 2, H * 0.55, dw, dh, 6);
  ctx.fill();
  ctx.strokeStyle = '#475569'; ctx.stroke();
  ctx.fillStyle = '#f87171';
  ctx.font = 'bold ' + Math.max(15, dh * 0.5) + 'px ui-monospace,monospace';
  ctx.fillText(String(centerMsg), W / 2, H * 0.55 + dh / 2);

  for (let i = 0; i < 24; i++) {
    const lit = litSet.has(i) || (animMode === 'single' && i === cursor && litSet.size === 0);
    drawCell(i, lit || i === cursor);
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function paintBetIcon(cv, kind) {
  const c = cv.getContext('2d');
  const s = 26;
  cv.width = s * 2; cv.height = s * 2;
  c.setTransform(2, 0, 0, 2, 0, 0);
  c.clearRect(0, 0, s, s);
  drawIcon(c, kind, s / 2, s / 2, s * 0.95);
}

function renderBets() {
  const box = document.getElementById('bets');
  box.innerHTML = '';
  KINDS.forEach(k => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'bet' + (bets[k.id] > 0 ? ' on' : '');
    const cv = document.createElement('canvas');
    paintBetIcon(cv, k.id);
    b.innerHTML = '<span class="stake">' + (bets[k.id] || 0) + '</span>';
    b.appendChild(cv);
    const pay = document.createElement('span');
    pay.className = 'pay';
    pay.textContent = String(k.pay);
    b.appendChild(pay);
    b.onclick = () => {
      unlock();
      if (spinning) return;
      if (credits <= 0) { toast('分数不足'); sfx('invalid'); return; }
      credits--;
      bets[k.id]++;
      document.getElementById('credits').textContent = credits;
      save();
      sfx('click');
      renderBets();
    };
    box.appendChild(b);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function payoutForKinds(kindIds) {
  let win = 0;
  const hit = [];
  kindIds.forEach(id => {
    if (id === 'cannon' || id === 'train') return;
    const stake = bets[id] || 0;
    if (stake > 0) {
      const add = stake * kindMeta(id).pay;
      win += add;
      hit.push(id);
    }
  });
  return { win, hit };
}

function pickStopIndex() {
  const weights = RING.map(kind => {
    if (kind === 'cannon' || kind === 'train') return testBoost ? 4.5 : 0.55;
    const k = kindMeta(kind);
    return 1.15 + (55 - k.pay) / 55;
  });
  let sum = weights.reduce((a, b) => a + b, 0);
  let roll = Math.random() * sum;
  for (let i = 0; i < weights.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return i;
  }
  return 0;
}

async function animateSingle(stop) {
  animMode = 'single';
  litSet = new Set();
  const laps = 2 + ((Math.random() * 2) | 0);
  const total = laps * 24 + ((stop - cursor + 24) % 24);
  for (let s = 0; s < total; s++) {
    cursor = (cursor + 1) % 24;
    litSet = new Set([cursor]);
    draw();
    if (s % 2 === 0) sfx('move');
    const t = 26 + Math.floor(s / total * 80) + (s > total - 10 ? (s - (total - 10)) * 28 : 0);
    await sleep(t);
  }
}

async function animateTrain(stopHead) {
  animMode = 'train';
  const LEN = 8;
  const laps = 2;
  const total = laps * 24 + ((stopHead - cursor + 24) % 24);
  for (let s = 0; s < total; s++) {
    cursor = (cursor + 1) % 24;
    litSet = new Set();
    for (let k = 0; k < LEN; k++) litSet.add((cursor - k + 24) % 24);
    draw();
    if (s % 2 === 0) sfx('move');
    const t = 30 + Math.floor(s / total * 70) + (s > total - 10 ? (s - (total - 10)) * 30 : 0);
    await sleep(t);
  }
  // final train positions: 8 cells ending at stopHead
  cursor = stopHead;
  litSet = new Set();
  for (let k = 0; k < LEN; k++) litSet.add((stopHead - k + 24) % 24);
  draw();
}

async function animateCannon(stop) {
  await animateSingle(stop);
  // flash 3 random fruit hits
  const fruitIdx = [];
  for (let i = 0; i < 24; i++) {
    if (RING[i] !== 'cannon' && RING[i] !== 'train') fruitIdx.push(i);
  }
  const picks = [];
  while (picks.length < 3 && fruitIdx.length) {
    const j = (Math.random() * fruitIdx.length) | 0;
    picks.push(fruitIdx.splice(j, 1)[0]);
  }
  for (let n = 0; n < 3; n++) {
    litSet = new Set([stop, ...picks.slice(0, n + 1)]);
    draw();
    sfx('power');
    await sleep(280);
  }
  return picks.map(i => RING[i]);
}

async function runSpin() {
  if (spinning) return;
  unlock();
  if (totalBet() <= 0) { toast('请先押分'); sfx('invalid'); return; }
  spinning = true;
  document.getElementById('btnGo').disabled = true;
  centerMsg = '…';
  lastWin = 0;
  document.getElementById('winScore').textContent = '0';
  sfx('start');

  const stop = pickStopIndex();
  const kind = RING[stop];
  let win = 0;
  let msg = '谢谢参与';

  if (kind === 'cannon') {
    const hitKinds = await animateCannon(stop);
    const res = payoutForKinds(hitKinds);
    win = res.win;
    msg = win > 0 ? ('礼炮打中 +' + win) : '礼炮未押中';
    sfx(win > 0 ? 'win' : 'lose');
  } else if (kind === 'train') {
    await animateTrain(stop);
    const kinds = [];
    for (let k = 0; k < 8; k++) kinds.push(RING[(stop - k + 24) % 24]);
    const res = payoutForKinds(kinds);
    win = res.win;
    msg = win > 0 ? ('火车经过 +' + win) : '火车未押中';
    sfx(win > 0 ? 'win' : 'lose');
  } else {
    await animateSingle(stop);
    const stake = bets[kind] || 0;
    if (stake > 0) {
      win = stake * kindMeta(kind).pay;
      msg = kindMeta(kind).label + ' 中奖 +' + win;
      sfx('win');
    } else {
      sfx('lose');
    }
  }

  credits += win;
  lastWin = win;
  centerMsg = win > 0 ? ('+' + win) : '0';
  document.getElementById('credits').textContent = credits;
  document.getElementById('winScore').textContent = lastWin;
  KINDS.forEach(k => { bets[k.id] = 0; });
  renderBets();
  save();
  toast(msg);
  spinning = false;
  document.getElementById('btnGo').disabled = false;
  if (credits <= 0) setTimeout(() => toast('分数用尽，可在菜单重置'), 1600);
}

function loop() { draw(); requestAnimationFrame(loop); }

document.getElementById('btnGo').onclick = () => runSpin();
document.getElementById('btnMenu').onclick = () => {
  document.getElementById('panelMenu').classList.remove('hidden');
};
document.getElementById('btnTest').onclick = () => {
  unlock();
  testBoost = !testBoost;
  syncTestBtn();
  save();
  toast(testBoost ? '测试开：礼炮/火车更常出现' : '测试关：特奖恢复低概率');
  sfx('swap');
};
document.getElementById('btnPlay').onclick = () => {
  unlock();
  document.getElementById('panelMenu').classList.add('hidden');
  sfx('place');
};
document.getElementById('btnReset').onclick = () => {
  unlock();
  credits = 100;
  lastWin = 0;
  KINDS.forEach(k => { bets[k.id] = 0; });
  centerMsg = '100';
  document.getElementById('credits').textContent = credits;
  document.getElementById('winScore').textContent = '0';
  renderBets();
  save();
  sfx('swap');
  toast('已重置为 100 分');
};

load();
renderBets();
resize();
if (window.GameAudio) GameAudio.boot('catchy');
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
