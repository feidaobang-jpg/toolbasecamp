<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>老虎机 · 斗兽棋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1e293b;color:#fff7ed;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;max-width:420px;margin:0 auto;background:linear-gradient(180deg,#334155,#1e293b);display:flex;flex-direction:column;padding:4px;gap:3px;justify-content:flex-start}
#topBar{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;min-height:24px}
#audioBar{display:flex;gap:4px;align-items:center}
#audioBar .tb-btn{font-size:11px;padding:4px 9px;border:0;border-radius:999px;background:#2563eb;color:#fff;cursor:pointer}
#audioBar .game-volume{display:flex;align-items:center;gap:3px;font-size:10px;color:#93c5fd}
#audioBar input[type=range]{width:56px}
#board{
  flex:0 0 auto;width:100%;height:auto;margin:0 auto;
  border-radius:12px;background:#0f172a;border:3px solid #64748b;
  box-shadow:inset 0 0 0 2px #1e293b,0 4px 12px rgba(0,0,0,.35);
  overflow:hidden;position:relative
}
canvas{display:block;width:100%;height:100%}
#mid{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:1px 0}
.act{border:0;cursor:pointer;font-weight:800;box-shadow:0 2px 0 #0004}
.act:active{transform:translateY(1px)}
.act:disabled{opacity:.4;cursor:not-allowed}
#btnAll{padding:5px 12px;border-radius:8px;font-size:12px;background:linear-gradient(180deg,#86efac,#16a34a);color:#052e16}
#btnClear{padding:5px 12px;border-radius:8px;font-size:12px;background:linear-gradient(180deg,#fb923c,#c2410c);color:#fff}
#panel{
  flex:0 0 auto;display:flex;gap:6px;padding:6px;
  border-radius:12px;border:2px solid #166534;
  background:
    repeating-linear-gradient(-45deg,transparent,transparent 7px,rgba(0,0,0,.06) 7px,rgba(0,0,0,.06) 14px),
    linear-gradient(180deg,#86efac,#4ade80 45%,#22c55e)
}
#betMain{flex:1 1 auto;min-width:0}
#bets{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,auto);gap:5px}
.bet{
  aspect-ratio:1;border:2px solid #334155;border-radius:10px;padding:3px;cursor:pointer;min-width:0;
  background:linear-gradient(180deg,#1e293b,#0f172a);display:flex;flex-direction:column;gap:2px;
  box-shadow:0 2px 0 #14532d
}
.bet.on{border-color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.4),0 2px 0 #14532d}
.bet .scoreLayer{
  flex:0 0 auto;background:#020617;border-radius:5px;padding:2px 0;
  color:#facc15;font-size:13px;font-weight:800;font-family:ui-monospace,Consolas,monospace;
  text-align:center;line-height:1.1;border:1px solid #475569
}
.bet .icoLayer{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;border-radius:6px
}
.bet .emo{
  font-size:28px;line-height:1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 1px 1px #0008);font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif
}
.bet .pay{font-size:10px;font-weight:800;color:#fde047;line-height:1}
#side{flex:0 0 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#scoreBox{width:100%;background:#0f172a;border:2px solid #334155;border-radius:8px;padding:4px 2px;text-align:center}
#scoreBox .lab{font-size:11px;color:#94a3b8;font-weight:700}
#scoreBox b{display:block;font-size:18px;color:#f8fafc;font-variant-numeric:tabular-nums;line-height:1.15}
#btnGo{
  width:58px;height:58px;border-radius:50%;border:3px solid #fdba74;cursor:pointer;font-weight:900;font-size:18px;color:#fff;
  background:radial-gradient(circle at 35% 28%,#fb923c,#ea580c 55%,#c2410c);
  box-shadow:0 3px 0 #9a3412,0 0 10px rgba(234,88,12,.35)
}
#btnGo:disabled{opacity:.45;cursor:not-allowed}
#foot{flex:0 0 auto;display:flex;gap:6px;align-items:center}
#btnTest{border:0;border-radius:999px;padding:4px 9px;background:#1e3a8a;color:#fff;font-size:10px;font-weight:700;cursor:pointer}
#btnTest.on{background:#b45309}
#btnReset{border:0;border-radius:999px;padding:4px 9px;background:#44403c;color:#fde68a;font-size:10px;font-weight:700;cursor:pointer}
#toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;padding:10px 14px;border-radius:12px;background:rgba(15,23,42,.92);border:1px solid #fbbf24;color:#fde68a;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="topBar"><div class="action-row" id="audioBar"></div></div>
  <div id="board"><canvas id="c"></canvas></div>
  <div id="mid">
    <button type="button" class="act" id="btnAll" title="全+1">×1</button>
    <button type="button" class="act" id="btnClear" title="清空押分">清空</button>
  </div>
  <div id="panel">
    <div id="betMain"><div id="bets"></div></div>
    <div id="side">
      <div id="scoreBox"><div class="lab">总分</div><b id="credits">100</b></div>
      <button type="button" id="btnGo" title="开始">GO</button>
    </div>
  </div>
  <div id="foot">
    <button type="button" id="btnTest">测试特奖</button>
    <button type="button" id="btnReset">重置 100 分</button>
  </div>
  <div id="toast"></div>
</div>
<script src="../../js/game/game-audio.js?v=minimax1"></script>
<script>
(function () {
'use strict';
const KEY = 'tbc_tiger_slots_v2';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/** 斗兽棋：象 1 大 1 小(底中)；狮虎豹狼狗猫各 1 大 2 小；鼠大10/小2 */
const KINDS = [
  { id: 'elephant', emoji: '🐘', label: '象', payBig: 100, paySmall: 50 },
  { id: 'lion',     emoji: '🦁', label: '狮', payBig: 20,  paySmall: 2 },
  { id: 'tiger',    emoji: '🐯', label: '虎', payBig: 20,  paySmall: 2 },
  { id: 'leopard',  emoji: '🐆', label: '豹', payBig: 20,  paySmall: 2 },
  { id: 'wolf',     emoji: '🐺', label: '狼', payBig: 10,  paySmall: 2 },
  { id: 'dog',      emoji: '🐶', label: '狗', payBig: 10,  paySmall: 2 },
  { id: 'cat',      emoji: '🐱', label: '猫', payBig: 10,  paySmall: 2 },
  { id: 'rat',      emoji: '🐭', label: '鼠', payBig: 10,  paySmall: 2 }
];

const EMOJI = {
  elephant: '🐘', lion: '🦁', tiger: '🐯', leopard: '🐆',
  wolf: '🐺', dog: '🐶', cat: '🐱', rat: '🐭',
  gift: '🎁', train: '🚂'
};

/** 顶中大象、底中小象；左上小鼠；左中礼包、右中火车；同种大小不相邻 */
function C(a, big) { return { a: a, big: !!big }; }
const RING = [
  C('rat', false), C('lion', false), C('rat', true), C('elephant', true), C('tiger', false), C('wolf', true), C('leopard', false),
  C('dog', true), C('cat', false), C('train', true), C('lion', true), C('tiger', false),
  C('wolf', false), C('leopard', true), C('dog', false), C('elephant', false), C('cat', true), C('lion', false), C('tiger', true),
  C('wolf', false), C('leopard', false), C('gift', true), C('dog', false), C('cat', false)
];
let W = 360, H = 360, dpr = 1;
let credits = 100;
let lastWin = 0;
let bets = Object.create(null);
let lastBets = Object.create(null);
KINDS.forEach(k => { bets[k.id] = 0; lastBets[k.id] = 0; });
let cursor = 0;
let litSet = new Set();
let spinning = false;
let centerMsg = '0';
let testBoost = false;
let focusBet = 0;

function sfx(n) { try { GameAudio && GameAudio.sfx(n); } catch (e) {} }
function unlock() { try { GameAudio && GameAudio.unlock(); } catch (e) {} }

function hud() {
  const el = document.getElementById('credits');
  if (el) el.textContent = credits;
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (typeof d.credits === 'number') credits = d.credits;
    testBoost = !!d.testBoost;
    if (d.lastBets) KINDS.forEach(k => { lastBets[k.id] = d.lastBets[k.id] | 0; });
  } catch (e) {}
  hud();
  syncTestBtn();
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ credits, testBoost, lastBets: Object.assign({}, lastBets) }));
  } catch (e) {}
}
function syncTestBtn() {
  const b = document.getElementById('btnTest');
  b.classList.toggle('on', testBoost);
  b.textContent = testBoost ? '测试中·高特奖' : '测试特奖';
}

function kindMeta(id) { return KINDS.find(k => k.id === id); }
function isSpecial(cell) { return cell.a === 'gift' || cell.a === 'train'; }

function cellPay(cell) {
  if (isSpecial(cell)) return 0;
  const k = kindMeta(cell.a);
  if (!k) return 0;
  return cell.big ? k.payBig : k.paySmall;
}

function totalBet() { return KINDS.reduce((s, k) => s + (bets[k.id] || 0), 0); }
function totalOf(map) { return KINDS.reduce((s, k) => s + (map[k.id] || 0), 0); }

function resize() {
  const board = document.getElementById('board');
  const wrap = document.getElementById('wrap');
  const used =
    document.getElementById('topBar').offsetHeight +
    document.getElementById('mid').offsetHeight +
    document.getElementById('panel').offsetHeight +
    document.getElementById('foot').offsetHeight +
    20;
  const availW = Math.max(160, wrap.clientWidth - 8);
  const availH = Math.max(160, wrap.clientHeight - used);
  // 正方形铺满可用区，格子顶满画布无上下黑边
  const side = Math.floor(Math.min(availW, availH) / 7) * 7;
  board.style.width = side + 'px';
  board.style.height = side + 'px';
  dpr = Math.min(2, devicePixelRatio || 1);
  W = side;
  H = side;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { resize(); draw(); });

function cellRect(i) {
  const cols = 7, rows = 7;
  const size = Math.floor(Math.min(W, H) / cols);
  const gridW = size * cols, gridH = size * rows;
  const ox = 0, oy = 0;
  const map = [];
  for (let x = 0; x < cols; x++) map.push({ c: x, r: 0 });
  for (let y = 1; y < rows - 1; y++) map.push({ c: cols - 1, r: y });
  for (let x = cols - 1; x >= 0; x--) map.push({ c: x, r: rows - 1 });
  for (let y = rows - 2; y >= 1; y--) map.push({ c: 0, r: y });
  const m = map[i % 24];
  return { x: ox + m.c * size, y: oy + m.r * size, w: size, h: size, ox, oy, size, gridW, gridH };
}

function roundPath(c, x, y, w, h, rad) {
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}

function drawEmoji(c, animal, x, y, s, big) {
  const e = EMOJI[animal] || '❓';
  // 同档位统一尺寸：大格一致、小格一致；全身表情略缩以对齐脸部
  const tier = big ? 0.78 : 0.52;
  const optical = { elephant: 0.88, leopard: 0.9, train: 0.88, gift: 0.9 }[animal] || 1;
  const px = Math.max(12, Math.floor(s * tier * optical));
  c.save();
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.font = px + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  c.fillText(e, x, y);
  c.restore();
}

function drawCell(i, lit) {
  const cell = RING[i];
  const r = cellRect(i);
  const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
  if (cell.a === 'gift') { g.addColorStop(0, lit ? '#fde68a' : '#a16207'); g.addColorStop(1, lit ? '#fbbf24' : '#78350f'); }
  else if (cell.a === 'train') { g.addColorStop(0, lit ? '#7dd3fc' : '#0369a1'); g.addColorStop(1, lit ? '#38bdf8' : '#0c4a6e'); }
  else { g.addColorStop(0, lit ? '#fffbeb' : '#f8fafc'); g.addColorStop(1, lit ? '#fde68a' : '#e2e8f0'); }
  ctx.fillStyle = g;
  ctx.strokeStyle = lit ? '#facc15' : '#94a3b8';
  ctx.lineWidth = lit ? 3 : 1.5;
  const inset = 2;
  roundPath(ctx, r.x + inset, r.y + inset, r.w - inset * 2, r.h - inset * 2, Math.min(8, r.w * 0.18));
  ctx.fill(); ctx.stroke();
  if (lit) {
    ctx.strokeStyle = 'rgba(250,204,21,.95)';
    ctx.lineWidth = 3.5;
    roundPath(ctx, r.x + 1, r.y + 1, r.w - 2, r.h - 2, Math.min(9, r.w * 0.2));
    ctx.stroke();
  }

  if (isSpecial(cell)) {
    drawEmoji(ctx, cell.a, r.x + r.w / 2, r.y + r.h / 2, r.w, true);
  } else {
    drawEmoji(ctx, cell.a, r.x + r.w / 2, r.y + r.h / 2, r.w, !!cell.big);
  }
}

function drawSunburst(cx, cy, R) {
  const rays = 28;
  for (let i = 0; i < rays; i++) {
    const a0 = (i / rays) * Math.PI * 2;
    const a1 = ((i + 0.5) / rays) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? '#1e3a5f' : '#0ea5e9';
    ctx.globalAlpha = 0.35;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  const r0 = cellRect(0);
  const cx = r0.ox + r0.gridW / 2;
  const cy = r0.oy + r0.gridH / 2;
  const innerPad = r0.size * 0.12;
  const ix = r0.ox + r0.size + innerPad;
  const iy = r0.oy + r0.size + innerPad;
  const iw = r0.gridW - r0.size * 2 - innerPad * 2;
  const ih = r0.gridH - r0.size * 2 - innerPad * 2;

  roundPath(ctx, ix, iy, iw, ih, 10);
  ctx.save();
  ctx.clip();
  drawSunburst(cx, cy, Math.max(iw, ih) * 0.75);
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#facc15';
  ctx.font = 'bold ' + Math.max(16, r0.size * 0.4) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('老虎机', cx, cy - r0.size * 0.5);
  ctx.font = Math.max(16, r0.size * 0.5) + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
  ctx.fillText('🐘🦁🐯', cx, cy - r0.size * 0.02);

  const dw = Math.min(iw * 0.4, r0.size * 2.1), dh = r0.size * 0.68;
  ctx.fillStyle = '#020617';
  roundPath(ctx, cx - dw / 2, cy + r0.size * 0.42, dw, dh, 6); ctx.fill();
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold ' + Math.max(15, dh * 0.55) + 'px ui-monospace,Consolas,monospace';
  ctx.fillText(String(centerMsg), cx, cy + r0.size * 0.42 + dh / 2);

  for (let i = 0; i < 24; i++) {
    drawCell(i, litSet.has(i) || i === cursor);
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1700);
}

function payLabel(k) {
  return k.payBig + '/' + k.paySmall;
}

function renderBets() {
  const box = document.getElementById('bets');
  box.innerHTML = '';
  KINDS.forEach((k, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'bet' + (bets[k.id] > 0 ? ' on' : '');
    b.innerHTML =
      '<span class="scoreLayer">' + (bets[k.id] || 0) + '</span>' +
      '<span class="icoLayer"><span class="emo">' + k.emoji + '</span><span class="pay">' + payLabel(k) + '</span></span>';
    b.onclick = () => { focusBet = idx; addBet(k.id, 1); };
    box.appendChild(b);
  });
}

function addBet(id, n) {
  unlock();
  if (spinning) return;
  for (let i = 0; i < n; i++) {
    if (credits <= 0) { toast('分数不足'); sfx('invalid'); break; }
    credits--;
    bets[id]++;
  }
  hud(); save(); sfx('click'); renderBets();
}

function clearBets() {
  unlock();
  if (spinning) return;
  const back = totalBet();
  if (back <= 0) { toast('没有押分'); sfx('invalid'); return; }
  credits += back;
  KINDS.forEach(k => { bets[k.id] = 0; });
  hud(); renderBets(); save(); sfx('swap'); toast('已清空押分 +' + back);
}

function ensureBetsForSpin() {
  if (totalBet() > 0) return true;
  const need = totalOf(lastBets);
  if (need <= 0) { toast('请先押分'); sfx('invalid'); return false; }
  if (credits < need) { toast('分数不足，无法沿用上次押分'); sfx('invalid'); return false; }
  credits -= need;
  KINDS.forEach(k => { bets[k.id] = lastBets[k.id] | 0; });
  hud(); renderBets();
  toast('沿用上次押分 −' + need);
  return true;
}

function snapshotLastBets() {
  KINDS.forEach(k => { lastBets[k.id] = bets[k.id] | 0; });
  save();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function payoutCells(indices) {
  let win = 0;
  indices.forEach(i => {
    const cell = RING[i];
    if (isSpecial(cell)) return;
    const stake = bets[cell.a] || 0;
    if (stake > 0) win += stake * cellPay(cell);
  });
  return win;
}

function pickStopIndex() {
  const weights = RING.map(cell => {
    if (isSpecial(cell)) return testBoost ? 4.5 : 0.5;
    const pay = cellPay(cell);
    return 1.05 + (110 - Math.min(pay, 100)) / 110;
  });
  let sum = weights.reduce((a, b) => a + b, 0), roll = Math.random() * sum;
  for (let i = 0; i < weights.length; i++) { roll -= weights[i]; if (roll <= 0) return i; }
  return 0;
}

async function animateSingle(stop) {
  litSet = new Set();
  const laps = 2 + ((Math.random() * 2) | 0);
  const total = laps * 24 + ((stop - cursor + 24) % 24);
  for (let s = 0; s < total; s++) {
    cursor = (cursor + 1) % 24;
    litSet = new Set([cursor]);
    draw();
    if (s % 2 === 0) sfx('move');
    await sleep(26 + Math.floor(s / total * 80) + (s > total - 10 ? (s - (total - 10)) * 28 : 0));
  }
}

async function animateTrain(stopHead) {
  const LEN = 8, laps = 2;
  const total = laps * 24 + ((stopHead - cursor + 24) % 24);
  sfx('train');
  for (let s = 0; s < total; s++) {
    cursor = (cursor + 1) % 24;
    litSet = new Set();
    for (let k = 0; k < LEN; k++) litSet.add((cursor - k + 24) % 24);
    draw();
    if (s % 2 === 0) sfx('trainChug');
    await sleep(30 + Math.floor(s / total * 70) + (s > total - 10 ? (s - (total - 10)) * 30 : 0));
  }
  cursor = stopHead;
  litSet = new Set();
  for (let k = 0; k < LEN; k++) litSet.add((stopHead - k + 24) % 24);
  draw();
  sfx('train');
}

async function animateCannon(stop) {
  await animateSingle(stop);
  sfx('gift');
  const animalIdx = [];
  for (let i = 0; i < 24; i++) if (!isSpecial(RING[i])) animalIdx.push(i);
  const picks = [];
  while (picks.length < 3 && animalIdx.length) {
    const j = (Math.random() * animalIdx.length) | 0;
    picks.push(animalIdx.splice(j, 1)[0]);
  }
  for (let n = 0; n < 3; n++) {
    litSet = new Set([stop, ...picks.slice(0, n + 1)]);
    draw(); sfx('giftPop'); await sleep(280);
  }
  return picks;
}

async function runSpin() {
  if (spinning) return;
  unlock();
  if (!ensureBetsForSpin()) return;

  spinning = true;
  document.getElementById('btnGo').disabled = true;
  centerMsg = '…';
  lastWin = 0; hud();
  snapshotLastBets();
  sfx('start');

  const stop = pickStopIndex();
  const cell = RING[stop];
  let win = 0, msg = '谢谢参与';

  if (cell.a === 'gift') {
    const picks = await animateCannon(stop);
    win = payoutCells(picks);
    msg = win > 0 ? ('礼包打中 +' + win) : '礼包未押中';
    if (win > 0) sfx('gift');
    else sfx('lose');
  } else if (cell.a === 'train') {
    await animateTrain(stop);
    const idxs = [];
    for (let k = 0; k < 8; k++) idxs.push((stop - k + 24) % 24);
    win = payoutCells(idxs);
    msg = win > 0 ? ('火车经过 +' + win) : '火车未押中';
    if (win > 0) sfx('train');
    else sfx('lose');
  } else {
    await animateSingle(stop);
    const stake = bets[cell.a] || 0;
    const pay = cellPay(cell);
    if (stake > 0) {
      win = stake * pay;
      const sizeTag = cell.big ? '大' : '小';
      msg = EMOJI[cell.a] + sizeTag + kindMeta(cell.a).label + ' +' + win;
      sfx('win');
    } else sfx('lose');
  }

  credits += win;
  lastWin = win;
  centerMsg = win > 0 ? String(Math.min(99, win)) : '0';
  KINDS.forEach(k => { bets[k.id] = 0; });
  renderBets();
  hud(); save();
  toast(msg);
  spinning = false;
  document.getElementById('btnGo').disabled = false;
  if (credits <= 0) setTimeout(() => toast('分数用尽，可点重置'), 1600);
}

function loop() { draw(); requestAnimationFrame(loop); }

document.getElementById('btnGo').onclick = () => runSpin();
document.getElementById('btnAll').onclick = () => {
  unlock();
  if (spinning) return;
  let added = 0;
  KINDS.forEach(k => {
    if (credits > 0) { credits--; bets[k.id]++; added++; }
  });
  if (!added) toast('分数不足');
  else { sfx('click'); toast('全押 +1'); }
  hud(); renderBets(); save();
};
document.getElementById('btnClear').onclick = () => clearBets();
document.getElementById('btnTest').onclick = () => {
  unlock(); testBoost = !testBoost; syncTestBtn(); save();
  toast(testBoost ? '测试开：礼包/火车更常出现' : '测试关：特奖恢复低概率'); sfx('swap');
};
document.getElementById('btnReset').onclick = () => {
  unlock();
  if (spinning) return;
  credits = 100; lastWin = 0;
  KINDS.forEach(k => { bets[k.id] = 0; lastBets[k.id] = 0; });
  centerMsg = '0';
  hud(); renderBets(); save(); sfx('swap'); toast('已重置为 100 分');
};

load();
renderBets();
resize();
requestAnimationFrame(() => { resize(); draw(); });
if (window.GameAudio) GameAudio.boot('catchy');
window.__tbThumbAutoStart = function () {
  KINDS.forEach(function (k) { bets[k.id] = 1; });
  credits = 100;
  cursor = 4;
  litSet = new Set([2, 3, 4, 5, 6, 7, 8, 9]);
  centerMsg = '66';
  hud();
  renderBets();
  draw();
};
requestAnimationFrame(loop);
})();
</script>
<script src="../../js/game/thumb-preview.js"></script>
