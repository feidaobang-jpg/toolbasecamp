<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>老虎机 · Animal Slots</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1e293b;color:#fff7ed;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;max-width:420px;margin:0 auto;background:linear-gradient(180deg,#334155,#1e293b);display:flex;flex-direction:column;padding:6px;gap:5px}
#topBar{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;gap:6px;min-height:28px}
#audioBar{display:flex;gap:4px;align-items:center}
#audioBar .tb-btn{font-size:11px;padding:5px 10px;border:0;border-radius:999px;background:#2563eb;color:#fff;cursor:pointer}
#audioBar .game-volume{display:flex;align-items:center;gap:3px;font-size:10px;color:#93c5fd}
#audioBar input[type=range]{width:64px}
#board{
  flex:0 0 auto;width:100%;aspect-ratio:1 / 1;max-height:min(52vh,420px);
  border-radius:14px;background:#0f172a;border:3px solid #64748b;
  box-shadow:inset 0 0 0 2px #1e293b,0 4px 14px rgba(0,0,0,.35);
  overflow:hidden;position:relative;margin:0 auto
}
canvas{display:block;width:100%;height:100%}
#mid{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 0
}
.act{border:0;cursor:pointer;font-weight:800;box-shadow:0 2px 0 #0004}
.act:active{transform:translateY(1px)}
.act:disabled{opacity:.4;cursor:not-allowed}
#btnAll{padding:6px 12px;border-radius:8px;font-size:12px;background:linear-gradient(180deg,#86efac,#16a34a);color:#052e16}
#btnSmall,#btnBig{width:36px;height:36px;border-radius:50%;font-size:13px;background:#fff;color:#111;border:2px solid #e2e8f0}
#btnPrev,#btnNext{width:34px;height:34px;border-radius:8px;font-size:14px;background:#facc15;color:#422006}
#panel{
  flex:1 1 auto;min-height:0;display:flex;gap:8px;padding:10px 8px;
  border-radius:14px;border:2px solid #166534;
  background:
    repeating-linear-gradient(-45deg,transparent,transparent 8px,rgba(0,0,0,.06) 8px,rgba(0,0,0,.06) 16px),
    linear-gradient(180deg,#86efac,#4ade80 40%,#22c55e);
  box-shadow:inset 0 1px 0 #bbf7d0
}
#betMain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#bets{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:8px;flex:1;min-height:0}
.bet{
  border:2px solid #334155;border-radius:12px;padding:4px 4px 5px;cursor:pointer;min-width:0;min-height:0;
  background:linear-gradient(180deg,#1e293b,#0f172a);display:flex;flex-direction:column;gap:3px;
  box-shadow:0 2px 0 #14532d
}
.bet.on{border-color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.45),0 2px 0 #14532d}
/* 第1层：押分 */
.bet .scoreLayer{
  flex:0 0 auto;background:#020617;border-radius:6px;padding:3px 0;
  color:#facc15;font-size:15px;font-weight:800;font-family:ui-monospace,Consolas,monospace;
  text-align:center;line-height:1.15;border:1px solid #475569
}
/* 第2层：大图标 + 赔率 */
.bet .icoLayer{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;border-radius:8px;background:radial-gradient(circle at 40% 30%,#334155,#1e293b)
}
.bet .emo{font-size:clamp(28px,8vw,40px);line-height:1;filter:drop-shadow(0 2px 2px #0008)}
.bet .pay{font-size:12px;font-weight:800;color:#fde047;line-height:1}
#side{
  flex:0 0 88px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;padding:2px 0
}
#scoreBox{
  width:100%;background:#0f172a;border:2px solid #334155;border-radius:10px;padding:6px 4px;text-align:center
}
#scoreBox .lab{font-size:12px;color:#94a3b8;font-weight:700}
#scoreBox b{display:block;font-size:22px;color:#f8fafc;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
#btnGo{
  width:72px;height:72px;border-radius:50%;border:4px solid #fdba74;cursor:pointer;font-weight:900;font-size:22px;color:#fff;
  background:radial-gradient(circle at 35% 28%,#fb923c,#ea580c 55%,#c2410c);
  box-shadow:0 4px 0 #9a3412,0 0 14px rgba(234,88,12,.4)
}
#btnGo:disabled{opacity:.45;cursor:not-allowed}
#btnMenu{
  width:100%;border:0;border-radius:10px;padding:8px 6px;font-weight:800;font-size:13px;cursor:pointer;
  background:linear-gradient(180deg,#4ade80,#15803d);color:#052e16;box-shadow:0 2px 0 #14532d
}
#foot{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start}
#btnTest{border:0;border-radius:999px;padding:5px 10px;background:#1e3a8a;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
#btnTest.on{background:#b45309}
#ui{position:absolute;inset:0;pointer-events:none;z-index:8}
#ui .panel{pointer-events:auto;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(92%,360px);background:rgba(15,23,42,.96);border:1px solid #64748b;border-radius:16px;padding:16px 14px}
#ui h1{font-size:1.3rem;color:#fbbf24;margin-bottom:8px}
#ui p{font-size:.82rem;line-height:1.5;color:#94a3b8;margin-bottom:7px}
#ui .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#ui button{font:inherit;flex:1;min-width:100px;border:0;border-radius:999px;padding:10px 12px;background:#2563eb;color:#fff;cursor:pointer}
#ui button.ghost{background:#1e293b;border:1px solid #475569}
.hidden{display:none!important}
#toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;padding:10px 14px;border-radius:12px;background:rgba(15,23,42,.92);border:1px solid #fbbf24;color:#fde68a;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="topBar"><div class="action-row" id="audioBar"></div></div>
  <div id="board"><canvas id="c"></canvas></div>
  <div id="mid">
    <button type="button" class="act" id="btnAll" title="全+1">×1</button>
    <button type="button" class="act" id="btnPrev" aria-label="左">◀</button>
    <button type="button" class="act" id="btnNext" aria-label="右">▶</button>
    <button type="button" class="act" id="btnSmall">小</button>
    <button type="button" class="act" id="btnBig">大</button>
  </div>
  <div id="panel">
    <div id="betMain"><div id="bets"></div></div>
    <div id="side">
      <div id="scoreBox"><div class="lab">总分</div><b id="credits">100</b></div>
      <button type="button" id="btnGo" title="开始">GO</button>
      <button type="button" id="btnMenu">菜单</button>
    </div>
  </div>
  <div id="foot"><button type="button" id="btnTest">测试特奖</button></div>
  <div id="toast"></div>
  <div id="ui">
    <div class="panel" id="panelMenu">
      <h1>🐯 老虎机</h1>
      <p>点下方动物押分；「GO」会<strong>沿用上次押分</strong>（当前未押时）。「×1」各图案各加 1 分。</p>
      <p><b>礼炮 🎆</b>随机打中 3 格；<b>火车 🚂</b> 8 灯同行结算。中奖后可点「小/大」比倍。</p>
      <p>仅供娱乐，无真钱。</p>
      <div class="row">
        <button id="btnPlay">进入</button>
        <button class="ghost" id="btnReset">重置 100 分</button>
      </div>
    </div>
  </div>
</div>
<script src="../../js/game/game-audio.js?v=20"></script>
<script>
(function () {
'use strict';
const KEY = 'tbc_tiger_slots_v1';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/** 动物表情图案（赔率由高到低） */
const KINDS = [
  { id: 'panda',   emoji: '🐼', label: '熊猫', pay: 120 },
  { id: 'tiger',   emoji: '🐯', label: '老虎', pay: 40 },
  { id: 'leopard', emoji: '🐆', label: '豹子', pay: 30 },
  { id: 'lion',    emoji: '🦁', label: '狮子', pay: 20 },
  { id: 'chicken', emoji: '🐔', label: '小鸡', pay: 20 },
  { id: 'rabbit',  emoji: '🐰', label: '兔子', pay: 15 },
  { id: 'fox',     emoji: '🦊', label: '狐狸', pay: 10 },
  { id: 'mouse',   emoji: '🐭', label: '老鼠', pay: 5 }
];

const EMOJI = {
  panda: '🐼', tiger: '🐯', leopard: '🐆', lion: '🦁',
  chicken: '🐔', rabbit: '🐰', fox: '🦊', mouse: '🐭',
  cannon: '🎆', train: '🚂'
};

const RING = [
  'mouse', 'fox', 'rabbit', 'chicken', 'lion', 'leopard', 'tiger',
  'mouse', 'panda', 'cannon', 'fox', 'rabbit',
  'tiger', 'leopard', 'lion', 'chicken', 'rabbit', 'fox', 'mouse',
  'panda', 'tiger', 'train', 'lion', 'leopard'
];

let W = 360, H = 360, dpr = 1;
let credits = 100;
let lastWin = 0;
let bets = Object.create(null);
let lastBets = Object.create(null);
KINDS.forEach(k => { bets[k.id] = 0; lastBets[k.id] = 0; });
let cursor = 0;
let litSet = new Set();
let spinning = false;
let centerMsg = '20';
let testBoost = false;
let canDouble = false;
let focusBet = 0;

function sfx(n) { try { GameAudio && GameAudio.sfx(n); } catch (e) {} }
function unlock() { try { GameAudio && GameAudio.unlock(); } catch (e) {} }

function hud() {
  const el = document.getElementById('credits');
  if (el) el.textContent = credits;
  document.getElementById('btnSmall').disabled = spinning || !canDouble || lastWin <= 0;
  document.getElementById('btnBig').disabled = spinning || !canDouble || lastWin <= 0;
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (typeof d.credits === 'number') credits = d.credits;
    testBoost = !!d.testBoost;
    if (d.lastBets) KINDS.forEach(k => { lastBets[k.id] = d.lastBets[k.id] | 0; });
  } catch (e) {}
  hud();
  syncTestBtn();
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ credits, testBoost, lastBets: Object.assign({}, lastBets) }));
  } catch (e) {}
}
function syncTestBtn() {
  const b = document.getElementById('btnTest');
  b.classList.toggle('on', testBoost);
  b.textContent = testBoost ? '测试中·高特奖' : '测试特奖';
}

function kindMeta(id) {
  if (id === 'cannon') return { id: 'cannon', label: '礼炮', pay: 0, emoji: '🎆' };
  if (id === 'train') return { id: 'train', label: '火车', pay: 0, emoji: '🚂' };
  return KINDS.find(k => k.id === id);
}
function totalBet() { return KINDS.reduce((s, k) => s + (bets[k.id] || 0), 0); }
function totalOf(map) { return KINDS.reduce((s, k) => s + (map[k.id] || 0), 0); }

function resize() {
  const box = document.getElementById('board').getBoundingClientRect();
  dpr = Math.min(2, devicePixelRatio || 1);
  W = Math.max(240, box.width);
  H = Math.max(240, box.height);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { resize(); draw(); });

function cellRect(i) {
  const cols = 7, rows = 7, pad = 3;
  // 强制正方形格子：取宽高可用空间的较小边
  const size = Math.floor(Math.min((W - pad * 2) / cols, (H - pad * 2) / rows));
  const gridW = size * cols;
  const gridH = size * rows;
  const ox = Math.floor((W - gridW) / 2);
  const oy = Math.floor((H - gridH) / 2);
  const map = [];
  for (let x = 0; x < cols; x++) map.push({ c: x, r: 0 });
  for (let y = 1; y < rows - 1; y++) map.push({ c: cols - 1, r: y });
  for (let x = cols - 1; x >= 0; x--) map.push({ c: x, r: rows - 1 });
  for (let y = rows - 2; y >= 1; y--) map.push({ c: 0, r: y });
  const m = map[i % 24];
  return { x: ox + m.c * size, y: oy + m.r * size, w: size, h: size, ox, oy, size, gridW, gridH };
}

function roundPath(c, x, y, w, h, rad) {
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}

function drawEmoji(c, kind, x, y, s) {
  const e = EMOJI[kind] || '❓';
  c.save();
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.font = Math.max(12, Math.floor(s * 0.78)) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  c.fillText(e, x, y + 1);
  c.restore();
}

function drawCell(i, lit) {
  const kind = RING[i];
  const r = cellRect(i);
  const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
  if (kind === 'cannon') { g.addColorStop(0, lit ? '#fde68a' : '#a16207'); g.addColorStop(1, lit ? '#fbbf24' : '#78350f'); }
  else if (kind === 'train') { g.addColorStop(0, lit ? '#7dd3fc' : '#0369a1'); g.addColorStop(1, lit ? '#38bdf8' : '#0c4a6e'); }
  else { g.addColorStop(0, lit ? '#fffbeb' : '#f8fafc'); g.addColorStop(1, lit ? '#fde68a' : '#e2e8f0'); }
  ctx.fillStyle = g;
  ctx.strokeStyle = lit ? '#facc15' : '#94a3b8';
  ctx.lineWidth = lit ? 3 : 1.5;
  // 正方形圆角格
  const inset = 2;
  roundPath(ctx, r.x + inset, r.y + inset, r.w - inset * 2, r.h - inset * 2, Math.min(8, r.w * 0.18));
  ctx.fill(); ctx.stroke();
  if (lit) {
    ctx.strokeStyle = 'rgba(250,204,21,.95)';
    ctx.lineWidth = 3.5;
    roundPath(ctx, r.x + 1, r.y + 1, r.w - 2, r.h - 2, Math.min(9, r.w * 0.2));
    ctx.stroke();
  }
  drawEmoji(ctx, kind, r.x + r.w / 2, r.y + r.h / 2, r.w * 0.92);
}

function drawSunburst(cx, cy, R) {
  const rays = 28;
  for (let i = 0; i < rays; i++) {
    const a0 = (i / rays) * Math.PI * 2;
    const a1 = ((i + 0.5) / rays) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? '#1e3a5f' : '#0ea5e9';
    ctx.globalAlpha = 0.35;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function draw() {
  // 深蓝底板（贴近参考）
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  const r0 = cellRect(0);
  const cx = r0.ox + r0.gridW / 2;
  const cy = r0.oy + r0.gridH / 2;
  const innerPad = r0.size * 0.15;
  const ix = r0.ox + r0.size + innerPad;
  const iy = r0.oy + r0.size + innerPad;
  const iw = r0.gridW - r0.size * 2 - innerPad * 2;
  const ih = r0.gridH - r0.size * 2 - innerPad * 2;

  roundPath(ctx, ix, iy, iw, ih, 10);
  ctx.save();
  ctx.clip();
  drawSunburst(cx, cy, Math.max(iw, ih) * 0.75);
  ctx.restore();

  // 中心标题 + 结果
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#facc15';
  ctx.font = 'bold ' + Math.max(16, r0.size * 0.42) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('老虎机', cx, cy - r0.size * 0.55);
  ctx.font = Math.max(18, r0.size * 0.55) + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
  ctx.fillText('🐼 🐯', cx, cy - r0.size * 0.05);

  const dw = Math.min(iw * 0.42, r0.size * 2.2), dh = r0.size * 0.72;
  ctx.fillStyle = '#020617';
  roundPath(ctx, cx - dw / 2, cy + r0.size * 0.45, dw, dh, 6); ctx.fill();
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold ' + Math.max(16, dh * 0.55) + 'px ui-monospace,Consolas,monospace';
  ctx.fillText(String(centerMsg), cx, cy + r0.size * 0.45 + dh / 2);

  for (let i = 0; i < 24; i++) {
    const lit = litSet.has(i) || i === cursor;
    drawCell(i, lit);
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1700);
}

function renderBets() {
  const box = document.getElementById('bets');
  box.innerHTML = '';
  KINDS.forEach((k, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'bet' + (bets[k.id] > 0 ? ' on' : '');
    if (idx === focusBet) b.classList.add('on');
    b.innerHTML =
      '<span class="scoreLayer">' + (bets[k.id] || 0) + '</span>' +
      '<span class="icoLayer"><span class="emo">' + k.emoji + '</span><span class="pay">' + k.pay + '</span></span>';
    b.onclick = () => { focusBet = idx; addBet(k.id, 1); };
    box.appendChild(b);
  });
}

function addBet(id, n) {
  unlock();
  if (spinning) return;
  canDouble = false; hud();
  for (let i = 0; i < n; i++) {
    if (credits <= 0) { toast('金币不足'); sfx('invalid'); break; }
    credits--;
    bets[id]++;
  }
  hud(); save(); sfx('click'); renderBets();
}

/** 开始时：若当前无押分，沿用上次押分并从金币扣除 */
function ensureBetsForSpin() {
  if (totalBet() > 0) return true;
  const need = totalOf(lastBets);
  if (need <= 0) { toast('请先押分'); sfx('invalid'); return false; }
  if (credits < need) { toast('金币不足，无法沿用上次押分'); sfx('invalid'); return false; }
  credits -= need;
  KINDS.forEach(k => { bets[k.id] = lastBets[k.id] | 0; });
  hud(); renderBets();
  toast('沿用上次押分 −' + need);
  return true;
}

function snapshotLastBets() {
  KINDS.forEach(k => { lastBets[k.id] = bets[k.id] | 0; });
  save();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function payoutForKinds(kindIds) {
  let win = 0;
  kindIds.forEach(id => {
    if (id === 'cannon' || id === 'train') return;
    const stake = bets[id] || 0;
    if (stake > 0) win += stake * kindMeta(id).pay;
  });
  return win;
}

function pickStopIndex() {
  const weights = RING.map(kind => {
    if (kind === 'cannon' || kind === 'train') return testBoost ? 4.5 : 0.55;
    const k = kindMeta(kind);
    return 1.1 + (130 - k.pay) / 130;
  });
  let sum = weights.reduce((a, b) => a + b, 0), roll = Math.random() * sum;
  for (let i = 0; i < weights.length; i++) { roll -= weights[i]; if (roll <= 0) return i; }
  return 0;
}

async function animateSingle(stop) {
  litSet = new Set();
  const laps = 2 + ((Math.random() * 2) | 0);
  const total = laps * 24 + ((stop - cursor + 24) % 24);
  for (let s = 0; s < total; s++) {
    cursor = (cursor + 1) % 24;
    litSet = new Set([cursor]);
    draw();
    if (s % 2 === 0) sfx('move');
    await sleep(26 + Math.floor(s / total * 80) + (s > total - 10 ? (s - (total - 10)) * 28 : 0));
  }
}

async function animateTrain(stopHead) {
  const LEN = 8, laps = 2;
  const total = laps * 24 + ((stopHead - cursor + 24) % 24);
  for (let s = 0; s < total; s++) {
    cursor = (cursor + 1) % 24;
    litSet = new Set();
    for (let k = 0; k < LEN; k++) litSet.add((cursor - k + 24) % 24);
    draw();
    if (s % 2 === 0) sfx('move');
    await sleep(30 + Math.floor(s / total * 70) + (s > total - 10 ? (s - (total - 10)) * 30 : 0));
  }
  cursor = stopHead;
  litSet = new Set();
  for (let k = 0; k < LEN; k++) litSet.add((stopHead - k + 24) % 24);
  draw();
}

async function animateCannon(stop) {
  await animateSingle(stop);
  const animalIdx = [];
  for (let i = 0; i < 24; i++) if (RING[i] !== 'cannon' && RING[i] !== 'train') animalIdx.push(i);
  const picks = [];
  while (picks.length < 3 && animalIdx.length) {
    const j = (Math.random() * animalIdx.length) | 0;
    picks.push(animalIdx.splice(j, 1)[0]);
  }
  for (let n = 0; n < 3; n++) {
    litSet = new Set([stop, ...picks.slice(0, n + 1)]);
    draw(); sfx('power'); await sleep(280);
  }
  return picks.map(i => RING[i]);
}

async function runSpin() {
  if (spinning) return;
  unlock();
  canDouble = false; hud();
  if (!ensureBetsForSpin()) return;

  spinning = true;
  document.getElementById('btnGo').disabled = true;
  centerMsg = '…';
  lastWin = 0; hud();
  snapshotLastBets();
  sfx('start');

  const stop = pickStopIndex();
  const kind = RING[stop];
  let win = 0, msg = '谢谢参与';

  if (kind === 'cannon') {
    const hitKinds = await animateCannon(stop);
    win = payoutForKinds(hitKinds);
    msg = win > 0 ? ('礼炮打中 +' + win) : '礼炮未押中';
    sfx(win > 0 ? 'win' : 'lose');
  } else if (kind === 'train') {
    await animateTrain(stop);
    const kinds = [];
    for (let k = 0; k < 8; k++) kinds.push(RING[(stop - k + 24) % 24]);
    win = payoutForKinds(kinds);
    msg = win > 0 ? ('火车经过 +' + win) : '火车未押中';
    sfx(win > 0 ? 'win' : 'lose');
  } else {
    await animateSingle(stop);
    const stake = bets[kind] || 0;
    if (stake > 0) {
      win = stake * kindMeta(kind).pay;
      msg = kindMeta(kind).emoji + kindMeta(kind).label + ' 中奖 +' + win;
      sfx('win');
    } else sfx('lose');
  }

  credits += win;
  lastWin = win;
  canDouble = win > 0;
  centerMsg = win > 0 ? String(Math.min(99, win)) : '0';
  KINDS.forEach(k => { bets[k.id] = 0; });
  renderBets();
  hud(); save();
  toast(msg + (canDouble ? ' · 可小/大比倍' : ''));
  spinning = false;
  document.getElementById('btnGo').disabled = false;
  if (credits <= 0) setTimeout(() => toast('金币用尽，可在菜单重置'), 1600);
}

function doDouble(isBig) {
  unlock();
  if (spinning || !canDouble || lastWin <= 0) return;
  const roll = 1 + ((Math.random() * 14) | 0);
  const winSide = isBig ? (roll >= 8) : (roll <= 7);
  centerMsg = String(roll);
  if (winSide) {
    credits += lastWin;
    lastWin *= 2;
    toast((isBig ? '大' : '小') + '中！骰 ' + roll + ' · 赢分 ' + lastWin);
    sfx('win');
  } else {
    credits -= lastWin;
    if (credits < 0) credits = 0;
    toast((isBig ? '大' : '小') + '不中 · 骰 ' + roll);
    lastWin = 0;
    canDouble = false;
    sfx('lose');
  }
  hud(); save();
}

function loop() { draw(); requestAnimationFrame(loop); }

document.getElementById('btnGo').onclick = () => runSpin();
document.getElementById('btnAll').onclick = () => {
  unlock();
  if (spinning) return;
  canDouble = false;
  let added = 0;
  KINDS.forEach(k => {
    if (credits > 0) { credits--; bets[k.id]++; added++; }
  });
  if (!added) toast('金币不足');
  else { sfx('click'); toast('全押 +1'); }
  hud(); renderBets(); save();
};
document.getElementById('btnPrev').onclick = () => {
  unlock();
  focusBet = (focusBet + 7) % 8;
  renderBets();
  if (!spinning) addBet(KINDS[focusBet].id, 1);
};
document.getElementById('btnNext').onclick = () => {
  unlock();
  focusBet = (focusBet + 1) % 8;
  renderBets();
  if (!spinning) addBet(KINDS[focusBet].id, 1);
};
document.getElementById('btnSmall').onclick = () => doDouble(false);
document.getElementById('btnBig').onclick = () => doDouble(true);
document.getElementById('btnMenu').onclick = () => document.getElementById('panelMenu').classList.remove('hidden');
document.getElementById('btnTest').onclick = () => {
  unlock(); testBoost = !testBoost; syncTestBtn(); save();
  toast(testBoost ? '测试开：礼炮/火车更常出现' : '测试关：特奖恢复低概率'); sfx('swap');
};
document.getElementById('btnPlay').onclick = () => {
  unlock(); document.getElementById('panelMenu').classList.add('hidden'); sfx('place');
};
document.getElementById('btnReset').onclick = () => {
  unlock();
  credits = 100; lastWin = 0; canDouble = false;
  KINDS.forEach(k => { bets[k.id] = 0; lastBets[k.id] = 0; });
  centerMsg = '20';
  hud(); renderBets(); save(); sfx('swap'); toast('已重置为 100 金币');
};

load();
renderBets();
resize();
if (window.GameAudio) GameAudio.boot('catchy');
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
