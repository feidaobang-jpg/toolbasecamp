<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>霓虹贪吃蛇 - Neon Snake</title>
<style>
/* ============================================================
   全局样式
   ============================================================ */
html,body{
  margin:0;padding:0;width:100%;height:100%;
  background:#05060f;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
#wrap{
  position:fixed;left:0;top:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#0b1030 0%,#05060f 70%);
}
canvas{display:block;background:#070a18;box-shadow:0 0 60px rgba(60,120,255,.25);}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";
/* ============================================================
 * 霓虹贪吃蛇 Neon Snake
 * 单文件 2D Canvas 游戏
 * 结构分层：
 *   1. 常量与工具
 *   2. 音频系统 (WebAudio 程序生成音效 + BGM)
 *   3. 输入系统 (键盘 + 虚拟摇杆/按钮，双端适配)
 *   4. 粒子系统
 *   5. 游戏核心逻辑 (蛇、食物、关卡、无尽模式)
 *   6. 渲染系统 (画面、UI、界面)
 *   7. 主循环与自适应缩放(含手机自动横屏旋转)
 * ============================================================ */

/* ---------------- 1. 常量与工具 ---------------- */
const BASE_W = 960, BASE_H = 540;          // 横屏基准 16:9
const GRID = 30;                            // 网格尺寸(px)
const COLS = 30, ROWS = 16;                 // 游戏区网格数 (900x480)
const BOARD_X = (BASE_W - COLS*GRID)/2;     // 棋盘偏移
const BOARD_Y = 46;                         // 顶部留HUD空间

const STATE = { MENU:0, PLAY:1, PAUSE:2, OVER:3, LEVELCLEAR:4 };

// 递进关卡配置：目标分数、速度(格/秒)、障碍数
const LEVELS = [
  {target:  80, speed: 5.0, obstacles: 0,  name:"第 1 关"},
  {target: 120, speed: 6.0, obstacles: 6,  name:"第 2 关"},
  {target: 160, speed: 7.0, obstacles: 12, name:"第 3 关"},
  {target: 200, speed: 8.0, obstacles: 18, name:"第 4 关"},
  {target: 260, speed: 9.5, obstacles: 26, name:"第 5 关"},
];

const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);

/* ---------------- 2. 音频系统 ---------------- */
const Audio2 = (()=> {
  let ctx=null, master=null, bgmGain=null, bgmTimer=null, bgmStep=0;
  function init(){
    if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination);
    bgmGain = ctx.createGain(); bgmGain.gain.value=0.16; bgmGain.connect(master);
  }
  function resume(){ init(); if(ctx.state==="suspended") ctx.resume(); }
  // 通用音符
  function tone(freq, dur, type="square", vol=0.25, dest=null, slide=0){
    if(!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), ctx.currentTime+dur);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
    o.connect(g); g.connect(dest||master);
    o.start(); o.stop(ctx.currentTime+dur+0.02);
  }
  // 噪声(碰撞用)
  function noise(dur, vol=0.3){
    if(!ctx) return;
    const len=ctx.sampleRate*dur, buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=ctx.createBufferSource(); s.buffer=buf;
    const g=ctx.createGain(); g.gain.value=vol;
    s.connect(g); g.connect(master); s.start();
  }
  const sfx = {
    eat(){ tone(660,0.08,"square",0.22); tone(880,0.1,"square",0.18); },       // 吃食物
    turn(){ tone(300,0.03,"triangle",0.08); },                                  // 转向(轻)
    boost(){ tone(500,0.12,"sawtooth",0.15,null,400); },                        // 加速(攻击键)
    crash(){ noise(0.35,0.4); tone(120,0.4,"sawtooth",0.3,null,-80); },        // 碰撞失败
    levelup(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.18,"triangle",0.25),i*110)); }, // 通关
    over(){ [392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.3,"sawtooth",0.2),i*180)); },       // 游戏结束
    click(){ tone(800,0.05,"square",0.15); },                                   // UI点击
    bonus(){ tone(1200,0.08,"sine",0.22); tone(1600,0.12,"sine",0.18); },       // 特殊食物
  };
  // 简易BGM: 循环琶音序列
  const seq=[262,330,392,494, 262,330,392,523, 247,294,392,494, 220,294,349,440];
  function startBGM(){
    resume();
    if(bgmTimer) return;
    bgmStep=0;
    bgmTimer=setInterval(()=>{
      const f=seq[bgmStep%seq.length];
      tone(f,0.22,"triangle",1,bgmGain);
      if(bgmStep%4===0) tone(f/2,0.4,"sine",0.8,bgmGain);   // 低音
      bgmStep++;
    },220);
  }
  function stopBGM(){ if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;} }
  return { resume, sfx, startBGM, stopBGM };
})();

/* ---------------- 3. 输入系统 ---------------- */
const Input = (()=> {
  const keys={};
  let dirQueue=[];            // 方向输入队列，避免一帧内多次转向冲突
  let action={attack:false, jump:false, l:false, u:false, i:false, o:false};

  const DIRKEYS = {
    "KeyW":[0,-1],"ArrowUp":[0,-1],
    "KeyS":[0,1],"ArrowDown":[0,1],
    "KeyA":[-1,0],"ArrowLeft":[-1,0],
    "KeyD":[1,0],"ArrowRight":[1,0],
  };
  window.addEventListener("keydown",e=>{
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
    if(keys[e.code]) return;
    keys[e.code]=true;
    if(DIRKEYS[e.code]) dirQueue.push(DIRKEYS[e.code]);
    if(e.code==="KeyJ"||e.code==="Enter") action.attack=true;
    if(e.code==="KeyK"||e.code==="Space") action.jump=true;
    if(e.code==="KeyL") action.l=true;
    if(e.code==="KeyU") action.u=true;
    if(e.code==="KeyI") action.i=true;
    if(e.code==="KeyO") action.o=true;
    Game.onAnyKey(e.code);
  });
  window.addEventListener("keyup",e=>{ keys[e.code]=false; });

  /* ---- 移动端虚拟摇杆与按钮 (在基准坐标系中定义，渲染/命中都用它) ---- */
  const isTouch = "ontouchstart" in window || navigator.maxTouchPoints>0;
  const joy = {cx:130, cy:BASE_H-110, r:70, knobX:0, knobY:0, active:false, id:-1};
  const btns = [
    {id:"attack", label:"加速", x:BASE_W-80,  y:BASE_H-150, r:42, down:false, tid:-1, col:"#ff5577"},
    {id:"jump",   label:"暂停", x:BASE_W-170, y:BASE_H-75,  r:42, down:false, tid:-1, col:"#55aaff"},
  ];
  let touchDirty=null; // 摇杆产生的方向

  function toBase(px,py){ // 屏幕坐标 -> 基准坐标 (考虑缩放与旋转)
    return Screen.pointToBase(px,py);
  }
  function handleTouchStart(e){
    Audio2.resume();
    for(const t of e.changedTouches){
      const p=toBase(t.clientX,t.clientY);
      if(Game.state!==STATE.PLAY){ Game.onTap(p.x,p.y); continue; }
      // 允许点击暂停按钮区域(HUD)
      if(Game.hitHudPause(p.x,p.y)){ Game.togglePause(); continue; }
      let hit=false;
      for(const b of btns){
        if((p.x-b.x)**2+(p.y-b.y)**2 < (b.r+14)**2){
          b.down=true; b.tid=t.identifier; hit=true;
          if(b.id==="attack") action.attack=true;
          if(b.id==="jump") action.jump=true;
        }
      }
      if(!hit && p.x<BASE_W/2 && !joy.active){
        joy.active=true; joy.id=t.identifier;
        joy.cx=clamp(p.x,80,BASE_W/2-80); joy.cy=clamp(p.y,BOARD_Y+60,BASE_H-70);
        joy.knobX=0; joy.knobY=0;
      }
    }
    e.preventDefault();
  }
  function handleTouchMove(e){
    for(const t of e.changedTouches){
      if(joy.active && t.identifier===joy.id){
        const p=toBase(t.clientX,t.clientY);
        let dx=p.x-joy.cx, dy=p.y-joy.cy;
        const len=Math.hypot(dx,dy);
        if(len>joy.r){ dx=dx/len*joy.r; dy=dy/len*joy.r; }
        joy.knobX=dx; joy.knobY=dy;
        if(len>18){ // 死区
          touchDirty = Math.abs(dx)>Math.abs(dy) ? [Math.sign(dx),0] : [0,Math.sign(dy)];
        }
      }
    }
    e.preventDefault();
  }
  function handleTouchEnd(e){
    for(const t of e.changedTouches){
      if(joy.active && t.identifier===joy.id){ joy.active=false; joy.knobX=joy.knobY=0; touchDirty=null; }
      for(const b of btns){ if(b.tid===t.identifier){ b.down=false; b.tid=-1; } }
    }
    e.preventDefault();
  }
  window.addEventListener("touchstart",handleTouchStart,{passive:false});
  window.addEventListener("touchmove",handleTouchMove,{passive:false});
  window.addEventListener("touchend",handleTouchEnd,{passive:false});
  window.addEventListener("touchcancel",handleTouchEnd,{passive:false});
  // PC鼠标点击(菜单/按钮)
  window.addEventListener("mousedown",e=>{
    Audio2.resume();
    const p=toBase(e.clientX,e.clientY);
    Game.onTap(p.x,p.y);
  });

  function popDir(){
    if(dirQueue.length) return dirQueue.shift();
    if(touchDirty){ const d=touchDirty; touchDirty=null; return d; }
    return null;
  }
  function consumeAction(name){ const v=action[name]; action[name]=false; return v; }
  function isDown(code){ return !!keys[code]; }
  return { popDir, consumeAction, isDown, joy, btns, isTouch,
           get attackHeld(){ return keys["KeyJ"]||keys["Enter"]||btns[0].down; } };
})();

/* ---------------- 4. 粒子系统 ---------------- */
const Particles = (()=> {
  const list=[];
  function burst(x,y,color,n=14,spd=140){
    for(let i=0;i<n;i++){
      const a=rnd(0,Math.PI*2), s=rnd(spd*0.3,spd);
      list.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.4,0.8),t:0,color,size:rnd(2,5)});
    }
  }
  function trail(x,y,color){
    list.push({x,y,vx:rnd(-15,15),vy:rnd(-15,15),life:0.35,t:0,color,size:rnd(1.5,3)});
  }
  function update(dt){
    for(let i=list.length-1;i>=0;i--){
      const p=list[i]; p.t+=dt;
      if(p.t>=p.life){ list.splice(i,1); continue; }
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96;
    }
  }
  function draw(ctx){
    for(const p of list){
      const k=1-p.t/p.life;
      ctx.globalAlpha=k;
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*k,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  function clear(){ list.length=0; }
  return { burst, trail, update, draw, clear };
})();

/* ---------------- 5. 游戏核心逻辑 ---------------- */
const Game = (()=> {
  let state=STATE.MENU;
  let endless=false;          // 无尽模式
  let level=0;                // 当前关卡索引
  let score=0, best=+(localStorage.getItem("neonSnakeBest")||0);
  let lives=3;
  let snake=[], dir=[1,0], nextDir=[1,0], moveAcc=0, moveInterval=0.2;
  let food=null, bonus=null, bonusTimer=0;
  let obstacles=[];
  let shake=0, flashMsg="", flashT=0;
  let hue=0;                  // 全局动态色相
  let invincible=0;           // 复活后短暂无敌
  let endlessSpeedup=0;

  const cellPx=(c,r)=>[BOARD_X+c*GRID+GRID/2, BOARD_Y+r*GRID+GRID/2];

  function speedOf(){
    let s = endless ? (5+endlessSpeedup) : LEVELS[level].speed;
    if(Input.attackHeld) s*=1.7;        // 攻击键=加速冲刺
    return s;
  }

  function freeCell(){
    // 随机找空格：不与蛇、障碍、食物重叠
    for(let tries=0;tries<500;tries++){
      const c=rndi(0,COLS-1), r=rndi(0,ROWS-1);
      if(snake.some(s=>s[0]===c&&s[1]===r)) continue;
      if(obstacles.some(o=>o[0]===c&&o[1]===r)) continue;
      if(food&&food[0]===c&&food[1]===r) continue;
      if(bonus&&bonus[0]===c&&bonus[1]===r) continue;
      return [c,r];
    }
    return [0,0];
  }

  function genObstacles(n){
    obstacles=[];
    for(let i=0;i<n;i++){
      // 避开出生区中间一行
      let c,r,ok=false,tries=0;
      while(!ok&&tries++<300){
        c=rndi(1,COLS-2); r=rndi(1,ROWS-2);
        ok = !(r===Math.floor(ROWS/2)&&c<12) &&
             !obstacles.some(o=>Math.abs(o[0]-c)<2&&Math.abs(o[1]-r)<2);
      }
      obstacles.push([c,r]);
    }
  }

  function resetSnake(){
    const r=Math.floor(ROWS/2);
    snake=[[6,r],[5,r],[4,r]];
    dir=[1,0]; nextDir=[1,0]; moveAcc=0;
    invincible=1.5;
  }

  function startGame(isEndless){
    endless=isEndless; level=0; score=0; lives=3; endlessSpeedup=0;
    genObstacles(endless?0:LEVELS[0].obstacles);
    resetSnake();
    food=freeCell(); bonus=null; bonusTimer=rnd(6,12);
    Particles.clear();
    state=STATE.PLAY;
    Audio2.startBGM();
    flash(endless?"无尽模式 开始！":"第 1 关 开始！");
  }

  function nextLevel(){
    level++;
    if(level>=LEVELS.length){ // 全部通关 → 进入无尽
      endless=true; endlessSpeedup=5;
      flash("全关通关！进入无尽模式！");
      genObstacles(0);
    }else{
      flash(LEVELS[level].name+" 开始！");
      genObstacles(LEVELS[level].obstacles);
    }
    resetSnake();
    food=freeCell(); bonus=null;
    state=STATE.PLAY;
  }

  function flash(msg){ flashMsg=msg; flashT=2.2; }

  function die(){
    Audio2.sfx.crash();
    shake=14;
    const [hx,hy]=cellPx(snake[0][0],snake[0][1]);
    Particles.burst(hx,hy,"#ff5566",30,220);
    lives--;
    if(lives<=0){
      state=STATE.OVER;
      Audio2.sfx.over();
      Audio2.stopBGM();
      if(score>best){ best=score; localStorage.setItem("neonSnakeBest",best); }
    }else{
      flash("剩余生命 "+lives+"，继续！");
      resetSnake();
    }
  }

  function step(){
    dir=nextDir;
    const head=[snake[0][0]+dir[0], snake[0][1]+dir[1]];
    // 撞墙
    if(head[0]<0||head[0]>=COLS||head[1]<0||head[1]>=ROWS){
      if(invincible>0){ // 无敌期穿墙环绕
        head[0]=(head[0]+COLS)%COLS; head[1]=(head[1]+ROWS)%ROWS;
      }else{ die(); return; }
    }
    // 撞自己(不含尾巴即将移走的格子)
    const willGrow = food&&head[0]===food[0]&&head[1]===food[1];
    const body = willGrow? snake : snake.slice(0,-1);
    if(invincible<=0 && body.some(s=>s[0]===head[0]&&s[1]===head[1])){ die(); return; }
    // 撞障碍
    if(invincible<=0 && obstacles.some(o=>o[0]===head[0]&&o[1]===head[1])){ die(); return; }

    snake.unshift(head);
    // 吃普通食物
    if(willGrow){
      score+=10;
      Audio2.sfx.eat();
      const [fx,fy]=cellPx(food[0],food[1]);
      Particles.burst(fx,fy,"#7dffb0",16,160);
      food=freeCell();
      if(endless && score%50===0){ endlessSpeedup+=0.6; flash("速度提升！"); }
      // 关卡模式检查目标
      if(!endless && score>=LEVELS[level].target){
        state=STATE.LEVELCLEAR;
        Audio2.sfx.levelup();
        const [hx,hy]=cellPx(head[0],head[1]);
        Particles.burst(hx,hy,"#ffe066",40,260);
      }
    }else if(bonus && head[0]===bonus[0]&&head[1]===bonus[1]){
      // 吃特殊食物
      score+=30;
      Audio2.sfx.bonus();
      const [bx,by]=cellPx(bonus[0],bonus[1]);
      Particles.burst(bx,by,"#ffd24d",24,200);
      bonus=null;
      snake.pop();
    }else{
      snake.pop();
    }
  }

  function update(dt){
    hue=(hue+dt*20)%360;
    if(flashT>0) flashT-=dt;
    if(shake>0) shake=Math.max(0,shake-dt*40);
    Particles.update(dt);
    if(state!==STATE.PLAY) return;
    if(invincible>0) invincible-=dt;

    // 方向输入(禁止180度回头)
    let d;
    while((d=Input.popDir())){
      if(d[0]===-dir[0]&&d[1]===-dir[1]) continue;
      if(d[0]===nextDir[0]&&d[1]===nextDir[1]) continue;
      nextDir=d; Audio2.sfx.turn();
      break;
    }
    // 暂停(跳跃键/K/空格)
    if(Input.consumeAction("jump")){ togglePause(); return; }
    if(Input.consumeAction("attack")){ Audio2.sfx.boost(); }
    Input.consumeAction("l");Input.consumeAction("u");Input.consumeAction("i");Input.consumeAction("o");

    // 特殊食物计时
    bonusTimer-=dt;
    if(bonusTimer<=0){
      if(bonus){ bonus=null; bonusTimer=rnd(6,12); }
      else{ bonus=freeCell(); bonusTimer=6; }
    }

    // 蛇移动(固定步进，帧率无关)
    moveInterval=1/speedOf();
    moveAcc+=dt;
    while(moveAcc>=moveInterval && state===STATE.PLAY){
      moveAcc-=moveInterval;
      step();
    }
    // 冲刺尾迹
    if(Input.attackHeld && snake.length){
      const [tx,ty]=cellPx(snake[snake.length-1][0],snake[snake.length-1][1]);
      Particles.trail(tx,ty,`hsl(${hue},90%,65%)`);
    }
  }

  /* ---- 界面交互 ---- */
  const menuBtns=[
    {label:"关卡模式", x:BASE_W/2, y:300, w:240, h:56, act:()=>startGame(false)},
    {label:"无尽模式", x:BASE_W/2, y:380, w:240, h:56, act:()=>startGame(true)},
  ];
  const overBtns=[
    {label:"重新开始", x:BASE_W/2-140, y:400, w:220, h:56, act:()=>startGame(endless)},
    {label:"返回菜单", x:BASE_W/2+140, y:400, w:220, h:56, act:()=>{state=STATE.MENU;Audio2.stopBGM();}},
  ];
  const pauseBtns=[
    {label:"继续游戏", x:BASE_W/2, y:300, w:240, h:56, act:()=>{state=STATE.PLAY;}},
    {label:"重新开始", x:BASE_W/2, y:380, w:240, h:56, act:()=>startGame(endless)},
    {label:"返回菜单", x:BASE_W/2, y:460, w:240, h:56, act:()=>{state=STATE.MENU;Audio2.stopBGM();}},
  ];
  const clearBtns=[
    {label:"下一关", x:BASE_W/2, y:380, w:240, h:56, act:nextLevel},
  ];
  function activeBtns(){
    if(state===STATE.MENU) return menuBtns;
    if(state===STATE.OVER) return overBtns;
    if(state===STATE.PAUSE) return pauseBtns;
    if(state===STATE.LEVELCLEAR) return clearBtns;
    return [];
  }
  function onTap(x,y){
    if(state===STATE.PLAY){
      if(hitHudPause(x,y)) togglePause();
      return;
    }
    for(const b of activeBtns()){
      if(Math.abs(x-b.x)<b.w/2 && Math.abs(y-b.y)<b.h/2){
        Audio2.sfx.click(); b.act(); return;
      }
    }
  }
  function onAnyKey(code){
    if(state===STATE.MENU){
      if(code==="Enter"||code==="KeyJ") startGame(false);
      if(code==="KeyL") startGame(true);
    }else if(state===STATE.OVER){
      if(code==="Enter"||code==="KeyJ"||code==="Space") startGame(endless);
      if(code==="Escape") { state=STATE.MENU; Audio2.stopBGM(); }
    }else if(state===STATE.LEVELCLEAR){
      if(code==="Enter"||code==="KeyJ"||code==="Space") nextLevel();
    }else if(state===STATE.PAUSE){
      if(code==="KeyK"||code==="Space"||code==="Escape") state=STATE.PLAY;
    }else if(state===STATE.PLAY){
      if(code==="Escape") togglePause();
    }
  }
  function togglePause(){
    if(state===STATE.PLAY){ state=STATE.PAUSE; Audio2.sfx.click(); }
    else if(state===STATE.PAUSE){ state=STATE.PLAY; Audio2.sfx.click(); }
  }
  function hitHudPause(x,y){ return x>BASE_W-56&&x<BASE_W-8&&y>4&&y<42; }

  return {
    update, onTap, onAnyKey, togglePause, hitHudPause, activeBtns,
    get state(){return state;},
    get score(){return score;}, get best(){return best;},
    get lives(){return lives;}, get level(){return level;},
    get endless(){return endless;}, get snake(){return snake;},
    get food(){return food;}, get bonus(){return bonus;},
    get obstacles(){return obstacles;}, get shake(){return shake;},
    get flashMsg(){return flashMsg;}, get flashT(){return flashT;},
    get hue(){return hue;}, get invincible(){return invincible;},
    get target(){return endless?Infinity:LEVELS[level].target;},
    cellPx,
  };
})();

/* ---------------- 6. 渲染系统 ---------------- */
const Render = (()=> {
  const cv=document.getElementById("game");
  const ctx=cv.getContext("2d");
  cv.width=BASE_W; cv.height=BASE_H;

  // 预生成星空背景
  const stars=[];
  for(let i=0;i<90;i++) stars.push({x:rnd(0,BASE_W),y:rnd(0,BASE_H),r:rnd(0.5,1.8),p:rnd(0,Math.PI*2)});

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawBG(t){
    const g=ctx.createLinearGradient(0,0,0,BASE_H);
    g.addColorStop(0,"#0a0e2a"); g.addColorStop(0.6,"#0b1230"); g.addColorStop(1,"#141033");
    ctx.fillStyle=g; ctx.fillRect(0,0,BASE_W,BASE_H);
    for(const s of stars){
      const a=0.3+0.5*Math.abs(Math.sin(t*0.8+s.p));
      ctx.globalAlpha=a; ctx.fillStyle="#cfe0ff";
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function drawBoard(){
    // 面板底
    ctx.fillStyle="rgba(6,10,26,0.85)";
    roundRect(BOARD_X-6,BOARD_Y-6,COLS*GRID+12,ROWS*GRID+12,10); ctx.fill();
    // 霓虹边框
    ctx.strokeStyle=`hsla(${Game.hue},90%,60%,0.9)`;
    ctx.lineWidth=2.5;
    ctx.shadowColor=`hsla(${Game.hue},90%,60%,1)`; ctx.shadowBlur=14;
    roundRect(BOARD_X-6,BOARD_Y-6,COLS*GRID+12,ROWS*GRID+12,10); ctx.stroke();
    ctx.shadowBlur=0;
    // 网格
    ctx.strokeStyle="rgba(90,120,220,0.10)"; ctx.lineWidth=1;
    ctx.beginPath();
    for(let c=1;c<COLS;c++){ ctx.moveTo(BOARD_X+c*GRID,BOARD_Y); ctx.lineTo(BOARD_X+c*GRID,BOARD_Y+ROWS*GRID); }
    for(let r=1;r<ROWS;r++){ ctx.moveTo(BOARD_X,BOARD_Y+r*GRID); ctx.lineTo(BOARD_X+COLS*GRID,BOARD_Y+r*GRID); }
    ctx.stroke();
  }

  function drawSnake(t){
    const s=Game.snake;
    const blink = Game.invincible>0 && Math.floor(t*8)%2===0;
    if(blink) ctx.globalAlpha=0.45;
    for(let i=s.length-1;i>=0;i--){
      const [x,y]=Game.cellPx(s[i][0],s[i][1]);
      const k=i/Math.max(1,s.length-1);
      const h=(Game.hue+ k*80)%360;
      const size=GRID*0.82*(1-k*0.25);
      ctx.shadowColor=`hsl(${h},95%,60%)`; ctx.shadowBlur=i===0?18:8;
      const grad=ctx.createRadialGradient(x-3,y-3,1,x,y,size/1.4);
      grad.addColorStop(0,`hsl(${h},95%,75%)`);
      grad.addColorStop(1,`hsl(${h},85%,45%)`);
      ctx.fillStyle=grad;
      roundRect(x-size/2,y-size/2,size,size,size*0.32); ctx.fill();
    }
    ctx.shadowBlur=0;
    // 眼睛
    if(s.length){
      const [hx,hy]=Game.cellPx(s[0][0],s[0][1]);
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(hx-5,hy-4,3.2,0,Math.PI*2); ctx.arc(hx+5,hy-4,3.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#122";
      ctx.beginPath(); ctx.arc(hx-5,hy-4,1.6,0,Math.PI*2); ctx.arc(hx+5,hy-4,1.6,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function drawFood(t){
    if(Game.food){
      const [x,y]=Game.cellPx(Game.food[0],Game.food[1]);
      const pulse=1+0.12*Math.sin(t*5);
      ctx.shadowColor="#4dff9d"; ctx.shadowBlur=16;
      const g=ctx.createRadialGradient(x-3,y-3,1,x,y,11*pulse);
      g.addColorStop(0,"#c8ffe2"); g.addColorStop(1,"#17c964");
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(x,y,10*pulse,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    if(Game.bonus){
      const [x,y]=Game.cellPx(Game.bonus[0],Game.bonus[1]);
      const rot=t*2;
      ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
      ctx.shadowColor="#ffd24d"; ctx.shadowBlur=20;
      ctx.fillStyle="#ffd24d";
      // 星形
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const r=i%2===0?13:5.5, a=i*Math.PI/5-Math.PI/2;
        ctx[i===0?"moveTo":"lineTo"](Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0; ctx.restore();
    }
  }

  function drawObstacles(t){
    for(const o of Game.obstacles){
      const [x,y]=Game.cellPx(o[0],o[1]);
      ctx.shadowColor="#8866ff"; ctx.shadowBlur=8;
      const g=ctx.createLinearGradient(x-12,y-12,x+12,y+12);
      g.addColorStop(0,"#6f5bd6"); g.addColorStop(1,"#3a2e80");
      ctx.fillStyle=g;
      roundRect(x-12,y-12,24,24,5); ctx.fill();
      ctx.strokeStyle="rgba(200,180,255,.5)"; ctx.lineWidth=1.5;
      roundRect(x-12,y-12,24,24,5); ctx.stroke();
      ctx.shadowBlur=0;
    }
  }

  function drawHUD(){
    ctx.textBaseline="middle";
    ctx.font="bold 20px sans-serif";
    ctx.fillStyle="#e8f0ff";
    ctx.textAlign="left";
    ctx.fillText("分数 "+Game.score,BOARD_X,24);
    ctx.fillStyle="#9fb4ff";
    ctx.fillText("最高 "+Game.best,BOARD_X+140,24);
    // 生命
    ctx.textAlign="center";
    for(let i=0;i<3;i++){
      const x=BASE_W/2-36+i*36;
      ctx.fillStyle=i<Game.lives?"#ff5577":"rgba(255,85,119,0.2)";
      drawHeart(x,22,10);
    }
    // 关卡/模式
    ctx.textAlign="right"; ctx.fillStyle="#ffd24d";
    const modeTxt = Game.endless? "无尽模式" : LEVELS[Game.level].name+"  目标 "+Game.target;
    ctx.fillText(modeTxt,BASE_W-70,24);
    // 暂停按钮
    ctx.fillStyle="rgba(255,255,255,0.12)";
    roundRect(BASE_W-52,6,44,32,8); ctx.fill();
    ctx.fillStyle="#e8f0ff";
    ctx.fillRect(BASE_W-40,13,5,18); ctx.fillRect(BASE_W-27,13,5,18);
  }
  function drawHeart(x,y,s){
    ctx.beginPath();
    ctx.moveTo(x,y+s*0.35);
    ctx.bezierCurveTo(x-s,y-s*0.6,x-s*0.4,y-s*1.1,x,y-s*0.35);
    ctx.bezierCurveTo(x+s*0.4,y-s*1.1,x+s,y-s*0.6,x,y+s*0.35);
    ctx.fill();
  }

  function drawTouchUI(){
    if(!Input.isTouch || Game.state!==STATE.PLAY) return;
    const j=Input.joy;
    // 摇杆
    ctx.globalAlpha=j.active?0.55:0.28;
    ctx.strokeStyle="#9fc0ff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(j.cx,j.cy,j.r,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle="#9fc0ff";
    ctx.beginPath(); ctx.arc(j.cx+j.knobX,j.cy+j.knobY,26,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    // 按钮
    for(const b of Input.btns){
      ctx.globalAlpha=b.down?0.8:0.4;
      ctx.fillStyle=b.col;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle="#fff"; ctx.font="bold 18px sans-serif"; ctx.textAlign="center";
      ctx.fillText(b.label,b.x,b.y);
    }
  }

  function drawButton(b,t){
    const glow=0.5+0.5*Math.sin(t*3);
    ctx.shadowColor=`hsla(${Game.hue},90%,60%,${0.6+glow*0.4})`; ctx.shadowBlur=18;
    const g=ctx.createLinearGradient(b.x-b.w/2,b.y-b.h/2,b.x+b.w/2,b.y+b.h/2);
    g.addColorStop(0,`hsl(${Game.hue},70%,38%)`);
    g.addColorStop(1,`hsl(${(Game.hue+60)%360},70%,30%)`);
    ctx.fillStyle=g;
    roundRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h,14); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.6)"; ctx.lineWidth=2;
    roundRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h,14); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle="#fff"; ctx.font="bold 24px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(b.label,b.x,b.y+1);
  }

  function overlay(alpha=0.66){
    ctx.fillStyle=`rgba(4,6,16,${alpha})`;
    ctx.fillRect(0,0,BASE_W,BASE_H);
  }

  function drawTitleText(txt,y,size,color){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=`bold ${size}px sans-serif`;
    ctx.shadowColor=color; ctx.shadowBlur=24;
    ctx.fillStyle=color;
    ctx.fillText(txt,BASE_W/2,y);
    ctx.shadowBlur=0;
  }

  function draw(t){
    ctx.save();
    // 屏幕震动
    if(Game.shake>0) ctx.translate(rnd(-Game.shake,Game.shake)*0.5,rnd(-Game.shake,Game.shake)*0.5);

    drawBG(t);
    drawBoard();
    drawObstacles(t);
    drawFood(t);
    drawSnake(t);
    Particles.draw(ctx);
    drawHUD();
    drawTouchUI();

    const st=Game.state;
    if(st===STATE.MENU){
      overlay(0.55);
      drawTitleText("霓 虹 贪 吃 蛇",150,60,`hsl(${Game.hue},95%,65%)`);
      ctx.fillStyle="#9fb4ff"; ctx.font="18px sans-serif";
      ctx.fillText("WASD/方向键 移动 · J/回车 加速 · K/空格 暂停 · 手机摇杆+按钮",BASE_W/2,215);
      for(const b of Game.activeBtns()) drawButton(b,t);
      ctx.fillStyle="rgba(180,200,255,0.6)"; ctx.font="15px sans-serif";
      ctx.fillText("最高分: "+Game.best,BASE_W/2,470);
    }else if(st===STATE.PAUSE){
      overlay();
      drawTitleText("已 暂 停",180,52,"#7db8ff");
      for(const b of Game.activeBtns()) drawButton(b,t);
    }else if(st===STATE.OVER){
      overlay();
      drawTitleText("游 戏 结 束",180,56,"#ff5577");
      ctx.fillStyle="#fff"; ctx.font="bold 30px sans-serif";
      ctx.fillText("得分: "+Game.score,BASE_W/2,270);
      ctx.fillStyle="#ffd24d"; ctx.font="20px sans-serif";
      ctx.fillText("最高分: "+Game.best + (Game.score>=Game.best?"  新纪录!":""),BASE_W/2,315);
      for(const b of Game.activeBtns()) drawButton(b,t);
    }else if(st===STATE.LEVELCLEAR){
      overlay();
      drawTitleText("关 卡 完 成 !",190,56,"#ffe066");
      ctx.fillStyle="#fff"; ctx.font="bold 26px sans-serif";
      ctx.fillText("当前得分: "+Game.score,BASE_W/2,280);
      for(const b of Game.activeBtns()) drawButton(b,t);
    }

    // 提示语
    if(Game.flashT>0 && st===STATE.PLAY){
      ctx.globalAlpha=clamp(Game.flashT,0,1);
      drawTitleText(Game.flashMsg,120,34,"#ffe066");
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  return { draw, cv };
})();

/* ---------------- 7. 缩放适配与主循环 ---------------- */
const Screen = (()=> {
  const cv=Render.cv;
  let rotated=false, scale=1, offX=0, offY=0;

  function resize(){
    const w=window.innerWidth, h=window.innerHeight;
    // 竖屏窄设备(如微信手机竖持)：旋转画布实现自动横屏
    rotated = h>w && Math.min(w,h)<820;
    const availW = rotated? h : w;
    const availH = rotated? w : h;
    scale=Math.min(availW/BASE_W, availH/BASE_H);
    const cssW=BASE_W*scale, cssH=BASE_H*scale;
    // 高DPI清晰化
    const dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=BASE_W*dpr; cv.height=BASE_H*dpr;
    cv.getContext("2d").setTransform(dpr,0,0,dpr,0,0);
    cv.style.width=cssW+"px"; cv.style.height=cssH+"px";
    if(rotated){
      cv.style.transform=`rotate(90deg)`;
      offX=(w-cssH)/2; offY=(h-cssW)/2;
      cv.style.position="fixed";
      cv.style.left=((w-cssW)/2)+"px";
      cv.style.top=((h-cssH)/2)+"px";
    }else{
      cv.style.transform="none";
      cv.style.position="static";
    }
  }
  // 屏幕坐标 -> 游戏基准坐标
  function pointToBase(px,py){
    const rect=cv.getBoundingClientRect();
    if(!rotated){
      return {x:(px-rect.left)*BASE_W/rect.width, y:(py-rect.top)*BASE_H/rect.height};
    }
    // canvas旋转了+90deg，逆变换：游戏坐标 = rotate(-90) 屏幕相对坐标
    // 旋转后 rect.width==cssH, rect.height==cssW
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    const dx=px-cx, dy=py-cy;
    const gx=dy, gy=-dx;
    return {x:BASE_W/2+gx*BASE_W/rect.height, y:BASE_H/2+gy*BASE_H/rect.width};
  }
  window.addEventListener("resize",resize);
  window.addEventListener("orientationchange",()=>setTimeout(resize,300));
  resize();
  return { pointToBase };
})();

/* 主循环：固定时间步进由Game内部处理，渲染每帧 */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;          // 防止后台切回时大跳帧
  Game.update(dt);
  Render.draw(now/1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
