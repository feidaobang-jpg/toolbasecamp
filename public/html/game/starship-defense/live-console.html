<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虫潮围城 · 主持控制台</title><link rel="stylesheet" href="./live.css?v=live1"></head><body><main class="console">
<h1>虫潮围城 · 主持控制台</h1><p>你可以随时接管，或只主持、让AI继续操作。控制台与直播画面分开，OBS只采集直播画面。</p>
<div class="entry"><a href="./live.html" target="_blank" rel="noopener">打开直播画面</a><button id="rules">查看互动规则</button><button id="diagnose">检查本机服务</button></div>
<p class="notice" id="connection">正在检测本机服务。未连接B站时只运行演示；模拟事件不会产生真实礼物或收益。</p>
<div class="cards">
<section class="card"><h2>主持方式</h2><div class="actions"><button data-mode="auto">AI独播</button><button data-mode="assist">我操作 · AI辅助</button><button data-mode="host">我主持 · AI操作</button></div><div class="actions"><button data-control="start">开始</button><button data-control="pause">暂停互动</button><button data-control="resume">继续</button><button data-control="restart">下一场</button></div><button id="hold">我正在说话，AI静音10秒</button><button id="mic">启用麦克风避让</button><label><input type="checkbox" id="voice" checked> AI语音</label><label>视角 <select id="camera"><option value="third">斜俯视</option><option value="first">第一人称</option></select></label><pre id="state" class="status">等待直播画面</pre></section>
<section class="card"><h2>演示互动</h2><p>测试按钮只在演示状态有效。正式连接后使用B站真实事件。</p><label>测试昵称 <input id="name" value="演示观众" maxlength="20"></label><div class="actions"><button data-comment="加入">加入</button><button data-comment="医疗">医疗组</button><button data-comment="工程">工程组</button><button data-comment="守城">投票守城</button><button data-comment="跟随">投票跟随</button></div><label>测试弹幕 <input id="comment" maxlength="120" placeholder="问AI如何参与"></label><button id="send">发送模拟弹幕</button><div class="actions"><button data-support="repair">模拟基地维修</button><button data-support="shield">模拟护盾</button><button data-support="tank">模拟坦克</button><button data-support="strike">模拟轰炸</button></div><div id="events"></div></section>
<section class="card"><h2>B站正式连接</h2><p>仅使用官方直播开放平台。开发者密钥保存在本机配置中；这里填写主播身份码。</p><label>主播身份码 <input id="code" type="password" autocomplete="off"></label><button id="connect">连接已审核项目</button><button id="disconnect">断开B站互动</button><pre id="bili" class="status">待申请开发者权限及项目审核</pre></section>
<section class="card"><h2>推流与故障保护</h2><p>首次在OBS导入专用场景并配置B站推流。程序不会自行公开开播。</p><button id="obs">检查OBS连接</button><button id="scene">建立专用OBS场景</button><button id="record">开始本地录制</button><button id="stopRecord">结束录制</button><button id="emergency" class="danger">紧急停止：结束互动并停止OBS推流</button><pre id="health" class="status"></pre></section>
</div><dialog id="ruleDialog"><h2>直播互动规则</h2><pre id="ruleText"></pre><button id="closeRules">关闭</button></dialog>
</main><script type="module" src="./live-console.js?v=live1"></script></body></html>
