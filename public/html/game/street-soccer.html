<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>足球 · Street Soccer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#052e16;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;max-width:420px;margin:0 auto;background:#14532d}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;z-index:2;display:flex;gap:10px;flex-wrap:wrap}
#hud b{color:#fde68a}
#audioBar{position:absolute;top:8px;right:8px;z-index:5;pointer-events:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:55%}
#audioBar .tb-btn{font-size:11px;padding:6px 10px;border:0;border-radius:999px;background:#2563eb;color:#fff;cursor:pointer}
#audioBar .game-volume{display:flex;align-items:center;gap:4px;font-size:10px;color:#94a3b8}
#audioBar input[type=range]{width:72px}
#touch{display:none;position:absolute;inset:0;pointer-events:none;z-index:3}
#touch .pad{pointer-events:auto;position:absolute;left:16px;bottom:16px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
#touch .stick{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.35);left:33px;top:33px}
#touch .kick{pointer-events:auto;position:absolute;right:18px;bottom:28px;width:76px;height:76px;border-radius:50%;background:rgba(37,99,235,.55);color:#fff;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3)}
@media(pointer:coarse){#touch{display:block}}
#ui{position:absolute;inset:0;pointer-events:none;z-index:4}
#ui .panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,380px);background:rgba(15,23,42,.94);border:1px solid #334155;border-radius:14px;padding:18px 16px}
#ui h1{font-size:1.3rem;margin-bottom:6px;color:#86efac}
#ui h2{font-size:1.05rem;margin:0 0 10px;color:#bbf7d0}
#ui p{font-size:.85rem;line-height:1.45;color:#94a3b8;margin-bottom:8px}
#ui .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#ui button{font:inherit;border:0;border-radius:999px;padding:10px 16px;background:#2563eb;color:#fff;cursor:pointer;flex:1;min-width:100px}
#ui button.ghost{background:#1e293b;border:1px solid #475569}
#ui button:disabled{opacity:.45}
#ui .shop-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e293b;font-size:.84rem}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span>比分 <b id="score">0-0</b></span><span>轮 <b id="round">1</b></span><span>币 <b id="coins">0</b></span><span>最高胜 <b id="best">0</b></span></div>
  <div class="action-row" id="audioBar"></div>
  <div id="touch"><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="kick" id="btnKick">踢</div></div>
  <div id="ui">
    <div class="panel" id="panelMenu">
      <h1>足球</h1>
      <p>俯视简化 3v3：带球射门，先踢进目标球数获胜。联赛积分可升级球员。</p>
      <p>WASD 移动 · J/空格 踢球</p>
      <div class="row"><button id="btnNew">新游戏</button><button class="ghost" id="btnContinue" disabled>继续</button></div>
    </div>
    <div class="panel hidden" id="panelShop">
      <h2>更衣室 · 第 <span id="shopLv">1</span> 轮</h2>
      <p id="shopMsg"></p><div id="shopList"></div>
      <div class="row"><button id="btnNext">下场比赛</button><button class="ghost" id="btnSaveMenu">存档回菜单</button></div>
    </div>
    <div class="panel hidden" id="panelOver">
      <h2 id="overTitle">比赛结束</h2><p id="overMsg"></p>
      <div class="row"><button id="btnRetry">再来</button><button class="ghost" id="btnOverMenu">菜单</button></div>
    </div>
  </div>
</div>
<script src="../../js/game/game-audio.js?v=19"></script>
<script>
(function(){
const KEY='tbc_soccer_v1';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=360,H=640,dpr=1,mode='menu',state=null,best=0;
const keys={};let stick={x:0,y:0,active:false};

function sfx(n){try{GameAudio&&GameAudio.sfx(n)}catch(e){}}
function unlock(){try{GameAudio&&GameAudio.unlock()}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function loadMeta(){const d=load();best=(d&&d.best)||0;document.getElementById('best').textContent=best;document.getElementById('btnContinue').disabled=!(d&&d.play)}
function persist(){if(!state)return;save({best:Math.max(best,state.wins),play:{wins:state.wins,coins:state.coins,round:state.round,spd:state.spd,shot:state.shot}})}
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=Math.max(280,r.width);H=Math.max(400,r.height);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);
function hidePanels(){['panelMenu','panelShop','panelOver'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function show(id){hidePanels();document.getElementById(id).classList.remove('hidden')}

function resetBall(){
  state.ball={x:W/2,y:H/2,vx:0,vy:0};
  state.me={x:W/2,y:H*0.7,vx:0,vy:0};
  state.mates=[{x:W*0.3,y:H*0.55},{x:W*0.7,y:H*0.55}];
  state.foes=[{x:W*0.35,y:H*0.35},{x:W*0.65,y:H*0.35},{x:W/2,y:H*0.22}];
}

function newGame(from){
  unlock();const p=from||{};
  state={wins:p.wins||0,coins:p.coins||0,round:p.round||1,spd:p.spd||0,shot:p.shot||0,myG:0,opG:0,target:2+Math.min(3,((p.round||1)/2)|0),t:0,kickCd:0};
  resetBall();mode='play';hidePanels();hud();sfx('place');
}

function hud(){if(!state)return;document.getElementById('score').textContent=state.myG+'-'+state.opG;document.getElementById('round').textContent=state.round;document.getElementById('coins').textContent=state.coins;document.getElementById('best').textContent=Math.max(best,state.wins)}

function openShop(won){
  mode='shop';document.getElementById('shopLv').textContent=state.round;
  document.getElementById('shopMsg').textContent=(won?'赢了！':'')+' 金币 '+state.coins;
  const list=document.getElementById('shopList');list.innerHTML='';
  [{id:'spd',name:'跑动速度',cost:14+state.spd*10,ok:state.spd<5},{id:'shot',name:'射门力量',cost:14+state.shot*10,ok:state.shot<5}].forEach(it=>{
    const row=document.createElement('div');row.className='shop-item';row.innerHTML='<span>'+it.name+'</span>';
    const b=document.createElement('button');b.textContent=it.cost+' 币';b.disabled=!it.ok||state.coins<it.cost;
    b.onclick=()=>{unlock();if(state.coins<it.cost||!it.ok)return;state.coins-=it.cost;sfx('swap');if(it.id==='spd')state.spd++;if(it.id==='shot')state.shot++;persist();openShop(won);hud()};
    row.appendChild(b);list.appendChild(row);
  });
  show('panelShop');persist();
}

function goal(mine){
  if(mine){state.myG++;state.coins+=3;state.scoreBoost=(state.scoreBoost||0)+50;sfx('win')}
  else{state.opG++;sfx('lose')}
  resetBall();
  if(state.myG>=state.target){state.wins++;state.round++;state.coins+=12;best=Math.max(best,state.wins);openShop(true)}
  else if(state.opG>=state.target){mode='over';save({best:Math.max(best,state.wins),play:null});document.getElementById('overTitle').textContent='落败';document.getElementById('overMsg').textContent='比分 '+state.myG+'-'+state.opG;show('panelOver')}
  hud();
}

function update(dt){
  if(mode!=='play'||!state)return;
  state.t+=dt;state.kickCd=Math.max(0,state.kickCd-dt);
  let ix=stick.active?stick.x:0,iy=stick.active?stick.y:0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])ix-=1;if(keys['ArrowRight']||keys['d']||keys['D'])ix+=1;
  if(keys['ArrowUp']||keys['w']||keys['W'])iy-=1;if(keys['ArrowDown']||keys['s']||keys['S'])iy+=1;
  const m=Math.hypot(ix,iy)||1;const spd=130+state.spd*20;
  state.me.x=Math.max(20,Math.min(W-20,state.me.x+ix/m*spd*dt));
  state.me.y=Math.max(H*0.12,Math.min(H-20,state.me.y+iy/m*spd*dt));

  const b=state.ball;
  if((keys['j']||keys['J']||keys[' ']||keys._kick)&&state.kickCd<=0&&Math.hypot(state.me.x-b.x,state.me.y-b.y)<28){
    state.kickCd=0.35;keys._kick=false;
    const ang=Math.atan2((iy|| -1),(ix||0))|| -Math.PI/2;
    const pow=280+state.shot*40;b.vx=Math.cos(ang)*pow;b.vy=Math.sin(ang)*pow;sfx('hit');
  }

  // AI mates lightly chase ball
  state.mates.forEach((p,i)=>{p.x+=(b.x-p.x)*0.4*dt;p.y+=(b.y*0.7+H*0.15-p.y)*0.35*dt});
  state.foes.forEach((p,i)=>{
    const tx=b.x+(i-1)*20,ty=b.y-10;
    p.x+=(tx-p.x)*(0.5+state.round*0.02)*dt;p.y+=(ty-p.y)*(0.5+state.round*0.02)*dt;
    if(Math.hypot(p.x-b.x,p.y-b.y)<22&&Math.random()<0.02){b.vx=(Math.random()-.3)*120;b.vy=180+Math.random()*80}
  });

  b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=0.985;b.vy*=0.985;
  if(b.x<16||b.x>W-16)b.vx*=-0.8;b.x=Math.max(16,Math.min(W-16,b.x));
  if(b.y>H-16){b.y=H-16;b.vy*=-0.6}
  // goals
  if(b.y<28&&b.x>W*0.32&&b.x<W*0.68)goal(true);
  if(b.y>H-28&&b.x>W*0.32&&b.x<W*0.68)goal(false);
  // sticky dribble
  if(Math.hypot(state.me.x-b.x,state.me.y-b.y)<20&&Math.hypot(b.vx,b.vy)<40){b.x=state.me.x;b.y=state.me.y-12}
  hud();
}

function drawPlayer(p,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.fill()}
function draw(){
  ctx.fillStyle='#15803d';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.strokeRect(12,24,W-24,H-48);
  ctx.beginPath();ctx.moveTo(12,H/2);ctx.lineTo(W-12,H/2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,40,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(W*0.32,8,W*0.36,18);ctx.fillRect(W*0.32,H-26,W*0.36,18);
  if(!state)return;
  state.mates.forEach(p=>drawPlayer(p,'#93c5fd'));
  state.foes.forEach(p=>drawPlayer(p,'#fca5a5'));
  drawPlayer(state.me,'#38bdf8');
  ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(state.ball.x,state.ball.y,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e2e8f0';ctx.font='13px system-ui';ctx.fillText('目标 '+state.target+' 球',12,H-8);
}

let last=performance.now();
function loop(n){const dt=Math.min(0.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key]=false});
(function(){const pad=document.getElementById('pad'),st=document.getElementById('stick');
function set(cx,cy){const r=pad.getBoundingClientRect();let x=(cx-r.left)/r.width*2-1,y=(cy-r.top)/r.height*2-1;const m=Math.hypot(x,y)||1;if(m>1){x/=m;y/=m}stick={x,y,active:true};st.style.left=(33+x*28)+'px';st.style.top=(33+y*28)+'px'}
function end(){stick={x:0,y:0,active:false};st.style.left='33px';st.style.top='33px'}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);set(e.clientX,e.clientY)});
pad.addEventListener('pointermove',e=>{if(stick.active)set(e.clientX,e.clientY)});
pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
document.getElementById('btnKick').addEventListener('pointerdown',e=>{e.preventDefault();keys._kick=true});
})();

document.getElementById('btnNew').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnContinue').onclick=()=>{unlock();const d=load();if(d&&d.play)newGame(d.play)};
document.getElementById('btnNext').onclick=()=>{unlock();state.myG=0;state.opG=0;state.target=2+Math.min(3,(state.round/2)|0);resetBall();mode='play';hidePanels();persist();sfx('place')};
document.getElementById('btnSaveMenu').onclick=()=>{persist();mode='menu';show('panelMenu');loadMeta()};
document.getElementById('btnRetry').onclick=()=>{unlock();newGame(null)};
document.getElementById('btnOverMenu').onclick=()=>{mode='menu';show('panelMenu');loadMeta()};

loadMeta();resize();if(window.GameAudio)GameAudio.boot('catchy');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
