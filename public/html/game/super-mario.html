<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>超级玛丽 · Super Mario</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;height:100dvh;width:100dvw;background:#020617;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;left:50%;top:50%;width:960px;height:540px;transform:translate(-50%,-50%);background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:auto}

#audioBar{position:absolute;left:0;right:0;top:0;z-index:6;padding:4px 8px;display:flex;align-items:center;gap:6px;pointer-events:none}
#audioBar>*{pointer-events:auto}
#sound-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(15,23,42,.7);color:#e2e8f0;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#sound-btn.is-muted{color:#64748b}
.game-volume{display:flex;align-items:center;gap:3px}
.game-volume span{font-size:10px;color:#94a3b8;display:none}
.game-volume input[type=range]{-webkit-appearance:none;appearance:none;width:64px;height:4px;border-radius:2px;background:rgba(148,163,184,.3);outline:none;cursor:pointer}
.game-volume input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#3b82f6;border:1px solid rgba(255,255,255,.5);cursor:pointer}

#hud{position:absolute;left:0;right:0;top:0;z-index:2;padding:4px 10px;padding-top:36px;font-size:13px;pointer-events:none;text-shadow:0 1px 3px #000;display:flex;gap:10px;flex-wrap:wrap}
#hud b{color:#fde68a}

#touch{display:none;position:absolute;inset:0;pointer-events:none;z-index:3}
#touch .pad{pointer-events:auto;position:absolute;left:1.5%;bottom:2.5%;width:11%;aspect-ratio:1;max-width:96px;min-width:52px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25)}
#touch .stick{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:rgba(255,255,255,.32);transform:translate(0,0)}
#touch .btn-jump{pointer-events:auto;position:absolute;right:2%;bottom:2.5%;width:7%;aspect-ratio:1;max-width:56px;min-width:36px;border-radius:50%;background:rgba(37,99,235,.55);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
#touch .btn-fire{pointer-events:auto;position:absolute;right:11%;bottom:16%;width:6.5%;aspect-ratio:1;max-width:50px;min-width:32px;border-radius:50%;background:rgba(239,68,68,.55);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
@media(pointer:coarse){#touch{display:block}}

#orientTip{display:none;position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:5;max-width:min(92%,320px);padding:10px 14px;border-radius:12px;background:rgba(15,23,42,.92);border:1px solid #fbbf24;color:#e2e8f0;font-size:13px;text-align:center;pointer-events:auto}
#orientTip .row{display:flex;gap:8px;margin-top:8px;justify-content:center}
#orientTip button{font:inherit;border:0;border-radius:999px;padding:8px 14px;background:#2563eb;color:#fff;cursor:pointer}

#ui{position:absolute;inset:0;pointer-events:none;z-index:4}
#ui .panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,340px);background:rgba(10,14,28,.94);border:1px solid #334155;border-radius:14px;padding:16px 18px;text-align:center}
#ui h1{font-size:1.3rem;color:#fbbf24;margin-bottom:6px}
#ui p{font-size:.76rem;line-height:1.4;color:#94a3b8;margin-bottom:4px}
#ui .row{display:flex;gap:8px;margin-top:10px}
#ui button{font:inherit;flex:1;border:0;border-radius:999px;padding:11px 14px;background:#2563eb;color:#fff;cursor:pointer;font-size:.82rem;font-weight:600;transition:background .15s}
#ui button:hover{background:#1d4ed8}
#ui button.ghost{background:#1e293b;border:1px solid #475569}
#ui button.ghost:hover{background:#334155}
.power-badge{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:700;vertical-align:1px}
.power-badge.fire{background:#ef4444;color:#fff}
.power-badge.star{background:#3b82f6;color:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.5}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="audioBar">
    <button type="button" id="sound-btn" data-i18n="tools.game.soundOn">静音</button>
    <label class="game-volume">
      <span data-i18n="tools.game.volume">音量</span>
      <input type="range" id="volume-slider" min="0" max="100" value="50" step="1">
    </label>
  </div>

  <div id="hud">
    <span>得分 <b id="hudScore">0</b></span>
    <span><span style="color:#fde68a">&#9679;</span> <b id="hudCoins">0</b></span>
    <span id="hudPower" style="display:none"></span>
    <span>世界 <b id="hudWorld">1-1</b></span>
    <span>生命 <b id="hudLives">3</b></span>
  </div>

  <div id="orientTip" class="hidden">
    <div>横版闯关，建议 <b>横屏</b> 游玩</div>
    <div class="row"><button type="button" id="btnHideTip">知道了</button></div>
  </div>

  <div id="touch">
    <div class="pad" id="pad"><div class="stick" id="stick"></div></div>
    <div class="btn-jump" id="btnJumpT">跳</div>
    <div class="btn-fire" id="btnFireT">射</div>
  </div>

  <div id="ui">
    <div class="panel" id="panelMenu">
      <h1>超级玛丽</h1>
      <p>横版平台跳跃：踩蘑菇怪、踢龟壳、吃金币、拿道具、冲向旗杆！</p>
      <p style="color:#fbbf24">道具：<span class="power-badge" style="background:#f87171;color:#fff">蘑菇</span> 变大 <span class="power-badge fire">花</span> 发射火球 <span class="power-badge star">星</span> 无敌</p>
      <p>WASD/方向键 · 空格/↑ 跳跃 · J/↓ 射击/踢壳</p>
      <div class="row"><button id="btnStart">开始冒险</button></div>
    </div>
    <div class="panel hidden" id="panelOver">
      <h1 id="overTitle">Game Over</h1>
      <p id="overText"></p>
      <div class="row">
        <button id="btnRetry">再来一局</button>
        <button class="ghost" id="btnMenu">返回标题</button>
      </div>
    </div>
    <div class="panel hidden" id="panelWin">
      <h1 id="winTitle">过关！</h1>
      <p id="winText"></p>
      <div class="row">
        <button id="btnNext">下一关</button>
        <button class="ghost" id="btnWinMenu">返回标题</button>
      </div>
    </div>
    <div class="panel hidden" id="panelPause" style="width:min(60%,200px);padding:12px">
      <h2 style="font-size:1rem;color:#e2e8f0">暂停</h2>
      <div class="row"><button id="btnResume">继续</button></div>
    </div>
  </div>
</div>

<script src="../../js/game/game-audio.js?v=20"></script>
<script>
(function(){'use strict';
// ═══════════════════════════════════════════
//  SUPER MARIO — Canvas Platformer
// ═══════════════════════════════════════════

const SAVE_KEY = 'tbc_super_mario_v1';
const BW = 960, BH = 540, T = 32;
const G = 1680, JV = -540, JB = -580;

const cnv = document.getElementById('c');
const ctx = cnv.getContext('2d');
const wrap = document.getElementById('wrap');
const HUD = {
  sc: document.getElementById('hudScore'), cn: document.getElementById('hudCoins'),
  lv: document.getElementById('hudWorld'), li: document.getElementById('hudLives'),
  pw: document.getElementById('hudPower')
};

// ─── STATE ───
let W = BW, H = BH, sx = 1, sy = 1, mode = 'menu', last = 0, best = 0;
let keys = {}, touchDir = { x: 0, y: 0 }, jumpQ = false, fireQ = false, pauseQ = false;
let cam = 0, ww = 0, wNum = 1, lvNum = 1, inv = 0, levelTime = 300;
let player = null, blocks = [], coins = [], enemies = [], powerUps = [];
let parts = [], texts = [], fireballs = [], shells = [];
let shake = { x: 0, y: 0, f: 0 };
let isPortrait = false, tipHide = false, tipSnooze = false;

try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); best = s.best | 0; tipHide = !!s.tipHide; }
catch (e) {}

function saveMeta() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ best, tipHide })); } catch (e) {} }

// ─── AUDIO ───
let audioOn = false;
function initAudio() { if (!audioOn && window.GameAudio) { GameAudio.bindControls(); GameAudio.startBgm('catchy'); audioOn = true; } }
window.addEventListener('pointerdown', function un() { initAudio(); }, { once: true });
function sf(n) { if (window.GameAudio) GameAudio.sfx(n); }

// ─── HELPERS ───
function cl(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function gy() { return H - T * 2; }
function isMobile() {
  if (matchMedia('(pointer: coarse)').matches) return true;
  if ((navigator.maxTouchPoints || 0) > 1 && matchMedia('(hover: none)').matches) return true;
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
}
function tipUI() {
  const t = document.getElementById('orientTip');
  if (!t) return;
  const s = isMobile() && isPortrait && !tipHide && !tipSnooze;
  t.classList.toggle('hidden', !s); t.style.display = s ? 'block' : 'none';
}

// ─── BUILD LEVEL ───
function buildLevel() {
  blocks = []; coins = []; enemies = []; powerUps = []; parts = []; texts = []; fireballs = []; shells = [];
  const ln = 60 + (wNum * 10) + (lvNum * 8);
  ww = ln * T;

  // ground
  const nGaps = 2 + wNum + lvNum;
  const gaps = [];
  for (let i = 0; i < nGaps; i++) {
    const gx = (ln * 0.15 + i * ((ln * 0.7) / (nGaps + 0.5)) + ri(-3, 3)) * T;
    const gw = ri(2, 3) * T;
    gaps.push({ x: gx, w: gw });
  }
  gaps.sort((a, b) => a.x - b.x);
  let cx = 0;
  gaps.forEach(g => {
    if (g.x > cx) blocks.push({ x: cx, y: gy(), w: g.x - cx, h: H - gy(), kind: 'ground' });
    cx = Math.max(cx, g.x + g.w);
  });
  if (cx < ww) blocks.push({ x: cx, y: gy(), w: ww - cx, h: H - gy(), kind: 'ground' });

  // brick / ? blocks
  for (let i = 0; i < 10 + wNum * 3; i++) {
    const bx = ri(5, ln - 8) * T, by = gy() - ri(3, 7) * T, n = ri(1, 4);
    for (let j = 0; j < n; j++) {
      const k = Math.random() > 0.55 ? 'q' : 'brick';
      blocks.push({ x: bx + j * T, y: by, w: T, h: T, kind: k, used: false, bump: 0 });
    }
  }

  // hidden blocks (invisible 1-up)
  if (lvNum >= 2) {
    for (let i = 0; i < ri(0, 2); i++) {
      blocks.push({ x: ri(10, ln - 15) * T, y: gy() - ri(3, 5) * T, w: T, h: T, kind: 'hidden', used: false, bump: 0 });
    }
  }

  // pipes
  for (let i = 0; i < 2 + Math.floor(wNum / 2); i++) {
    const px = ri(8, ln - 10) * T, ph = ri(2, 3) * T;
    blocks.push({ x: px, y: gy() - ph, w: T * 2, h: ph, kind: 'pipe', plant: false, plantT: rnd(0, 3), plantOut: false, plantY: 0 });
  }

  // moving platforms
  if (wNum >= 2 || lvNum >= 2) {
    for (let i = 0; i < ri(1, 2 + wNum); i++) {
      const mx = ri(8, ln - 18) * T, my = gy() - ri(3, 5) * T, md = ri(2, 4) * T;
      blocks.push({ x: mx, y: my, w: T * 3, h: 12, kind: 'mplat', bx: mx, by: my, my: md, dir: 1, spd: 45 + wNum * 15 });
    }
  }

  // coins
  for (let i = 0; i < 12 + wNum * 4 + lvNum * 2; i++) {
    coins.push({ x: ri(3, ln - 4) * T + rnd(-6, 6), y: gy() - ri(2, 6) * T, w: 14, h: 14, taken: false, ph: rnd(0, 6) });
  }
  // coin arcs over gaps
  gaps.forEach(g => {
    const mx = g.x + g.w / 2;
    if (Math.random() > 0.6) {
      for (let j = 0; j < 5; j++) {
        coins.push({ x: mx - 36 + j * 18, y: gy() - 64 - Math.abs(j - 2) * 20, w: 14, h: 14, taken: false, ph: rnd(0, 6) });
      }
    }
  });

  // enemies
  const ec = 5 + wNum * 2 + lvNum;
  for (let i = 0; i < ec; i++) {
    const r = Math.random();
    let kind = 'goomba';
    if (r > 0.6 && wNum >= 2) kind = 'koopa';
    if (r > 0.85 && wNum >= 2) kind = 'flyer';
    const isFly = kind === 'flyer';
    enemies.push({
      x: ri(8, ln - 10) * T, y: isFly ? gy() - ri(4, 7) * T : gy() - 28,
      w: 28, h: 28, vx: (Math.random() > 0.5 ? 1 : -1) * (60 + wNum * 9),
      vy: 0, dead: false, squish: 0,
      kind,
      flyBase: isFly ? gy() - ri(4, 7) * T : 0,
      flyAmp: isFly ? rnd(20, 40) : 0, flyPh: rnd(0, 6.28),
      shell: false, shellVx: 0, shellT: 0
    });
  }

  // flag
  blocks.push({ x: ww - T * 4, y: gy() - T * 8, w: 8, h: T * 8, kind: 'flag' });
  blocks.push({ x: ww - T * 4 - 10, y: gy() - T * 8, w: 28, h: 20, kind: 'flagtop' });

  levelTime = 300;
}

function spawnPlayer(keep) {
  const prev = keep ? player : null, big = prev ? prev.big : false;
  player = {
    x: T * 3, y: gy() - (big ? 56 : 40), w: 24, h: big ? 48 : 36,
    vx: 0, vy: 0, onGround: false, face: 1, big,
    power: prev ? (prev.power || 'none') : 'none',
    starT: prev ? (prev.starT || 0) : 0, fireT: prev ? (prev.fireT || 0) : 0,
    score: prev ? prev.score : 0, coins: prev ? prev.coins : 0,
    lives: prev ? prev.lives : 3, won: false, frame: 0, ft: 0, dblJump: false
  };
  cam = 0; inv = 2;
}

function updateHUD() {
  if (!player) return;
  HUD.sc.textContent = player.score | 0;
  HUD.cn.textContent = player.coins | 0;
  HUD.lv.textContent = wNum + '-' + lvNum;
  HUD.li.textContent = player.lives | 0;
  if (player.power === 'fire') { HUD.pw.style.display = 'inline'; HUD.pw.innerHTML = '<span class="power-badge fire">炎花</span>'; }
  else if (player.starT > 0) { HUD.pw.style.display = 'inline'; HUD.pw.innerHTML = '<span class="power-badge star">无敌 ' + Math.ceil(player.starT) + 's</span>'; }
  else HUD.pw.style.display = 'none';
}

function burst(x, y, c, n, v) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-(v || 150), v || 150), vy: rnd(-260, -60), life: rnd(0.15, 0.4), c, r: rnd(1.5, 4) });
}

function solids() { return blocks.filter(b => b.kind !== 'flag' && b.kind !== 'flagtop'); }

function worldCollide(body, dx, dy) {
  let nx = body.x + dx, ny = body.y + dy, hx = false, hy = false, grd = false;
  const sl = solids();
  let box = { x: nx, y: body.y, w: body.w, h: body.h };
  for (const b of sl) {
    if (!aabb(box, b)) continue;
    if (dx > 0) nx = b.x - body.w; else if (dx < 0) nx = b.x + b.w;
    hx = true;
  }
  box.x = nx; box.y = ny;
  for (const b of sl) {
    if (!aabb(box, b)) continue;
    if (dy > 0) { ny = b.y - body.h; grd = true; }
    else if (dy < 0) { ny = b.y + b.h; if (b.kind === 'brick' || b.kind === 'q' || b.kind === 'used' || b.kind === 'hidden') hitBlock(b); }
    hy = true;
  }
  return { x: nx, y: ny, hx, hy, grd };
}

function hitBlock(b) {
  if (b.bump > 0) return;
  b.bump = 0.18; sf('brick');
  if ((b.kind === 'q' || b.kind === 'hidden') && !b.used) {
    b.used = true;
    if (b.kind === 'hidden') {
      powerUps.push({ x: b.x, y: b.y - 24, w: 20, h: 20, vx: 70, vy: -40, kind: '1up', life: 8, col: '#4ade80' });
    } else {
      const r = Math.random();
      if (r < 0.3 && !player.big)
        powerUps.push({ x: b.x, y: b.y - 24, w: 20, h: 20, vx: 75, vy: -40, kind: 'mush', life: 8, col: '#f87171' });
      else if (r < 0.5)
        powerUps.push({ x: b.x, y: b.y - 24, w: 20, h: 20, vx: 55, vy: -40, kind: 'flower', life: 8, col: '#facc15' });
      else if (r < 0.6)
        powerUps.push({ x: b.x, y: b.y - 24, w: 20, h: 20, vx: 110, vy: -180, kind: 'star', life: 8, col: '#38bdf8' });
      else {
        player.coins++; player.score += 100; texts.push({ x: b.x + 8, y: b.y - 10, t: 0, tx: '+1', c: '#fbbf24' });
        sf('coin'); burst(b.x + T / 2, b.y, '#fde68a', 6, 100);
      }
    }
    if (b.kind === 'q') b.kind = 'used';
    else if (b.kind === 'hidden') { const i = blocks.indexOf(b); if (i >= 0) blocks.splice(i, 1); }
    updateHUD();
  } else if (b.kind === 'brick' && player.big) {
    const i = blocks.indexOf(b); if (i >= 0) blocks.splice(i, 1);
    player.score += 50; shake.f = Math.max(shake.f, 4); burst(b.x + T / 2, b.y + T / 2, '#fb923c', 12, 160); sf('brick'); updateHUD();
  }
}

// ─── PLAYER ───
function hurt() {
  if (inv > 0 || !player || player.won) return;
  if (player.starT > 0) return;
  if (player.big) { player.big = false; player.h = 36; player.y += 12; player.power = 'none'; inv = 1.8; shake.f = Math.max(shake.f, 6); sf('hit'); updateHUD(); return; }
  if (player.power === 'fire') { player.power = 'none'; inv = 1.8; shake.f = Math.max(shake.f, 6); sf('hit'); updateHUD(); return; }
  player.lives--; shake.f = Math.max(shake.f, 8); sf('hit'); updateHUD();
  if (player.lives <= 0) endGame(false); else { spawnPlayer(true); updateHUD(); }
}

function endGame(win) {
  mode = 'over';
  const sc = player ? player.score : 0; best = Math.max(best, sc); saveMeta();
  if (win) {
    document.getElementById('panelWin').classList.remove('hidden');
    document.getElementById('winTitle').textContent = '世界 ' + wNum + '-' + lvNum + ' 过关！';
    document.getElementById('winText').textContent = '得分 ' + sc + ' · 金币 ' + (player ? player.coins : 0) + ' · 最高 ' + best;
    sf('win');
  } else {
    document.getElementById('panelOver').classList.remove('hidden');
    document.getElementById('overTitle').textContent = 'Game Over';
    document.getElementById('overText').textContent = '得分 ' + sc + ' · 到达世界 ' + wNum + '-' + lvNum + ' · 最高 ' + best;
    sf('lose');
  }
  if (window.GameAudio) GameAudio.stopBgm(); updateHUD();
}

function nextLevel() {
  if (lvNum < 4) lvNum++; else { wNum++; lvNum = 1; }
  player.score += 1500 * wNum;
  buildLevel(); spawnPlayer(true); updateHUD();
  texts.push({ x: player.x, y: player.y - 40, t: 0, tx: '世界 ' + wNum + '-' + lvNum, c: '#38bdf8' });
  sf('level');
}

function newGame() {
  initAudio(); tipSnooze = true; tipUI();
  wNum = 1; lvNum = 1; buildLevel(); spawnPlayer(false); mode = 'play';
  document.getElementById('panelMenu').classList.add('hidden');
  document.getElementById('panelOver').classList.add('hidden');
  document.getElementById('panelWin').classList.add('hidden');
  document.getElementById('panelPause').classList.add('hidden');
  sf('start'); updateHUD();
}

// ─── UPDATE ───
function upd(dt) {
  if (mode !== 'play' || !player || player.won) return;

  levelTime -= dt;
  if (levelTime <= 0) { hurt(); levelTime = 0; }

  let ix = 0;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (touchDir.x > 0.25) ix += 1; else if (touchDir.x < -0.25) ix -= 1;
  const spd = player.big ? 240 : 220;
  player.vx = ix * spd;
  if (ix) player.face = ix;

  const wj = keys[' '] || keys['k'] || keys['arrowup'] || keys['w'] || jumpQ;
  if (wj && player.onGround) { player.vy = player.big ? JB : JV; player.onGround = false; sf('jump'); }
  jumpQ = false; keys[' '] = false; keys['k'] = false; keys['arrowup'] = false; keys['w'] = false;

  if ((keys['j'] || keys['arrowdown'] || fireQ) && player.power === 'fire' && player.fireT <= 0) {
    fireballs.push({ x: player.x + (player.face > 0 ? player.w : -8), y: player.y + player.h / 2 - 4, vx: player.face * 400, vy: -30, w: 10, h: 10, life: 1.6, bounce: 2 });
    player.fireT = 0.38; sf('shoot');
  }
  fireQ = false; keys['j'] = false; keys['arrowdown'] = false;

  if (keys['escape'] || pauseQ) { mode = 'paused'; document.getElementById('panelPause').classList.remove('hidden'); }
  pauseQ = false; keys['escape'] = false;

  player.vy += G * dt;
  const c1 = worldCollide(player, player.vx * dt, 0);
  player.x = c1.x; if (c1.hx) player.vx = 0;
  const c2 = worldCollide(player, 0, player.vy * dt);
  player.y = c2.y; if (c2.hy) { if (player.vy > 0) player.onGround = true; player.vy = 0; }
  else player.onGround = c2.grd;

  if (player.onGround && Math.abs(player.vx) > 10) { player.ft += dt; if (player.ft > 0.1) { player.frame = (player.frame + 1) % 4; player.ft = 0; } }
  else if (player.onGround) { player.frame = 0; player.ft = 0; }
  else player.frame = 5;

  if (player.y > H + 40) hurt();
  if (player.fireT > 0) player.fireT -= dt;
  if (player.starT > 0) player.starT -= dt;

  // flag
  for (const b of blocks) { if ((b.kind === 'flag' || b.kind === 'flagtop') && aabb(player, b)) {
    player.won = true; player.score += 500 + wNum * 300; sf('win'); updateHUD();
    setTimeout(() => { if (mode === 'play') nextLevel(); }, 700);
    break;
  }}

  // coins
  for (const c of coins) { if (c.taken) continue; c.ph += dt * 8;
    if (aabb(player, c)) { c.taken = true; player.coins++; player.score += 100; sf('coin'); burst(c.x + 7, c.y + 7, '#fde68a', 5, 80); }
    if (player.coins >= 100) { player.coins -= 100; player.lives++; sf('power'); texts.push({ x: player.x, y: player.y - 30, t: 0, tx: '1UP!', c: '#4ade80' }); }
  }
  updateHUD();

  // power-ups
  for (const p of powerUps) {
    p.life -= dt; if (p.life <= 0) continue;
    p.vy = (p.vy || 0) + G * dt; p.x += (p.vx || 0) * dt; p.y += p.vy * dt;
    const pc = worldCollide(p, 0, 0); if (pc.hx) p.vx *= -1; if (pc.hy) p.vy = 0;
    if (aabb(player, p)) {
      if (p.kind === 'mush') { if (!player.big) { player.big = true; player.h = 48; player.y -= 12; } player.score += 200; texts.push({ x: player.x, y: player.y - 30, t: 0, tx: '变大!', c: '#f87171' }); sf('power'); }
      else if (p.kind === 'flower') { player.power = 'fire'; if (!player.big) { player.big = true; player.h = 48; player.y -= 12; } texts.push({ x: player.x, y: player.y - 30, t: 0, tx: '炎花!', c: '#facc15' }); sf('power'); }
      else if (p.kind === 'star') { player.starT = 10; texts.push({ x: player.x, y: player.y - 30, t: 0, tx: '无敌!', c: '#38bdf8' }); sf('power'); }
      else if (p.kind === '1up') { player.lives++; texts.push({ x: player.x, y: player.y - 30, t: 0, tx: '1UP!', c: '#4ade80' }); sf('power'); }
      p.life = 0; burst(p.x + 10, p.y + 10, p.col, 8, 90); updateHUD();
    }
    if (p.x < -40 || p.x > ww + 40) p.life = 0;
  }
  powerUps = powerUps.filter(p => p.life > 0);

  // enemies
  for (const e of enemies) {
    if (e.dead) { e.squish += dt; continue; }
    if (e.shell) {
      e.x += e.shellVx * dt;
      e.shellT -= dt;
      if (e.shellT <= 0) { e.shell = false; e.kind = 'koopa'; e.vx = (Math.random() > 0.5 ? 1 : -1) * (60 + wNum * 9); }
    } else if (e.kind === 'goomba' || e.kind === 'koopa') {
      const er = worldCollide(e, e.vx * dt, 0); e.x = er.x; if (er.hx) e.vx *= -1;
      e.vy = (e.vy || 0) + G * dt;
      const ey = worldCollide(e, 0, e.vy * dt); e.y = ey.y; if (ey.hy) e.vy = 0;
    } else if (e.kind === 'flyer') {
      e.x += e.vx * dt; if (e.x < T * 2 || e.x > ww - T * 3) e.vx *= -1;
      e.flyPh += dt * 2.2; e.y = e.flyBase + Math.sin(e.flyPh) * e.flyAmp;
    }
    // shell kills other enemies
    if (e.shell && Math.abs(e.shellVx) > 40) {
      for (const o of enemies) { if (o === e || o.dead) continue;
        if (aabb(e, o)) { o.dead = true; o.squish = 0; player.score += 300; burst(o.x + o.w / 2, o.y + o.h / 2, '#fbbf24', 12, 150); sf('hit'); updateHUD(); }
      }
    }
    if (!aabb(player, e) || inv > 0) continue;
    if (player.starT > 0) { e.dead = true; e.squish = 0; player.score += 300; sf('hit'); burst(e.x + e.w / 2, e.y + e.h / 2, '#38bdf8', 14, 180); updateHUD(); continue; }
    // stomp
    if (player.vy > 30 && player.y + player.h - e.y < 24) {
      if (e.kind === 'koopa' && !e.shell) {
        e.shell = true; e.shellVx = 0; e.shellT = 5;
        player.vy = -340; player.score += 200; sf('hit');
      } else if (e.shell) {
        e.shellVx = player.face * 500;
        player.vy = -340; player.score += 400; sf('hit');
      } else {
        e.dead = true; e.squish = 0; player.vy = -340; player.score += 200;
      }
      burst(e.x + e.w / 2, e.y + e.h, '#a3e635', 10, 110); sf('hit'); updateHUD();
    } else hurt();
  }
  enemies = enemies.filter(e => !e.dead || e.squish < 0.5);

  // shells
  for (const e of enemies) {
    if (!e.shell || Math.abs(e.shellVx) < 40) continue;
    const sc = worldCollide(e, e.shellVx * dt, 0);
    if (sc.hx) e.shellVx *= -1;
    // shell break bricks
    for (let i = blocks.length - 1; i >= 0; i--) {
      if (blocks[i].kind === 'brick' && aabb(e, blocks[i])) { blocks.splice(i, 1); player.score += 50; burst(blocks[i] ? blocks[i].x : e.x, e.y, '#fb923c', 8, 120); sf('brick'); }
    }
  }

  // fireballs
  for (const fb of fireballs) {
    fb.x += fb.vx * dt; fb.y += fb.vy * dt; fb.vy += 500 * dt; fb.life -= dt;
    for (const e of enemies) { if (e.dead) continue; if (aabb(fb, e)) { e.dead = true; e.squish = 0; fb.life = 0; player.score += 200; burst(e.x + e.w / 2, e.y + e.h / 2, '#facc15', 10, 130); sf('hit'); updateHUD(); break; } }
    const fc = worldCollide(fb, 0, 0);
    if (fc.hx || fc.grd) { if (fb.bounce > 0) { fb.vy = -200; fb.bounce--; } else fb.life = 0; }
    else fc.hy ? fb.life = 0 : null;
    if (fb.x < -20 || fb.x > ww + 20 || fb.y > H + 40) fb.life = 0;
  }
  fireballs = fireballs.filter(fb => fb.life > 0);

  // moving platforms
  for (const b of blocks) {
    if (b.kind !== 'mplat') continue;
    b.y += b.dir * b.spd * dt;
    if (b.y < b.by - b.my) { b.y = b.by - b.my; b.dir = 1; }
    if (b.y > b.by) { b.y = b.by; b.dir = -1; }
    if (player && aabb({ x: player.x + 2, y: player.y + player.h, w: player.w - 4, h: 4 }, b)) {
      player.y = b.y - player.h; player.vy = 0; player.onGround = true;
    }
  }

  // piranha plants
  for (const b of blocks) {
    if (b.kind !== 'pipe') continue;
    b.plantT -= dt;
    if (b.plantT <= 0) {
      b.plantOut = !b.plantOut;
      b.plantT = b.plantOut ? 1.2 + Math.random() * 1.5 : 2 + Math.random() * 3;
      b.plantY = b.plantOut ? b.y - T : b.y;
    }
    if (b.plantOut) {
      const plantR = b.plantOut ? (b.plantT > 0.6 ? (1 - b.plantT / 1.2) * T * 2 : b.plantT * T * 1.5) : 0;
      const px = b.x + T / 2 - 10, py = b.y - plantR;
      if (player && !player.won && inv <= 0 && aabb(player, { x: px, y: py, w: 20, h: plantR })) {
        if (player.starT > 0) { b.plantOut = false; b.plantT = 3; player.score += 200; sf('hit'); burst(px + 10, py + plantR / 2, '#22c55e', 10, 100); }
        else hurt();
      }
    }
  }

  for (const b of blocks) { if (b.bump > 0) b.bump -= dt; }
  cam = cl(player.x - W * 0.35, 0, Math.max(0, ww - W));
  if (inv > 0) inv -= dt;
  if (shake.f > 0) { shake.f *= Math.pow(0.03, dt); if (shake.f < 0.3) shake.f = 0; shake.x = (Math.random() - 0.5) * shake.f * 2; shake.y = (Math.random() - 0.5) * shake.f * 2; }
  else { shake.x = 0; shake.y = 0; }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.t += dt; t.y -= 30 * dt; }
  texts = texts.filter(t => t.t < 1.2);
}

// ─── DRAW ───
function wx(x) { return x - cam; }
function draw() {
  ctx.setTransform(sx, 0, 0, sy, shake.x, shake.y);

  // sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3b82f6'); g.addColorStop(1, '#93d2ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 8; i++) {
    const cx = ((i * 170 + 60 - cam * 0.15) % (W + 260) + W + 260) % (W + 260) - 40;
    const cy = 36 + (i % 5) * 22;
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, 6.28); ctx.arc(cx + 18, cy - 6, 18, 0, 6.28); ctx.arc(cx + 38, cy, 12, 0, 6.28); ctx.fill();
  }

  // hills
  ctx.fillStyle = '#22c55e';
  for (let i = 0; i < 10; i++) {
    const hx = ((i * 140 - cam * 0.3) % (W + 220) + W + 220) % (W + 220) - 40;
    const hh = 40 + (i % 4) * 25;
    ctx.beginPath(); ctx.moveTo(hx, gy()); ctx.quadraticCurveTo(hx + 50, gy() - hh, hx + 110, gy()); ctx.fill();
  }

  // blocks
  for (const b of blocks) {
    const x = wx(b.x), y = b.y - (b.bump > 0 ? 8 : 0);
    if (x + b.w < -20 || x > W + 20) continue;

    if (b.kind === 'ground') {
      ctx.fillStyle = '#c4a574'; ctx.fillRect(x, b.y, b.w + 1, b.h);
      ctx.fillStyle = '#5a9e3e'; ctx.fillRect(x, b.y, b.w + 1, 9);
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      for (let gx = Math.floor(x / 18) * 18; gx < x + b.w; gx += 18) { ctx.fillRect(gx + 3, b.y, 3, 5); ctx.fillRect(gx + 10, b.y, 2, 4); }
    } else if (b.kind === 'brick') {
      ctx.fillStyle = '#c2410c'; ctx.fillRect(x, y, b.w - 1, b.h - 1);
      ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, b.w - 2, b.h - 2);
      ctx.fillStyle = '#7c2d12'; ctx.fillRect(x + 1, y + b.h / 2 - 0.5, b.w - 3, 1);
    } else if (b.kind === 'q' || b.kind === 'used') {
      ctx.fillStyle = b.kind === 'used' ? '#a8a29e' : '#fbbf24'; ctx.fillRect(x, y, b.w - 1, b.h - 1);
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeRect(x + 0.5, y + 0.5, b.w - 2, b.h - 2);
      if (b.kind === 'q') { ctx.fillStyle = '#78350f'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center'; ctx.fillText('?', x + b.w / 2, y + 23); }
    } else if (b.kind === 'hidden') {
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(x + 2, y + 2, b.w - 4, b.h - 4);
    } else if (b.kind === 'pipe') {
      ctx.fillStyle = '#16a34a'; ctx.fillRect(x + 4, y + 14, b.w - 8, b.h - 14);
      ctx.fillStyle = '#22c55e'; ctx.fillRect(x, y, b.w, 18);
      ctx.fillStyle = '#15803d'; ctx.fillRect(x, y, 6, 18); ctx.fillRect(x + b.w - 6, y, 6, 18);
      ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(x + 9, y, 4, 18);
      // piranha plant
      if (b.plantOut) {
        const pr = b.plantT > 0.6 ? (1 - b.plantT / 1.2) * T * 2 : b.plantT * T * 1.5;
        const px = b.x + T / 2 - 8;
        ctx.fillStyle = '#22c55e'; ctx.fillRect(wx(px), b.y - pr, 16, pr);
        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(wx(px + 8), b.y - pr, 9, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(wx(px + 4), b.y - pr - 2, 3, 0, 6.28); ctx.fill();
        ctx.beginPath(); ctx.arc(wx(px + 12), b.y - pr - 2, 3, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(wx(px + 5), b.y - pr - 1, 1, 0, 6.28); ctx.fill();
        ctx.beginPath(); ctx.arc(wx(px + 11), b.y - pr - 1, 1, 0, 6.28); ctx.fill();
      }
    } else if (b.kind === 'mplat') {
      ctx.fillStyle = '#d97706'; ctx.fillRect(x, y, b.w, b.h);
      ctx.fillStyle = '#f59e0b'; ctx.fillRect(x, y, b.w, 5);
      ctx.strokeStyle = '#92400e'; ctx.strokeRect(x + 0.5, y + 0.5, b.w - 1, b.h - 1);
    } else if (b.kind === 'flag') {
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(x, y, b.w, b.h);
      ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(x + 4, y, 6, 0, 6.28); ctx.fill();
    } else if (b.kind === 'flagtop') {
      ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + b.w, y + b.h / 2); ctx.lineTo(x, y + b.h); ctx.fill();
      ctx.fillStyle = '#fde68a'; ctx.beginPath();
      for (let i = 0; i < 5; i++) { const a = i * 1.2566 - 1.5708; i === 0 ? ctx.moveTo(x + 10 + Math.cos(a) * 6, y + 8 + Math.sin(a) * 6) : ctx.lineTo(x + 10 + Math.cos(a) * 6, y + 8 + Math.sin(a) * 6); }
      ctx.fill();
    }
  }

  // coins
  for (const c of coins) {
    if (c.taken) continue; const x = wx(c.x), y = c.y + Math.sin(c.ph) * 3;
    const sx = Math.abs(Math.cos(c.ph));
    ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.ellipse(x + 7, y + 7, 7 * Math.max(0.2, sx), 8, 0, 0, 6.28); ctx.fill();
    if (sx > 0.45) { ctx.fillStyle = '#fde68a'; ctx.fillRect(x + 4, y + 2, 3, 7); }
  }

  // power-ups
  for (const p of powerUps) {
    const x = wx(p.x), y = p.y;
    if (p.kind === 'mush' || p.kind === '1up') {
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.ellipse(x + 10, y + 12, 11, 10, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#fef2f2'; ctx.fillRect(x + 6, y + 6, 8, 6);
      ctx.fillStyle = '#e5e7eb'; ctx.fillRect(x + 3, y + 14, 14, 6);
      ctx.fillStyle = '#111'; ctx.fillRect(x + 7, y + 10, 2, 2); ctx.fillRect(x + 12, y + 10, 2, 2);
    } else if (p.kind === 'flower') {
      ctx.fillStyle = '#22c55e'; ctx.fillRect(x + 8, y + 4, 4, 14);
      ctx.fillStyle = p.col;
      for (let i = 0; i < 5; i++) { const a = i * 1.2566; ctx.beginPath(); ctx.arc(x + 10 + Math.cos(a) * 5, y + 10 + Math.sin(a) * 5, 3.5, 0, 6.28); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 10, y + 10, 3.5, 0, 6.28); ctx.fill();
    } else if (p.kind === 'star') {
      ctx.fillStyle = p.col; ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i * 0.6283 - 1.5708, r = i % 2 === 0 ? 9 : 4; i === 0 ? ctx.moveTo(x + 10 + Math.cos(a) * r, y + 10 + Math.sin(a) * r) : ctx.lineTo(x + 10 + Math.cos(a) * r, y + 10 + Math.sin(a) * r); }
      ctx.closePath(); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 10, y + 10, 3, 0, 6.28); ctx.fill();
    }
  }

  // enemies
  for (const e of enemies) {
    const x = wx(e.x), y = e.y;
    if (e.dead) { ctx.fillStyle = '#78716c'; ctx.fillRect(x, y + e.h - 8, e.w, 8); continue; }
    if (e.kind === 'goomba') {
      ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.ellipse(x + e.w / 2, y + e.h / 2 + 2, e.w / 2 + 1, e.h / 2 - 2, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#111'; ctx.fillRect(x + 6, y + 8, 2, 2); ctx.fillRect(x + 18, y + 8, 2, 2);
      ctx.fillStyle = '#dc2626'; ctx.fillRect(x + 4, y + 14, e.w - 8, 4);
      ctx.fillStyle = '#110'; ctx.fillRect(x + 4, y + e.h - 5, 6, 4); ctx.fillRect(x + e.w - 10, y + e.h - 5, 6, 4);
    } else if (e.kind === 'koopa' && !e.shell) {
      ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(x + e.w / 2, y + e.h / 2 + 2, e.w / 2 + 1, e.h / 2 - 2, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#111'; ctx.fillRect(x + 7, y + 8, 2, 2); ctx.fillRect(x + 17, y + 8, 2, 2);
      ctx.fillStyle = '#fbbf24'; ctx.fillRect(x + 4, y + 14, e.w - 8, 4);
      ctx.fillStyle = '#110'; ctx.fillRect(x + 4, y + e.h - 5, 6, 4); ctx.fillRect(x + e.w - 10, y + e.h - 5, 6, 4);
    } else if (e.shell) {
      ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(x + e.w / 2, y + e.h - 6, e.w / 2 + 1, 8, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#fbbf24'; ctx.fillRect(x + 3, y + e.h - 10, e.w - 6, 5);
    } else if (e.kind === 'flyer') {
      ctx.fillStyle = '#7c3aed'; ctx.beginPath(); ctx.ellipse(x + e.w / 2, y + e.h / 2, 12, 12, 0, 0, 6.28); ctx.fill();
      const wu = Math.sin(e.flyPh * 6) > 0, wy = wu ? -12 : -4;
      ctx.fillStyle = '#a78bfa';
      ctx.beginPath(); ctx.moveTo(x + 2, y + e.h / 2); ctx.lineTo(x - 8, y + wy); ctx.lineTo(x + 6, y + e.h / 2 - 4); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + e.w - 2, y + e.h / 2); ctx.lineTo(x + e.w + 8, y + wy); ctx.lineTo(x + e.w - 6, y + e.h / 2 - 4); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(x + 8, y + 10, 3, 3); ctx.fillRect(x + e.w - 11, y + 10, 3, 3);
    }
  }

  // fireballs
  for (const fb of fireballs) {
    const x = wx(fb.x), y = fb.y;
    ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(x + 5, y + 5, 5, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(x + 5, y + 5, 3, 0, 6.28); ctx.fill();
  }

  // player
  if (player) {
    const blink = inv > 0 && ((inv * 12) | 0) % 2 === 0;
    const starGlow = player.starT > 0 && ((player.starT * 10) | 0) % 3 !== 0;
    if (!blink) {
      const x = wx(player.x), y = player.y;
      ctx.save(); ctx.translate(x + player.w / 2, y + player.h); ctx.scale(player.face, 1);
      if (starGlow) { ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 14; }

      // shoes
      ctx.fillStyle = '#7c2d12'; ctx.fillRect(-12, -8, 10, 8); ctx.fillRect(2, -8, 10, 8);
      // pants
      ctx.fillStyle = '#1d4ed8'; ctx.fillRect(-10, player.big ? -28 : -22, 20, player.big ? 20 : 14);
      // body
      const bt = player.big ? -44 : -34, bh = player.big ? 18 : 14;
      ctx.fillStyle = player.power === 'fire' ? '#fff' : '#ef4444'; ctx.fillRect(-11, bt, 22, bh);
      if (player.power === 'fire') { ctx.fillStyle = '#ef4444'; ctx.fillRect(-11, bt, 22, 3); }
      // arms
      if (player.frame === 1 || player.frame === 3) { ctx.fillStyle = '#f5c6a0'; if (player.frame === 1) ctx.fillRect(-16, bt + 1, 5, 6); else ctx.fillRect(11, bt + 1, 5, 6); }
      // head
      ctx.fillStyle = '#f5c6a0'; ctx.beginPath(); ctx.arc(0, player.big ? -52 : -40, 9, 0, 6.28); ctx.fill();
      // hat
      ctx.fillStyle = player.power === 'fire' ? '#fff' : '#dc2626'; ctx.fillRect(-11, player.big ? -60 : -48, 22, 8);
      ctx.fillRect(-6, player.big ? -64 : -52, 12, 6);
      if (player.power === 'fire') { ctx.fillStyle = '#ef4444'; ctx.fillRect(-6, player.big ? -62 : -50, 12, 3); }
      // eyes
      ctx.fillStyle = '#111'; ctx.fillRect(-2, player.big ? -54 : -42, 2, 2); ctx.fillRect(5, player.big ? -54 : -42, 2, 2);

      ctx.shadowBlur = 0; ctx.restore();
    }
  }

  // particles
  for (const p of parts) { ctx.globalAlpha = cl(p.life * 2.5, 0, 1); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(wx(p.x), p.y, p.r, 0, 6.28); ctx.fill(); }
  ctx.globalAlpha = 1;

  // float texts
  for (const t of texts) { ctx.globalAlpha = 1 - t.t / 1.2; ctx.fillStyle = t.c; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center'; ctx.fillText(t.tx, wx(t.x), t.y); }
  ctx.globalAlpha = 1;

  if (mode === 'menu') { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, H); }

  // time bar
  if (mode === 'play') {
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(W / 2 - 40, H - 14, 80, 8);
    const tp = cl(levelTime / 300, 0, 1);
    ctx.fillStyle = tp < 0.25 ? '#ef4444' : '#22c55e';
    ctx.fillRect(W / 2 - 39, H - 13, 78 * tp, 6);
  }

  ctx.textAlign = 'left';
}

// ─── LOOP ───
function loop(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0.016); last = ts;
  if (mode === 'play') upd(dt);
  draw(); requestAnimationFrame(loop);
}

// ─── INPUT ───
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (mode === 'play') {
    if (k === ' ' || k === 'k' || k === 'arrowup' || k === 'w') { e.preventDefault(); jumpQ = true; }
    if (k === 'j' || k === 'arrowdown') { e.preventDefault(); fireQ = true; }
    if (k === 'escape') { e.preventDefault(); pauseQ = true; }
  }
  if (mode === 'paused' && k === 'escape') { mode = 'play'; document.getElementById('panelPause').classList.add('hidden'); }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// touch
(function () {
  const pad = document.getElementById('pad'), stick = document.getElementById('stick');
  let sid = null;
  function setStick(cx, cy) {
    const r = pad.getBoundingClientRect(); if (r.width < 1) return;
    const lw = pad.clientWidth, lh = pad.clientHeight;
    const lx = (cx - r.left) / r.width * lw, ly = (cy - r.top) / r.height * lh;
    let x = lx - lw / 2, y = ly - lh / 2;
    const m = Math.hypot(x, y) || 1, mag = cl(m / (lw * 0.36), 0, 1);
    x = (x / m) * mag; y = (y / m) * mag; touchDir = { x, y };
    stick.style.transform = 'translate(' + (x * lw * 0.2) + 'px,' + (y * lh * 0.2) + 'px)';
  }
  function end() { sid = null; touchDir = { x: 0, y: 0 }; stick.style.transform = 'translate(0,0)'; }
  function byId(l, id) { for (let i = 0; i < l.length; i++) if (l[i].identifier === id) return l[i]; return null; }
  pad.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); if (sid != null) return; sid = e.changedTouches[0].identifier; setStick(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });
  window.addEventListener('touchmove', e => { if (sid == null) return; const t = byId(e.touches, sid); if (!t) return; e.preventDefault(); setStick(t.clientX, t.clientY); }, { passive: false });
  window.addEventListener('touchend', e => { if (sid != null && byId(e.changedTouches, sid)) end(); }, { passive: false });
  window.addEventListener('touchcancel', e => { if (sid != null && byId(e.changedTouches, sid)) end(); }, { passive: false });
  document.getElementById('btnJumpT').addEventListener('touchstart', e => { e.preventDefault(); initAudio(); jumpQ = true; }, { passive: false });
  document.getElementById('btnFireT').addEventListener('touchstart', e => { e.preventDefault(); initAudio(); fireQ = true; }, { passive: false });
})();

// buttons
document.getElementById('btnStart').onclick = () => newGame();
document.getElementById('btnRetry').onclick = () => newGame();
document.getElementById('btnNext').onclick = () => { document.getElementById('panelWin').classList.add('hidden'); mode = 'play'; };
document.getElementById('btnResume').onclick = () => { mode = 'play'; document.getElementById('panelPause').classList.add('hidden'); };
document.getElementById('btnMenu').onclick = () => { mode = 'menu'; document.getElementById('panelOver').classList.add('hidden'); document.getElementById('panelMenu').classList.remove('hidden'); if (window.GameAudio) GameAudio.stopBgm(); };
document.getElementById('btnWinMenu').onclick = () => { mode = 'menu'; document.getElementById('panelWin').classList.add('hidden'); document.getElementById('panelMenu').classList.remove('hidden'); if (window.GameAudio) GameAudio.stopBgm(); };
document.getElementById('btnHideTip').onclick = () => { tipHide = true; saveMeta(); tipUI(); };

function resize() {
  const vw = Math.max(320, innerWidth | 0), vh = Math.max(240, innerHeight | 0);
  const sc = Math.min(vw / BW, vh / BH);
  const dw = Math.max(1, Math.floor(BW * sc)), dh = Math.max(1, Math.floor(BH * sc));
  wrap.style.width = dw + 'px'; wrap.style.height = dh + 'px';
  const dpr = Math.min(2.5, devicePixelRatio || 1);
  cnv.style.width = dw + 'px'; cnv.style.height = dh + 'px';
  cnv.width = Math.floor(dw * dpr); cnv.height = Math.floor(dh * dpr);
  sx = cnv.width / BW; sy = cnv.height / BH;
  W = BW; H = BH; isPortrait = vh > vw * 1.05; tipUI();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize(); requestAnimationFrame(loop);
})();
</script>
</body>
