<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>坦克大战 · Tank Battle</title>
<style>
/* ========== 全局样式 ========== */
html,body{margin:0;padding:0;width:100%;height:100%;background:#0a0a12;overflow:hidden;
  font-family:"Segoe UI",Arial,"Microsoft YaHei",sans-serif;touch-action:none;
  -webkit-user-select:none;user-select:none;
  height:100dvh;width:100dvw;}
#rotWrap{
  position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(ellipse at center,#141428 0%,#07070d 100%);
}
#gameWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
#gameCanvas{display:block;background:#000;box-shadow:0 0 40px rgba(80,160,255,.25),0 0 120px rgba(0,0,0,.8);
  border-radius:6px;max-width:100%;max-height:100%;}
/* 虚拟摇杆与按钮（仅触屏显示）——坐标相对旋转后的舞台 */
.touchUI{position:absolute;z-index:40;display:none;}
#joyBase{left:0;bottom:5%;width:28%;max-width:140px;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:2px solid rgba(255,255,255,.25);}
#joyKnob{position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#8fd0ff,#2f6bd8);
  box-shadow:0 0 14px rgba(90,170,255,.7);}
.tBtn{border-radius:50%;border:2px solid rgba(255,255,255,.3);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000;}
#btnFire{right:4%;bottom:6%;width:16%;max-width:88px;aspect-ratio:1;font-size:15px;
  background:radial-gradient(circle at 35% 30%,#ff9d7a,#c2402a);}
#btnPause{right:22%;bottom:18%;width:11%;max-width:60px;aspect-ratio:1;font-size:12px;
  background:radial-gradient(circle at 35% 30%,#c9c9e8,#565688);}
/* 合作联机大厅 */
#coopPanel{display:none;position:absolute;inset:0;z-index:50;align-items:center;justify-content:center;
  background:rgba(5,6,14,.88);padding:16px;box-sizing:border-box;}
#coopPanel.open{display:flex;}
.coop-box{width:min(420px,96vw);background:#15182a;border:1px solid rgba(255,210,74,.35);border-radius:14px;
  padding:18px 16px;color:#e8ecf8;font-size:14px;}
.coop-box h2{margin:0 0 10px;font-size:18px;color:#ffd24a;text-align:center;}
.coop-box label{display:block;margin:8px 0 4px;color:#9fb0d0;font-size:12px;}
.coop-box input{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid #3a4158;
  background:#0e1220;color:#fff;font-size:14px;}
.coop-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.coop-actions .tb-btn{flex:1;min-width:110px;background:#2563eb;color:#fff;border:0;border-radius:999px;
  padding:10px 12px;font-weight:700;cursor:pointer;}
.coop-roster{margin-top:12px;background:#0e1220;border-radius:8px;padding:8px 10px;min-height:80px;
  font-size:13px;line-height:1.5;color:#c8d0e8;}
.coop-msg{margin-top:8px;color:#ff9d7a;font-size:12px;min-height:1.2em;}
.coop-hint{margin-top:10px;font-size:11px;color:#7a849c;line-height:1.4;}
</style>
</head>
<body>
<div id="rotWrap">
  <div id="gameWrap"><canvas id="gameCanvas" width="960" height="540"></canvas></div>
  <div id="joyBase" class="touchUI"><div id="joyKnob"></div></div>
  <div id="btnFire" class="tBtn touchUI">开火</div>
  <div id="btnPause" class="tBtn touchUI">暂停</div>
  <div id="coopPanel" aria-hidden="true">
    <div class="coop-box">
      <h2>合作联机（最多 8 人）</h2>
      <label>昵称</label>
      <input id="coopName" maxlength="16" placeholder="Player" autocomplete="off">
      <label>房间密码（可空）</label>
      <input id="coopPass" maxlength="32" placeholder="可选" autocomplete="off">
      <label>房间号（6位数字，加入时填写）</label>
      <input id="coopCode" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="例如 482017" autocomplete="off">
      <div class="coop-actions">
        <button type="button" class="tb-btn" id="coopCreate">创建房间</button>
        <button type="button" class="tb-btn" id="coopJoin">加入房间</button>
        <button type="button" class="tb-btn" id="coopReady">准备</button>
        <button type="button" class="tb-btn" id="coopStart">开始（房主）</button>
        <button type="button" class="tb-btn" id="coopClose">关闭</button>
      </div>
      <div class="coop-roster" id="coopRoster">尚未连接</div>
      <div class="coop-msg" id="coopMsg"></div>
      <p class="coop-hint">房主权威同步战场（约 12 次/秒）。支持开局后中途加入。结束画面全员可见，仅房主可重开。</p>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
 * 坦克大战 Tank Battle —— 单文件 2D Canvas 游戏
 * 结构分层：
 *   1) 常量与工具        4) 实体（坦克/子弹/道具/特效）
 *   2) 音效系统 SFX      5) 地图与关卡
 *   3) 输入系统 Input    6) 游戏主控 Game（状态机 + 主循环）
 * =================================================================== */

/* ---------------- 1) 常量与工具 ---------------- */
const CANVAS_W = 960, CANVAS_H = 540;
const TILE = 20;                       // 地格尺寸
const FIELD_W = 26, FIELD_H = 26;      // 战场 26x26 格（经典FC）
const FIELD_PX = FIELD_W * TILE;       // 520
const OFF_X = (CANVAS_W - FIELD_PX) / 2 | 0;  // 战场水平居中
const OFF_Y = (CANVAS_H - FIELD_H * TILE) / 2 | 0;
// 地块类型
const T_EMPTY=0, T_BRICK=1, T_STEEL=2, T_WATER=3, T_GRASS=4, T_BASE=5;
// 方向
const DIR = {UP:0, RIGHT:1, DOWN:2, LEFT:3};
const DXY = [[0,-1],[1,0],[0,1],[-1,0]];

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const rand  = (a,b)=>a+Math.random()*(b-a);
const randi = (a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ---------------- 2) 音效系统（WebAudio 程序生成） ---------------- */
const SFX = (() => {
  let ctx = null;
  function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); 
    if(ctx.state==="suspended") ctx.resume(); return ctx; }
  function env(g,t0,a,d,peak){ g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(peak,t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); }
  function tone(type,f0,f1,dur,peak=0.18){
    const c=ac(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    env(g,t,0.005,dur,peak);o.connect(g).connect(c.destination);
    o.start(t);o.stop(t+dur+0.05);}
  function noise(dur,peak=0.2,fLow=400){
    const c=ac(),t=c.currentTime,n=c.sampleRate*dur|0,buf=c.createBuffer(1,n,c.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=c.createBufferSource();s.buffer=buf;
    const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=fLow;
    const g=c.createGain();env(g,t,0.005,dur,peak);
    s.connect(f).connect(g).connect(c.destination);s.start(t);}
  return {
    ac,
    unlock(){ ac(); },
    shoot(){ tone("square",880,220,0.09,0.12); },
    shootBig(){ tone("square",520,120,0.14,0.16); noise(0.06,0.08,1200); },
    hitWall(){ noise(0.07,0.12,900); },
    hitSteel(){ tone("triangle",1400,900,0.06,0.10); },
    explode(){ noise(0.35,0.30,500); tone("sawtooth",160,40,0.35,0.12); },
    bigExplode(){ noise(0.6,0.35,320); tone("sawtooth",120,30,0.6,0.16); },
    powerup(){ tone("sine",600,1200,0.12,0.15); setTimeout(()=>tone("sine",900,1600,0.15,0.15),90); },
    shield(){ tone("sine",300,900,0.25,0.12); },
    levelUp(){ [440,554,659,880].forEach((f,i)=>setTimeout(()=>tone("square",f,f,0.12,0.12),i*110)); },
    gameOver(){ [523,392,330,262].forEach((f,i)=>setTimeout(()=>tone("sawtooth",f,f*0.8,0.25,0.13),i*180)); },
    pause(){ tone("square",700,700,0.05,0.10); },
    spawn(){ tone("sine",200,500,0.15,0.08); },
    boat(){ tone("sine",250,120,0.3,0.12); noise(0.25,0.06,300); }
  };
})();

/* ---------------- 2.5) 背景音乐（WebAudio 程序生成 8bit 风格） ---------------- */
const BGM = (() => {
  // 音高辅助：以 A4=440 为基准的半音偏移（null=休止符）
  const N = s => 440*Math.pow(2,s/12);
  // 每轨：旋律/贝斯为等长步序列（半音偏移，null=休止），step=每步秒数，loop=是否循环
  const TRACKS = {
    menu: { step:0.22, loop:true, vol:0.045,
      mel:[0,4,7,12, 7,4,0,null, -2,2,5,10, 5,2,-2,null, 0,4,7,12, 14,12,7,4, 5,7,9,10, 12,null,7,null],
      bass:[-24,null,-17,null, -24,null,-17,null, -26,null,-19,null, -26,null,-19,null,
            -24,null,-17,null, -24,null,-17,null, -19,null,-14,null, -12,null,-12,null] },
    play: { step:0.19, loop:true, vol:0.035,
      mel:[null,null,12,null, 10,null,7,null, null,null,10,null, 7,null,5,null,
           null,null,12,null, 14,null,15,null, 14,null,12,null, 10,null,7,null],
      bass:[-24,-24,null,-24, null,-24,-22,null, -26,-26,null,-26, null,-26,-24,null,
            -24,-24,null,-24, null,-24,-22,null, -19,-19,null,-19, -21,null,-22,null] },
    clear:{ step:0.16, loop:false, vol:0.06,
      mel:[0,4,7,12, null,12,16,19, null,19,24,null, 24,24,24,null],
      bass:[-24,null,-12,null, -17,null,-5,null, -12,null,0,null, 0,null,0,null] },
    over: { step:0.28, loop:false, vol:0.055,
      mel:[7,null,3,null, 0,null,-2,null, -4,-5,-7,null, -9,null,-9,null],
      bass:[-17,null,-21,null, -24,null,-26,null, -28,null,-31,null, -33,null,-33,null] }
  };
  let cur=null, idx=0, nextT=0, timer=null, finished=false, audioPaused=false;
  function note(freq,t,dur,type,vol){
    if(!freq) return;
    const c=SFX.ac(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.setValueAtTime(vol,t+dur*0.7); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function schedule(){
    if(audioPaused) return;
    const c=SFX.ac(); if(c.state!=="running"){ return; }
    const tr=TRACKS[cur]; if(!tr) return;
    if(nextT < c.currentTime) nextT = c.currentTime + 0.05; // 恢复播放时防止补音爆发
    while(nextT < c.currentTime + 0.35){
      if(idx>=tr.mel.length){
        if(tr.loop) idx=0;
        else { finished=true; clearInterval(timer); timer=null; return; }
      }
      const m=tr.mel[idx], b=tr.bass[idx];
      if(m!==null) note(N(m), nextT, tr.step*0.92, "square", tr.vol);
      if(b!==null) note(N(b), nextT, tr.step*0.95, "triangle", tr.vol*1.5);
      nextT += tr.step; idx++;
    }
  }
  function play(name){
    if(audioPaused){ cur=name; idx=0; finished=false; return; }
    cur=name; idx=0; finished=false;
    nextT = SFX.ac().currentTime + 0.08;
    if(timer) clearInterval(timer);
    timer=setInterval(schedule,90); schedule();
  }
  // ensure：每帧调用，同名曲目不重复启动；非循环曲播完后保持静音
  function ensure(name){ if(cur===name) return; play(name); }
  function stop(){ if(timer) clearInterval(timer); timer=null; cur=null; }
  /** 暂停：停调度并 suspend AudioContext（暂停键 / 切后台） */
  function setPaused(on){
    if(on){
      if(audioPaused) return;
      audioPaused=true;
      if(timer){ clearInterval(timer); timer=null; }
      try{ const c=SFX.ac(); if(c && c.state==="running") c.suspend(); }catch(e){}
    } else {
      if(!audioPaused) return;
      audioPaused=false;
      try{ const c=SFX.ac(); if(c && c.state==="suspended") c.resume(); }catch(e){}
      if(cur){
        nextT = SFX.ac().currentTime + 0.08;
        if(timer) clearInterval(timer);
        timer=setInterval(schedule,90); schedule();
      }
    }
  }
  return { ensure, stop, setPaused };
})();

/* ---------------- 3) 输入系统（键盘 + 触屏） ---------------- */
const Input = (() => {
  const keys = {};
  // 移动向量、开火、功能键的统一抽象
  const state = { mx:0, my:0, fire:false, firePressed:false, pausePressed:false,
                  startPressed:false, extra:{L:false,U:false,I:false,O:false} };
  const moveMap = {
    KeyW:[0,-1],ArrowUp:[0,-1], KeyS:[0,1],ArrowDown:[0,1],
    KeyA:[-1,0],ArrowLeft:[-1,0], KeyD:[1,0],ArrowRight:[1,0] };
  window.addEventListener("keydown",e=>{
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Enter"].includes(e.code)) e.preventDefault();
    if(!keys[e.code]){
      if(e.code==="KeyJ"||e.code==="Enter"||e.code==="KeyK"||e.code==="Space"){ state.firePressed=true; state.startPressed=true; }
      if(e.code==="KeyL"||e.code==="KeyP"||e.code==="Escape") state.pausePressed=true;
    }
    keys[e.code]=true; SFX.unlock();
  });
  window.addEventListener("keyup",e=>{ keys[e.code]=false; });

  // 触屏：左侧摇杆
  const joyBase=document.getElementById("joyBase"), joyKnob=document.getElementById("joyKnob");
  let joyId=null, joyVec=[0,0];
  /** 屏幕坐标 → 舞台本地坐标（CSS 横屏旋转时用） */
  function screenToStage(clientX, clientY){
    if(!window.__tbCssLand) return { x:clientX, y:clientY };
    const vw = window.innerWidth;
    // 逆变换 translate(vw,0) rotate(90deg)：lx=sy, ly=vw-sx
    return { x: clientY, y: vw - clientX };
  }
  function joyMove(t){
    const p = screenToStage(t.clientX, t.clientY);
    const cx = joyBase.offsetLeft + joyBase.offsetWidth/2;
    const cy = joyBase.offsetTop + joyBase.offsetHeight/2;
    const max = joyBase.offsetWidth/2;
    let dx = p.x - cx, dy = p.y - cy;
    const len=Math.hypot(dx,dy)||1; const cl=Math.min(len,max);
    dx=dx/len*cl; dy=dy/len*cl;
    joyKnob.style.left=(50+dx/joyBase.offsetWidth*100)+"%";
    joyKnob.style.top=(50+dy/joyBase.offsetHeight*100)+"%";
    joyVec=[Math.abs(dx)>max*0.25?Math.sign(dx):0, Math.abs(dy)>max*0.25?Math.sign(dy):0];
    if(Math.abs(dx)>Math.abs(dy)) joyVec[1]=0; else joyVec[0]=0;
  }
  function joyEnd(){ joyId=null; joyVec=[0,0]; joyKnob.style.left="50%"; joyKnob.style.top="50%"; }
  let touchFire=false;
  function bindTouch(){
    window.addEventListener("touchstart",e=>{
      SFX.unlock();
      for(const t of e.changedTouches){
        const el=document.elementFromPoint(t.clientX,t.clientY);
        if(el===joyBase||el===joyKnob){ joyId=t.identifier; joyMove(t); }
        else if(el&&el.id==="btnFire"){ touchFire=true; state.firePressed=true; state.startPressed=true; }
        else if(el&&el.id==="btnPause"){ state.pausePressed=true; }
        else { state.startPressed=true; }
      }
      e.preventDefault();
    },{passive:false});
    window.addEventListener("touchmove",e=>{
      for(const t of e.changedTouches) if(t.identifier===joyId) joyMove(t);
      e.preventDefault();
    },{passive:false});
    const end=e=>{ for(const t of e.changedTouches){
        if(t.identifier===joyId) joyEnd();
      }
      // 松开开火按钮
      let stillFire=false;
      for(const t of e.touches){ const el=document.elementFromPoint(t.clientX,t.clientY);
        if(el&&el.id==="btnFire") stillFire=true; }
      touchFire=stillFire;
    };
    window.addEventListener("touchend",end); window.addEventListener("touchcancel",end);
  }
  bindTouch();

  function poll(){
    let mx=0,my=0;
    for(const k in moveMap) if(keys[k]){ mx+=moveMap[k][0]; my+=moveMap[k][1]; }
    if(joyVec[0]||joyVec[1]){ mx=joyVec[0]; my=joyVec[1]; }
    // 主导轴：坦克只能四方向
    if(mx&&my){ my=0; }
    state.mx=clamp(mx,-1,1); state.my=clamp(my,-1,1);
    state.fire = !!(keys.KeyJ||keys.Enter||keys.KeyK||keys.Space||touchFire);
    state.extra.L=!!keys.KeyL; state.extra.U=!!keys.KeyU;
    state.extra.I=!!keys.KeyI; state.extra.O=!!keys.KeyO;
    return state;
  }
  function consume(){ state.firePressed=false; state.pausePressed=false; state.startPressed=false; }
  return { poll, consume, state };
})();

/* ---------------- 4) 实体 ---------------- */

/** 粒子特效 */
class Particle{
  constructor(x,y,vx,vy,life,color,size){ Object.assign(this,{x,y,vx,vy,life,maxLife:life,color,size}); }
  update(dt){ this.x+=this.vx*dt; this.y+=this.vy*dt; this.vx*=0.96; this.vy*=0.96; this.life-=dt; }
  draw(g){ const a=Math.max(0,this.life/this.maxLife);
    g.globalAlpha=a; g.fillStyle=this.color;
    g.beginPath(); g.arc(this.x,this.y,this.size*a+0.5,0,Math.PI*2); g.fill(); g.globalAlpha=1; }
}

/** 子弹 */
class Bullet{
  constructor(owner,x,y,dir,speed,power){
    Object.assign(this,{owner,x,y,dir,speed,power,dead:false});
    this.w=6; this.h=6;
  }
  update(dt){ this.x+=DXY[this.dir][0]*this.speed*dt; this.y+=DXY[this.dir][1]*this.speed*dt; }
}

/** 道具类型 */
const PU = { STAR:"star", GUN:"gun", BOAT:"boat", GRENADE:"grenade", HELMET:"helmet", TANK:"tank", CLOCK:"clock", SHOVEL:"shovel" };
const PU_LIST = [PU.STAR,PU.GUN,PU.BOAT,PU.GRENADE,PU.HELMET,PU.TANK,PU.CLOCK,PU.SHOVEL];
class PowerUp{
  constructor(type,x,y){ Object.assign(this,{type,x,y,t:0,life:14,dead:false}); }
  update(dt){ this.t+=dt; this.life-=dt; if(this.life<=0) this.dead=true; }
}

/** 坦克（玩家与敌人共用基类） */
class Tank{
  constructor(x,y,isPlayer){
    this.x=x; this.y=y; this.w=TILE*2-2; this.h=TILE*2-2;
    this.dir=isPlayer?DIR.UP:DIR.DOWN;
    this.isPlayer=isPlayer;
    this.speed=isPlayer?95:60;
    this.bulletSpeed=220; this.bulletPower=1; this.maxBullets=1;
    this.cool=0; this.dead=false;
    this.stars=0;             // 星级：0基础 1快弹 2双发 3打铁 4除草
    this.boat=false;          // 船：可过水 + 抵挡一次攻击的船体护盾
    this.bulk=0;              // 装甲外观：0普通 1加厚(≥3星/枪) 2更厚(≥4星)；碰撞体积不变，被打降级
    this.shield=0;            // 无敌护盾剩余时间
    this.spawnGhost=1.6;      // 出生保护/闪烁
    this.hp=1;
    this.frozen=0;            // 被时钟冻结（敌人/玩家）
    this.type="normal";       // 敌人种类
    this.carriesPowerup=false;
    this.anim=0;
    this.eject=null;
  }
  get cx(){ return this.x+this.w/2; } get cy(){ return this.y+this.h/2; }
  rect(){ return {x:this.x,y:this.y,w:this.w,h:this.h}; }
  applyStars(){
    // 星级对应火力：参考FC原版 + 改版规则
    this.bulletSpeed = 220 + this.stars*45;
    this.maxBullets  = this.stars>=2 ? 2 : 1;
    this.bulletPower = this.stars>=3 ? 3 : 1;   // 3星可打铁
    if(this.stars>=4) this.bulletPower = 4;     // 4星可除草（额外星/手枪）
    // 3星/枪 → 装甲外观加厚；4星更厚（碰撞格始终不变）
    if(this.stars>=4) this.bulk = Math.max(this.bulk, 2);
    else if(this.stars>=3) this.bulk = Math.max(this.bulk, 1);
    this.applyBulk();
  }
  /** 锁定标准碰撞体积（装甲只改外观，不撑大 hitbox） */
  applyBulk(){
    const base = TILE*2-2;
    const cx=this.cx, cy=this.cy;
    this.w = base;
    this.h = base;
    this.x = cx - this.w/2;
    this.y = cy - this.h/2;
  }
}

/* ---------------- 5) 地图与关卡 ---------------- */
const Levels = (() => {

  const L2 = [

  const L3 = [
    "..........................",
    "..WWWW..BB......BB..WWWW..",
    "..WWWW..BB..SS..BB..WWWW..",
    "........BB..SS..BB........",
    "..BBBB......SS......BBBB..",
    "..BBBB..GG......GG..BBBB..",
    "........GGGGGGGGGG........",
    "..SS....GGBBBBBBGG....SS..",
    "..SS....GGBB..BBGG....SS..",
    "........GGBB..BBGG........",
    "WWWWWW....B....B....WWWWWW",
    "WWWWWW..BBSSSSBB....WWWWWW",
    "........BBBBSSBBBB........",

    "........BB..BB..BB........",
    "..BB........BB........BB..",
    "..BB..................BB..",
    "..........................",
    "..........................",
    ".........................."];
  const maps=[L1,L2,L3];
  const charMap={'.':T_EMPTY,'B':T_BRICK,'S':T_STEEL,'W':T_WATER,'G':T_GRASS};
  /** 闯关总关数；地形逐步解锁 */
  const CAMPAIGN_LEVELS = 20;
  // 1–4 仅砖（地图里的铁/草/水先关掉）；5–8 +铁；9–12 +草；13–20 +水
  // 注意：build 末尾 fortifyMidLane 会强制加中间铁墙，与关卡递进无关
  function gateTerrain(cell, level){
    if(cell===T_STEEL && level < 5) return T_EMPTY;
    if(cell===T_GRASS && level < 9) return T_EMPTY;
    if(cell===T_WATER && level < 13) return T_EMPTY;
    return cell;
  }

  /** 每关强制中路 + 最左/最右路铁砖，防止直通与侧翼偷袭 */
  function fortifyMidLane(grid){
    const put = (r,c,t)=>{
      if(r<0||r>=FIELD_H||c<0||c>=FIELD_W) return;
      if(grid[r][c]===T_BASE) return;
      grid[r][c]=t;
    };
    // —— 中路 ——
    for(let c=11;c<=14;c++) put(6,c,T_STEEL);
    put(7,11,T_STEEL); put(7,14,T_STEEL);
    for(let c=10;c<=15;c++){
      if(c===12||c===13) continue;
      put(11,c,T_STEEL);
    }
    put(12,10,T_STEEL); put(12,15,T_STEEL);
    put(13,11,T_STEEL); put(13,14,T_STEEL);
    for(let c=11;c<=14;c++) put(17,c,T_STEEL);
    put(18,11,T_BRICK); put(18,14,T_BRICK);
    put(19,12,T_BRICK); put(19,13,T_BRICK);

    // —— 最左路（挡左侧出生点直下）——
    put(5,0,T_STEEL); put(5,1,T_STEEL); put(5,2,T_BRICK);
    put(8,0,T_BRICK); put(8,1,T_STEEL); put(8,2,T_STEEL);
    put(12,0,T_STEEL); put(12,1,T_BRICK);
    put(15,0,T_BRICK); put(15,1,T_STEEL); put(15,2,T_STEEL);
    put(19,0,T_STEEL); put(19,1,T_STEEL); put(19,2,T_BRICK);
    put(21,1,T_BRICK); put(21,2,T_STEEL);

    // —— 最右路 ——
    put(5,23,T_BRICK); put(5,24,T_STEEL); put(5,25,T_STEEL);
    put(8,23,T_STEEL); put(8,24,T_STEEL); put(8,25,T_BRICK);
    put(12,24,T_BRICK); put(12,25,T_STEEL);
    put(15,23,T_STEEL); put(15,24,T_STEEL); put(15,25,T_BRICK);
    put(19,23,T_BRICK); put(19,24,T_STEEL); put(19,25,T_STEEL);
    put(21,23,T_STEEL); put(21,24,T_BRICK);
  }

  function build(levelIdx,endless){
    const lv = endless ? Math.max(1, levelIdx) : levelIdx;
    const src = maps[endless ? randi(0,maps.length-1) : (levelIdx-1)%maps.length];
    const grid=[];
    for(let r=0;r<FIELD_H;r++){ grid[r]=[];
      for(let c=0;c<FIELD_W;c++){
        const raw=charMap[src[r][c]]??T_EMPTY;
        grid[r][c]=endless ? raw : gateTerrain(raw, lv);
      }
    }
    // 基地（美国鹰）位于底部中央 2x2，并用砖围起
    const bx=12, by=24;
    for(let r=by;r<by+2;r++) for(let c=bx;c<bx+2;c++) grid[r][c]=T_BASE;
    for(let c=bx-1;c<=bx+2;c++){ if(grid[by-1]) grid[by-1][c]=T_BRICK; }
    grid[by][bx-1]=T_BRICK; grid[by][bx+2]=T_BRICK;
    grid[by+1][bx-1]=T_BRICK; grid[by+1][bx+2]=T_BRICK;
    // 清理出生点：基地左右对称空地（避开砖墙 11/14）
    const clear=(r,c)=>{ for(let i=r;i<r+2;i++) for(let j=c;j<c+2;j++)
      if(grid[i]&&grid[i][j]!==undefined&&grid[i][j]!==T_BASE) grid[i][j]=T_EMPTY; };
    clear(0,0); clear(0,12); clear(0,24);          // 敌人出生点
    // 友军出生：8/16 为主，再往外对称扩展
    [8,16,6,18,4,20,2,22].forEach(c=>clear(24,c));
    fortifyMidLane(grid);
    // 铁墙不要挡住出生格
    clear(0,0); clear(0,12); clear(0,24);
    [8,16,6,18,4,20,2,22].forEach(c=>clear(24,c));
    return grid;
  }
  // 关卡敌人配置：数量与种类随关卡递增
  // 血量档：fast/normal/power=1 · mid=2 · armor=3（已去掉抗5发）
  function enemyPlan(level){
    const total = Math.min(12 + level*2, 30);
    const fast  = Math.min(2+level, 10);
    const power = Math.min(1+level, 8);
    const mid   = Math.min(1+Math.floor(level/2), 8); // 抗 2 发
    const armor = Math.min(level, 8);                 // 抗 3 发
    return { total, fast, power, mid, armor };
  }
  return { build, enemyPlan, count:maps.length, CAMPAIGN_LEVELS };
})();

/* ---------------- 6) 游戏主控 ---------------- */
const Game = (() => {
  const cvs=document.getElementById("gameCanvas"), g=cvs.getContext("2d");
  // 状态机：menu / playing / paused / levelClear / gameover
  let stateName="menu";
  let grid=null, player=null, enemies=[], bullets=[], powerups=[], particles=[];
  let level=1, endless=false, score=0, lives=30, hiScore=+(localStorage.tbHiScore||0);
  let enemyQueue=0, enemyPlanObj=null, enemiesKilled=0;
  let spawnTimer=0, freezeTimer=0, shovelTimer=0, baseAlive=true;
  let shake=0, flashMsg="", flashTime=0, stateTime=0, overReason="";
  let menuSel=0; // 0=闯关 1=无尽 2=敌人吃道具 3=测试 4=合作联机
  let debugMode=false; // 测试模式：大幅提高道具掉落概率
  let enemyLootMode=false; // 敌人可拾取道具（烟山后期玩法）
  let bossSpawned=false; // 本关是否已刷过 Boss（每 5 关一只）
  let clearGrace=0; // 敌军清空后的拾取缓冲秒数
  // 合作联机（房主权威）
  let coopMode=false, coopIsHost=false, coopMyPid="", coopHostPid="";
  let coopSend=null;           // (obj)=>void
  let coopAllies={};           // pid -> Tank（不含本地 player）
  let coopRemoteInput={};      // pid -> {mx,my,fire}
  let coopStateAcc=0;
  let coopGridSent="";
  let coopRoster=[];
  let coopPredictUntil=0; // 本地预测校正用
  const COOP_TINTS=[
    ["#d8c84a","#8a7a1e"],["#7ac0e8","#2a6a9a"],["#e88a7a","#9a3a2a"],["#c9a0e8","#5a2a8a"],
    ["#7ae0a0","#2a7a4a"],["#ffb060","#a05020"],["#90d0ff","#3060a0"],["#f0a0c0","#903050"]
  ];
  const COOP_SPAWN=[[8,24],[16,24],[6,24],[18,24],[4,24],[20,24],[2,24],[22,24]];
  const MENU_COUNT=5;
  const CAMPAIGN_LEVELS=Levels.CAMPAIGN_LEVELS;
  const CLEAR_GRACE_SEC=4.5;

  /* ---- 碰撞辅助 ---- */
  function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
  function tileAt(px,py){ const c=Math.floor((px-OFF_X)/TILE), r=Math.floor((py-OFF_Y)/TILE);
    if(r<0||r>=FIELD_H||c<0||c>=FIELD_W) return T_STEEL; // 边界视为铁
    return grid[r][c]; }
  function friendlyTanks(){
    const list=[];
    if(player) list.push(player);
    for(const pid in coopAllies){ const t=coopAllies[pid]; if(t) list.push(t); }
    return list;
  }
  function nearestFriendly(from){
    let best=null, bd=1e9;
    for(const t of friendlyTanks()){
      if(!t||t.dead) continue;
      const d=Math.hypot(from.cx-t.cx, from.cy-t.cy);
      if(d<bd){ bd=d; best=t; }
    }
    return best;
  }
  function tankBlocked(t,nx,ny){
    // 检查坦克矩形四角+边中点的地形；水面：有船可通过
    const pts=[[nx+1,ny+1],[nx+t.w-1,ny+1],[nx+1,ny+t.h-1],[nx+t.w-1,ny+t.h-1],
               [nx+t.w/2,ny+1],[nx+t.w/2,ny+t.h-1],[nx+1,ny+t.h/2],[nx+t.w-1,ny+t.h/2]];
    for(const [px,py] of pts){
      const tt=tileAt(px,py);
      if(tt===T_BRICK||tt===T_STEEL||tt===T_BASE) return true;
      if(tt===T_WATER && !t.boat) return true;
    }
    // 战场边界
    if(nx<OFF_X||ny<OFF_Y||nx+t.w>OFF_X+FIELD_PX||ny+t.h>OFF_Y+FIELD_H*TILE) return true;
    // 坦克互撞
    const r={x:nx,y:ny,w:t.w,h:t.h};
    const all=[...friendlyTanks(),...enemies];
    for(const o of all){ if(!o||o===t||o.dead) continue; if(rectHit(r,o.rect())) return true; }
    return false;
  }

  /* ---- 特效 ---- */
  function boom(x,y,n,base){
    for(let i=0;i<n;i++){
      const a=rand(0,Math.PI*2), sp=rand(30,180);
      const colors=base||["#ffd24a","#ff8c2e","#ff4e2e","#ffe9a0","#aaa"];
      particles.push(new Particle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,
        rand(0.25,0.7),colors[randi(0,colors.length-1)],rand(1.5,4)));
    }
  }
  function flash(msg,t=1.6){ flashMsg=msg; flashTime=t; }

  /* ---- 水域辅助：船被击毁后自动滑出水域 ---- */
  function onWater(t){
    const pts=[[t.x+2,t.y+2],[t.x+t.w-2,t.y+2],[t.x+2,t.y+t.h-2],[t.x+t.w-2,t.y+t.h-2],[t.cx,t.cy]];
    return pts.some(([px,py])=>tileAt(px,py)===T_WATER);
  }
  // 在半格网上搜索离坦克最近的可站立陆地点
  function findLandSpot(t){
    const step=TILE/2; let best=null, bd=Infinity;
    for(let j=0;j<=FIELD_H*2-4;j++) for(let i=0;i<=FIELD_W*2-4;i++){
      const x=OFF_X+i*step+1, y=OFF_Y+j*step+1;
      const d=(x-t.x)*(x-t.x)+(y-t.y)*(y-t.y);
      if(d>=bd) continue;
      if(!tankBlocked(t,x,y)){ bd=d; best={x,y}; }
    }
    return best;
  }

  /* ---- 生成 ---- */
  function snapGear(t){
    if(!t) return null;
    return {
      stars:t.stars|0, boat:!!t.boat, bulk:t.bulk|0,
      pid:t.coopPid, name:t.coopName, slot:t.coopSlot|0, tint:t.coopTint
    };
  }
  function applyGear(t, gear){
    if(!t||!gear) return;
    t.stars = gear.stars|0;
    t.boat = !!gear.boat;
    t.bulk = gear.bulk|0;
    t.applyStars(); // 子弹威力/双发等随星级恢复
    // 被打掉的装甲层：若星级仍够，外观至少回到对应厚度
    if(t.stars>=4) t.bulk = Math.max(t.bulk, 2);
    else if(t.stars>=3) t.bulk = Math.max(t.bulk, 1);
    t.applyBulk();
  }
  function spawnAtSlot(slot, pid, name, gear){
    const sp=COOP_SPAWN[slot%COOP_SPAWN.length];
    const t=new Tank(OFF_X+sp[0]*TILE+1, OFF_Y+sp[1]*TILE+1, true);
    t.coopPid=pid; t.coopName=name||("P"+(slot+1));
    t.coopTint=(gear&&gear.tint)||COOP_TINTS[slot%COOP_TINTS.length];
    t.coopSlot=slot;
    if(gear) applyGear(t, gear);
    else { t.stars=0; t.bulk=0; t.boat=false; t.applyStars(); }
    t.shield=3;
    return t;
  }
  function setupCoopPlayers(keepGear){
    const prev={};
    if(keepGear){
      for(const t of friendlyTanks()){
        if(t&&t.coopPid) prev[t.coopPid]=snapGear(t);
      }
    }
    coopAllies={};
    player=null;
    const roster = coopRoster.slice(0,8);
    roster.forEach((p,i)=>{
      const t=spawnAtSlot(i, p.pid, p.name, keepGear?prev[p.pid]:null);
      if(p.pid===coopMyPid) player=t;
      else coopAllies[p.pid]=t;
    });
    if(!player && roster.length){
      player=spawnAtSlot(0, coopMyPid, "Me", keepGear?prev[coopMyPid]:null);
    }
    SFX.spawn();
  }
  function newLevel(){
    // 过关保留星/枪/船/装甲外观与火力
    const keepSolo = !coopMode ? snapGear(player) : null;
    grid=Levels.build(level,endless);
    bullets=[]; powerups=[]; particles=[]; enemies=[];
    enemyPlanObj = endless ? Levels.enemyPlan(level) : Levels.enemyPlan(level);
    enemyQueue = endless ? Infinity : enemyPlanObj.total;
    enemiesKilled=0; spawnTimer=0.5; freezeTimer=0; shovelTimer=0; baseAlive=true;
    bossSpawned=false;
    clearGrace=0;
    if(coopMode) setupCoopPlayers(true);
    else spawnPlayer({ keep: keepSolo });
    if(level%5===0) flash("⚠ Boss 关：本关将出现强化敌军", 2.2);
  }
  function spawnPlayer(opts){
    opts=opts||{};
    if(coopMode && player){
      const gear = opts.keep ? snapGear(player) : null;
      const slot=player.coopSlot|0, pid=player.coopPid||coopMyPid, name=player.coopName;
      player=spawnAtSlot(slot, pid, name, gear);
      return;
    }
    const gear = opts.keep ? (opts.keep===true ? snapGear(player) : opts.keep) : null;
    player=new Tank(OFF_X+8*TILE+1, OFF_Y+24*TILE+1, true);
    if(gear) applyGear(player, gear);
    else { player.stars=0; player.bulk=0; player.boat=false; player.applyStars(); }
    player.shield=3; SFX.spawn();
  }
  function respawnFriendly(t){
    if(!t) return;
    // 阵亡重生：装备清空（过关才保留星/船/火力）
    const slot=t.coopSlot|0, pid=t.coopPid, name=t.coopName;
    const tint=t.coopTint;
    const nt=spawnAtSlot(slot, pid, name, null);
    if(tint) nt.coopTint=tint;
    if(pid===coopMyPid) player=nt;
    else coopAllies[pid]=nt;
  }
  const SPAWN_COLS=[0,12,24];
  function trySpawnEnemy(){
    if(enemyQueue<=0) return;
    const alive=enemies.filter(e=>!e.dead).length;
    const maxAlive = endless ? Math.min(4+Math.floor(level/2),8) : Math.min(4 + (coopMode?Math.max(0,friendlyTanks().length-1):0), 8);
    if(alive>=maxAlive) return;
    const col=SPAWN_COLS[randi(0,2)];
    const x=OFF_X+col*TILE+1, y=OFF_Y+1;
    const r={x,y,w:TILE*2-2,h:TILE*2-2};
    for(const o of [...friendlyTanks(),...enemies]) if(o&&!o.dead&&rectHit(r,o.rect())) return;
    const e=new Tank(x,y,false);
    // 每 5 关刷一只强化重甲（抗 3 发 + 可打铁，偏慢）
    const wantBoss = (level%5===0) && !bossSpawned && (endless || enemyQueue<=Math.max(3, (enemyPlanObj.total/2)|0));
    if(wantBoss){
      bossSpawned=true;
      e.type="armor"; e.hp=3; e.speed=42; e.stars=3; e.applyStars();
      e.carriesPowerup=true; e.bulletSpeed=300;
      flash("💀 强化重甲出现！抗 3 发可打铁", 1.8);
    } else {
      const p=enemyPlanObj, kRoll=Math.random();
      if(kRoll<0.22 && p.armor>0){
        // 重甲：抗 3 发
        e.type="armor"; e.hp=3; e.speed=48;
      } else if(kRoll<0.40 && p.mid>0){
        // 中甲：抗 2 发
        e.type="mid"; e.hp=2; e.speed=68; e.bulletSpeed=250;
      } else if(kRoll<0.58 && p.fast>0){
        // 冲锋：瘦小快车，1 血
        e.type="fast"; e.hp=1; e.speed=118; e.cool=-0.15;
      } else if(kRoll<0.74 && p.power>0){
        // 火力：长炮、弹速高，1 血
        e.type="power"; e.hp=1; e.speed=55; e.bulletSpeed=340;
        if(level>=8) e.maxBullets=2;
      } else {
        e.type="normal"; e.hp=1; e.speed=60;
      }
      e.speed += Math.min(level*2,26);
      if(Math.random()<(debugMode?1:0.22)) e.carriesPowerup=true;
    }
    if(freezeTimer>0) e.frozen=freezeTimer;
    enemies.push(e); if(enemyQueue!==Infinity) enemyQueue--;
    SFX.spawn();
  }

  /* ---- 射击 ---- */
  function fire(t){
    if(t.cool>0) return;
    const mine=bullets.filter(b=>b.owner===t&&!b.dead).length;
    if(mine>=t.maxBullets) return;
    const bx=t.cx+DXY[t.dir][0]*(t.w/2+4)-3, by=t.cy+DXY[t.dir][1]*(t.h/2+4)-3;
    bullets.push(new Bullet(t,bx,by,t.dir,t.bulletSpeed,t.bulletPower));
    t.cool = t.isPlayer ? (t.stars>=1?0.28:0.42) : rand(0.8,1.8);
    if(t.isPlayer) (t.bulletPower>=3?SFX.shootBig:SFX.shoot)();
  }

  /* ---- 道具 ---- */
  function dropPowerup(x,y){
    const type=PU_LIST[randi(0,PU_LIST.length-1)];
    // 落点对齐空地附近
    const px=clamp(x-TILE,OFF_X,OFF_X+FIELD_PX-TILE*2), py=clamp(y-TILE,OFF_Y,OFF_Y+FIELD_H*TILE-TILE*2);
    powerups.push(new PowerUp(type,px,py));
  }
  function applyPowerup(pu){

        player.applyStars();
        flash(player.stars>=4?"🔫 满级火力！装甲加厚可抗弹":"🔫 手枪！可打铁 · 装甲加厚");
        break;
      case PU.BOAT: // 船：护盾一层 + 可在水上行走

  /** 敌人吃到道具时的负面/强化效果（敌人吃道具模式） */

  function setBaseWall(t){
    const bx=12,by=24;
    for(let c=bx-1;c<=bx+2;c++) if(grid[by-1][c]!==T_BASE) grid[by-1][c]=t;
    for(const [r,c] of [[by,bx-1],[by,bx+2],[by+1,bx-1],[by+1,bx+2]]) if(grid[r][c]!==T_BASE) grid[r][c]=t;
  }
  /** 装甲体型被打：变小一级，短暂无敌；火力星级保留，可再吃星/枪变粗 */
  function hurtPlayerBulk(){
    if(!player || player.bulk<=0) return false;
    player.bulk--;
    player.applyBulk();
    player.shield = Math.max(player.shield, 1.2);
    SFX.hitSteel();
    boom(player.cx, player.cy, 10, ["#ffd24a","#ffb02e","#fff"]);
    flash(player.bulk>0 ? "装甲受损！" : "装甲剥落！");
    return true;
  }

  /* ---- 子弹与地形/实体交互 ---- */
  function bulletHitTerrain(b){
    // 子弹前端检测两个采样点（覆盖宽度）
    const fx=b.x+b.w/2+DXY[b.dir][0]*b.w/2, fy=b.y+b.h/2+DXY[b.dir][1]*b.h/2;
    const side = b.dir===DIR.UP||b.dir===DIR.DOWN ? [[-6,0],[6,0]] : [[0,-6],[0,6]];
    let hit=false;
    for(const [ox,oy] of [[0,0],...side]){
      const px=fx+ox, py=fy+oy;
      const c=Math.floor((px-OFF_X)/TILE), r=Math.floor((py-OFF_Y)/TILE);
      if(c<0||c>=FIELD_W||r<0||r>=FIELD_H){ hit=true; continue; }
      const t=grid[r][c];
      if(t===T_BRICK){ grid[r][c]=T_EMPTY; hit=true; boom(OFF_X+c*TILE+TILE/2,OFF_Y+r*TILE+TILE/2,5,["#c96f3b","#8a4a26","#e0a070"]); }
      else if(t===T_STEEL){ hit=true;
        if(b.power>=3){ grid[r][c]=T_EMPTY; boom(OFF_X+c*TILE+TILE/2,OFF_Y+r*TILE+TILE/2,8,["#cfd6e4","#9aa4b8","#fff"]); SFX.hitSteel(); }
        else SFX.hitSteel(); }
      else if(t===T_GRASS && b.power>=4){ grid[r][c]=T_EMPTY; boom(OFF_X+c*TILE+TILE/2,OFF_Y+r*TILE+TILE/2,6,["#3f9b41","#7ac96a","#2c6e2f"]); }
      else if(t===T_BASE){
        // 友军子弹撞基地只挡下，不摧毁；敌军可毁
        hit=true;
        if(!(b.owner && b.owner.isPlayer)) baseAlive=false;
        else SFX.hitSteel();
      }
    }
    if(hit&&baseAlive!==false) SFX.hitWall();
    return hit;
  }
  function killTank(t,byPlayer){
    t.dead=true; boom(t.cx,t.cy,26); SFX.explode(); shake=Math.max(shake,0.25);
    if(!t.isPlayer){
      enemiesKilled++;
      if(byPlayer){ const pts={normal:100,fast:200,power:300,mid:350,armor:450}[t.type]||100; score+=pts;
        flashScore(t.cx,t.cy,pts); }
      if(t.carriesPowerup) dropPowerup(t.cx,t.cy);
    }
  }
  const scorePops=[];
  function flashScore(x,y,v){ scorePops.push({x,y,v,t:0.9}); }

  function driveTank(p, vx, vy, fireNow, dt){
    if(!p||p.dead) return;
    p.cool-=dt; p.shield-=dt; p.spawnGhost-=dt;
    if(p.frozen>0){ p.frozen-=dt; vx=0; vy=0; }
    if(p.eject){
      const dx=p.eject.x-p.x, dy=p.eject.y-p.y, dist=Math.hypot(dx,dy);
      const sp=p.speed*1.6*dt;
      if(dist<=sp){ p.x=p.eject.x; p.y=p.eject.y; p.eject=null; }
      else { p.x+=dx/dist*sp; p.y+=dy/dist*sp;
        if(Math.random()<0.5) boom(p.cx,p.cy+p.h/2,2,["#7ad0ff","#a0d8ff"]); }
      vx=vy=0;
    }
    if(vx||vy){
      p.dir = vx>0?DIR.RIGHT:vx<0?DIR.LEFT:vy>0?DIR.DOWN:DIR.UP;
      p.anim+=dt*10;
      const nx=p.x+vx*p.speed*dt, ny=p.y+vy*p.speed*dt;
      if(!tankBlocked(p,nx,p.y)) p.x=nx;
      if(!tankBlocked(p,p.x,ny)) p.y=ny;
      if(vy&&!vx){ const snap=Math.round((p.x-OFF_X-1)/(TILE/2))*(TILE/2)+OFF_X+1;
        const d=snap-p.x;
        if(d){ const step=Math.sign(d)*Math.min(Math.abs(d),p.speed*dt);
          if(!tankBlocked(p,p.x+step,p.y)) p.x+=step; } }
      if(vx&&!vy){ const snap=Math.round((p.y-OFF_Y-1)/(TILE/2))*(TILE/2)+OFF_Y+1;
        const d=snap-p.y;
        if(d){ const step=Math.sign(d)*Math.min(Math.abs(d),p.speed*dt);
          if(!tankBlocked(p,p.x,p.y+step)) p.y+=step; } }
    }
    if(fireNow && !(p.frozen>0)) fire(p);
    for(const pu of powerups){
      if(pu.dead||!rectHit(p.rect(),{x:pu.x,y:pu.y,w:TILE*2,h:TILE*2})) continue;
      pu.dead=true;
      if(p===player){ applyPowerup(pu); continue; }
      // 队友拾取：个人强化给该车，全局效果走原逻辑
      if(pu.type===PU.STAR){ p.stars=Math.min(4,(p.stars||0)+1); p.applyStars(); flash("⭐ 队友升星"); }
      else if(pu.type===PU.GUN){ p.stars=Math.max(p.stars||0,3); p.applyStars(); flash("🔫 队友拿到手枪"); }
      else if(pu.type===PU.HELMET){ p.shield=Math.max(p.shield,12); }
      else if(pu.type===PU.BOAT){ p.boat=true; }
      else if(pu.type===PU.TANK){ lives++; flash("🚗 生命 +1"); }
      else applyPowerup(pu);
    }
  }
  function hurtFriendly(t, b){
    if(t.shield>0){ SFX.hitSteel(); boom(b.x+3,b.y+3,6,["#7ad0ff","#fff"]); return; }
    if(t.bulk>0){
      t.bulk-=1; t.applyBulk(); SFX.hitSteel(); boom(b.x+3,b.y+3,8,["#ffd24a","#fff"]);
      if(t===player) flash("装甲被打掉一层！");
      return;
    }
    if(t.boat){
      t.boat=false; SFX.hitWall();
      if(t===player) flash("⛵ 船体护盾抵挡了攻击！");
      boom(t.cx,t.cy,10,["#7ad0ff","#3f7fd0","#fff"]);
      if(onWater(t)){
        const spot=findLandSpot(t);
        if(spot){ t.eject=spot; t.shield=Math.max(t.shield,1.5); }
      }
      return;
    }
    killTank(t,false);
  }
  function buildNetState(){
    const packT=t=>({
      pid:t.coopPid||"", name:t.coopName||"", slot:t.coopSlot|0,
      x:Math.round(t.x), y:Math.round(t.y), dir:t.dir, dead:!!t.dead,
      stars:t.stars|0, boat:!!t.boat, bulk:t.bulk|0, shield:+(t.shield||0).toFixed(1),
      spawnGhost:+(t.spawnGhost||0).toFixed(1), frozen:+(t.frozen||0).toFixed(1)
    });
    const friends=friendlyTanks().map(packT);
    const fullGrid = grid ? grid.map(row=>row.join("")).join("|") : "";
    const gridChanged = fullGrid !== coopGridSent;
    if(gridChanged) coopGridSent = fullGrid;
    return {
      type:"state",
      level, score, lives, enemyQueue, enemiesKilled, baseAlive,
      freezeTimer:+freezeTimer.toFixed(2), shovelTimer:+shovelTimer.toFixed(2),
      clearGrace:+clearGrace.toFixed(2), stateName, overReason: overReason||"",
      // 地图只在变化时下发，大幅减轻手机流量与解析
      grid: gridChanged ? fullGrid : undefined,
      players: friends,
      enemies: enemies.filter(e=>!e.dead).map(e=>({
        x:Math.round(e.x), y:Math.round(e.y), dir:e.dir, hp:e.hp, type:e.type,
        stars:e.stars|0, speed:Math.round(e.speed), spawnGhost:+(e.spawnGhost||0).toFixed(1),
        shield:+(e.shield||0).toFixed(1), frozen:+(e.frozen||0).toFixed(1)
      })),
      bullets: bullets.filter(b=>!b.dead).map(b=>({
        x:Math.round(b.x), y:Math.round(b.y), dir:b.dir, power:b.power,
        friend:!!(b.owner&&b.owner.isPlayer)
      })),
      powerups: powerups.filter(p=>!p.dead).map(p=>({type:p.type,x:Math.round(p.x),y:Math.round(p.y),life:+p.life.toFixed(1)}))
    };
  }
  function applyNetState(msg){
    if(!msg) return;
    level=msg.level|level; score=msg.score|0; lives=msg.lives|0;
    enemyQueue=msg.enemyQueue; enemiesKilled=msg.enemiesKilled|0;
    baseAlive=!!msg.baseAlive; freezeTimer=msg.freezeTimer||0; shovelTimer=msg.shovelTimer||0;
    clearGrace=msg.clearGrace||0;
    if(msg.overReason!=null && msg.overReason!=="") overReason=msg.overReason;
    if(msg.stateName && msg.stateName!=="menu"){
      const prev=stateName;
      stateName=msg.stateName;
      if(stateName!==prev && (stateName==="gameover"||stateName==="levelClear")) stateTime=0;
    }
    if(msg.grid){
      const rows=String(msg.grid).split("|");
      if(rows.length===FIELD_H){
        grid=rows.map(r=>r.split("").map(ch=>+ch));
        coopGridSent=msg.grid;
      }
    }
    // players：复用对象；自己的坦克软校正（本地预测）
    const seen={};
    (msg.players||[]).forEach(ps=>{
      seen[ps.pid]=true;
      let t = (ps.pid===coopMyPid) ? player : coopAllies[ps.pid];
      if(!t){
        t=spawnAtSlot(ps.slot|0, ps.pid, ps.name);
        if(ps.pid===coopMyPid) player=t; else coopAllies[ps.pid]=t;
      }
      const isSelf = ps.pid===coopMyPid;
      if(isSelf && player && !ps.dead && stateName==="playing"){
        const dx=ps.x-t.x, dy=ps.y-t.y, dist=Math.hypot(dx,dy);
        if(dist>28){ t.x=ps.x; t.y=ps.y; }
        else { t.x+=dx*0.4; t.y+=dy*0.4; }
      } else {
        t.x=ps.x; t.y=ps.y;
      }
      t.dir=ps.dir; t.dead=!!ps.dead;
      const starsChanged=(t.stars|0)!==(ps.stars|0) || (t.bulk|0)!==(ps.bulk|0);
      t.stars=ps.stars|0; t.boat=!!ps.boat; t.bulk=ps.bulk|0;
      t.shield=ps.shield||0; t.spawnGhost=ps.spawnGhost||0; t.frozen=ps.frozen||0;
      t.coopName=ps.name||t.coopName;
      if(starsChanged){ t.applyStars(); t.applyBulk(); }
      if(ps.pid===coopMyPid) player=t; else coopAllies[ps.pid]=t;
    });
    for(const pid in coopAllies){ if(!seen[pid] && pid!==coopMyPid) delete coopAllies[pid]; }
    // enemies / bullets / powerups：复用数组槽位，减少 GC
    const elist=msg.enemies||[];
    while(enemies.length>elist.length) enemies.pop();
    for(let i=0;i<elist.length;i++){
      const es=elist[i];
      let e=enemies[i];
      if(!e){ e=new Tank(es.x,es.y,false); enemies[i]=e; }
      e.dead=false; e.x=es.x; e.y=es.y; e.dir=es.dir; e.hp=es.hp;
      e.type=es.type||"normal"; e.speed=es.speed||60;
      e.spawnGhost=es.spawnGhost||0; e.shield=es.shield||0; e.frozen=es.frozen||0;
      if((e.stars|0)!==(es.stars|0)){ e.stars=es.stars|0; e.applyStars(); }
    }
    const blist=msg.bullets||[];
    while(bullets.length>blist.length) bullets.pop();
    for(let i=0;i<blist.length;i++){
      const bs=blist[i];
      let b=bullets[i];
      if(!b){ b=new Bullet({isPlayer:!!bs.friend}, bs.x, bs.y, bs.dir, 220, bs.power||1); bullets[i]=b; }
      else {
        b.dead=false; b.x=bs.x; b.y=bs.y; b.dir=bs.dir; b.power=bs.power||1;
        b.owner=b.owner||{}; b.owner.isPlayer=!!bs.friend;
      }
    }
    const plist=msg.powerups||[];
    while(powerups.length>plist.length) powerups.pop();
    for(let i=0;i<plist.length;i++){
      const ps=plist[i];
      let pu=powerups[i];
      if(!pu){ pu=new PowerUp(ps.type, ps.x, ps.y); powerups[i]=pu; }
      else { pu.type=ps.type; pu.x=ps.x; pu.y=ps.y; }
      pu.dead=false; pu.life=ps.life||10;
    }
  }
  function onCoopRoster(list){
    if(!coopMode||!coopIsHost||stateName!=="playing") return;
    coopRoster=Array.isArray(list)?list.slice():coopRoster;
    const have={}; friendlyTanks().forEach(t=>{ if(t&&t.coopPid) have[t.coopPid]=true; });
    let used=Object.keys(have).length;
    (list||[]).forEach((p)=>{
      if(!p||!p.pid||have[p.pid]) return;
      const slot=Math.min(used, COOP_SPAWN.length-1);
      const t=spawnAtSlot(slot, p.pid, p.name, null);
      used++;
      if(p.pid===coopMyPid) player=t;
      else coopAllies[p.pid]=t;
      have[p.pid]=true;
      flash("➕ "+(p.name||"玩家")+" 中途加入", 1.4);
      // 强制下一包带全地图
      coopGridSent="";
    });
  }

  /* ---- 更新逻辑 ---- */
  function update(dt){
    const inp=Input.poll();
    stateTime+=dt;

    // 暂停 / 切后台：停 BGM；恢复后继续
    const wantPauseAudio = stateName==="paused" || document.hidden;
    BGM.setPaused(wantPauseAudio);
    // 背景音乐：清理缓冲期播 clear，其余跟状态
    if(!wantPauseAudio){
      let track={menu:"menu",playing:"play",paused:"play",levelClear:"clear",gameover:"over"}[stateName];
      if(stateName==="playing" && clearGrace>0) track="clear";
      if(track) BGM.ensure(track);
    }

    if(stateName==="menu"){
      if(inp.my<0&&!menuMoved){ menuSel=(menuSel+MENU_COUNT-1)%MENU_COUNT; menuMoved=true; }
      else if(inp.my>0&&!menuMoved){ menuSel=(menuSel+1)%MENU_COUNT; menuMoved=true; }
      else if(!inp.my) menuMoved=false;
      if(Input.state.startPressed){
        if(menuSel===4){
          if(window.TankCoop) window.TankCoop.open();
          Input.consume(); return;
        }
        coopMode=false; coopSend=null;
        endless=menuSel===1;
        enemyLootMode=menuSel===2;
        debugMode=menuSel===3;
        if(menuSel===2) endless=false; // 敌人吃道具以闯关形式进行
        level=1; score=0; lives=30; player=null; coopAllies={};
        newLevel(); stateName="playing"; SFX.levelUp();
      }
      Input.consume(); return;
    }
    if(stateName==="gameover"||stateName==="levelClear"){
      // 结束画面：震屏迅速停住，不要一直抖
      shake = Math.max(0, shake - dt * 2.5);
      if(stateTime>0.45) shake = 0;
      flashTime=Math.max(0,flashTime-dt);
      // 联机客机：只看结算，不能自行重开/进下一关
      if(coopMode && !coopIsHost){
        Input.consume(); return;
      }
      if(stateTime>1.2 && Input.state.startPressed){
        if(stateName==="levelClear"){
          if(!endless && level>=CAMPAIGN_LEVELS){ stateName="menu"; menuSel=0; coopMode=false; }
          else { level++; newLevel(); stateName="playing"; coopGridSent=""; }
        }
        else {
          // 游戏结束：房主重开本局；单机回菜单
          if(coopMode && coopIsHost){
            level=1; score=0; lives=30; overReason="";
            newLevel(); stateName="playing"; coopGridSent="";
            if(coopSend) coopSend({type:"event", name:"restart"});
            flash("房主已重开", 1.2);
          } else {
            stateName="menu"; menuSel=0; coopMode=false; shake=0;
          }
        }
      }
      Input.consume(); return;
    }
    if(Input.state.pausePressed){
      if(stateName==="playing"||stateName==="paused"){
        stateName = stateName==="paused" ? "playing" : "paused"; SFX.pause();
      }
      Input.consume(); return;
    }
    if(stateName==="paused"){ Input.consume(); return; }
    if(document.hidden){ Input.consume(); return; }

    /* --- 联机客机：发输入 + 本地预测移动；状态由房主校正 --- */
    if(coopMode && !coopIsHost){
      if(coopSend && stateName==="playing"){
        coopSend({type:"input", mx:inp.mx|0, my:inp.my|0, fire:!!inp.fire});
        // 本地预测自己坦克位移（开火仍以房主为准，避免双发）
        if(player&&!player.dead) driveTank(player, inp.mx, inp.my, false, dt);
      }
      for(const pt of particles) pt.update(dt);
      particles=particles.filter(p=>p.life>0);
      shake=Math.max(0,shake-dt);
      flashTime=Math.max(0,flashTime-dt);
      Input.consume();
      return;
    }

    /* --- playing（单机 / 房主） --- */
    driveTank(player, inp.mx, inp.my, inp.fire, dt);
    if(coopMode && coopIsHost){
      for(const pid in coopAllies){
        const t=coopAllies[pid];
        const ri=coopRemoteInput[pid]||{mx:0,my:0,fire:false};
        driveTank(t, ri.mx|0, ri.my|0, !!ri.fire, dt);
        // 开火是边沿：避免每帧连发，清掉 fire 等下一次 input
        if(ri.fire) ri.fire=false;
      }
    }
    // 敌人生成
    spawnTimer-=dt;
    if(spawnTimer<=0){ trySpawnEnemy(); spawnTimer = endless? Math.max(0.9,2.4-level*0.1) : 2.0; }
    freezeTimer=Math.max(0,freezeTimer-dt);
    if(shovelTimer>0){ shovelTimer-=dt; if(shovelTimer<=0) setBaseWall(T_BRICK); }

    // 敌人AI：随机游走 + 概率朝基地/玩家 + 随机开火
    for(const e of enemies){
      if(e.dead) continue;
      e.cool-=dt; e.spawnGhost-=dt; e.shield=Math.max(0,(e.shield||0)-dt); e.anim+=dt*10;
      if(e.frozen>0){ e.frozen-=dt; continue; }
      e.aiT=(e.aiT||0)-dt;
      if(e.aiT<=0){
        e.aiT=rand(0.6,2.2);
        // 敌人吃道具模式：优先冲向场上道具
        let chasedPu=false;
        if(enemyLootMode){
          let best=null, bestD=1e9;
          for(const pu of powerups){
            if(pu.dead) continue;
            const d=Math.hypot(e.cx-(pu.x+TILE), e.cy-(pu.y+TILE));
            if(d<bestD){ bestD=d; best=pu; }
          }
          if(best && bestD<220){
            chasedPu=true;
            e.dir = Math.abs(e.cx-(best.x+TILE))>Math.abs(e.cy-(best.y+TILE))
              ? (e.cx<best.x+TILE?DIR.RIGHT:DIR.LEFT)
              : (e.cy<best.y+TILE?DIR.DOWN:DIR.UP);
          }
        }
        if(!chasedPu){
          const roll=Math.random();
          if(roll<0.45){ e.dir=randi(0,3); }
          else if(roll<0.75){ // 朝基地
            e.dir = Math.abs(e.cx-(OFF_X+13*TILE))>TILE ? (e.cx<OFF_X+13*TILE?DIR.RIGHT:DIR.LEFT) : DIR.DOWN;
          } else { // 朝最近友军
            const tgt=nearestFriendly(e);
            if(tgt){
              e.dir = Math.abs(e.cx-tgt.cx)>Math.abs(e.cy-tgt.cy)
                ? (e.cx<tgt.cx?DIR.RIGHT:DIR.LEFT) : (e.cy<tgt.cy?DIR.DOWN:DIR.UP);
            }
          }
        }
      }
      const nx=e.x+DXY[e.dir][0]*e.speed*dt, ny=e.y+DXY[e.dir][1]*e.speed*dt;
      if(!tankBlocked(e,nx,ny)){ e.x=nx; e.y=ny; }
      else e.aiT=0; // 撞墙立刻换向
      if(Math.random()<dt*0.9) fire(e);
      // 敌人拾取道具
      if(enemyLootMode){
        for(const pu of powerups){
          if(pu.dead) continue;
          if(rectHit(e.rect(),{x:pu.x,y:pu.y,w:TILE*2,h:TILE*2})){
            pu.dead=true; applyEnemyPowerup(e, pu); break;
          }
        }
      }
    }

    // 子弹
    for(const b of bullets){
      if(b.dead) continue;
      b.update(dt);
      if(bulletHitTerrain(b)){ b.dead=true; boom(b.x+3,b.y+3,4); continue; }
      // 子弹对撞
      for(const ob of bullets){ if(ob!==b&&!ob.dead&&ob.owner.isPlayer!==b.owner.isPlayer&&rectHit(b,ob)){ b.dead=ob.dead=true; } }
      if(b.dead) continue;
      // 命中坦克
      if(b.owner.isPlayer){
        for(const e of enemies){
          if(e.dead||e.spawnGhost>0.8) continue;
          if(rectHit(b,e.rect())){ b.dead=true;
            if((e.shield||0)>0){ SFX.hitSteel(); boom(b.x+3,b.y+3,6,["#7ad0ff","#fff"]); }
            else {
              e.hp-=1; if(e.hp<=0) killTank(e,true);
              else { SFX.hitSteel(); boom(b.x+3,b.y+3,5,["#cfd6e4","#fff"]); }
            }
            break; }
        }
      } else {
        for(const t of friendlyTanks()){
          if(!t||t.dead||t.spawnGhost>0.8) continue;
          if(rectHit(b,t.rect())){ b.dead=true; hurtFriendly(t,b); break; }
        }
      }
    }
    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>!e.dead);
    for(const pu of powerups) pu.update(dt);
    powerups=powerups.filter(p=>!p.dead);
    for(const pt of particles) pt.update(dt);
    particles=particles.filter(p=>p.life>0);
    for(const sp of scorePops){ sp.t-=dt; sp.y-=24*dt; }
    while(scorePops.length&&scorePops[0].t<=0) scorePops.shift();
    shake=Math.max(0,shake-dt);
    flashTime=Math.max(0,flashTime-dt);

    // 友军死亡（共享生命）
    for(const t of friendlyTanks()){
      if(t&&t.dead){
        lives--;
        if(lives>0){ respawnFriendly(t); }
        else { doGameOver(); Input.consume(); return; }
      }
    }
    // 基地被毁
    if(!baseAlive){ doGameOver(true); Input.consume(); return; }
    // 关卡通过：先播通关音，留几秒继续移动/捡道具，再进结算
    if(!endless && enemyQueue<=0 && enemies.length===0){
      if(clearGrace<=0){
        clearGrace = CLEAR_GRACE_SEC;
        score+=1000; SFX.levelUp();
        BGM.ensure("clear");
        flash("敌军肃清！还可拾取道具…", CLEAR_GRACE_SEC);
        if(score>hiScore){ hiScore=score; localStorage.tbHiScore=hiScore; }
      } else {
        clearGrace -= dt;
        if(clearGrace<=0){
          stateName="levelClear"; stateTime=0;
          if(level>=CAMPAIGN_LEVELS) flash("🏆 通关全部 "+CAMPAIGN_LEVELS+" 关！");
        }
      }
    }
    // 无尽模式：每杀15个升一级难度
    if(endless && enemiesKilled>=level*15){ level++; flash("〰 无尽模式 · 难度提升至 Lv"+level); SFX.levelUp(); }

    // 房主广播状态（约 12Hz；地图仅变化时带上）
    if(coopMode && coopIsHost && coopSend){
      coopStateAcc+=dt;
      if(coopStateAcc>=0.08){
        coopStateAcc=0;
        try{ coopSend(buildNetState()); }catch(e){}
      }
    }
    Input.consume();
  }
  let menuMoved=false;
  function doGameOver(baseDestroyed){
    stateName="gameover"; stateTime=0; overReason=baseDestroyed?"基地被摧毁！":"生命耗尽"; SFX.gameOver();
    if(baseDestroyed){ shake=0.55; boom(OFF_X+13*TILE,OFF_Y+25*TILE,60); SFX.bigExplode(); }
    else shake=Math.min(shake, 0.2);
    if(score>hiScore){ hiScore=score; localStorage.tbHiScore=hiScore; }
  }

  /* ---------------- 渲染 ---------------- */
  function drawTile(r,c){
    const x=OFF_X+c*TILE, y=OFF_Y+r*TILE, t=grid[r][c];
    if(t===T_BRICK){
      const gr=g.createLinearGradient(x,y,x,y+TILE);
      gr.addColorStop(0,"#b5502a"); gr.addColorStop(1,"#8a3a1e");
      g.fillStyle=gr; g.fillRect(x,y,TILE,TILE);
      g.fillStyle="rgba(0,0,0,.35)";
      g.fillRect(x,y+TILE/2-1,TILE,2); g.fillRect(x+TILE/2-1,y,2,TILE/2); g.fillRect(x+TILE/4-1,y+TILE/2,2,TILE/2);
      g.fillStyle="rgba(255,255,255,.08)"; g.fillRect(x,y,TILE,2);
    } else if(t===T_STEEL){
      const gr=g.createLinearGradient(x,y,x+TILE,y+TILE);
      gr.addColorStop(0,"#e8edf5"); gr.addColorStop(0.5,"#98a2b5"); gr.addColorStop(1,"#5c6577");
      g.fillStyle=gr; g.fillRect(x,y,TILE,TILE);
      g.fillStyle="rgba(255,255,255,.35)"; g.fillRect(x+3,y+3,TILE-6,3);
      g.strokeStyle="rgba(0,0,0,.4)"; g.strokeRect(x+.5,y+.5,TILE-1,TILE-1);
    } else if(t===T_WATER){
      const ph=performance.now()/700;
      const gr=g.createLinearGradient(x,y,x,y+TILE);
      gr.addColorStop(0,"#1b4f9e"); gr.addColorStop(1,"#0e2f66");
      g.fillStyle=gr; g.fillRect(x,y,TILE,TILE);
      g.fillStyle="rgba(140,200,255,.35)";
      const w=Math.sin(ph+r*0.9+c*1.3)*3;
      g.fillRect(x+3,y+6+w,TILE-6,2);
    } else if(t===T_BASE){
      // 美国鹰基地（2x2 只在左上角格绘制一次）
      if(r>0&&grid[r-1][c]===T_BASE) return;
      if(c>0&&grid[r][c-1]===T_BASE) return;
      const s=TILE*2;
      const alive=baseAlive;
      g.fillStyle=alive?"#1a2438":"#2a2a2a"; g.fillRect(x,y,s,s);
      g.strokeStyle=alive?"rgba(232,193,74,.55)":"rgba(80,80,80,.5)"; g.lineWidth=1.5;
      g.strokeRect(x+1,y+1,s-2,s-2);
      const cx=x+s/2, cy=y+s/2;
      // 翅
      g.fillStyle=alive?"#6b3e1f":"#444";
      g.beginPath();
      g.moveTo(cx, cy-2);
      g.lineTo(cx-16, cy+2); g.lineTo(cx-14, cy+8); g.lineTo(cx-4, cy+4);
      g.lineTo(cx+4, cy+4); g.lineTo(cx+14, cy+8); g.lineTo(cx+16, cy+2);
      g.closePath(); g.fill();
      // 身
      g.fillStyle=alive?"#8a5528":"#555";
      g.beginPath(); g.arc(cx, cy+3, 6.5, 0, Math.PI*2); g.fill();
      // 白头（秃鹰）
      g.fillStyle=alive?"#f2f2f0":"#777";
      g.beginPath(); g.arc(cx, cy-6, 5.2, 0, Math.PI*2); g.fill();
      // 喙
      g.fillStyle=alive?"#e8a040":"#666";
      g.beginPath(); g.moveTo(cx+3, cy-6); g.lineTo(cx+9, cy-5); g.lineTo(cx+3, cy-3); g.closePath(); g.fill();
      // 眼
      g.fillStyle="#111"; g.beginPath(); g.arc(cx+1.5, cy-7, 0.9, 0, Math.PI*2); g.fill();
      // 爪/座
      g.fillStyle=alive?"#c9a24a":"#555";
      g.fillRect(cx-7, y+s-7, 14, 3);
      if(!alive){
        g.strokeStyle="rgba(255,80,80,.7)"; g.lineWidth=2;
        g.beginPath(); g.moveTo(x+6,y+6); g.lineTo(x+s-6,y+s-6);
        g.moveTo(x+s-6,y+6); g.lineTo(x+6,y+s-6); g.stroke();
      }
    }
  }
  function drawGrass(r,c){
    const x=OFF_X+c*TILE, y=OFF_Y+r*TILE;
    g.fillStyle="#2c7a30"; g.fillRect(x,y,TILE,TILE);
    g.fillStyle="#3f9b41";
    g.fillRect(x+2,y+2,5,5); g.fillRect(x+11,y+4,6,5); g.fillRect(x+5,y+11,6,6);
    g.fillStyle="#61bd54"; g.fillRect(x+13,y+13,4,4); g.fillRect(x+3,y+8,3,3);
  }
  /**
   * 敌人外观：贴图缩放一律 ≤1（不超过碰撞格/地格占位）。
   * 弱小往小画；厚甲用颜色/铆钉区分，不放大出格。
   */
  function enemyVis(t){
    switch(t.type){
      case "fast":  return {sx:0.62, sy:0.72, track:3.5, barrel:0.78, turret:4.5, maxHp:1};
      case "power": return {sx:0.90, sy:0.92, track:5.5, barrel:1.0,  turret:6.0, maxHp:1}; // 炮管不伸出格外
      case "mid":   return {sx:0.92, sy:0.94, track:7,   barrel:0.95, turret:6.8, maxHp:2};
      case "armor": return {sx:1.0,  sy:1.0,  track:8,   barrel:0.95, turret:7.2, maxHp:3};
      default:      return {sx:1.0,  sy:1.0,  track:6,   barrel:0.92, turret:6.5, maxHp:1}; // normal
    }
  }
  function drawTank(t){
    if(t.dead) return;
    if(t.spawnGhost>0 && Math.floor(t.spawnGhost*10)%2===0 && !t.isPlayer) return;
    g.save(); g.translate(t.cx,t.cy); g.rotate(t.dir*Math.PI/2);
    const w=t.w,h=t.h;
    const bulk = (t.isPlayer && t.bulk) ? t.bulk : 0;
    // 玩家也不放大出格：装甲只加厚履带/铆钉，scale 固定 1
    const vis = t.isPlayer
      ? {sx:1, sy:1, track:bulk>=2?8:(bulk>=1?7:6), barrel:0.92, turret:bulk?7.2:6.5, maxHp:1}
      : enemyVis(t);
    g.scale(Math.min(1, vis.sx), Math.min(1, vis.sy));
    const trackW = Math.min(vis.track, w/2-1);
    const trackShift = Math.floor(t.anim)%2===0?0:2;
    const thickBody = t.type==="armor" || t.type==="mid";
    g.fillStyle=t.isPlayer?(bulk?"#2a3520":"#3a4a2a"):(thickBody?"#2a2e38":"#333844");
    g.fillRect(-w/2,-h/2,trackW,h); g.fillRect(w/2-trackW,-h/2,trackW,h);
    if(bulk){
      g.fillStyle="rgba(255,210,100,.35)";
      g.fillRect(-w/2,-h/2,2,h); g.fillRect(w/2-2,-h/2,2,h);
    }
    g.fillStyle="rgba(255,255,255,.18)";
    for(let i=-h/2+trackShift;i<h/2;i+=5){
      g.fillRect(-w/2+1,i,trackW-2,2); g.fillRect(w/2-trackW+1,i,trackW-2,2);
    }
    let c1,c2;
    if(t.isPlayer){
      if(t.coopTint){ c1=t.coopTint[0]; c2=t.coopTint[1]; }
      else if(bulk>=2){ c1="#ffe08a"; c2="#a07818"; }
      else if(bulk>=1){ c1="#edd45a"; c2="#8a6a14"; }
      else { c1="#d8c84a"; c2="#8a7a1e"; }
    }
    else if(t.type==="fast"){ c1="#7ac0e8"; c2="#1e5a8a"; }
    else if(t.type==="power"){ c1="#e88a7a"; c2="#9a3a2a"; }
    else if(t.type==="mid"){ c1="#c9a0e8"; c2="#5a2a8a"; }
    else if(t.type==="armor"){ c1="#c8d0e0"; c2="#4a5468"; }
    else { c1="#b0b8a0"; c2="#5a6050"; }
    const gr=g.createLinearGradient(-w/2,-h/2,w/2,h/2);
    gr.addColorStop(0,c1); gr.addColorStop(1,c2);
    g.fillStyle=gr; g.fillRect(-w/2+trackW-1,-h/2+3,w-trackW*2+2,h-6);
    if(bulk>0 || thickBody){
      const thick = bulk>=2 || t.type==="armor";
      g.strokeStyle = t.isPlayer
        ? (bulk>=2 ? "rgba(255,200,60,.95)" : "rgba(255,210,120,.8)")
        : (t.type==="mid" ? "rgba(220,160,255,.75)" : "rgba(200,220,255,.7)");
      g.lineWidth = thick ? 2.2 : 1.6;
      g.strokeRect(-w/2+trackW,-h/2+4,w-trackW*2,h-8);
      g.fillStyle=t.isPlayer?"#c9a24a":(t.type==="mid"?"#b080d0":"#98a8c0");
      const rivets=[[-6,-6],[6,-6],[-6,6],[6,6],[0,-7],[0,7]];
      for(const [rx,ry] of rivets){ g.beginPath(); g.arc(rx,ry,thick?1.5:1.1,0,Math.PI*2); g.fill(); }
    }
    if(t.type==="fast"){
      g.fillStyle="rgba(180,230,255,.55)";
      g.fillRect(-2,-h/2+6,4,h-12);
      g.fillStyle="rgba(255,255,255,.35)";
      g.fillRect(-w/2+trackW+1,-4,w-trackW*2-2,2);
    }
    g.fillStyle=t.isPlayer?(bulk?"#ffe9a0":"#eadb6a")
      :(t.type==="mid"?"#e8d0ff":"#d8dde8");
    g.beginPath(); g.arc(0,1,vis.turret,0,Math.PI*2); g.fill();
    if(bulk){ g.strokeStyle="rgba(180,120,20,.7)"; g.lineWidth=1.5; g.stroke(); }
    // 炮管：末端不超过格子边缘（-h/2）
    const barrelLen = Math.min((h/2-1)*vis.barrel, h/2-1);
    g.fillStyle=t.isPlayer?"#6a5c14":(t.type==="power"?"#5a2020":"#404858");
    const bw = t.type==="power" ? 3.2 : (t.type==="fast" ? 2.0 : 2.4);
    g.fillRect(-bw, -barrelLen, bw*2, barrelLen+4);
    if(!t.isPlayer && vis.maxHp>1 && t.hp<vis.maxHp){
      g.fillStyle = "rgba(255,80,80,.85)";
      g.fillRect(-w/2+5,h/2-5,(w-10)*(t.hp/vis.maxHp),3);
    }
    if(t.type==="armor"){
      g.fillStyle="rgba(220,230,255,.9)"; g.font="bold 7px sans-serif"; g.textAlign="center";
      g.fillText("×3",0,-h/2+7);
    } else if(t.type==="mid"){
      g.fillStyle="rgba(230,200,255,.9)"; g.font="bold 7px sans-serif"; g.textAlign="center";
      g.fillText("×2",0,-h/2+7);
    }
    if(t.isPlayer && t.coopName){
      g.fillStyle="#fff"; g.font="bold 7px sans-serif"; g.textAlign="center";
      g.fillText(String(t.coopName).slice(0,6),0,-h/2+7);
    }
    g.restore();
    if(t.isPlayer&&t.boat){
      const pad=5, pulse=0.65+0.25*Math.sin(performance.now()/200);
      g.strokeStyle=`rgba(90,190,255,${pulse})`; g.lineWidth=3;
      g.beginPath(); g.roundRect(t.x-pad,t.y-pad,t.w+pad*2,t.h+pad*2,8); g.stroke();
      g.strokeStyle="rgba(160,220,255,.35)"; g.lineWidth=1.5;
      g.beginPath(); g.roundRect(t.x-pad-3,t.y-pad-3,t.w+pad*2+6,t.h+pad*2+6,10); g.stroke();
    }
    // 装甲：只改车身样式，不外围加圈（避免像船）
    if(t.shield>0){
      const a=0.35+0.25*Math.sin(performance.now()/90);
      g.strokeStyle=`rgba(120,210,255,${a})`; g.lineWidth=2.5;
      g.beginPath(); g.arc(t.cx,t.cy,t.w/2+6,0,Math.PI*2); g.stroke();
      g.strokeStyle=`rgba(255,255,255,${a*0.6})`;
      g.beginPath(); g.arc(t.cx,t.cy,t.w/2+9,performance.now()/300,performance.now()/300+Math.PI); g.stroke();
    }
    if(t.frozen>0){ g.fillStyle="rgba(150,220,255,.25)"; g.fillRect(t.x,t.y,t.w,t.h); }
  }
  function drawBullet(b){
    const gr=g.createRadialGradient(b.x+3,b.y+3,0,b.x+3,b.y+3,6);
    if(b.power>=3){ gr.addColorStop(0,"#fff"); gr.addColorStop(0.4,"#ffd24a"); gr.addColorStop(1,"rgba(255,120,40,0)"); }
    else { gr.addColorStop(0,"#fff"); gr.addColorStop(0.5,"#ffe9a0"); gr.addColorStop(1,"rgba(255,220,120,0)"); }
    g.fillStyle=gr; g.fillRect(b.x-3,b.y-3,12,12);
    g.fillStyle=b.power>=3?"#ffd24a":"#eee";
    g.fillRect(b.x+1,b.y+1,4,4);
  }
  function drawPowerup(pu){
    const x=pu.x,y=pu.y,s=TILE*2;
    if(pu.life<4 && Math.floor(pu.life*6)%2===0) return; // 快消失时闪烁
    const bob=Math.sin(pu.t*4)*2;
    g.save(); g.translate(x+s/2,y+s/2+bob);
    // 底板发光
    const glow=g.createRadialGradient(0,0,2,0,0,s*0.8);
    glow.addColorStop(0,"rgba(255,240,150,.5)"); glow.addColorStop(1,"rgba(255,240,150,0)");
    g.fillStyle=glow; g.fillRect(-s,-s,s*2,s*2);
    g.fillStyle="#1c2030"; g.strokeStyle="#ffd24a"; g.lineWidth=2;
    g.beginPath(); g.roundRect(-s/2+2,-s/2+2,s-4,s-4,5); g.fill(); g.stroke();
    g.textAlign="center"; g.textBaseline="middle";
    // 图标（代码绘制）
    switch(pu.type){
      case PU.STAR: star(0,0,9,"#ffd24a"); break;
      case PU.GUN:
        g.fillStyle="#e8e8f0"; g.fillRect(-9,-4,16,6); g.fillRect(-8,2,5,7);
        g.fillStyle="#ffb02e"; g.fillRect(5,-4,4,6); break;
      case PU.BOAT:
        g.fillStyle="#7ab8e8"; g.beginPath(); g.moveTo(-10,3); g.lineTo(10,3); g.lineTo(5,9); g.lineTo(-5,9); g.closePath(); g.fill();
        g.fillStyle="#fff"; g.beginPath(); g.moveTo(0,-9); g.lineTo(0,2); g.lineTo(8,2); g.closePath(); g.fill(); break;
      case PU.GRENADE:
        // 地雷：圆盘 + 触角 + 危险标
        g.fillStyle="#3a3f48";
        g.beginPath(); g.arc(0,2,10,0,Math.PI*2); g.fill();
        g.fillStyle="#5a6470";
        g.beginPath(); g.arc(0,2,7,0,Math.PI*2); g.fill();
        g.fillStyle="#2a3038";
        g.beginPath(); g.arc(0,2,3.5,0,Math.PI*2); g.fill();
        g.strokeStyle="#c9a24a"; g.lineWidth=1.5;
        g.beginPath(); g.arc(0,2,10,0,Math.PI*2); g.stroke();
        // 四根触须
        g.strokeStyle="#d8dde8"; g.lineWidth=2;
        [[-11,-4],[11,-4],[-8,12],[8,12]].forEach(([x,y])=>{
          g.beginPath(); g.moveTo(0,2); g.lineTo(x,y); g.stroke();
          g.fillStyle="#ffd24a"; g.beginPath(); g.arc(x,y,1.6,0,Math.PI*2); g.fill();
        });
        g.fillStyle="#ff6b4a"; g.font="bold 9px sans-serif"; g.textAlign="center";
        g.fillText("!",0,5);
        break;
      case PU.HELMET:
        g.fillStyle="#9ad0ff"; g.beginPath(); g.arc(0,2,8,Math.PI,0); g.fill();
        g.fillRect(-8,2,16,3); break;
      case PU.TANK:
        // 小坦克（加命）
        g.fillStyle="#3a4a2a";
        g.fillRect(-10,-6,4,14); g.fillRect(6,-6,4,14);
        g.fillStyle="#d8c84a";
        g.fillRect(-7,-4,14,10);
        g.fillStyle="#8a7a1e";
        g.fillRect(-7,5,14,3);
        g.fillStyle="#eadb6a";
        g.beginPath(); g.arc(0,0,3.5,0,Math.PI*2); g.fill();
        g.fillStyle="#6a5c14";
        g.fillRect(-1.5,-11,3,8);
        break;
      case PU.CLOCK:
        g.strokeStyle="#fff"; g.lineWidth=2; g.beginPath(); g.arc(0,0,8,0,Math.PI*2); g.stroke();
        g.beginPath(); g.moveTo(0,0); g.lineTo(0,-5); g.moveTo(0,0); g.lineTo(4,2); g.stroke(); break;
      case PU.SHOVEL:
        g.fillStyle="#c9a06a"; g.fillRect(-2,-9,4,10);
        g.fillStyle="#98a2b5"; g.beginPath(); g.moveTo(-6,1); g.lineTo(6,1); g.lineTo(4,9); g.lineTo(-4,9); g.closePath(); g.fill(); break;
    }
    g.restore();
  }
  function star(cx,cy,r,color){
    g.fillStyle=color; g.beginPath();
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2===0?r:r*0.45;
      g[i===0?"moveTo":"lineTo"](cx+Math.cos(a)*rr,cy+Math.sin(a)*rr); }
    g.closePath(); g.fill();
  }

  function drawHUD(){
    // 侧栏面板
    g.fillStyle="rgba(255,255,255,.05)";
    g.fillRect(4,OFF_Y,OFF_X-10,FIELD_H*TILE);
    g.fillRect(OFF_X+FIELD_PX+6,OFF_Y,OFF_X-10,FIELD_H*TILE);
    g.fillStyle="#dfe6f5"; g.font="bold 15px sans-serif"; g.textAlign="center";
    const lx=(OFF_X-8)/2+4;

    g.font="bold 26px sans-serif"; g.fillStyle="#ffd24a";
    g.fillText(endless?"∞":(level+"/"+CAMPAIGN_LEVELS),lx,OFF_Y+54);
    if(endless){ g.font="11px sans-serif"; g.fillStyle="#9fb0d0"; g.fillText("难度 Lv"+level,lx,OFF_Y+72); }
    else if(enemyLootMode){ g.font="11px sans-serif"; g.fillStyle="#ff9d7a"; g.fillText("敌可吃道具",lx,OFF_Y+72); }
    g.font="bold 15px sans-serif"; g.fillStyle="#dfe6f5";
    g.fillText("生命",lx,OFF_Y+108);
    g.fillStyle="#ff7a6a"; g.font="bold 22px sans-serif"; g.fillText("♥ ×"+Math.max(0,lives),lx,OFF_Y+134);
    // 剩余敌人
    g.fillStyle="#dfe6f5"; g.font="bold 15px sans-serif"; g.fillText("敌军",lx,OFF_Y+176);
    if(endless){ g.fillStyle="#c0c8dc"; g.font="bold 18px sans-serif"; g.fillText("×"+enemiesKilled+" 击毁",lx,OFF_Y+200); }
    else{ const remain=enemyQueue+enemies.length;
      let ex=lx-30, ey=OFF_Y+192;
      g.fillStyle="#b0687a";
      for(let i=0;i<remain&&i<20;i++){ g.fillRect(ex+(i%4)*16,ey+Math.floor(i/4)*14,10,10); } }
    // 右侧：分数与状态

    g.fillStyle="#dfe6f5"; g.font="bold 15px sans-serif"; g.fillText("最高",rx,OFF_Y+88);
    g.fillStyle="#c0c8dc"; g.font="bold 18px sans-serif"; g.fillText(hiScore,rx,OFF_Y+112);
    // 火力星级
    g.fillStyle="#dfe6f5"; g.font="bold 15px sans-serif"; g.fillText("火力",rx,OFF_Y+150);
    for(let i=0;i<4;i++) star(rx-27+i*18,OFF_Y+170,7,i<(player?player.stars:0)?"#ffd24a":"#3a4258");
    if(player&&player.boat){ g.fillStyle="#7ab8e8"; g.font="bold 14px sans-serif"; g.fillText("⛵ 船",rx,OFF_Y+200); }
    if(player&&player.bulk>0){ g.fillStyle="#ffd24a"; g.font="bold 13px sans-serif";

    if(player&&player.shield>0){ g.fillStyle="#9ad0ff"; g.font="bold 13px sans-serif";

  function drawFrame(){
    // 背景渐变
    const bg=g.createLinearGradient(0,0,0,CANVAS_H);
    bg.addColorStop(0,"#12121e"); bg.addColorStop(1,"#0a0a12");
    g.fillStyle=bg; g.fillRect(0,0,CANVAS_W,CANVAS_H);
    g.save();
    if(shake>0) g.translate(rand(-1,1)*shake*12,rand(-1,1)*shake*12);
    // 战场底色
    const fg=g.createLinearGradient(OFF_X,OFF_Y,OFF_X,OFF_Y+FIELD_H*TILE);

    g.fillStyle=fg; g.fillRect(OFF_X,OFF_Y,FIELD_PX,FIELD_H*TILE);
    g.strokeStyle="rgba(120,160,255,.25)"; g.lineWidth=2;
    g.strokeRect(OFF_X-1,OFF_Y-1,FIELD_PX+2,FIELD_H*TILE+2);
    if(grid){
      // 先画非草地块
      for(let r=0;r<FIELD_H;r++) for(let c=0;c<FIELD_W;c++)
        if(grid[r][c]!==T_EMPTY&&grid[r][c]!==T_GRASS) drawTile(r,c);
      for(const pu of powerups) drawPowerup(pu);
      for(const e of enemies) drawTank(e);
      for(const t of friendlyTanks()) drawTank(t);
      for(const b of bullets) drawBullet(b);
      // 草最后画（遮挡坦克）
      for(let r=0;r<FIELD_H;r++) for(let c=0;c<FIELD_W;c++)
        if(grid[r][c]===T_GRASS) drawGrass(r,c);
      for(const pt of particles) pt.draw(g);
      // 分数飘字
      g.textAlign="center"; g.font="bold 13px sans-serif";
      for(const sp of scorePops){ g.globalAlpha=Math.min(1,sp.t*2); g.fillStyle="#ffe9a0";
        g.fillText("+"+sp.v,sp.x,sp.y); }
      g.globalAlpha=1;
    }
    g.restore();
    drawHUD();
    // 顶部提示条
    if(flashTime>0){
      g.globalAlpha=Math.min(1,flashTime*2);
      g.fillStyle="rgba(20,26,44,.85)";
      const w=g.measureText(flashMsg).width+60;
      g.fillRect(CANVAS_W/2-w/2,6,w,26);
      g.fillStyle="#ffe9a0"; g.font="bold 14px sans-serif"; g.textAlign="center";
      g.fillText(flashMsg,CANVAS_W/2,24); g.globalAlpha=1;
    }
    if(stateName==="playing" && clearGrace>0){
      g.fillStyle="rgba(10,14,28,.72)";
      g.fillRect(CANVAS_W/2-90, CANVAS_H-36, 180, 26);
      g.fillStyle="#7ae0a0"; g.font="bold 14px sans-serif"; g.textAlign="center";
      g.fillText("过关倒计时 "+clearGrace.toFixed(1)+"s", CANVAS_W/2, CANVAS_H-18);
    }
    // 覆盖层
    if(stateName==="menu") drawMenu();
    else if(stateName==="paused") drawOverlay("暂停","按 L / P 或点击暂停键继续（背景音乐已暂停）");
    else if(stateName==="levelClear"){
      const done=!endless && level>=CAMPAIGN_LEVELS;
      const waitGuest=coopMode && !coopIsHost;
      let sub;
      if(done) sub=waitGuest?("得分 "+score+"　·　等待房主回标题"):("得分 "+score+"　·　按 开火键 回标题");
      else sub=waitGuest?("得分 "+score+"　·　等待房主进入下一关"):("得分 "+score+"　·　按 开火键 进入下一关");
      drawOverlay(done?"全部通关！":("关卡 "+level+" 通过！"), sub);
    }
    else if(stateName==="gameover") drawOverlay("游 戏 结 束",
      overReason+"　·　得分 "+score+(score>=hiScore?"（新纪录！）":"　·　最高 "+hiScore)+
      (coopMode?(coopIsHost?"　·　房主按 开火键 重开":"　·　等待房主重开"):"　·　按 开火键 重新开始"),true);
  }
  function drawOverlay(title,sub,isOver){
    g.fillStyle="rgba(5,6,12,.72)"; g.fillRect(0,0,CANVAS_W,CANVAS_H);
    g.textAlign="center";
    const gr=g.createLinearGradient(0,CANVAS_H/2-60,0,CANVAS_H/2+10);
    gr.addColorStop(0,isOver?"#ff8a6a":"#8ad0ff"); gr.addColorStop(1,isOver?"#c23a2a":"#3a7fd0");
    g.fillStyle=gr; g.font="bold 52px sans-serif";
    g.fillText(title,CANVAS_W/2,CANVAS_H/2-20);
    g.fillStyle="#dfe6f5"; g.font="16px sans-serif";
    g.fillText(sub,CANVAS_W/2,CANVAS_H/2+30);
    const guestWait=coopMode && !coopIsHost && (stateName==="gameover"||stateName==="levelClear");
    if(!guestWait && stateTime%1<0.6){ g.fillStyle="#ffd24a"; g.font="bold 15px sans-serif";
      g.fillText("▶ 开火键 / 点击屏幕 继续",CANVAS_W/2,CANVAS_H/2+72); }
  }
  function drawMenu(){
    g.fillStyle="rgba(5,6,12,.82)"; g.fillRect(0,0,CANVAS_W,CANVAS_H);
    // 标题
    g.textAlign="center";
    const t=performance.now()/1000;
    const gr=g.createLinearGradient(0,110,0,190);
    gr.addColorStop(0,"#ffd24a"); gr.addColorStop(1,"#ff7a2e");
    g.fillStyle=gr; g.font="bold 64px sans-serif";
    g.fillText("坦 克 大 战",CANVAS_W/2,170);
    g.fillStyle="#9fb0d0"; g.font="16px sans-serif";
    g.fillText("TANK BATTLE · 经典改版",CANVAS_W/2,200);
    // 菜单项
    const items=[
      "🎮 闯关模式（共 "+CAMPAIGN_LEVELS+" 关）",
      "♾ 无尽模式",
      "😈 敌人吃道具",
      "🧪 测试模式（道具必掉）",
      "🌐 合作联机（最多 8 人）"
    ];
    g.font="bold 20px sans-serif";
    items.forEach((it,i)=>{
      const y=236+i*38, sel=menuSel===i;
      if(sel){ g.fillStyle="rgba(255,210,74,.12)";
        g.fillRect(CANVAS_W/2-200,y-26,400,34);
        g.fillStyle="#ffd24a"; g.fillText("▶",CANVAS_W/2-220,y); }
      g.fillStyle=sel?"#ffe9a0":"#8a94ac";
      g.fillText(it,CANVAS_W/2,y);
    });
    g.fillStyle="#6a748c"; g.font="12px sans-serif";
    g.fillText("敌军血量：蓝/绿/红=1　紫×2　灰×3　·　贴图不超过格子",CANVAS_W/2,430);
    g.fillText("移动：WASD / 方向键 / 摇杆　　开火：J / 回车 / K / 空格　　暂停：L / P",CANVAS_W/2,450);
    g.fillText("道具：⛵船=渡水+护盾　🔫手枪=火力直升打铁，再吃一个可除草",CANVAS_W/2,470);
    if(t%1<0.6){ g.fillStyle="#7ae0a0"; g.font="bold 15px sans-serif";
      g.fillText("按 开火键 / 点击屏幕 开始（上下键切换模式）",CANVAS_W/2,496); }
    g.fillStyle="#ffd24a"; g.font="bold 15px sans-serif";
    g.fillText("最高分："+hiScore,CANVAS_W/2,520);
  }

  /* ---- 主循环 ---- */
  let last=performance.now();
  function loop(now){
    let dt=(now-last)/1000; last=now;
    dt=Math.min(dt,0.05);  // 防止切后台后大步长穿墙
    update(dt);
    drawFrame();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  return {
    beginCampaignFromCoop: function(opts){
      opts=opts||{};
      coopMode=true;
      coopMyPid=opts.myPid||"";
      coopHostPid=opts.hostPid||"";
      coopIsHost=!!opts.isHost || (coopMyPid && coopMyPid===coopHostPid);
      coopSend=typeof opts.send==="function" ? opts.send : null;
      coopRoster=Array.isArray(opts.roster)?opts.roster.slice():[];
      coopRemoteInput={};
      coopStateAcc=0;
      coopGridSent="";
      endless=false; enemyLootMode=false; debugMode=false;
      level=1; score=0; lives=30; player=null; coopAllies={}; overReason="";
      // 中途加入：先进入 playing，等房主 state 覆盖
      newLevel(); stateName="playing"; SFX.levelUp();
      flash(opts.lateJoin ? "中途加入 · 同步战场中…" : (coopIsHost?"联机房主 · 同步中":"联机加入 · 等待房主同步"), 1.6);
    },
    onRemoteInput: function(pid, data){
      if(!coopMode||!coopIsHost||!pid) return;
      coopRemoteInput[pid]={
        mx:data&&data.mx|0,
        my:data&&data.my|0,
        fire:!!(data&&data.fire)
      };
    },
    applyNetState: applyNetState,
    onCoopRoster: onCoopRoster,
    isCoopHost: function(){ return coopMode&&coopIsHost; }
  };
})();

/* ---------------- 合作联机 WebSocket 大厅 ---------------- */
(() => {
  const panel = document.getElementById("coopPanel");
  const rosterEl = document.getElementById("coopRoster");
  const msgEl = document.getElementById("coopMsg");
  let ws = null, myPid = "", room = null, ready = false, hostPid = "";

  function apiBase(){
    if(typeof siteConfig!=="undefined" && siteConfig.apiBase) return siteConfig.apiBase;
    const host = location.hostname;
    if(host==="localhost"||host==="127.0.0.1") return "http://127.0.0.1:8001";
    return location.origin + "/api";
  }
  function wsUrl(){
    return apiBase().replace(/^http/, "ws") + "/game/tank-coop/ws";
  }
  function setMsg(t){ if(msgEl) msgEl.textContent = t||""; }
  function renderRoster(){
    if(!rosterEl) return;
    if(!room){ rosterEl.textContent = "尚未进入房间"; return; }
    const lines = ["房间 "+room.code+" · "+(room.players||[]).length+"/"+room.maxPlayers];
    (room.players||[]).forEach(p=>{
      lines.push((p.host?"👑 ":"· ")+p.name+(p.ready?" ✓准备":"")+(p.pid===myPid?"（我）":""));
    });
    rosterEl.textContent = lines.join("\n");
    const codeInp = document.getElementById("coopCode");
    if(codeInp && room.code) codeInp.value = room.code;
  }
  function normalizeCode(raw){
    const digits=String(raw||"").replace(/\D/g,"");
    return digits ? digits.padStart(6,"0").slice(-6) : "";
  }
  function send(obj){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(obj)); }
  function startGame(msg){
    room=msg.room||room;
    hostPid=msg.hostPid||hostPid||((room.players||[]).find(p=>p.host)||{}).pid||"";
    const roster=(room&&room.players)||[];
    const isHost = myPid && myPid===hostPid;
    closePanel();
    if(typeof Game!=="undefined" && Game.beginCampaignFromCoop){
      Game.beginCampaignFromCoop({
        myPid, hostPid, isHost, roster,
        lateJoin: !!msg.lateJoin,
        send: function(payload){ send(payload); }
      });
    }
  }
  function ensureWs(){
    return new Promise((resolve, reject)=>{
      if(ws && ws.readyState===1){ resolve(ws); return; }
      try{
        ws = new WebSocket(wsUrl());
      }catch(e){ reject(e); return; }
      ws.onopen = ()=> resolve(ws);
      ws.onerror = ()=>{ setMsg("无法连接服务器"); reject(new Error("ws")); };
      ws.onclose = ()=>{ setMsg("连接已断开"); room=null; renderRoster(); };
      ws.onmessage = (ev)=>{
        let msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
        if(msg.type==="hello"){ myPid=msg.pid; }
        else if(msg.type==="joined"){
          myPid=msg.you; room=msg.room;
          if(msg.hostPid) hostPid=msg.hostPid;
          setMsg((msg.lateJoin?"中途加入 ":"已进入房间 ")+room.code);
          renderRoster();
          if(msg.lateJoin) startGame({ room, hostPid, lateJoin:true });
        }
        else if(msg.type==="roster"){
          room=msg.room; renderRoster();
          if(typeof Game!=="undefined" && Game.onCoopRoster) Game.onCoopRoster((room&&room.players)||[]);
        }
        else if(msg.type==="start"){ setMsg("开战！"); startGame(msg); }
        else if(msg.type==="input"){
          if(typeof Game!=="undefined" && Game.onRemoteInput) Game.onRemoteInput(msg.from, msg);
        }
        else if(msg.type==="state"){
          if(typeof Game!=="undefined" && Game.applyNetState && !Game.isCoopHost()) Game.applyNetState(msg);
        }
        else if(msg.type==="event"){
          if(msg.name==="restart" && typeof Game!=="undefined" && Game.beginCampaignFromCoop && !Game.isCoopHost()){
            startGame({ room, hostPid, lateJoin:false });
          }
        }
        else if(msg.type==="error"){
          const map={room_not_found:"房间不存在",bad_password:"密码错误",room_full:"房间已满",
            already_started:"已开局",host_only:"仅房主可开始",already_in_room:"已在房间中"};
          setMsg(map[msg.message]||msg.message||"错误");
        }
      };
    });
  }
  function open(){
    panel.classList.add("open");
    panel.setAttribute("aria-hidden","false");
    const nameInp=document.getElementById("coopName");
    if(nameInp && !nameInp.value){
      try{ nameInp.value = localStorage.getItem("tb_tank_coop_name")||("P"+Math.floor(Math.random()*90+10)); }catch(e){}
    }
    setMsg(""); renderRoster();
  }
  function closePanel(){
    panel.classList.remove("open");
    panel.setAttribute("aria-hidden","true");
  }
  function name(){
    const n=(document.getElementById("coopName").value||"Player").trim().slice(0,16);
    try{ localStorage.setItem("tb_tank_coop_name", n); }catch(e){}
    return n;
  }
  function password(){ return (document.getElementById("coopPass").value||"").slice(0,32); }

  document.getElementById("coopCreate").onclick = async ()=>{
    try{
      await ensureWs();
      send({type:"create", name:name(), password:password()});
    }catch(e){ setMsg("连接失败"); }
  };
  document.getElementById("coopJoin").onclick = async ()=>{
    const code=normalizeCode(document.getElementById("coopCode").value);
    if(!code){ setMsg("请填写 6 位房间号"); return; }
    document.getElementById("coopCode").value=code;
    try{
      await ensureWs();
      send({type:"join", code, name:name(), password:password()});
    }catch(e){ setMsg("连接失败"); }
  };
  document.getElementById("coopReady").onclick = ()=>{
    ready = !ready;
    send({type:"ready", ready});
    setMsg(ready?"已准备":"取消准备");
  };
  document.getElementById("coopStart").onclick = ()=>{
    send({type:"start", level:1});
  };
  document.getElementById("coopClose").onclick = ()=>{
    send({type:"leave"});
    try{ if(ws) ws.close(); }catch(e){}
    ws=null; room=null; closePanel();
  };

  panel.addEventListener("touchstart", e=>e.stopPropagation(), {passive:true});
  panel.addEventListener("pointerdown", e=>e.stopPropagation());

  window.TankCoop = { open, close: closePanel };
})();

/* ---------------- 画布缩放：PC 普通横屏 / 手机竖屏自动旋转横屏 ---------------- */
(() => {
  const cvs = document.getElementById("gameCanvas");
  const stage = document.getElementById("rotWrap");
  window.__tbCssLand = false;

  function isWeChat(){ return /MicroMessenger/i.test(navigator.userAgent || ""); }
  /** 手机/平板触屏（不含普通 PC） */
  function isMobile(){
    if(isWeChat()) return true;
    if(window.matchMedia("(pointer: coarse)").matches) return true;
    if(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "")) return true;
    return ("ontouchstart" in window) && (navigator.maxTouchPoints|0) > 1
      && window.matchMedia("(hover: none)").matches;
  }

  /**
   * PC：窗口内等比适配，不旋转。
   * 手机竖屏：舞台旋转 90° 铺满（微信无法系统横屏时靠这个）。
   * 手机已横持：也不旋转，直接铺满。
   */
  function layout(){
    const vw = window.innerWidth || document.documentElement.clientWidth;
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const portrait = vh > vw;
    const useCssLand = isMobile() && portrait;
    window.__tbCssLand = useCssLand;
    document.body.classList.toggle("cssRotate", useCssLand);

    stage.style.position = "fixed";
    stage.style.overflow = "hidden";
    if(useCssLand){
      stage.style.left = "0";
      stage.style.top = "0";
      stage.style.right = "auto";
      stage.style.bottom = "auto";
      stage.style.width = vh + "px";
      stage.style.height = vw + "px";
      stage.style.transformOrigin = "0 0";
      stage.style.transform = "translate(" + vw + "px,0) rotate(90deg)";
      const scale = Math.min(vh / CANVAS_W, vw / CANVAS_H);
      cvs.style.width = Math.floor(CANVAS_W * scale) + "px";
      cvs.style.height = Math.floor(CANVAS_H * scale) + "px";
    } else {
      stage.style.left = "0";
      stage.style.top = "0";
      stage.style.right = "0";
      stage.style.bottom = "0";
      stage.style.width = "auto";
      stage.style.height = "auto";
      stage.style.transform = "none";
      const scale = Math.min(vw / CANVAS_W, vh / CANVAS_H);
      cvs.style.width = Math.floor(CANVAS_W * scale) + "px";
      cvs.style.height = Math.floor(CANVAS_H * scale) + "px";
    }
  }

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 120));
  if(window.visualViewport) window.visualViewport.addEventListener("resize", layout);

  if(isMobile()){
    document.querySelectorAll(".touchUI").forEach(el => { el.style.display = "block"; });
    const bf = document.getElementById("btnFire");
    const bp = document.getElementById("btnPause");
    if(bf) bf.style.display = "flex";
    if(bp) bp.style.display = "flex";
  }

  layout();
})();
</script>
</body>
</html>
