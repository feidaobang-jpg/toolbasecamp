<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>坦克大战 · Tank Battle</title>
<style>
/* ========== 全局样式 ========== */
html,body{margin:0;padding:0;width:100%;height:100%;background:#0a0a12;overflow:hidden;
  font-family:"Segoe UI",Arial,"Microsoft YaHei",sans-serif;touch-action:none;
  -webkit-user-select:none;user-select:none;
  height:100dvh;width:100dvw;}
#rotWrap{
  position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(ellipse at center,#141428 0%,#07070d 100%);
}
#gameWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
#gameCanvas{display:block;background:#000;box-shadow:0 0 40px rgba(80,160,255,.25),0 0 120px rgba(0,0,0,.8);
  border-radius:6px;max-width:100%;max-height:100%;}
/* 虚拟摇杆与按钮（仅触屏显示）——坐标相对旋转后的舞台 */
.touchUI{position:absolute;z-index:40;display:none;}
#joyBase{left:0;bottom:5%;width:28%;max-width:140px;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:2px solid rgba(255,255,255,.25);}
#joyKnob{position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#8fd0ff,#2f6bd8);
  box-shadow:0 0 14px rgba(90,170,255,.7);}
.tBtn{border-radius:50%;border:2px solid rgba(255,255,255,.3);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000;}
#btnFire{right:4%;bottom:6%;width:16%;max-width:88px;aspect-ratio:1;font-size:15px;
  background:radial-gradient(circle at 35% 30%,#ff9d7a,#c2402a);}
/* 暂停叠在开火正上方（同中心，开火高 + 间距） */
#btnPause{right:6.5%;bottom:calc(6% + min(16vw,88px) + 10px);width:11%;max-width:60px;aspect-ratio:1;font-size:12px;
  background:radial-gradient(circle at 35% 30%,#c9c9e8,#565688);}
/* 合作联机大厅 */
#coopPanel{display:none;position:absolute;inset:0;z-index:50;align-items:center;justify-content:center;
  background:rgba(5,6,14,.88);padding:16px;box-sizing:border-box;}
#coopPanel.open{display:flex;}
.coop-box{width:min(420px,96vw);background:#15182a;border:1px solid rgba(255,210,74,.35);border-radius:14px;
  padding:18px 16px;color:#e8ecf8;font-size:14px;}
.coop-box h2{margin:0 0 10px;font-size:18px;color:#ffd24a;text-align:center;}
.coop-box label{display:block;margin:8px 0 4px;color:#9fb0d0;font-size:12px;}
.coop-box input{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid #3a4158;
  background:#0e1220;color:#fff;font-size:14px;}
.coop-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.coop-actions .tb-btn{flex:1;min-width:110px;background:#2563eb;color:#fff;border:0;border-radius:999px;
  padding:10px 12px;font-weight:700;cursor:pointer;}
.coop-roster{margin-top:12px;background:#0e1220;border-radius:8px;padding:8px 10px;min-height:80px;
  font-size:13px;line-height:1.5;color:#c8d0e8;}
.coop-msg{margin-top:8px;color:#ff9d7a;font-size:12px;min-height:1.2em;}
.coop-hint{margin-top:10px;font-size:11px;color:#7a849c;line-height:1.4;}
</style>
</head>
<body>
<div id="rotWrap">
  <div id="gameWrap"><canvas id="gameCanvas" width="960" height="540"></canvas></div>
  <div id="joyBase" class="touchUI"><div id="joyKnob"></div></div>
  <div id="btnFire" class="tBtn touchUI">开火</div>
  <div id="btnPause" class="tBtn touchUI">暂停</div>
  <div id="coopPanel" aria-hidden="true">
    <div class="coop-box">
      <h2>合作联机（最多 8 人）</h2>
      <label>昵称</label>
      <input id="coopName" maxlength="16" placeholder="Player" autocomplete="off">
      <label>房间密码（可空）</label>
      <input id="coopPass" maxlength="32" placeholder="可选" autocomplete="off">
      <label>房间号（6位数字，加入时填写）</label>

      <div class="coop-actions">

        <button type="button" class="tb-btn" id="coopJoin">加入房间</button>

        <button type="button" class="tb-btn" id="coopClose">关闭</button>
      </div>
      <div class="coop-roster" id="coopRoster">尚未连接</div>

      <p class="coop-hint">联机节点：<span id="coopNode">—</span><br>双方必须打开<strong>同一个网址</strong>。客机跟房主权威同步（已关本地预测，避免子弹/走位发歪）。</p>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
 * 坦克大战 Tank Battle —— 单文件 2D Canvas 游戏
 * 结构分层：
 *   1) 常量与工具        4) 实体（坦克/子弹/道具/特效）
 *   2) 音效系统 SFX      5) 地图与关卡
 *   3) 输入系统 Input    6) 游戏主控 Game（状态机 + 主循环）
 * =================================================================== */

/* ---------------- 1) 常量与工具 ---------------- */
const CANVAS_W = 960, CANVAS_H = 540;
const TILE = 20;                       // 地格尺寸
const FIELD_W = 26, FIELD_H = 26;      // 战场 26x26 格（经典FC）
const FIELD_PX = FIELD_W * TILE;       // 520
const OFF_X = (CANVAS_W - FIELD_PX) / 2 | 0;  // 战场水平居中
const OFF_Y = (CANVAS_H - FIELD_H * TILE) / 2 | 0;
// 地块类型
const T_EMPTY=0, T_BRICK=1, T_STEEL=2, T_WATER=3, T_GRASS=4, T_BASE=5;
// 方向
const DIR = {UP:0, RIGHT:1, DOWN:2, LEFT:3};
const DXY = [[0,-1],[1,0],[0,1],[-1,0]];

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const rand  = (a,b)=>a+Math.random()*(b-a);
const randi = (a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ---------------- 2) 音效系统（WebAudio 程序生成） ---------------- */
/* AudioContext 仅在用户手势 unlock 后创建/resume；游戏循环与定时器禁止 resume（避免自动播放警告刷屏） */
const SFX = (() => {
  let ctx = null, unlocked = false, resumeInFlight = null;
  /** 履带/引擎循环：任意坦克移动时响起 */
  let eng = null; // { gain, o1, o2, src, filt }
  let engLevel = 0;
  /** 只返回已有 ctx，不创建、不 resume */
  function ac(){ return ctx; }
  function unlock(){
    unlocked = true;
    try{
      if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    }catch(e){ return; }
    if(ctx.state==="running" || resumeInFlight) return;
    try{
      const p = ctx.resume();
      resumeInFlight = Promise.resolve(p).then(()=>{ resumeInFlight=null; }).catch(()=>{ resumeInFlight=null; });
    }catch(e){}
  }
  function live(){ return unlocked && ctx && ctx.state==="running"; }
  function env(g,t0,a,d,peak){ g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(peak,t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); }
  function tone(type,f0,f1,dur,peak=0.18){
    if(!live()) return;
    const c=ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    env(g,t,0.005,dur,peak);o.connect(g).connect(c.destination);
    o.start(t);o.stop(t+dur+0.05);}
  function noise(dur,peak=0.2,fLow=400){
    if(!live()) return;
    const c=ctx,t=c.currentTime,n=c.sampleRate*dur|0,buf=c.createBuffer(1,n,c.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=c.createBufferSource();s.buffer=buf;
    const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=fLow;
    const g=c.createGain();env(g,t,0.005,dur,peak);
    s.connect(f).connect(g).connect(c.destination);s.start(t);}
  function ensureEngine(){
    if(!live()) return null;
    if(eng) return eng;
    const c=ctx;
    const gain=c.createGain(); gain.gain.value=0;
    const o1=c.createOscillator(); o1.type="sawtooth"; o1.frequency.value=52;
    const o2=c.createOscillator(); o2.type="square"; o2.frequency.value=78;
    const g1=c.createGain(); g1.gain.value=0.32;
    const g2=c.createGain(); g2.gain.value=0.16;
    const n=Math.max(1, c.sampleRate*1.2|0), buf=c.createBuffer(1,n,c.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*0.55;
    const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
    const filt=c.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=220; filt.Q.value=0.7;
    const gn=c.createGain(); gn.gain.value=0.22;
    o1.connect(g1).connect(gain);
    o2.connect(g2).connect(gain);
    src.connect(filt).connect(gn).connect(gain);
    gain.connect(c.destination);
    o1.start(); o2.start(); src.start();
    eng={ gain, o1, o2, src, filt };
    return eng;
  }
  /** level: 0=停；>0 有坦克在动，越大越响（多车叠加） */
  function setEngine(level){
    level = Math.max(0, Math.min(1.4, +level||0));
    engLevel = level;
    if(level<=0.001){
      if(eng && ctx){
        try{ eng.gain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.04); }catch(e){}
      }
      return;
    }
    const e=ensureEngine();
    if(!e || !ctx) return;
    const t=ctx.currentTime;
    try{
      e.gain.gain.setTargetAtTime(0.028 + level*0.055, t, 0.05);
      e.o1.frequency.setTargetAtTime(46 + level*22, t, 0.06);
      e.o2.frequency.setTargetAtTime(68 + level*28, t, 0.06);
      e.filt.frequency.setTargetAtTime(180 + level*140, t, 0.08);
    }catch(err){}
  }
  function stopEngine(){ setEngine(0); }
  return {
    ac,
    unlock,
    setEngine,
    stopEngine,
    shoot(){ tone("square",880,220,0.09,0.12); },
    shootBig(){ tone("square",520,120,0.14,0.16); noise(0.06,0.08,1200); },
    hitWall(){ noise(0.07,0.12,900); },
    hitSteel(){ tone("triangle",1400,900,0.06,0.10); },
    /** 敌军未打死：清晰受击（区别于打钢墙的尖鸣） */
    hitEnemy(){ tone("square",380,140,0.09,0.15); noise(0.055,0.11,1200); },
    /** 友军未打死（装甲剥落/船体等）：更沉的受击 */
    hitFriendly(){ tone("sawtooth",240,80,0.11,0.17); noise(0.08,0.14,700); },
    /** 敌军炸毁：短促简单爆炸 */
    explode(){ noise(0.28,0.26,520); tone("sawtooth",180,45,0.28,0.11); },
    bigExplode(){ noise(0.6,0.35,320); tone("sawtooth",120,30,0.6,0.16); },
    /** 友军/自己被打死：双层轰鸣，更震撼 */
    friendlyExplode(){
      noise(0.72,0.40,260); tone("sawtooth",95,22,0.72,0.18);
      setTimeout(()=>{ noise(0.38,0.22,180); tone("sawtooth",70,18,0.35,0.12); },70);
    },
    powerup(){ tone("sine",600,1200,0.12,0.15); setTimeout(()=>tone("sine",900,1600,0.15,0.15),90); },
    /** 道具掉落：叮叮叮 */
    dropDing(){
      [1046,1318,1568].forEach((f,i)=>setTimeout(()=>{
        tone("sine",f,f,0.11,0.18);
        tone("triangle",f*2,f*2,0.08,0.06);
      }, i*95));
    },
    /** 每关开始固定开场短曲（非循环 BGM） */
    levelStart(){
      const seq=[
        [392,0,0.12],[523,110,0.12],[659,220,0.12],[784,330,0.16],
        [659,520,0.10],[784,620,0.10],[1047,720,0.22],
        [784,980,0.12],[1047,1100,0.28]
      ];
      seq.forEach(([f,d,dur])=>setTimeout(()=>tone("square",f,f,dur,0.13),d));
    },
    shield(){ tone("sine",300,900,0.25,0.12); },
    levelUp(){ [440,554,659,880].forEach((f,i)=>setTimeout(()=>tone("square",f,f,0.12,0.12),i*110)); },
    gameOver(){ [523,392,330,262].forEach((f,i)=>setTimeout(()=>tone("sawtooth",f,f*0.8,0.25,0.13),i*180)); stopEngine(); },
    pause(){ tone("square",700,700,0.05,0.10); },
    spawn(){ tone("sine",200,500,0.15,0.08); },
    boat(){ tone("sine",250,120,0.3,0.12); noise(0.25,0.06,300); }
  };
})();

/* ---------------- 2.5) 背景音乐（已关闭，保留空实现以免调用报错） ---------------- */
const BGM = (() => {
  function ensure(){}
  function stop(){}
  function setPaused(){}
  return { ensure, stop, setPaused };
})();

/* ---------------- 3) 输入系统（键盘 + 触屏） ---------------- */
const Input = (() => {
  const keys = {};
  // 移动向量、开火、功能键的统一抽象
  const state = { mx:0, my:0, fire:false, firePressed:false, pausePressed:false,
                  startPressed:false, extra:{L:false,U:false,I:false,O:false} };
  const moveMap = {
    KeyW:[0,-1],ArrowUp:[0,-1], KeyS:[0,1],ArrowDown:[0,1],
    KeyA:[-1,0],ArrowLeft:[-1,0], KeyD:[1,0],ArrowRight:[1,0] };
  window.addEventListener("keydown",e=>{
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Enter"].includes(e.code)) e.preventDefault();
    if(!keys[e.code]){
      if(e.code==="KeyJ"||e.code==="Enter"||e.code==="KeyK"||e.code==="Space"){ state.firePressed=true; state.startPressed=true; }
      if(e.code==="KeyL"||e.code==="KeyP"||e.code==="Escape") state.pausePressed=true;
    }
    keys[e.code]=true; SFX.unlock();
  });
  window.addEventListener("keyup",e=>{ keys[e.code]=false; });
  // 鼠标点击也算手势（仅 unlock，不开始游戏）
  window.addEventListener("pointerdown",()=>{ SFX.unlock(); },{passive:true});

  // 触屏：左侧摇杆
  const joyBase=document.getElementById("joyBase"), joyKnob=document.getElementById("joyKnob");
  let joyId=null, joyVec=[0,0];
  /** 屏幕坐标 → 舞台本地坐标（CSS 横屏旋转时用） */
  function screenToStage(clientX, clientY){
    if(!window.__tbCssLand) return { x:clientX, y:clientY };
    const vw = window.innerWidth;
    // 逆变换 translate(vw,0) rotate(90deg)：lx=sy, ly=vw-sx
    return { x: clientY, y: vw - clientX };
  }
  function joyMove(t){
    const p = screenToStage(t.clientX, t.clientY);
    const cx = joyBase.offsetLeft + joyBase.offsetWidth/2;
    const cy = joyBase.offsetTop + joyBase.offsetHeight/2;
    const max = joyBase.offsetWidth/2;
    let dx = p.x - cx, dy = p.y - cy;
    const len=Math.hypot(dx,dy)||1; const cl=Math.min(len,max);
    dx=dx/len*cl; dy=dy/len*cl;
    joyKnob.style.left=(50+dx/joyBase.offsetWidth*100)+"%";
    joyKnob.style.top=(50+dy/joyBase.offsetHeight*100)+"%";
    joyVec=[Math.abs(dx)>max*0.25?Math.sign(dx):0, Math.abs(dy)>max*0.25?Math.sign(dy):0];
    if(Math.abs(dx)>Math.abs(dy)) joyVec[1]=0; else joyVec[0]=0;
  }
  function joyEnd(){ joyId=null; joyVec=[0,0]; joyKnob.style.left="50%"; joyKnob.style.top="50%"; }
  let touchFire=false;
  function bindTouch(){
    window.addEventListener("touchstart",e=>{
      SFX.unlock();
      for(const t of e.changedTouches){
        const el=document.elementFromPoint(t.clientX,t.clientY);
        if(el===joyBase||el===joyKnob){ joyId=t.identifier; joyMove(t); }
        else if(el&&el.id==="btnFire"){ touchFire=true; state.firePressed=true; state.startPressed=true; }
        else if(el&&el.id==="btnPause"){ state.pausePressed=true; }
        else if(!(window.TankCoop && TankCoop.isOpen && TankCoop.isOpen())){
          // 联机大厅打开时，点按钮不要当成菜单「开火开始」
          state.startPressed=true;
        }
      }
      e.preventDefault();
    },{passive:false});
    window.addEventListener("touchmove",e=>{
      for(const t of e.changedTouches) if(t.identifier===joyId) joyMove(t);
      e.preventDefault();
    },{passive:false});
    const end=e=>{ for(const t of e.changedTouches){
        if(t.identifier===joyId) joyEnd();
      }
      // 松开开火按钮
      let stillFire=false;
      for(const t of e.touches){ const el=document.elementFromPoint(t.clientX,t.clientY);
        if(el&&el.id==="btnFire") stillFire=true; }
      touchFire=stillFire;
    };
    window.addEventListener("touchend",end); window.addEventListener("touchcancel",end);
  }
  bindTouch();

  function poll(){
    let mx=0,my=0;
    for(const k in moveMap) if(keys[k]){ mx+=moveMap[k][0]; my+=moveMap[k][1]; }
    if(joyVec[0]||joyVec[1]){ mx=joyVec[0]; my=joyVec[1]; }
    // 主导轴：坦克只能四方向
    if(mx&&my){ my=0; }
    state.mx=clamp(mx,-1,1); state.my=clamp(my,-1,1);
    state.fire = !!(keys.KeyJ||keys.Enter||keys.KeyK||keys.Space||touchFire);
    state.extra.L=!!keys.KeyL; state.extra.U=!!keys.KeyU;
    state.extra.I=!!keys.KeyI; state.extra.O=!!keys.KeyO;
    return state;
  }
  function consume(){ state.firePressed=false; state.pausePressed=false; state.startPressed=false; }
  return { poll, consume, state };
})();

/* ---------------- 4) 实体 ---------------- */

/** 粒子特效 */
class Particle{
  constructor(x,y,vx,vy,life,color,size){ Object.assign(this,{x,y,vx,vy,life,maxLife:life,color,size}); }
  update(dt){ this.x+=this.vx*dt; this.y+=this.vy*dt; this.vx*=0.96; this.vy*=0.96; this.life-=dt; }
  draw(g){ const a=Math.max(0,this.life/this.maxLife);
    g.globalAlpha=a; g.fillStyle=this.color;
    g.beginPath(); g.arc(this.x,this.y,this.size*a+0.5,0,Math.PI*2); g.fill(); g.globalAlpha=1; }
}

/** 子弹；kind: normal | ap | flame（Boss 巨型穿甲/火焰） */
class Bullet{
  constructor(owner,x,y,dir,speed,power,kind){
    Object.assign(this,{owner,x,y,dir,speed,power,dead:false,kind:kind||"normal"});
    if(this.kind==="ap" || this.kind==="flame"){ this.w=14; this.h=14; }
    else { this.w=6; this.h=6; }
  }
  update(dt){
    this.x+=DXY[this.dir][0]*this.speed*dt;
    this.y+=DXY[this.dir][1]*this.speed*dt;
  }
}

/** 道具类型 */
const PU = { STAR:"star", GUN:"gun", BOAT:"boat", GRENADE:"grenade", HELMET:"helmet", TANK:"tank", CLOCK:"clock", SHOVEL:"shovel" };
const PU_LIST = [PU.STAR,PU.GUN,PU.BOAT,PU.GRENADE,PU.HELMET,PU.TANK,PU.CLOCK,PU.SHOVEL];
class PowerUp{
  constructor(type,x,y){ Object.assign(this,{type,x,y,t:0,life:14,dead:false}); }
  update(dt){ this.t+=dt; this.life-=dt; if(this.life<=0) this.dead=true; }
}

/** 坦克（玩家与敌人共用基类） */
class Tank{
  constructor(x,y,isPlayer){
    this.x=x; this.y=y; this.w=TILE*2-2; this.h=TILE*2-2;
    this.dir=isPlayer?DIR.UP:DIR.DOWN;
    this.isPlayer=isPlayer;
    this.speed=isPlayer?95:60;
    this.bulletSpeed=220; this.bulletPower=1; this.maxBullets=1;
    this.cool=0; this.dead=false;
    this.stars=0;             // 星级：0基础 1快弹 2双发 3打铁 4除草
    this.boat=false;          // 船：可过水（boatLayers>0）
    this.boatLayers=0;        // 船护盾层数，最多 3，每层抵挡一次伤害
    this.bulk=0;              // 装甲外观：0普通 1加厚(≥3星/枪) 2更厚(≥4星)；碰撞体积不变，被打降级
    this.shield=0;            // 无敌护盾剩余时间（可叠加）
    this.spawnGhost=1.6;      // 出生保护/闪烁
    this.hp=1;
    this.frozen=0;            // 被时钟冻结（敌人/玩家）
    this.type="normal";       // 敌人种类
    this.carriesPowerup=false;
    this.anim=0;
    this.eject=null;
  }
  get cx(){ return this.x+this.w/2; } get cy(){ return this.y+this.h/2; }
  rect(){ return {x:this.x,y:this.y,w:this.w,h:this.h}; }
  applyStars(){
    // 星级对应火力：参考FC原版 + 改版规则
    this.bulletSpeed = 220 + this.stars*45;
    this.maxBullets  = this.stars>=2 ? 2 : 1;
    this.bulletPower = this.stars>=3 ? 3 : 1;   // 3星可打铁
    if(this.stars>=4) this.bulletPower = 4;     // 4星可除草（额外星/手枪）
    // 3星/枪 → 装甲外观加厚；4星更厚（碰撞格始终不变）
    if(this.stars>=4) this.bulk = Math.max(this.bulk, 2);
    else if(this.stars>=3) this.bulk = Math.max(this.bulk, 1);
    this.applyBulk();
  }
  /** 锁定碰撞体积（装甲只改外观；Boss 保持巨型） */
  applyBulk(){
    const base = this.type==="boss" ? (TILE*4-2) : (TILE*2-2);
    const cx=this.cx, cy=this.cy;
    this.w = base;
    this.h = base;
    this.x = cx - this.w/2;
    this.y = cy - this.h/2;
  }
  syncBoatFlag(){ this.boat = (this.boatLayers|0) > 0; }
}

  const maps=[L1,L2,L3,L4,L5,L6];
  const charMap={'.':T_EMPTY,'B':T_BRICK,'S':T_STEEL,'W':T_WATER,'G':T_GRASS};
  /** 闯关总关数；地形逐步解锁 */
  const CAMPAIGN_LEVELS = 50;
  // 地形解锁（50 关）：1–4 仅砖；5–10 +铁；11–20 +草；21–50 全地形
  // 三路稀疏铁块在 fortifyLanes 另加，不受此门控影响
  function gateTerrain(cell, level){
    if(cell===T_STEEL && level < 5) return T_EMPTY;
    if(cell===T_GRASS && level < 11) return T_EMPTY;
    if(cell===T_WATER && level < 21) return T_EMPTY;
    return cell;
  }

  /** 稳定伪随机（同关同布局，过关必变） */
  function laneRng(seed){
    let s = (seed >>> 0) || 1;
    return ()=>{
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /**
   * 底图变换：镜像/上下翻/平移/开走廊/砖块扰动
   * 同底图循环时也能一眼看出换关；endless 用更大种子
   */
  function mutateMap(src, seed){
    let cells = src.map(row => row.split(""));
    const rnd = laneRng(seed * 9973 + 13);
    const mode = ((seed % 6) + 6) % 6;
    if(mode===0 || mode===3) cells = cells.map(r => r.slice().reverse());
    if(mode===1 || mode===4){
      const mid = cells.slice(1, 23).reverse();
      cells = [cells[0]].concat(mid, cells.slice(23));
    }
    const shift = (seed * 3 + mode) % 6;
    if(shift){
      cells = cells.map(r => r.slice(shift).concat(r.slice(0, shift)));
    }
    // 开几条缝，避免墙型永远一样
    const gaps = 2 + (seed % 3);
    for(let i=0;i<gaps;i++){
      const r = 4 + Math.floor(rnd()*16);
      const c0 = 3 + Math.floor(rnd()*18);
      for(let c=c0;c<c0+3 && c<FIELD_W;c++){
        if(cells[r][c]==="B") cells[r][c]=".";
      }
    }
    const bumps = 8 + (seed % 7);
    for(let i=0;i<bumps;i++){
      const r = 2 + Math.floor(rnd()*20);
      const c = 2 + Math.floor(rnd()*22);
      if(r>=23) continue;
      const ch = cells[r][c];
      if(ch===".") cells[r][c] = "B";
      else if(ch==="B" && rnd()<0.55) cells[r][c] = ".";
    }
    return cells.map(r => r.join(""));
  }

  /**
   * 左 / 中 / 右三路各放 1–3 块铁（不要成墙），挡直通但不堵死
   * 列：左 0–2 · 中 12–13 · 右 23–25；行避开出生与基地
   */
  function fortifyLanes(grid, level){
    const put = (r,c,t)=>{
      if(r<0||r>=FIELD_H||c<0||c>=FIELD_W) return;
      if(grid[r][c]===T_BASE) return;
      grid[r][c]=t;
    };
    const rnd = laneRng(level * 7919 + 42);
    const rowsPool = [5,7,9,11,13,15,17,19];
    const laneCols = [[0,1,2],[12,13],[23,24,25]];
    // 先清掉三路走廊原有铁（模板里常成片），再只放 1–3，避免越叠越多
    for(const cols of laneCols){
      for(let r=2;r<=22;r++){
        for(const c of cols){
          if(grid[r][c]===T_STEEL) grid[r][c]=T_EMPTY;
        }
      }
    }
    function sprinkle(cols, count){
      const pool = rowsPool.slice();
      for(let i=pool.length-1;i>0;i--){
        const j = Math.floor(rnd()*(i+1));
        const t = pool[i]; pool[i]=pool[j]; pool[j]=t;
      }
      const n = Math.max(1, Math.min(3, count|0));
      for(let i=0;i<n;i++){
        const r = pool[i];
        const c = cols[Math.floor(rnd()*cols.length)];
        put(r, c, T_STEEL);
        // 偶发旁贴一块砖，不额外加铁
        if(rnd()<0.35){
          const dc = rnd()<0.5 ? -1 : 1;
          const nc = c+dc;
          if(nc>=0 && nc<FIELD_W) put(r, nc, T_BRICK);
        }
      }
    }
    const nL = 1 + (level + 0) % 3; // 1..3
    const nM = 1 + (level + 1) % 3;
    const nR = 1 + (level + 2) % 3;
    sprinkle(laneCols[0], nL);
    sprinkle(laneCols[1], nM);
    sprinkle(laneCols[2], nR);
  }

  function build(levelIdx,endless){
    const lv = Math.max(1, levelIdx|0);
    // 闯关/敌方吃道具/测试/联机：按关序轮换底图；无尽：错位轮换，避免与闯关同序
    const baseIdx = endless
      ? ((lv - 1 + Math.floor(lv/2)) % maps.length)
      : ((lv - 1) % maps.length);
    const src = mutateMap(maps[baseIdx], lv + (endless ? 100 : 0));
    const grid=[];
    for(let r=0;r<FIELD_H;r++){ grid[r]=[];
      for(let c=0;c<FIELD_W;c++){
        const raw=charMap[src[r][c]]??T_EMPTY;
        grid[r][c]=endless ? raw : gateTerrain(raw, lv);
      }
    }
    // 基地（美国鹰）位于底部中央 2x2，并用砖围起
    const bx=12, by=24;
    for(let r=by;r<by+2;r++) for(let c=bx;c<bx+2;c++) grid[r][c]=T_BASE;
    for(let c=bx-1;c<=bx+2;c++){ if(grid[by-1]) grid[by-1][c]=T_BRICK; }
    grid[by][bx-1]=T_BRICK; grid[by][bx+2]=T_BRICK;
    grid[by+1][bx-1]=T_BRICK; grid[by+1][bx+2]=T_BRICK;
    // 清理出生点：基地左右对称空地（避开砖墙 11/14）
    const clear=(r,c)=>{ for(let i=r;i<r+2;i++) for(let j=c;j<c+2;j++)
      if(grid[i]&&grid[i][j]!==undefined&&grid[i][j]!==T_BASE) grid[i][j]=T_EMPTY; };
    clear(0,0); clear(0,12); clear(0,24);          // 敌人出生点
    // Boss 顶部中央 4×4 空地（约 4 辆普通坦克占地）
    for(let r=0;r<4;r++) for(let c=11;c<=14;c++)
      if(grid[r]&&grid[r][c]!==undefined&&grid[r][c]!==T_BASE) grid[r][c]=T_EMPTY;
    // 友军出生：8/16 为主，再往外对称扩展
    [8,16,6,18,4,20,2,22].forEach(c=>clear(24,c));
    fortifyLanes(grid, lv);
    // 铁墙不要挡住出生格
    clear(0,0); clear(0,12); clear(0,24);
    for(let r=0;r<4;r++) for(let c=11;c<=14;c++)
      if(grid[r]&&grid[r][c]!==undefined&&grid[r][c]!==T_BASE) grid[r][c]=T_EMPTY;
    [8,16,6,18,4,20,2,22].forEach(c=>clear(24,c));
    return grid;
  }
  // 50 关难度递进：总量与精英占比随关卡上升
  // 血量档：fast/normal/power=1 · mid=2 · armor=3 · boss 另算
  function enemyPlan(level){
    const lv = Math.max(1, level|0);
    // 总量缓升；中后期精英占比更高
    const total = Math.min(10 + Math.floor(lv*0.85), 40);
    const fast  = Math.min(1 + Math.floor(lv/3), 12);
    const power = Math.min(Math.floor(lv/4), 12);
    const mid   = Math.min(Math.floor((lv+2)/5), 12);
    const armor = Math.min(Math.floor(lv/6), 14);
    return { total, fast, power, mid, armor };
  }
  return { build, enemyPlan, count:maps.length, CAMPAIGN_LEVELS };
})();

  // 客机预测：关——预测会让子弹/朝向相对房主权威「看起来歪」
  const COOP_PREDICT=false;

  const COOP_PRED_SOFT=28;
  const COOP_PRED_BLEND=0.10;
  const COOP_TINTS=[
    ["#d8c84a","#8a7a1e"],["#7ac0e8","#2a6a9a"],["#e88a7a","#9a3a2a"],["#c9a0e8","#5a2a8a"],
    ["#7ae0a0","#2a7a4a"],["#ffb060","#a05020"],["#90d0ff","#3060a0"],["#f0a0c0","#903050"]
  ];

  const MENU_COUNT=5;
  const CAMPAIGN_LEVELS=Levels.CAMPAIGN_LEVELS;
  const CLEAR_GRACE_SEC=4.5;

  /* ---- 碰撞辅助 ---- */
  function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
  function tileAt(px,py){ const c=Math.floor((px-OFF_X)/TILE), r=Math.floor((py-OFF_Y)/TILE);
    if(r<0||r>=FIELD_H||c<0||c>=FIELD_W) return T_STEEL; // 边界视为铁
    return grid[r][c]; }
  function friendlyTanks(){
    const list=[];
    if(player) list.push(player);
    for(const pid in coopAllies){ const t=coopAllies[pid]; if(t) list.push(t); }
    return list;
  }
  function nearestFriendly(from){
    let best=null, bd=1e9;
    for(const t of friendlyTanks()){
      if(!t||t.dead) continue;
      const d=Math.hypot(from.cx-t.cx, from.cy-t.cy);
      if(d<bd){ bd=d; best=t; }
    }
    return best;
  }
  function tankBlocked(t,nx,ny){
    // 检查坦克矩形四角+边中点的地形；水面：有船可通过
    const pts=[[nx+1,ny+1],[nx+t.w-1,ny+1],[nx+1,ny+t.h-1],[nx+t.w-1,ny+t.h-1],
               [nx+t.w/2,ny+1],[nx+t.w/2,ny+t.h-1],[nx+1,ny+t.h/2],[nx+t.w-1,ny+t.h/2]];
    for(const [px,py] of pts){
      const tt=tileAt(px,py);
      if(tt===T_BRICK||tt===T_STEEL||tt===T_BASE) return true;
      if(tt===T_WATER && !t.boat) return true;
    }
    // 战场边界
    if(nx<OFF_X||ny<OFF_Y||nx+t.w>OFF_X+FIELD_PX||ny+t.h>OFF_Y+FIELD_H*TILE) return true;
    // 坦克互撞
    const r={x:nx,y:ny,w:t.w,h:t.h};
    const all=[...friendlyTanks(),...enemies];
    for(const o of all){ if(!o||o===t||o.dead) continue; if(rectHit(r,o.rect())) return true; }
    return false;
  }

  /* ---- 特效 ---- */
  function boom(x,y,n,base){
    for(let i=0;i<n;i++){
      const a=rand(0,Math.PI*2), sp=rand(30,180);
      const colors=base||["#ffd24a","#ff8c2e","#ff4e2e","#ffe9a0","#aaa"];
      particles.push(new Particle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,
        rand(0.25,0.7),colors[randi(0,colors.length-1)],rand(1.5,4)));
    }
  }
  function flash(msg,t=1.6){ flashMsg=msg; flashTime=t; }

  /* ---- 水域辅助：船被击毁后自动滑出水域 ---- */
  function onWater(t){
    const pts=[[t.x+2,t.y+2],[t.x+t.w-2,t.y+2],[t.x+2,t.y+t.h-2],[t.x+t.w-2,t.y+t.h-2],[t.cx,t.cy]];
    return pts.some(([px,py])=>tileAt(px,py)===T_WATER);
  }
  // 在半格网上搜索离坦克最近的可站立陆地点
  function findLandSpot(t){
    const step=TILE/2; let best=null, bd=Infinity;
    for(let j=0;j<=FIELD_H*2-4;j++) for(let i=0;i<=FIELD_W*2-4;i++){
      const x=OFF_X+i*step+1, y=OFF_Y+j*step+1;
      const d=(x-t.x)*(x-t.x)+(y-t.y)*(y-t.y);
      if(d>=bd) continue;
      if(!tankBlocked(t,x,y)){ bd=d; best={x,y}; }
    }
    return best;
  }

  /* ---- 生成 ---- */
  function snapGear(t){
    if(!t) return null;
    return {
      stars:t.stars|0, boat:!!t.boat, boatLayers:t.boatLayers|0, bulk:t.bulk|0,
      pid:t.coopPid, name:t.coopName, slot:t.coopSlot|0, tint:t.coopTint
    };
  }
  function applyGear(t, gear){
    if(!t||!gear) return;
    t.stars = gear.stars|0;
    t.boatLayers = Math.min(3, gear.boatLayers!=null ? (gear.boatLayers|0) : (gear.boat?1:0));
    t.syncBoatFlag();
    t.bulk = gear.bulk|0;
    t.applyStars(); // 子弹威力/双发等随星级恢复
    // 被打掉的装甲层：若星级仍够，外观至少回到对应厚度
    if(t.stars>=4) t.bulk = Math.max(t.bulk, 2);
    else if(t.stars>=3) t.bulk = Math.max(t.bulk, 1);
    t.applyBulk();
  }
  function spawnAtSlot(slot, pid, name, gear){
    const sp=COOP_SPAWN[slot%COOP_SPAWN.length];
    const t=new Tank(OFF_X+sp[0]*TILE+1, OFF_Y+sp[1]*TILE+1, true);
    t.coopPid=pid; t.coopName=name||("P"+(slot+1));
    t.coopTint=(gear&&gear.tint)||COOP_TINTS[slot%COOP_TINTS.length];
    t.coopSlot=slot;
    if(gear) applyGear(t, gear);
    else { t.stars=0; t.bulk=0; t.boatLayers=0; t.boat=false; t.applyStars(); }
    t.shield=3;
    return t;
  }
  function setupCoopPlayers(keepGear){
    const prev={};
    if(keepGear){
      for(const t of friendlyTanks()){
        if(t&&t.coopPid) prev[t.coopPid]=snapGear(t);
      }
    }
    coopAllies={};
    player=null;
    const roster = coopRoster.slice(0,8);
    roster.forEach((p,i)=>{
      const t=spawnAtSlot(i, p.pid, p.name, keepGear?prev[p.pid]:null);
      if(p.pid===coopMyPid) player=t;
      else coopAllies[p.pid]=t;
    });
    if(!player && roster.length){
      player=spawnAtSlot(0, coopMyPid, "Me", keepGear?prev[coopMyPid]:null);
    }
    SFX.spawn();
  }
  function newLevel(){
    // 过关保留星/枪/船/装甲外观与火力
    const keepSolo = !coopMode ? snapGear(player) : null;
    grid=Levels.build(level,endless);
    bullets=[]; powerups=[]; particles=[]; enemies=[];
    enemyPlanObj = endless ? Levels.enemyPlan(level) : Levels.enemyPlan(level);
    enemyQueue = endless ? Infinity : enemyPlanObj.total;
    enemiesKilled=0; spawnTimer=0.5; freezeTimer=0; shovelTimer=0; baseAlive=true;
    bossSpawned=false;
    if(!debugMode){ debugBossCleared=false; debugBossWave=1; debugBossDelay=0; }
    clearGrace=0;
    if(coopMode) setupCoopPlayers(true);
    else spawnPlayer({ keep: keepSolo });
    SFX.levelStart();
    if(debugMode){
      if(debugBossCleared) flash("⚠ 测试模式：10 只 Boss 已全部肃清", 2.0);
      else flash("⚠ 测试模式：Boss "+debugBossWave+"/"+BOSS_TIERS+"（第 "+level+" 关）", 2.0);
    } else if(level%5===0) flash("⚠ Boss 关：第 "+bossTierOfLevel(level)+"/"+BOSS_TIERS+" 号 Boss", 2.2);
  }
  function bossTierOfLevel(lv){
    return Math.max(1, Math.min(BOSS_TIERS, Math.floor((lv|0)/5)));
  }
  /**
   * 10 只 Boss（关卡 5/10/…/50）外形递进：
   * barrels 炮管数 · armor 装甲层 · bodyVis 车体外观缩放 · bulletVis 弹体外观缩放
   * 碰撞体积始终 BOSS_SIZE（约 4 格），便于移动与占位一致
   */
  function bossProfile(tier){
    const t = Math.max(1, Math.min(BOSS_TIERS, tier|0));
    const barrels = t<=2 ? 1 : (t<=4 ? 2 : (t<=7 ? 3 : 4));
    const armor = Math.min(6, 1 + Math.floor((t-1)/2)); // 1→6
    const bodyVis = 0.62 + (t-1)/(BOSS_TIERS-1) * 0.38;   // 外观车体 0.62→1
    const bulletVis = 0.22 + (t-1)/(BOSS_TIERS-1) * 0.78; // 外观弹体 0.22→1，碰撞仍满 4 格
    const ammo = t>=8 ? "flame" : (t%2===0 ? "flame" : "ap");
    const names = ["侦察型","巡猎型","重装型","裂甲型","赤焰型","霜锋型","要塞型","暗影型","炼狱型","终焉型"];
    const palettes = [
      ["#7a8a98","#3a4450","#c8d4e0"],
      ["#5a7a58","#243028","#a8d090"],
      ["#8a7a50","#3a3020","#e0c878"],
      ["#6a5a7a","#2a2038","#c8a0e8"],
      ["#8a4a48","#3a1818","#f0a090"],
      ["#4a6a7a","#183040","#90d0e8"],
      ["#8a7840","#3a2810","#ffe080"],
      ["#5a4060","#201028","#e0a0c8"],
      ["#8a4028","#301008","#ff9040"],
      ["#3a2020","#100808","#ffd24a"]
    ];
    const [c1,c2,accent] = palettes[t-1];
    const style = t; // 1..10 造型分支
    return { tier:t, name:names[t-1], barrels, armor, bodyVis, bulletVis, ammo, c1, c2, accent, style };
  }
  /** 测试模式：切到下一 Boss 关卡并准备刷怪 */
  function advanceDebugBossLevel(){
    const keep = player && !player.dead ? snapGear(player) : null;
    grid = Levels.build(level, false);
    bullets=[]; powerups=[]; particles=[];
    enemies=[];
    enemyPlanObj = Levels.enemyPlan(level);
    enemyQueue = enemyPlanObj.total;
    enemiesKilled=0;
    bossSpawned=false;
    spawnTimer=0.2;
    freezeTimer=0; shovelTimer=0; clearGrace=0; baseAlive=true;
    if(player && !player.dead){
      applyGear(player, keep);
      player.x = OFF_X+8*TILE+1;
      player.y = OFF_Y+24*TILE+1;
      player.dir = DIR.UP;
      player.shield = Math.max(player.shield||0, 2.5);
      player.spawnGhost = Math.max(player.spawnGhost||0, 0.8);
    } else if(!coopMode){
      spawnPlayer({ keep });
    }
    SFX.levelStart();
    flash("⚔ Boss "+debugBossWave+"/"+BOSS_TIERS+"（第 "+level+" 关）", 2.2);
  }
  function onDebugBossDefeated(){
    if(!debugMode || debugBossCleared || debugBossDelay>0) return;
    // 清场等待，避免杂兵干扰连刷
    enemies=[];
    bullets = bullets.filter(b=>b.owner && b.owner.isPlayer && !b.dead);
    if(debugBossWave >= BOSS_TIERS){
      debugBossCleared = true;
      bossSpawned = true;
      debugBossDelay = 0;
      flash("🏆 最终大 Boss「终焉型」击破！不再刷新", 3.2);
      return;
    }
    debugBossDelay = 3;
    const next = debugBossWave + 1;
    const np = bossProfile(next);
    flash("下一只："+np.name+"（"+next+"/"+BOSS_TIERS+"）· 3 秒后出现", 2.8);
  }
  function tickDebugBossDelay(dt){
    if(!debugMode || debugBossCleared || debugBossDelay<=0) return;
    debugBossDelay -= dt;
    if(debugBossDelay > 0) return;
    debugBossDelay = 0;
    debugBossWave++;
    level = debugBossWave * 5; // 5,10,…,50
    advanceDebugBossLevel();
  }
  function spawnPlayer(opts){
    opts=opts||{};
    if(coopMode && player){
      const gear = opts.keep ? snapGear(player) : null;
      const slot=player.coopSlot|0, pid=player.coopPid||coopMyPid, name=player.coopName;
      player=spawnAtSlot(slot, pid, name, gear);
      return;
    }
    const gear = opts.keep ? (opts.keep===true ? snapGear(player) : opts.keep) : null;
    player=new Tank(OFF_X+8*TILE+1, OFF_Y+24*TILE+1, true);
    if(gear) applyGear(player, gear);
    else { player.stars=0; player.bulk=0; player.boatLayers=0; player.boat=false; player.applyStars(); }
    player.shield=3; SFX.spawn();
  }
  function respawnFriendly(t){
    if(!t) return;
    // 阵亡重生：装备清空（过关才保留星/船/火力）
    const slot=t.coopSlot|0, pid=t.coopPid, name=t.coopName;
    const tint=t.coopTint;
    // 单机 player 无 coopPid：必须替换 player，否则旧尸体每帧继续扣命
    const isLocal = !coopMode || t===player || !pid || pid===coopMyPid;
    if(isLocal){
      if(coopMode){
        const nt=spawnAtSlot(slot, pid||coopMyPid, name, null);
        if(tint) nt.coopTint=tint;
        player=nt;
      } else {
        spawnPlayer({});
      }
      return;
    }
    const nt=spawnAtSlot(slot, pid, name, null);
    if(tint) nt.coopTint=tint;
    coopAllies[pid]=nt;
  }
  const SPAWN_COLS=[0,12,24];
  const BOSS_SIZE = TILE*4-2; // 碰撞始终 ≈ 4 格
  function makeBoss(e){
    e.type="boss";
    e.w=BOSS_SIZE; e.h=BOSS_SIZE;
    e.x = OFF_X + 11*TILE + 1;
    e.y = OFF_Y + 1;
    e.dir = DIR.DOWN;
    const tier = debugMode ? debugBossWave : bossTierOfLevel(level);
    const p = bossProfile(tier);
    e.bossTier = p.tier;
    e.bossName = p.name;
    e.bossBarrels = p.barrels;
    e.bossArmor = p.armor;
    e.bossBodyVis = p.bodyVis;
    e.bossBulletVis = p.bulletVis;
    e.bossStyle = p.style;
    e.bossC1 = p.c1; e.bossC2 = p.c2; e.bossAccent = p.accent;
    e.bossAmmo = p.ammo;
    e.hp = Math.min(40, 8 + p.tier*3);
    e.maxHp = e.hp;
    // 前期略快便于挪位，后期更沉
    e.speed = Math.max(10, 28 - Math.floor(p.tier*1.4));
    e.stars = 1; e.applyStars();
    e.bulletSpeed = 120 + p.tier*8;
    e.bulletPower = 1;
    e.maxBullets = 1;
    e.carriesPowerup = false;
    e.cool = 1.2;
    e.spawnGhost = 0.2;
    return e;
  }
  function trySpawnEnemy(){
    if(enemyQueue<=0) return;
    // 测试模式等待下一只 Boss 时不刷怪
    if(debugMode && debugBossDelay>0) return;
    const alive=enemies.filter(e=>!e.dead).length;
    const hasBoss = enemies.some(e=>!e.dead&&e.type==="boss");
    // 测试模式：10 只连锁；正式每 5 关一只（共 10 只）
    const wantBoss = !bossSpawned && !hasBoss && (
      debugMode ? !debugBossCleared : (level%5===0)
    );
    const maxAlive = endless ? Math.min(4+Math.floor(level/2),8) : Math.min(4 + (coopMode?Math.max(0,friendlyTanks().length-1):0), 8);
    if(!wantBoss && alive>=maxAlive) return;

    if(wantBoss){
      const bw=BOSS_SIZE, bh=BOSS_SIZE;
      const bx=OFF_X+11*TILE+1, by=OFF_Y+1;
      const r={x:bx,y:by,w:bw,h:bh};
      for(const o of [...friendlyTanks(),...enemies]) if(o&&!o.dead&&rectHit(r,o.rect())) return;
      const e=new Tank(bx,by,false);
      makeBoss(e);
      bossSpawned=true;
      if(freezeTimer>0) e.frozen=freezeTimer;
      enemies.push(e); if(enemyQueue!==Infinity) enemyQueue--;
      SFX.spawn();
      const ammoName = e.bossAmmo==="flame" ? "火焰弹" : "穿甲弹";
      flash("💀 "+(e.bossName||"Boss")+" "+e.bossTier+"/"+BOSS_TIERS+" · "+e.bossBarrels+" 管 · "+ammoName+" · HP "+e.hp, 2.4);
      return;
    }

    if(alive>=maxAlive) return;
    const col=SPAWN_COLS[randi(0,2)];
    const x=OFF_X+col*TILE+1, y=OFF_Y+1;
    const r={x,y,w:TILE*2-2,h:TILE*2-2};
    for(const o of [...friendlyTanks(),...enemies]) if(o&&!o.dead&&rectHit(r,o.rect())) return;
    const e=new Tank(x,y,false);
    const p=enemyPlanObj, kRoll=Math.random();
    const hasFlameCar = enemies.some(x=>!x.dead&&x.type==="flamecar");
    // 火焰车小 Boss：3 关起出现，场上最多 1 辆
    const flameChance = level>=3 ? Math.min(0.22, 0.08 + level*0.004) : 0;
    // 后期提高精英占比
    const armorBias = Math.min(0.35, 0.12 + level*0.004);
    const midBias = Math.min(0.55, 0.28 + level*0.003);
    if(!hasFlameCar && kRoll<flameChance){
      makeFlameCar(e);
    } else if(kRoll<armorBias && p.armor>0){
      e.type="armor"; e.hp=3; e.speed=48;
    } else if(kRoll<midBias && p.mid>0){
      e.type="mid"; e.hp=2; e.speed=68; e.bulletSpeed=250;
    } else if(kRoll<midBias+0.18 && p.fast>0){
      e.type="fast"; e.hp=1; e.speed=118; e.cool=-0.15;
    } else if(kRoll<midBias+0.34 && p.power>0){
      e.type="power"; e.hp=1; e.speed=55; e.bulletSpeed=340;
      if(level>=8) e.maxBullets=2;
    } else {
      e.type="normal"; e.hp=1; e.speed=60;
    }
    if(e.type!=="flamecar") e.speed += Math.min(level*1.2, 36);
    if(debugMode) e.carriesPowerup=true;
    else {
      const killedOrQueued = endless
        ? (enemiesKilled + enemies.filter(x=>!x.dead).length)
        : Math.max(0, (enemyPlanObj.total|0) - (enemyQueue|0));
      e.carriesPowerup = ((killedOrQueued + 1) % 4 === 0) || Math.random()<0.04;
    }
    if(freezeTimer>0) e.frozen=freezeTimer;
    enemies.push(e); if(enemyQueue!==Infinity) enemyQueue--;
    SFX.spawn();
  }

  function makeFlameCar(e){
    e.type="flamecar";
    e.w=TILE*2-2; e.h=TILE*2-2;
    e.hp=5; e.maxHp=5;
    e.speed=50 + Math.min(level, 20);
    e.bulletSpeed=190 + Math.min(level, 40);
    e.bulletPower=1;
    e.maxBullets=1;
    e.stars=0;
    e.bossAmmo="flame";
    e.bossBulletVis=1;
    e.carriesPowerup = debugMode || Math.random()<0.25;
    e.cool=0.6;
    e.spawnGhost=0.25;
    return e;
  }
  /* ---- 射击 ---- */
  function fire(t){
    if(t.cool>0) return;
    const mine=bullets.filter(b=>b.owner===t&&!b.dead).length;
    if(mine>=t.maxBullets) return;
    const isBoss = !t.isPlayer && t.type==="boss";
    const isFlameCar = !t.isPlayer && t.type==="flamecar";
    const kind = isBoss ? (t.bossAmmo||"ap") : (isFlameCar ? "flame" : "normal");
    let bx, by, b;
    if(kind==="ap"||kind==="flame"){
      // 大 Boss：碰撞约 4 格；火焰车小 Boss：碰撞约 2 格
      const tileSpan = isBoss ? 4 : 2;
      const wide = TILE*tileSpan - 4, thick = isBoss ? 18 : 14;
      const bw = (t.dir===DIR.UP||t.dir===DIR.DOWN) ? wide : thick;
      const bh = (t.dir===DIR.UP||t.dir===DIR.DOWN) ? thick : wide;
      bx = t.cx + DXY[t.dir][0]*(t.w/2+6) - bw/2;
      by = t.cy + DXY[t.dir][1]*(t.h/2+6) - bh/2;
      b = new Bullet(t, bx, by, t.dir, t.bulletSpeed, t.bulletPower, kind);
      b.w = bw; b.h = bh;
      b.bossBulletVis = t.bossBulletVis!=null ? t.bossBulletVis : 1;
      b.bossTier = t.bossTier||0;
      // 抵消：大 Boss 弹需 4 发，火焰车弹需 2 发
      b.blockHp = isBoss ? 4 : 2;
      b.fromFlameCar = isFlameCar;
    } else {
      bx = t.cx+DXY[t.dir][0]*(t.w/2+4)-3;
      by = t.cy+DXY[t.dir][1]*(t.h/2+4)-3;
      b = new Bullet(t, bx, by, t.dir, t.bulletSpeed, t.bulletPower, kind);
      b.blockHp = 1;
    }
    bullets.push(b);
    if(t.isPlayer) t.cool = t.stars>=1?0.28:0.42;
    else if(t.type==="boss") t.cool = rand(1.2, 2.2);
    else if(t.type==="flamecar") t.cool = rand(0.9, 1.6);
    else t.cool = rand(0.8,1.8);
    if(t.isPlayer) (t.bulletPower>=3?SFX.shootBig:SFX.shoot)();
    else if(t.type==="boss"||t.type==="flamecar") SFX.shootBig();
  }

  /* ---- 道具 ---- */
  /** 在地图随机空地掉道具（FC：不在坦克尸体处） */
  function dropPowerupRandom(){
    const type=PU_LIST[randi(0,PU_LIST.length-1)];
    const candidates=[];
    if(grid){
      for(let r=2;r<=21;r++){
        for(let c=2;c<=22;c++){
          const t=grid[r][c];
          if(t===T_EMPTY || t===T_GRASS) candidates.push([r,c]);
        }
      }
    }
    let r=randi(4,18), c=randi(4,20);
    if(candidates.length){
      const pick=candidates[randi(0,candidates.length-1)];
      r=pick[0]; c=pick[1];
    }
    const px=OFF_X+c*TILE, py=OFF_Y+r*TILE;
    powerups.push(new PowerUp(type,px,py));
    SFX.dropDing();
    flash("✦ 道具出现！", 1.1);
  }
  /** 红闪坦克被打中：随机位置掉道具；坦克未死则继续红闪，再打还能掉 */
  function popCarrierPowerup(e){
    if(!e || e.isPlayer || !e.carriesPowerup) return;
    dropPowerupRandom();
  }
  function applyPowerup(pu){
    SFX.powerup(); score+=500;
    switch(pu.type){
      case PU.STAR:
        player.stars=Math.min(player.stars+1,4); player.applyStars();
        if(player.bulk>=2) flash("★ 火力全开！装甲加厚");
        else if(player.bulk>=1) flash("★ 火力提升 · 装甲变厚");
        else flash("★ 火力提升 Lv"+player.stars);
        break;
      case PU.GUN: // 手枪：直升 3/4 星 + 立刻变粗装甲体
        player.stars = player.stars>=3 ? 4 : 3;
        player.bulk = player.stars>=4 ? 2 : Math.max(player.bulk, 1);
        player.applyStars();
        flash(player.stars>=4?"🔫 满级火力！装甲加厚可抗弹":"🔫 手枪！可打铁 · 装甲加厚");
        break;
      case PU.BOAT: // 船：最多叠 3 层，每层挡一次伤害 + 可渡水
        player.boatLayers = Math.min(3, (player.boatLayers|0) + 1);
        player.syncBoatFlag();
        SFX.boat();
        flash("⛵ 船 ×"+player.boatLayers+"（最多3层，可渡水）"); break;
      case PU.GRENADE:
        for(const e of enemies){
          if(e.dead) continue;
          if(e.type==="boss"){
            const dmg = Math.max(4, Math.ceil((e.maxHp||e.hp)*0.45));
            e.hp -= dmg;
            boom(e.cx,e.cy,36,["#ff6a20","#ffd24a","#fff"]);
            if(e.hp<=0) killTank(e,true);
            else flash("地雷重创 Boss！剩余 "+e.hp, 1.4);
          } else if(e.type==="flamecar"){
            e.hp -= 3;
            boom(e.cx,e.cy,28,["#ff6a20","#ffd24a","#fff"]);
            if(e.hp<=0) killTank(e,true);
            else flash("地雷重创火焰车！剩余 "+e.hp, 1.2);
          } else {
            e.dead=true; enemiesKilled++; score+=100; boom(e.cx,e.cy,26);
          }
        }
        SFX.bigExplode(); shake=0.4; flash("地雷！普通敌军清除"); break;
      case PU.HELMET:
        player.shield = (player.shield||0) + 10;
        SFX.shield(); flash("🛡 无敌 +10 秒（合计 "+player.shield.toFixed(0)+"s）"); break;
      case PU.TANK:
        lives++; flash("🚗 小坦克！生命 +1"); break;
      case PU.CLOCK:
        freezeTimer = (freezeTimer||0) + 8;
        for(const e of enemies) e.frozen = (e.frozen||0) + 8;
        flash("⏱ 敌方冻结 +8 秒（合计 "+freezeTimer.toFixed(0)+"s）"); break;
      case PU.SHOVEL: // 铲子：基地围墙变铁 12 秒
        shovelTimer=12; setBaseWall(T_STEEL); flash("🛠 基地加固（钢墙）"); break;
    }
  }
  /** 敌方吃到道具时的负面/强化效果（仅敌方吃道具模式） */
  function applyEnemyPowerup(e, pu){
    SFX.powerup();
    switch(pu.type){
      case PU.STAR:
        e.stars=Math.min((e.stars||0)+1,4); e.applyStars();
        flash("⚠ 敌军火力提升！"); break;
      case PU.GUN:
        e.stars = (e.stars||0)>=3 ? 4 : 3; e.applyStars();
        e.hp=Math.max(e.hp,3);
        flash("⚠ 敌军拿到手枪！可打铁"); break;
      case PU.BOAT:
        e.boatLayers = Math.min(3, (e.boatLayers|0) + 1); e.syncBoatFlag();
        flash("⚠ 敌军上船 ×"+e.boatLayers); break;
      case PU.GRENADE:
        if(player&&!player.dead){
          if(player.shield>0){ player.shield=0; flash("敌军地雷被护盾挡下"); }
          else if((player.boatLayers|0)>0){
            player.boatLayers--; player.syncBoatFlag();
            flash("⛵ 船体挡下敌军地雷（剩 "+player.boatLayers+" 层）");
          }
          else if(player.bulk>0){ hurtPlayerBulk(); flash("敌军地雷打掉装甲外形"); }
          else { killTank(player,false); flash("敌军地雷！"); }
        }
        SFX.bigExplode(); shake=0.35; break;
      case PU.HELMET:
        e.shield=(e.shield||0)+8; flash("⚠ 敌军无敌护盾叠加"); break;
      case PU.TANK:
        enemyQueue = endless ? enemyQueue : enemyQueue+1;
        flash("⚠ 敌军增援 +1"); break;
      case PU.CLOCK:
        if(player&&!player.dead){ player.frozen=(player.frozen||0)+6; flash("⏱ 你被冻结 +6 秒！"); }
        break;
      case PU.SHOVEL: // 敌军铲子：扒掉基地围墙
        shovelTimer=0; setBaseWall(T_EMPTY); flash("⚠ 基地围墙被敌军铲子挖空！"); break;
    }

  function setBaseWall(t){
    const bx=12,by=24;
    for(let c=bx-1;c<=bx+2;c++) if(grid[by-1][c]!==T_BASE) grid[by-1][c]=t;
    for(const [r,c] of [[by,bx-1],[by,bx+2],[by+1,bx-1],[by+1,bx+2]]) if(grid[r][c]!==T_BASE) grid[r][c]=t;
  }
  /** 装甲体型被打：变小一级，短暂无敌；火力星级保留，可再吃星/枪变粗 */
  function hurtPlayerBulk(){
    if(!player || player.bulk<=0) return false;
    player.bulk--;
    player.applyBulk();
    player.shield = Math.max(player.shield, 1.2);
    SFX.hitFriendly();
    boom(player.cx, player.cy, 10, ["#ffd24a","#ffb02e","#fff"]);

  /* ---- 子弹与地形/实体交互 ---- */
  /** Boss 宽弹：覆盖子弹矩形内全部格（约 4 格宽）；毁砖/草，遇铁/基地停且不毁铁 */
  function bossHitTerrainWide(b){
    const c0 = Math.floor((b.x - OFF_X) / TILE);
    const c1 = Math.floor((b.x + b.w - 1 - OFF_X) / TILE);
    const r0 = Math.floor((b.y - OFF_Y) / TILE);
    const r1 = Math.floor((b.y + b.h - 1 - OFF_Y) / TILE);
    let hit = false;
    for(let r=r0; r<=r1; r++){
      for(let c=c0; c<=c1; c++){
        if(c<0||c>=FIELD_W||r<0||r>=FIELD_H){ hit=true; continue; }
        const t = grid[r][c];
        if(t===T_BRICK){
          hit=true; grid[r][c]=T_EMPTY;
          const cols = b.kind==="flame" ? ["#ff6a20","#ff4020","#ffd24a"] : ["#c96f3b","#8a4a26","#e0a070"];
          boom(OFF_X+c*TILE+TILE/2, OFF_Y+r*TILE+TILE/2, b.kind==="flame"?7:5, cols);
        } else if(t===T_GRASS && b.kind==="flame"){
          hit=true; grid[r][c]=T_EMPTY;
          boom(OFF_X+c*TILE+TILE/2, OFF_Y+r*TILE+TILE/2, 5, ["#3f9b41","#7ac96a","#ff8a20"]);
        } else if(t===T_STEEL){
          hit=true; SFX.hitSteel();
        } else if(t===T_BASE){
          hit=true;
          if(!(b.owner && b.owner.isPlayer)) baseAlive=false;
          else SFX.hitSteel();
        }
      }
    }
    if(hit && baseAlive!==false) SFX.hitWall();
    return hit;
  }
  function sizeBossBullet(b){
    if(!b || (b.kind!=="ap" && b.kind!=="flame")) return;
    const tileSpan = b.fromFlameCar ? 2 : 4;
    const wide = TILE*tileSpan - 4, thick = b.fromFlameCar ? 14 : 18;
    if(b.dir===DIR.UP||b.dir===DIR.DOWN){ b.w=wide; b.h=thick; }
    else { b.w=thick; b.h=wide; }
  }
  function bulletHitTerrain(b){
    const isBossShot = b.kind==="ap"||b.kind==="flame";
    if(isBossShot) return bossHitTerrainWide(b);
    // 普通弹：前端采样点
    const fx=b.x+b.w/2+DXY[b.dir][0]*b.w/2, fy=b.y+b.h/2+DXY[b.dir][1]*b.h/2;
    const side = b.dir===DIR.UP||b.dir===DIR.DOWN ? [[-6,0],[6,0]] : [[0,-6],[0,6]];
    let hit=false;
    for(const [ox,oy] of [[0,0],...side]){
      const px=fx+ox, py=fy+oy;
      const c=Math.floor((px-OFF_X)/TILE), r=Math.floor((py-OFF_Y)/TILE);
      if(c<0||c>=FIELD_W||r<0||r>=FIELD_H){ hit=true; continue; }
      const t=grid[r][c];
      if(t===T_BRICK){
        grid[r][c]=T_EMPTY; hit=true;
        boom(OFF_X+c*TILE+TILE/2,OFF_Y+r*TILE+TILE/2,5,["#c96f3b","#8a4a26","#e0a070"]);
      }
      else if(t===T_STEEL){ hit=true;
        if(b.power>=3){
          grid[r][c]=T_EMPTY;
          boom(OFF_X+c*TILE+TILE/2,OFF_Y+r*TILE+TILE/2,8,["#cfd6e4","#9aa4b8","#fff"]);
          SFX.hitSteel();
        } else SFX.hitSteel();
      }
      else if(t===T_GRASS && b.power>=4){
        grid[r][c]=T_EMPTY;
        boom(OFF_X+c*TILE+TILE/2,OFF_Y+r*TILE+TILE/2,6,["#3f9b41","#7ac96a","#2c6e2f"]);
      }
      else if(t===T_BASE){
        hit=true;
        if(!(b.owner && b.owner.isPlayer)) baseAlive=false;
        else SFX.hitSteel();
      }
    }
    if(hit&&baseAlive!==false) SFX.hitWall();
    return hit;
  }
  function killTank(t,byPlayer){
    t.dead=true;
    if(t.type==="boss"){ boom(t.cx,t.cy,48); SFX.bigExplode(); shake=Math.max(shake,0.7); }
    else boom(t.cx,t.cy,26);

    else if(t.type!=="boss"){ SFX.explode(); shake=Math.max(shake,0.25); }
    if(!t.isPlayer){
      enemiesKilled++;
      if(byPlayer){
        const pts={normal:100,fast:200,power:300,mid:350,armor:450,flamecar:800,boss:2500}[t.type]||100;
        score+=pts; flashScore(t.cx,t.cy,pts);
        if(t.type==="boss" && !debugMode) flash("🏆 巨型 Boss 击破！", 1.8);
        if(t.type==="flamecar") flash("🔥 火焰车击破！", 1.4);
      }

      if(t.type==="boss" && debugMode) onDebugBossDefeated();
