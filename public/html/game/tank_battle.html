  const scorePops=[];
  function flashScore(x,y,v){ scorePops.push({x,y,v,t:0.9}); }

  function driveTank(p, vx, vy, fireNow, dt){
    if(!p||p.dead) return false;
    const ox=p.x, oy=p.y;
    p.cool-=dt; p.shield-=dt; p.spawnGhost-=dt;
    if(p.frozen>0){ p.frozen-=dt; vx=0; vy=0; }
    if(p.eject){
      const dx=p.eject.x-p.x, dy=p.eject.y-p.y, dist=Math.hypot(dx,dy);
      const sp=p.speed*1.6*dt;
      if(dist<=sp){ p.x=p.eject.x; p.y=p.eject.y; p.eject=null; }
      else { p.x+=dx/dist*sp; p.y+=dy/dist*sp;
        if(Math.random()<0.5) boom(p.cx,p.cy+p.h/2,2,["#7ad0ff","#a0d8ff"]); }
      vx=vy=0;
    }
    if(vx||vy){
      p.dir = vx>0?DIR.RIGHT:vx<0?DIR.LEFT:vy>0?DIR.DOWN:DIR.UP;
      p.anim+=dt*10;
      const nx=p.x+vx*p.speed*dt, ny=p.y+vy*p.speed*dt;
      if(!tankBlocked(p,nx,p.y)) p.x=nx;
      if(!tankBlocked(p,p.x,ny)) p.y=ny;
      if(vy&&!vx){ const snap=Math.round((p.x-OFF_X-1)/(TILE/2))*(TILE/2)+OFF_X+1;
        const d=snap-p.x;
        if(d){ const step=Math.sign(d)*Math.min(Math.abs(d),p.speed*dt);
          if(!tankBlocked(p,p.x+step,p.y)) p.x+=step; } }
      if(vx&&!vy){ const snap=Math.round((p.y-OFF_Y-1)/(TILE/2))*(TILE/2)+OFF_Y+1;
        const d=snap-p.y;
        if(d){ const step=Math.sign(d)*Math.min(Math.abs(d),p.speed*dt);
          if(!tankBlocked(p,p.x,p.y+step)) p.y+=step; } }
    }
    if(fireNow && !(p.frozen>0)) fire(p);
    for(const pu of powerups){
      if(pu.dead||!rectHit(p.rect(),{x:pu.x,y:pu.y,w:TILE*2,h:TILE*2})) continue;
      pu.dead=true;
      if(p===player){ applyPowerup(pu); continue; }
      // 队友拾取：个人强化给该车，全局效果走原逻辑
      if(pu.type===PU.STAR){ p.stars=Math.min(4,(p.stars||0)+1); p.applyStars(); flash("⭐ 队友升星"); }
      else if(pu.type===PU.GUN){ p.stars=Math.max(p.stars||0,3); p.applyStars(); flash("🔫 队友拿到手枪"); }
      else if(pu.type===PU.HELMET){ p.shield=(p.shield||0)+12; flash("🛡 队友护盾叠加"); }
      else if(pu.type===PU.BOAT){
        p.boatLayers=Math.min(3,(p.boatLayers|0)+1); p.syncBoatFlag();
        flash("⛵ 队友船 ×"+p.boatLayers);
      }
      else if(pu.type===PU.TANK){ lives++; flash("🚗 生命 +1"); }
      else applyPowerup(pu);
    }
    return (Math.abs(p.x-ox)+Math.abs(p.y-oy)) > 0.05;
  }
  function hurtFriendly(t, b){
    if(t.shield>0){ SFX.hitSteel(); boom(b.x+3,b.y+3,6,["#7ad0ff","#fff"]); return; }
    if(t.bulk>0){
      t.bulk-=1; t.applyBulk(); SFX.hitFriendly(); boom(b.x+3,b.y+3,8,["#ffd24a","#fff"]);
      if(t===player) flash("装甲被打掉一层！");
      return;
    }
    if((t.boatLayers|0)>0){
      t.boatLayers--; t.syncBoatFlag(); SFX.hitFriendly();
      if(t===player) flash(t.boatLayers>0 ? ("⛵ 船体抵挡！剩 "+t.boatLayers+" 层") : "⛵ 船体护盾耗尽！");
      boom(t.cx,t.cy,10,["#7ad0ff","#3f7fd0","#fff"]);
      if(!t.boat && onWater(t)){
        const spot=findLandSpot(t);
        if(spot){ t.eject=spot; t.shield=Math.max(t.shield,1.5); }
      }
      return;
    }
    killTank(t,false);
  }
  function buildNetState(){
    const packT=t=>({
      pid:t.coopPid||"", name:t.coopName||"", slot:t.coopSlot|0,
      x:t.x|0, y:t.y|0, dir:t.dir, dead:t.dead?1:0,
      stars:t.stars|0, boat:t.boat?1:0, boatLayers:t.boatLayers|0, bulk:t.bulk|0,
      sh:+(t.shield||0).toFixed(1), sg:+(t.spawnGhost||0).toFixed(1), fz:+(t.frozen||0).toFixed(1)
    });
    const friends=friendlyTanks().map(packT);
    const fullGrid = grid ? grid.map(row=>row.join("")).join("|") : "";
    const gridChanged = fullGrid !== coopGridSent;
    if(gridChanged) coopGridSent = fullGrid;
    // 紧凑字段：客机 JSON.parse 更轻；地图仅变化时附带
    return {
      type:"state",
      level, score, lives, enemyQueue, enemiesKilled, baseAlive:baseAlive?1:0,
      freezeTimer:+freezeTimer.toFixed(2), shovelTimer:+shovelTimer.toFixed(2),
      clearGrace:+clearGrace.toFixed(2), stateName, overReason: overReason||"",
      grid: gridChanged ? fullGrid : undefined,
      players: friends,
      enemies: enemies.filter(e=>!e.dead).map(e=>([
        e.x|0, e.y|0, e.dir, e.hp|0, e.type||"n", e.stars|0, e.speed|0,
        +(e.spawnGhost||0).toFixed(1), +(e.shield||0).toFixed(1), +(e.frozen||0).toFixed(1),
        e.maxHp|0, e.bossAmmo||"", e.bossTier|0
      ])),
      bullets: bullets.filter(b=>!b.dead).map(b=>([
        b.x|0,b.y|0,b.dir,b.power|0,b.owner&&b.owner.isPlayer?1:0, b.kind||"n",
        +(b.bossBulletVis!=null?b.bossBulletVis:1).toFixed(2),
        b.blockHp|0, b.fromFlameCar?1:0
      ])),
      powerups: powerups.filter(p=>!p.dead).map(p=>([p.type,p.x|0,p.y|0,+p.life.toFixed(1)]))
    };
  }
  function applyNetState(msg){
    if(!msg) return;
    level=msg.level|level; score=msg.score|0; lives=msg.lives|0;
    enemyQueue=msg.enemyQueue; enemiesKilled=msg.enemiesKilled|0;
    baseAlive=!!msg.baseAlive; freezeTimer=msg.freezeTimer||0; shovelTimer=msg.shovelTimer||0;
    clearGrace=msg.clearGrace||0;
    if(msg.overReason!=null && msg.overReason!=="") overReason=msg.overReason;
    if(msg.stateName && msg.stateName!=="menu"){
      const prev=stateName;
      stateName=msg.stateName;
      if(stateName!==prev && (stateName==="gameover"||stateName==="levelClear")) stateTime=0;
    }
    if(msg.grid){
      const rows=String(msg.grid).split("|");
      if(rows.length===FIELD_H){
        grid=rows.map(r=>r.split("").map(ch=>+ch));
        coopGridSent=msg.grid;
      }
    }
    // players：客机对自己坦克做「死区 + 软跟 + 大偏差硬贴」；队友硬贴目标点供插值
    // 客机无本地碰撞权威：用 dead/bulk/boat 变化轻量补受击/爆炸声（每事件最多一声）
    const seen={};
    let guestFriendBoom=false, guestFriendHit=false;
    (msg.players||[]).forEach(ps=>{
      seen[ps.pid]=true;
      let t = (ps.pid===coopMyPid) ? player : coopAllies[ps.pid];
      if(!t){
        t=spawnAtSlot(ps.slot|0, ps.pid, ps.name);
        if(ps.pid===coopMyPid) player=t; else coopAllies[ps.pid]=t;
      }
      const isSelf = ps.pid===coopMyPid;
      const px=ps.x|0, py=ps.y|0;
      const wasDead=!!t.dead, prevBulk=t.bulk|0, prevBoatLayers=t.boatLayers|0;
      if(isSelf && COOP_PREDICT && player && !ps.dead && stateName==="playing"){
        const dx=px-t.x, dy=py-t.y, dist=Math.hypot(dx,dy);
        if(dist>COOP_PRED_SOFT){ t.x=px; t.y=py; }
        else if(dist>COOP_PRED_DEAD){ t.x+=dx*COOP_PRED_BLEND; t.y+=dy*COOP_PRED_BLEND; }
        // else 死区内完全相信本地预测
      } else if(!isSelf && COOP_PREDICT){
        t._tx=px; t._ty=py;
        if(t._hasNet==null || Math.hypot(px-t.x,py-t.y)>48){ t.x=px; t.y=py; }
        t._hasNet=1;
      } else {
        t.x=px; t.y=py;
      }
      t.dir=ps.dir; t.dead=!!ps.dead;
      const starsChanged=(t.stars|0)!==(ps.stars|0) || (t.bulk|0)!==(ps.bulk|0);
      t.stars=ps.stars|0; t.bulk=ps.bulk|0;
      t.boatLayers = ps.boatLayers!=null ? (ps.boatLayers|0) : (ps.boat?1:0);
      t.syncBoatFlag();
      t.shield=(ps.sh!=null?ps.sh:ps.shield)||0;
      t.spawnGhost=(ps.sg!=null?ps.sg:ps.spawnGhost)||0;
      t.frozen=(ps.fz!=null?ps.fz:ps.frozen)||0;
      t.coopName=ps.name||t.coopName;
      if(starsChanged){ t.applyStars(); t.applyBulk(); }
      if(!wasDead && t.dead) guestFriendBoom=true;
      else if(!t.dead && ((t.bulk|0)<prevBulk || (t.boatLayers|0)<prevBoatLayers)) guestFriendHit=true;
      if(ps.pid===coopMyPid) player=t; else coopAllies[ps.pid]=t;
    });
    if(guestFriendBoom) SFX.friendlyExplode();
    else if(guestFriendHit) SFX.hitFriendly();
    for(const pid in coopAllies){ if(!seen[pid] && pid!==coopMyPid) delete coopAllies[pid]; }
    // enemies / bullets / powerups
    const elist=msg.enemies||[];
    let prevEnemyHp=0;
    for(const e of enemies){ if(e&&!e.dead) prevEnemyHp+=e.hp|0; }
    const prevEnemyN=enemies.length;
    while(enemies.length>elist.length) enemies.pop();
    let newEnemyHp=0;
    for(let i=0;i<elist.length;i++){
      const raw=elist[i];
      const es=Array.isArray(raw)?{
        x:raw[0],y:raw[1],dir:raw[2],hp:raw[3],type:raw[4],stars:raw[5],speed:raw[6],
        spawnGhost:raw[7],shield:raw[8],frozen:raw[9],maxHp:raw[10],bossAmmo:raw[11],bossTier:raw[12]
      }:raw;
      let e=enemies[i];
      if(!e){ e=new Tank(es.x,es.y,false); enemies[i]=e; }
      e.dead=false; e.dir=es.dir; e.hp=es.hp;
      e.type=es.type||"normal"; e.speed=es.speed||60;
      e.spawnGhost=es.spawnGhost||0; e.shield=es.shield||0; e.frozen=es.frozen||0;
      if(COOP_PREDICT){
        e._tx=es.x; e._ty=es.y;
        if(e._hasNet==null || Math.hypot(es.x-e.x,es.y-e.y)>40){ e.x=es.x; e.y=es.y; }
        e._hasNet=1;
      } else {
        e.x=es.x; e.y=es.y;
      }
      if((e.stars|0)!==(es.stars|0)){ e.stars=es.stars|0; e.applyStars(); }
      if(e.type==="boss"){
        e.w=BOSS_SIZE; e.h=BOSS_SIZE;
        e.maxHp = es.maxHp || e.maxHp || e.hp;
        e.carriesPowerup=false;
        e.bulletPower=1;
        const tier = es.bossTier || e.bossTier || bossTierOfLevel(level);
        const p = bossProfile(tier);
        e.bossTier=p.tier; e.bossName=p.name; e.bossBarrels=p.barrels; e.bossArmor=p.armor;
        e.bossBodyVis=p.bodyVis; e.bossBulletVis=p.bulletVis; e.bossStyle=p.style;
        e.bossC1=p.c1; e.bossC2=p.c2; e.bossAccent=p.accent;
        if(es.bossAmmo==="flame"||es.bossAmmo==="ap") e.bossAmmo=es.bossAmmo;
        else e.bossAmmo = p.ammo;
      } else if(e.type==="flamecar"){
        e.w=TILE*2-2; e.h=TILE*2-2;
        e.maxHp = es.maxHp || e.maxHp || 5;
        e.bossAmmo="flame"; e.bossBulletVis=1; e.bulletPower=1;
      } else if(e.w!==TILE*2-2){ e.applyBulk(); }
      newEnemyHp+=e.hp|0;
    }
    if(elist.length < prevEnemyN) SFX.explode();
    else if(newEnemyHp < prevEnemyHp) SFX.hitEnemy();
    const blist=msg.bullets||[];
    while(bullets.length>blist.length) bullets.pop();
    for(let i=0;i<blist.length;i++){
      const raw=blist[i];
      const bs=Array.isArray(raw)?{
        x:raw[0],y:raw[1],dir:raw[2],power:raw[3],friend:!!raw[4],kind:raw[5]||"normal",
        bossBulletVis: raw[6], blockHp: raw[7], fromFlameCar: !!raw[8]
      }:raw;
      const kind = bs.kind==="ap"||bs.kind==="flame" ? bs.kind : "normal";
      let b=bullets[i];
      if(!b){ b=new Bullet({isPlayer:!!bs.friend}, bs.x, bs.y, bs.dir, 220, bs.power||1, kind); bullets[i]=b; }
      else {
        b.dead=false; b.x=bs.x; b.y=bs.y; b.dir=bs.dir; b.power=bs.power||1; b.kind=kind;
        b.owner=b.owner||{}; b.owner.isPlayer=!!bs.friend;
      }
      b.fromFlameCar = !!bs.fromFlameCar;
      if(bs.blockHp!=null) b.blockHp=bs.blockHp|0;
      else if(kind==="ap"||kind==="flame") b.blockHp = b.fromFlameCar ? 2 : 4;
      else b.blockHp = 1;
      if(kind==="ap"||kind==="flame"){
        sizeBossBullet(b);
        if(bs.bossBulletVis!=null) b.bossBulletVis=+bs.bossBulletVis;
      } else { b.w=6; b.h=6; }
    }
    const plist=msg.powerups||[];
    while(powerups.length>plist.length) powerups.pop();
    for(let i=0;i<plist.length;i++){
      const raw=plist[i];
      const ps=Array.isArray(raw)?{type:raw[0],x:raw[1],y:raw[2],life:raw[3]}:raw;
      let pu=powerups[i];
      if(!pu){ pu=new PowerUp(ps.type, ps.x, ps.y); powerups[i]=pu; }
      else { pu.type=ps.type; pu.x=ps.x; pu.y=ps.y; }
      pu.dead=false; pu.life=ps.life||10;
    }
  }
  /** 客机：队友插值 + 敌军沿朝向外推（仅 COOP_PREDICT） */
  function coopGuestPresent(dt){
    if(!COOP_PREDICT) return;
    const k=Math.min(1, 14*dt);
    for(const pid in coopAllies){
      const t=coopAllies[pid];
      if(!t||t.dead||t._tx==null) continue;
      t.x+=(t._tx-t.x)*k; t.y+=(t._ty-t.y)*k;
    }
    for(const e of enemies){
      if(!e||e.dead) continue;
      e.anim=(e.anim||0)+dt*10;
      if((e.frozen||0)>0){ e.frozen-=dt; continue; }
      const spd=e.speed||60;
      if(e._tx!=null){
        e._tx+=DXY[e.dir][0]*spd*dt*0.9;
        e._ty+=DXY[e.dir][1]*spd*dt*0.9;
        e.x+=(e._tx-e.x)*k;
        e.y+=(e._ty-e.y)*k;
      }
    }
    for(const b of bullets){
      if(!b||b.dead) continue;
      b.update(dt);
    }
  }
  function onCoopRoster(list){
    if(!coopMode||!coopIsHost||stateName!=="playing") return;
    coopRoster=Array.isArray(list)?list.slice():coopRoster;
    const have={}; friendlyTanks().forEach(t=>{ if(t&&t.coopPid) have[t.coopPid]=true; });
    let used=Object.keys(have).length;
    (list||[]).forEach((p)=>{
      if(!p||!p.pid||have[p.pid]) return;
      const slot=Math.min(used, COOP_SPAWN.length-1);
      const t=spawnAtSlot(slot, p.pid, p.name, null);
      used++;
      if(p.pid===coopMyPid) player=t;
      else coopAllies[p.pid]=t;
      have[p.pid]=true;
      flash("➕ "+(p.name||"玩家")+" 中途加入", 1.4);
      // 强制下一包带全地图
      coopGridSent="";
    });
  }

  /* ---- 更新逻辑 ---- */
  function update(dt){
    const inp=Input.poll();
    stateTime+=dt;

    // 暂停 / 切后台：停 BGM；恢复后继续
    const wantPauseAudio = stateName==="paused" || document.hidden;
    BGM.setPaused(wantPauseAudio);
    // 非对战帧停履带音（菜单/暂停/结算/切后台）
    if(wantPauseAudio || stateName!=="playing") SFX.stopEngine();
    // 背景音乐：清理缓冲期播 clear，其余跟状态
    if(!wantPauseAudio){
      let track={menu:"menu",playing:"play",paused:"play",levelClear:"clear",gameover:"over"}[stateName];
      if(stateName==="playing" && clearGrace>0) track="clear";
      if(track) BGM.ensure(track);
    }

    if(stateName==="menu"){
      // 联机大厅打开时冻结菜单，避免点「开始」被当成闯关开局又回到标题
      if(window.TankCoop && TankCoop.isOpen && TankCoop.isOpen()){
        Input.consume(); return;
      }
      if(inp.my<0&&!menuMoved){ menuSel=(menuSel+MENU_COUNT-1)%MENU_COUNT; menuMoved=true; }
      else if(inp.my>0&&!menuMoved){ menuSel=(menuSel+1)%MENU_COUNT; menuMoved=true; }
      else if(!inp.my) menuMoved=false;
      if(Input.state.startPressed){
        if(menuSel===4){
          if(window.TankCoop) window.TankCoop.open();
          Input.consume(); return;
        }
        coopMode=false; coopSend=null;
        endless=menuSel===1;
        enemyLootMode=menuSel===2;
        debugMode=menuSel===3;
        debugBossCleared=false;
        debugBossDelay=0;
        debugBossWave=1;
        if(menuSel===2) endless=false; // 敌方吃道具以闯关形式进行
        // 测试模式从第 1 只 Boss 关（第 5 关）开始连刷 10 只
        level = debugMode ? 5 : 1;
        score=0; lives=30; player=null; coopAllies={};
        newLevel(); stateName="playing";
      }
      Input.consume(); return;
    }
    if(stateName==="gameover"||stateName==="levelClear"){
      // 结束画面：震屏迅速停住，不要一直抖
      shake = Math.max(0, shake - dt * 2.5);
      if(stateTime>0.45) shake = 0;
      flashTime=Math.max(0,flashTime-dt);
      // 联机客机：只看结算，不能自行重开/进下一关
      if(coopMode && !coopIsHost){
        Input.consume(); return;
      }
      if(stateTime>1.2 && Input.state.startPressed){
        if(stateName==="levelClear"){
          if(!endless && level>=CAMPAIGN_LEVELS){ stateName="menu"; menuSel=0; coopMode=false; }
          else { level++; newLevel(); stateName="playing"; coopGridSent=""; }
        }
        else {
          // 游戏结束：房主重开本局；单机回菜单
          if(coopMode && coopIsHost){
            level=1; score=0; lives=30; overReason="";
            newLevel(); stateName="playing"; coopGridSent="";
            if(coopSend) coopSend({type:"event", name:"restart"});
            flash("房主已重开", 1.2);
          } else {
            stateName="menu"; menuSel=0; coopMode=false; shake=0;
          }
        }
      }
      Input.consume(); return;
    }
    if(Input.state.pausePressed){
      if(stateName==="playing"||stateName==="paused"){
        stateName = stateName==="paused" ? "playing" : "paused"; SFX.pause();
      }
      Input.consume(); return;
    }
    if(stateName==="paused"){ Input.consume(); return; }
    if(document.hidden){ Input.consume(); return; }

    /* --- 联机客机：发输入 + 可选本地预测（COOP_PREDICT） --- */
    if(coopMode && !coopIsHost){
      if(coopSend && stateName==="playing"){
        const mx=inp.mx|0, my=inp.my|0;
        const holding=!!inp.fire;
        const fireEdge=holding && !coopFireHeld;
        coopFireHeld=holding;
        coopInputAcc+=dt;
        const moved=mx!==coopLastIn.mx || my!==coopLastIn.my;
        if(fireEdge || moved || coopInputAcc>=0.1){
          coopInputAcc=0;
          coopLastIn={mx,my};
          coopSend({type:"input", mx, my, fire:holding});
        }
        // 只预测移动，开火仍以房主为准
        if(COOP_PREDICT && player&&!player.dead) driveTank(player, mx, my, false, dt);
      }
      coopGuestPresent(dt);
      // 客机：仅友军位移触发履带音（敌军移动不播，避免战场吵杂）
      {
        let movers=0;
        for(const t of friendlyTanks()){
          if(!t||t.dead) continue;
          if(t._lx==null){ t._lx=t.x; t._ly=t.y; }
          if(Math.abs(t.x-t._lx)+Math.abs(t.y-t._ly)>0.08) movers++;
          t._lx=t.x; t._ly=t.y;
        }
        SFX.setEngine(movers ? Math.min(1.1, 0.55 + movers*0.15) : 0);
      }
      for(const pt of particles) pt.update(dt);
      particles=particles.filter(p=>p.life>0);
      shake=Math.max(0,shake-dt);
      flashTime=Math.max(0,flashTime-dt);
      Input.consume();
      return;
    }

    /* --- playing（单机 / 房主） --- */
    let movers=0;
    if(driveTank(player, inp.mx, inp.my, inp.fire, dt)) movers++;
    if(coopMode && coopIsHost){
      for(const pid in coopAllies){
        const t=coopAllies[pid];
        const ri=coopRemoteInput[pid]||{mx:0,my:0,fire:false};
        if(driveTank(t, ri.mx|0, ri.my|0, !!ri.fire, dt)) movers++;
        // 开火是边沿：避免每帧连发，清掉 fire 等下一次 input
        if(ri.fire) ri.fire=false;
      }
    }
    // 测试模式：Boss 击破后的 3 秒间隔
    tickDebugBossDelay(dt);
    // 敌人生成
    spawnTimer-=dt;
    if(spawnTimer<=0){ trySpawnEnemy(); spawnTimer = endless? Math.max(0.9,2.4-level*0.1) : 2.0; }
    freezeTimer=Math.max(0,freezeTimer-dt);
    if(shovelTimer>0){ shovelTimer-=dt; if(shovelTimer<=0) setBaseWall(T_BRICK); }

    // 敌人AI：随机游走 + 概率朝基地/玩家 + 随机开火；Boss 更霸气、更爱压基地
    for(const e of enemies){
      if(e.dead) continue;
      e.cool-=dt; e.spawnGhost-=dt; e.shield=Math.max(0,(e.shield||0)-dt); e.anim+=dt*10;
      if(e.frozen>0){ e.frozen-=dt; continue; }
      e.aiT=(e.aiT||0)-dt;
      if(e.aiT<=0){
        e.aiT = e.type==="boss" ? rand(0.45,1.2) : (e.type==="flamecar" ? rand(0.4,1.0) : rand(0.6,2.2));
        let chasedPu=false;
        if(enemyLootMode && e.type!=="boss" && e.type!=="flamecar"){
          let best=null, bestD=1e9;
          for(const pu of powerups){
            if(pu.dead) continue;
            const d=Math.hypot(e.cx-(pu.x+TILE), e.cy-(pu.y+TILE));
            if(d<bestD){ bestD=d; best=pu; }
          }
          if(best && bestD<220){
            chasedPu=true;
            e.dir = Math.abs(e.cx-(best.x+TILE))>Math.abs(e.cy-(best.y+TILE))
              ? (e.cx<best.x+TILE?DIR.RIGHT:DIR.LEFT)
              : (e.cy<best.y+TILE?DIR.DOWN:DIR.UP);
          }
        }
        if(!chasedPu){
          const roll=Math.random();
          if(e.type==="boss"){
            // Boss：多朝基地/玩家压进，少瞎转
            if(roll<0.55){
              e.dir = Math.abs(e.cx-(OFF_X+13*TILE))>TILE*1.2
                ? (e.cx<OFF_X+13*TILE?DIR.RIGHT:DIR.LEFT) : DIR.DOWN;
            } else if(roll<0.9){
              const tgt=nearestFriendly(e);
              if(tgt){
                e.dir = Math.abs(e.cx-tgt.cx)>Math.abs(e.cy-tgt.cy)
                  ? (e.cx<tgt.cx?DIR.RIGHT:DIR.LEFT) : (e.cy<tgt.cy?DIR.DOWN:DIR.UP);
              } else e.dir=DIR.DOWN;
            } else e.dir=randi(0,3);
          } else if(e.type==="flamecar"){
            // 火焰车：优先追玩家，其次压基地
            if(roll<0.7){
              const tgt=nearestFriendly(e);
              if(tgt){
                e.dir = Math.abs(e.cx-tgt.cx)>Math.abs(e.cy-tgt.cy)
                  ? (e.cx<tgt.cx?DIR.RIGHT:DIR.LEFT) : (e.cy<tgt.cy?DIR.DOWN:DIR.UP);
              } else e.dir=DIR.DOWN;
            } else if(roll<0.9) e.dir=DIR.DOWN;
            else e.dir=randi(0,3);
          } else if(roll<0.45){ e.dir=randi(0,3); }
          else if(roll<0.75){
            e.dir = Math.abs(e.cx-(OFF_X+13*TILE))>TILE ? (e.cx<OFF_X+13*TILE?DIR.RIGHT:DIR.LEFT) : DIR.DOWN;
          } else {
            const tgt=nearestFriendly(e);
            if(tgt){
              e.dir = Math.abs(e.cx-tgt.cx)>Math.abs(e.cy-tgt.cy)
                ? (e.cx<tgt.cx?DIR.RIGHT:DIR.LEFT) : (e.cy<tgt.cy?DIR.DOWN:DIR.UP);
            }
          }
        }
      }
      const nx=e.x+DXY[e.dir][0]*e.speed*dt, ny=e.y+DXY[e.dir][1]*e.speed*dt;
      if(!tankBlocked(e,nx,ny)){ e.x=nx; e.y=ny; }
      else e.aiT=0;
      if(Math.random()<(e.type==="boss"?dt*0.55:(e.type==="flamecar"?dt*1.05:dt*0.9))) fire(e);
      // 仅敌方吃道具模式才允许敌军拾取
      if(enemyLootMode){
        for(const pu of powerups){
          if(pu.dead) continue;
          if(rectHit(e.rect(),{x:pu.x,y:pu.y,w:TILE*2,h:TILE*2})){
            pu.dead=true; applyEnemyPowerup(e, pu); break;
          }
        }
      }
    }
    // 履带音：仅己方（含联机友军）移动；敌军不播
    SFX.setEngine(movers ? Math.min(1.1, 0.55 + movers*0.15) : 0);

    // 子弹
    for(const b of bullets){
      if(b.dead) continue;
      b.update(dt);
      if(b.kind==="flame" && Math.random()<dt*28){
        particles.push(new Particle(
          b.x+rand(0,b.w), b.y+rand(0,b.h),
          rand(-30,30), rand(-50,-10), rand(0.12,0.3),
          Math.random()<0.5?"#ff8a20":"#ff5020", rand(3,7)
        ));
      }
      if(bulletHitTerrain(b)){
        b.dead=true;
        if(b.kind==="flame") boom(b.x+b.w/2,b.y+b.h/2,14,["#ff6a20","#ffd24a","#ff4020"]);
        else if(b.kind==="ap") boom(b.x+b.w/2,b.y+b.h/2,10,["#e8eef8","#ffd24a","#fff"]);
        else boom(b.x+3,b.y+3,4);
        continue;
      }
      // 子弹对撞：普通弹 1 发抵消；火焰车弹需 2；大 Boss 弹需 4
      for(const ob of bullets){
        if(ob===b||ob.dead||b.dead) continue;
        if(!ob.owner||!b.owner) continue;
        if(!!ob.owner.isPlayer === !!b.owner.isPlayer) continue;
        if(!rectHit(b,ob)) continue;
        // 只由我方弹发起结算，避免双次处理
        if(!b.owner.isPlayer) continue;
        b.dead=true;
        const left = (ob.blockHp!=null ? ob.blockHp : 1) - 1;
        ob.blockHp = left;
        boom(b.x+b.w/2, b.y+b.h/2, left>0?6:10, ["#fff","#ffd24a","#7ad0ff"]);
        if(left<=0){ ob.dead=true; SFX.hitSteel(); }
        else SFX.hitWall();
      }
      if(b.dead) continue;
      // 命中坦克
      if(b.owner.isPlayer){
        for(const e of enemies){
          if(e.dead||e.spawnGhost>0.8) continue;
          if(rectHit(b,e.rect())){ b.dead=true;
            if((e.shield||0)>0){ SFX.hitSteel(); boom(b.x+3,b.y+3,6,["#7ad0ff","#fff"]); }
            else {
              // 红闪：中一发就在地图随机处掉道具（不在坦克脚下）
              popCarrierPowerup(e);
              e.hp-=1; if(e.hp<=0) killTank(e,true);
              else { SFX.hitEnemy(); boom(b.x+3,b.y+3,5,["#cfd6e4","#fff"]); }
            }
            break; }
        }
      } else {
        for(const t of friendlyTanks()){
          if(!t||t.dead||t.spawnGhost>0.8) continue;
          if(rectHit(b,t.rect())){ b.dead=true; hurtFriendly(t,b); break; }
        }
      }
    }
    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>!e.dead);
    for(const pu of powerups) pu.update(dt);
    powerups=powerups.filter(p=>!p.dead);
    for(const pt of particles) pt.update(dt);
    particles=particles.filter(p=>p.life>0);
    for(const sp of scorePops){ sp.t-=dt; sp.y-=24*dt; }
    while(scorePops.length&&scorePops[0].t<=0) scorePops.shift();
    shake=Math.max(0,shake-dt);
    flashTime=Math.max(0,flashTime-dt);

    // 友军死亡（共享生命）；lifeTaken 防止同一尸体多帧重复扣命
    for(const t of friendlyTanks()){
      if(t&&t.dead && !t.lifeTaken){
        t.lifeTaken=true;
        lives--;
        if(lives>0){ respawnFriendly(t); }
        else { doGameOver(); Input.consume(); return; }
      }
    }
    // 基地被毁
    if(!baseAlive){ doGameOver(true); Input.consume(); return; }
    // 关卡通过：先播通关音，留几秒继续移动/捡道具，再进结算
    if(!endless && enemyQueue<=0 && enemies.length===0){
      if(clearGrace<=0){
        clearGrace = CLEAR_GRACE_SEC;
        score+=1000; SFX.levelUp();
        BGM.ensure("clear");
        flash("敌军肃清！还可拾取道具…", CLEAR_GRACE_SEC);
        if(score>hiScore){ hiScore=score; localStorage.tbHiScore=hiScore; }
      } else {
        clearGrace -= dt;
        if(clearGrace<=0){
          stateName="levelClear"; stateTime=0;
          if(level>=CAMPAIGN_LEVELS) flash("🏆 通关全部 "+CAMPAIGN_LEVELS+" 关！");
        }
      }
    }
    // 无尽模式：每杀够一波升难度并换地图（此前只升 Lv 不 rebuild，一直像第一关）
    if(endless && enemiesKilled>=level*15){
      level++;
      flash("〰 无尽模式 · 难度提升至 Lv"+level);
      newLevel();
      coopGridSent="";
      Input.consume();
      return;
    }

    // 房主广播状态（约 20Hz；地图仅变化时带上）
    if(coopMode && coopIsHost && coopSend){
      coopStateAcc+=dt;
      if(coopStateAcc>=0.05){
        coopStateAcc=0;
        try{ coopSend(buildNetState()); }catch(e){}
      }
    }
    Input.consume();
  }
  let menuMoved=false;
  function doGameOver(baseDestroyed){
    stateName="gameover"; stateTime=0; overReason=baseDestroyed?"基地被摧毁！":"生命耗尽"; SFX.gameOver();
    if(baseDestroyed){ shake=0.55; boom(OFF_X+13*TILE,OFF_Y+25*TILE,60); SFX.bigExplode(); }
    else shake=Math.min(shake, 0.2);
    if(score>hiScore){ hiScore=score; localStorage.tbHiScore=hiScore; }
  }

  /* ---------------- 渲染 ---------------- */
  function drawTile(r,c){
    const x=OFF_X+c*TILE, y=OFF_Y+r*TILE, t=grid[r][c];
    if(t===T_BRICK){
      const gr=g.createLinearGradient(x,y,x,y+TILE);
      gr.addColorStop(0,"#b5502a"); gr.addColorStop(1,"#8a3a1e");
      g.fillStyle=gr; g.fillRect(x,y,TILE,TILE);
      g.fillStyle="rgba(0,0,0,.35)";
      g.fillRect(x,y+TILE/2-1,TILE,2); g.fillRect(x+TILE/2-1,y,2,TILE/2); g.fillRect(x+TILE/4-1,y+TILE/2,2,TILE/2);
      g.fillStyle="rgba(255,255,255,.08)"; g.fillRect(x,y,TILE,2);
    } else if(t===T_STEEL){
      const gr=g.createLinearGradient(x,y,x+TILE,y+TILE);
      gr.addColorStop(0,"#e8edf5"); gr.addColorStop(0.5,"#98a2b5"); gr.addColorStop(1,"#5c6577");
      g.fillStyle=gr; g.fillRect(x,y,TILE,TILE);
      g.fillStyle="rgba(255,255,255,.35)"; g.fillRect(x+3,y+3,TILE-6,3);
      g.strokeStyle="rgba(0,0,0,.4)"; g.strokeRect(x+.5,y+.5,TILE-1,TILE-1);
    } else if(t===T_WATER){
      const ph=performance.now()/700;
      const gr=g.createLinearGradient(x,y,x,y+TILE);
      gr.addColorStop(0,"#1b4f9e"); gr.addColorStop(1,"#0e2f66");
      g.fillStyle=gr; g.fillRect(x,y,TILE,TILE);
      g.fillStyle="rgba(140,200,255,.35)";
      const w=Math.sin(ph+r*0.9+c*1.3)*3;
      g.fillRect(x+3,y+6+w,TILE-6,2);
    } else if(t===T_BASE){
      // 美国鹰基地（2x2 只在左上角格绘制一次）
      if(r>0&&grid[r-1][c]===T_BASE) return;
      if(c>0&&grid[r][c-1]===T_BASE) return;
      const s=TILE*2;
      const alive=baseAlive;
      g.fillStyle=alive?"#1a2438":"#2a2a2a"; g.fillRect(x,y,s,s);
      g.strokeStyle=alive?"rgba(232,193,74,.55)":"rgba(80,80,80,.5)"; g.lineWidth=1.5;
      g.strokeRect(x+1,y+1,s-2,s-2);
      const cx=x+s/2, cy=y+s/2;
      // 翅
      g.fillStyle=alive?"#6b3e1f":"#444";
      g.beginPath();
      g.moveTo(cx, cy-2);
      g.lineTo(cx-16, cy+2); g.lineTo(cx-14, cy+8); g.lineTo(cx-4, cy+4);
      g.lineTo(cx+4, cy+4); g.lineTo(cx+14, cy+8); g.lineTo(cx+16, cy+2);
      g.closePath(); g.fill();
      // 身
      g.fillStyle=alive?"#8a5528":"#555";
      g.beginPath(); g.arc(cx, cy+3, 6.5, 0, Math.PI*2); g.fill();
      // 白头（秃鹰）
      g.fillStyle=alive?"#f2f2f0":"#777";
      g.beginPath(); g.arc(cx, cy-6, 5.2, 0, Math.PI*2); g.fill();
      // 喙
      g.fillStyle=alive?"#e8a040":"#666";
      g.beginPath(); g.moveTo(cx+3, cy-6); g.lineTo(cx+9, cy-5); g.lineTo(cx+3, cy-3); g.closePath(); g.fill();
      // 眼
      g.fillStyle="#111"; g.beginPath(); g.arc(cx+1.5, cy-7, 0.9, 0, Math.PI*2); g.fill();
      // 爪/座
      g.fillStyle=alive?"#c9a24a":"#555";
      g.fillRect(cx-7, y+s-7, 14, 3);
      if(!alive){
        g.strokeStyle="rgba(255,80,80,.7)"; g.lineWidth=2;
        g.beginPath(); g.moveTo(x+6,y+6); g.lineTo(x+s-6,y+s-6);
        g.moveTo(x+s-6,y+6); g.lineTo(x+6,y+s-6); g.stroke();
      }
    }
  }
  function drawGrass(r,c){
    const x=OFF_X+c*TILE, y=OFF_Y+r*TILE;
    g.fillStyle="#2c7a30"; g.fillRect(x,y,TILE,TILE);
    g.fillStyle="#3f9b41";
    g.fillRect(x+2,y+2,5,5); g.fillRect(x+11,y+4,6,5); g.fillRect(x+5,y+11,6,6);
    g.fillStyle="#61bd54"; g.fillRect(x+13,y+13,4,4); g.fillRect(x+3,y+8,3,3);
  }
  /**
   * 敌人外观：贴图缩放一律 ≤1（不超过碰撞格/地格占位）。
   * 弱小往小画；厚甲用颜色/铆钉区分，不放大出格。
   */
  function enemyVis(t){
    switch(t.type){
      case "boss":  return {sx:1.0, sy:1.0, track:12, barrel:1.0, turret:14, maxHp:t.maxHp||12};
      case "flamecar": return {sx:1.0, sy:1.0, track:7, barrel:1.0, turret:7, maxHp:5};
      case "fast":  return {sx:0.62, sy:0.72, track:3.5, barrel:0.78, turret:4.5, maxHp:1};
      case "power": return {sx:0.90, sy:0.92, track:5.5, barrel:1.0,  turret:6.0, maxHp:1}; // 炮管不伸出格外
      case "mid":   return {sx:0.92, sy:0.94, track:7,   barrel:0.95, turret:6.8, maxHp:2};
      case "armor": return {sx:1.0,  sy:1.0,  track:8,   barrel:0.95, turret:7.2, maxHp:3};
      default:      return {sx:1.0,  sy:1.0,  track:6,   barrel:0.92, turret:6.5, maxHp:1}; // normal
    }
  }
  /** 火焰车小 Boss：2 格体型，橙红焰纹 + 宽焰口 */
  function drawFlameCarBody(t, w, h){
    const trackW = 7;
    const trackShift = Math.floor(t.anim)%2===0 ? 0 : 2;
    g.fillStyle="#1a0c08";
    g.fillRect(-w/2, -h/2+2, trackW, h-4);
    g.fillRect(w/2-trackW, -h/2+2, trackW, h-4);
    g.fillStyle="#ff6a20";
    for(let i=-h/2+6+trackShift;i<h/2-6;i+=5){
      g.fillRect(-w/2+1.5, i, trackW-3, 2);
      g.fillRect(w/2-trackW+1.5, i, trackW-3, 2);
    }
    const hull = g.createLinearGradient(-w/2, -h/2, w/2, h/2);
    hull.addColorStop(0, "#ff8a40");
    hull.addColorStop(0.45, "#c04018");
    hull.addColorStop(1, "#401008");
    g.fillStyle = hull;
    g.beginPath();
    g.moveTo(-w/2+trackW, -h/2+6);
    g.lineTo(w/2-trackW, -h/2+6);
    g.lineTo(w/2-trackW+2, h/2-6);
    g.lineTo(-w/2+trackW-2, h/2-6);
    g.closePath(); g.fill();
    g.strokeStyle="#ffd24a"; g.lineWidth=1.6; g.stroke();
    // 焰纹
    g.strokeStyle="rgba(255,220,100,.55)"; g.lineWidth=1.2;
    g.beginPath();
    g.moveTo(-6, -h/2+10); g.quadraticCurveTo(-2, 0, -6, h/2-10);
    g.moveTo(6, -h/2+10); g.quadraticCurveTo(2, 0, 6, h/2-10);
    g.stroke();
    // 炮塔
    g.fillStyle="#ff6020";
    g.beginPath(); g.ellipse(0, 2, 9, 8, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle="#ffe080"; g.lineWidth=1.4; g.stroke();
    g.fillStyle="#fff2a0";
    g.beginPath(); g.arc(0, 1, 3, 0, Math.PI*2); g.fill();
    // 宽焰炮口（约 2 格宽感）
    const barrelLen = h/2-2;
    const muzzle = g.createLinearGradient(-w*0.28, 0, w*0.28, 0);
    muzzle.addColorStop(0, "#5a1808");
    muzzle.addColorStop(0.5, "#ff8020");
    muzzle.addColorStop(1, "#5a1808");
    g.fillStyle="#2a1008";
    g.fillRect(-w*0.28, -barrelLen, w*0.56, 8);
    g.fillStyle = muzzle;
    g.fillRect(-w*0.26, -barrelLen-1, w*0.52, 5);
    // 血条
    const maxHp = t.maxHp||5;
    const ratio = Math.max(0, Math.min(1, t.hp/maxHp));
    g.fillStyle="rgba(0,0,0,.65)";
    g.fillRect(-w*0.4, h/2-9, w*0.8, 5);
    g.fillStyle=ratio>0.4?"#ff9040":"#ff5040";
    g.fillRect(-w*0.4, h/2-9, w*0.8*ratio, 5);
    g.fillStyle="#ffe080"; g.font="bold 8px sans-serif"; g.textAlign="center"; g.textBaseline="bottom";
    g.fillText("火焰车", 0, h/2-10);
  }
  /** 10 只 Boss：外观缩放/炮管/装甲递进，碰撞框仍用完整 w/h */
  function drawBossTankBody(t, w, h){
    const tier = t.bossTier || 1;
    const p = bossProfile(tier);
    const barrels = t.bossBarrels || p.barrels;
    const armor = t.bossArmor || p.armor;
    const bodyVis = t.bossBodyVis!=null ? t.bossBodyVis : p.bodyVis;
    const c1 = t.bossC1 || p.c1, c2 = t.bossC2 || p.c2, accent = t.bossAccent || p.accent;
    const isFlame = t.bossAmmo==="flame";
    const style = t.bossStyle || p.style;
    // 早期 Boss 画小一点（仍占 4 格碰撞，方便挪位观感）
    g.save();
    g.scale(bodyVis, bodyVis);
    const trackW = Math.min(15, w*0.2);
    const trackShift = Math.floor(t.anim)%2===0 ? 0 : 3;
    g.fillStyle="#0a0c10";
    g.beginPath(); g.roundRect(-w/2, -h/2+3, trackW, h-6, 2); g.fill();
    g.beginPath(); g.roundRect(w/2-trackW, -h/2+3, trackW, h-6, 2); g.fill();
    g.fillStyle="#3a424c";
    for(let i=-h/2+8+trackShift; i<h/2-8; i+=6){
      g.fillRect(-w/2+2, i, trackW-4, 2.8);
      g.fillRect(w/2-trackW+2, i, trackW-4, 2.8);
    }
    // 负重轮数量随装甲增加
    g.fillStyle="#1a2028";
    const wheels = 2 + Math.min(3, armor);
    for(let i=0;i<wheels;i++){
      const wy = -h/2+14 + i*((h-28)/Math.max(1,wheels-1));
      g.beginPath(); g.arc(-w/2+trackW/2, wy, 4.2, 0, Math.PI*2); g.fill();
      g.beginPath(); g.arc(w/2-trackW/2, wy, 4.2, 0, Math.PI*2); g.fill();
    }
    const hx = -w/2+trackW, hy = -h/2+8, hw = w-trackW*2, hh = h-16;
    const hull = g.createLinearGradient(hx, hy, hx+hw, hy+hh);
    hull.addColorStop(0, c1); hull.addColorStop(1, c2);
    g.fillStyle = hull;
    // 造型分支：不同车体剪影
    g.beginPath();
    if(style<=2){
      // 圆角轻坦
      g.roundRect(hx, hy, hw, hh, 8);
    } else if(style<=4){
      // 楔形前倾
      g.moveTo(hx+8, hy); g.lineTo(hx+hw-8, hy);
      g.lineTo(hx+hw+2, hy+hh*0.35); g.lineTo(hx+hw, hy+hh);
      g.lineTo(hx, hy+hh); g.lineTo(hx-2, hy+hh*0.35); g.closePath();
    } else if(style<=6){
      // 六边形重坦
      g.moveTo(hx+hw*0.2, hy); g.lineTo(hx+hw*0.8, hy);
      g.lineTo(hx+hw+3, hy+hh*0.45); g.lineTo(hx+hw*0.75, hy+hh);
      g.lineTo(hx+hw*0.25, hy+hh); g.lineTo(hx-3, hy+hh*0.45); g.closePath();
    } else if(style<=8){
      // 阶梯装甲
      g.moveTo(hx+4, hy+6); g.lineTo(hx+hw-4, hy+6);
      g.lineTo(hx+hw, hy+hh*0.4); g.lineTo(hx+hw-6, hy+hh);
      g.lineTo(hx+6, hy+hh); g.lineTo(hx, hy+hh*0.4); g.closePath();
    } else {
      // 最终：尖刺棱角
      g.moveTo(hx+10, hy); g.lineTo(hx+hw-10, hy);
      g.lineTo(hx+hw+4, hy+12); g.lineTo(hx+hw, hy+hh-8);
      g.lineTo(hx+hw*0.55, hy+hh+2); g.lineTo(hx+hw*0.45, hy+hh+2);
      g.lineTo(hx, hy+hh-8); g.lineTo(hx-4, hy+12); g.closePath();
    }
    g.fill();
    g.strokeStyle = accent; g.lineWidth = 1.4 + armor*0.2; g.stroke();
    // 装甲横线
    g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 1;
    for(let i=0;i<armor;i++){
      const y = hy + 8 + i*((hh-16)/Math.max(1,armor));
      g.beginPath(); g.moveTo(hx+6, y); g.lineTo(hx+hw-6, y); g.stroke();
    }
    // 侧裙
    g.fillStyle = c2;
    for(let i=0;i<Math.min(4, armor);i++){
      const sy = hy + hh*0.18 + i*8;
      g.fillRect(hx-2-i*0.8, sy, 3.5+i*0.5, 7);
      g.fillRect(hx+hw-1.5, sy, 3.5+i*0.5, 7);
    }
    // 炮塔
    const tw = w*(0.34 + armor*0.035), th = h*(0.24 + armor*0.025);
    g.fillStyle = c1;
    if(style>=9){
      g.beginPath();
      g.moveTo(-tw*0.5, th*0.55); g.lineTo(-tw*0.35, -th*0.15);
      g.lineTo(0, -th*0.35); g.lineTo(tw*0.35, -th*0.15);
      g.lineTo(tw*0.5, th*0.55); g.closePath(); g.fill();
    } else if(style>=5){
      g.beginPath(); g.ellipse(0, th*0.15, tw*0.55, th*0.55, 0, 0, Math.PI*2); g.fill();
    } else {
      g.beginPath(); g.roundRect(-tw/2, -th*0.05, tw, th, 5); g.fill();
    }
    g.strokeStyle = accent; g.lineWidth = 1.8; g.stroke();
    // 徽记 / 名称首字
    g.fillStyle = accent;
    g.font = "bold "+Math.floor(9+armor*0.8)+"px sans-serif";
    g.textAlign="center"; g.textBaseline="middle";
    g.fillText(String(tier), 0, th*0.28);
    // 多联炮管：管径随阶位略增
    const barrelLen = h/2 - 4;
    const spread = Math.min(w*0.5, 8 + barrels*7 + armor);
    const startX = barrels===1 ? 0 : -spread/2;
    const step = barrels===1 ? 0 : spread/(barrels-1);
    const tubeW = 3.2 + armor*0.55;
    for(let i=0;i<barrels;i++){
      const bx = startX + i*step - tubeW/2;
      g.fillStyle = "#10141a";
      g.fillRect(bx, -barrelLen, tubeW, barrelLen+10);
      // 炮口环
      g.fillStyle = isFlame ? "#ff6a20" : "#d8e0ec";
      g.fillRect(bx-0.8, -barrelLen-2, tubeW+1.6, 4);
      if(armor>=4){
        g.fillStyle = "#2a3038";
        g.fillRect(bx-1, -barrelLen*0.55, tubeW+2, 3);
      }
    }
    // 高阶饰件
    if(style>=6){
      g.fillStyle = c2;
      g.beginPath(); g.arc(tw*0.3, 0, 4.5, 0, Math.PI*2); g.fill();
      g.fillStyle = accent;
      g.beginPath(); g.arc(tw*0.3, 0, 2, 0, Math.PI*2); g.fill();
    }
    if(style>=9){
      g.fillStyle = accent;
      g.beginPath(); g.moveTo(-tw*0.4, -th*0.1); g.lineTo(-tw*0.15, -th*0.7); g.lineTo(0, -th*0.2); g.fill();
      g.beginPath(); g.moveTo(tw*0.4, -th*0.1); g.lineTo(tw*0.15, -th*0.7); g.lineTo(0, -th*0.2); g.fill();
    }
    if(style>=10){
      const pulse = 0.35+0.3*Math.sin(performance.now()/120);
      g.strokeStyle = `rgba(255,210,74,${pulse})`; g.lineWidth = 2.5;
      g.beginPath(); g.ellipse(0, 0, w*0.42, h*0.42, 0, 0, Math.PI*2); g.stroke();
    }
    g.restore();
    // 血条 / 名称不随 bodyVis 缩小（读得清）
    const maxHp = t.maxHp||t.hp||1;
    const ratio = Math.max(0, Math.min(1, t.hp/maxHp));
    g.fillStyle = "rgba(0,0,0,.7)";
    g.fillRect(-w*0.42, h/2-12, w*0.84, 7);
    g.fillStyle = ratio>0.5 ? "#6ad4a0" : (ratio>0.25 ? "#e0c060" : "#e05050");
    g.fillRect(-w*0.42, h/2-12, w*0.84*ratio, 7);
    g.fillStyle = accent;
    g.font = "bold 9px sans-serif"; g.textAlign="center"; g.textBaseline="bottom";
    g.fillText((t.bossName||p.name)+" "+tier+"/"+BOSS_TIERS, 0, h/2-13);
  }
  /** 我方：加粗条纹履带 + 塔式炮塔（区别敌军） */
  function drawPlayerTankBody(t, w, h, bulk){
    const trackW = bulk>=2 ? 9 : (bulk>=1 ? 8.5 : 8);
    const trackShift = Math.floor(t.anim)%2===0 ? 0 : 2;
    // 加粗深绿履带 + 金黄条纹（不用负重轮）
    g.fillStyle = bulk ? "#1e3a18" : "#243820";
    g.beginPath();
    g.roundRect(-w/2, -h/2, trackW, h, 2); g.fill();
    g.beginPath();
    g.roundRect(w/2-trackW, -h/2, trackW, h, 2); g.fill();
    g.fillStyle = "rgba(255,230,120,.4)";
    for(let i=-h/2+2+trackShift;i<h/2-2;i+=4){
      g.fillRect(-w/2+1.5, i, trackW-3, 2.2);
      g.fillRect(w/2-trackW+1.5, i, trackW-3, 2.2);
    }
    // 车身金黄
    let c1,c2;
    if(t.coopTint){ c1=t.coopTint[0]; c2=t.coopTint[1]; }
    else if(bulk>=2){ c1="#ffe66a"; c2="#c88810"; }
    else if(bulk>=1){ c1="#ffd84a"; c2="#b87808"; }
    else { c1="#ffcc33"; c2="#d09018"; }
    const hull=g.createLinearGradient(-w/2, -h/2, w/2, h/2);
    hull.addColorStop(0,c1); hull.addColorStop(1,c2);
    g.fillStyle=hull;
    g.fillRect(-w/2+trackW-1, -h/2+5, w-trackW*2+2, h-10);
    g.fillStyle="rgba(255,255,210,.4)";
    g.fillRect(-w/2+trackW, -h/2+5, w-trackW*2, 4);
    g.strokeStyle = bulk>=2 ? "rgba(255,220,80,.95)" : "rgba(255,200,60,.8)";
    g.lineWidth = bulk ? 2 : 1.4;
    g.strokeRect(-w/2+trackW, -h/2+6, w-trackW*2, h-12);
    // 塔式炮塔：下层方台 + 上层圆顶指挥塔
    const baseR = bulk ? 8.2 : 7.2;
    g.fillStyle = bulk>=2 ? "#fff2b0" : "#ffe48a";
    g.fillRect(-baseR*0.85, -2, baseR*1.7, baseR*1.15);
    g.strokeStyle="#a07010"; g.lineWidth=1.3;
    g.strokeRect(-baseR*0.85, -2, baseR*1.7, baseR*1.15);
    g.fillStyle = bulk ? "#fff8d0" : "#ffefb0";
    g.beginPath(); g.arc(0, 1, baseR*0.72, Math.PI, 0); g.fill();
    g.strokeStyle="#b88820"; g.lineWidth=1.1;
    g.beginPath(); g.arc(0, 1, baseR*0.72, Math.PI, 0); g.stroke();
    g.fillStyle="#fffaf0";
    g.beginPath(); g.arc(2.2, -1.5, 2.2, 0, Math.PI*2); g.fill();
    g.strokeStyle="#906818"; g.lineWidth=0.9;
    g.beginPath(); g.arc(2.2, -1.5, 2.2, 0, Math.PI*2); g.stroke();
    star(-1.2, 2.2, bulk?3.4:2.9, "#ffffff");
    const barrelLen = Math.min((h/2-1)*0.95, h/2-1);
    g.fillStyle="#4a3c10";
    g.fillRect(-2.2, -barrelLen, 4.4, barrelLen+2);
    g.fillStyle="#ffe08a";
    g.fillRect(-4.2, -barrelLen+1, 2.2, 5);
    g.fillRect(2.0, -barrelLen+1, 2.2, 5);
    g.fillStyle="#c9a24a";
    g.fillRect(-3.0, -barrelLen, 6.0, 2.4);
    if(t.coopName){
      g.fillStyle="#fff"; g.font="bold 7px sans-serif"; g.textAlign="center";
      g.fillText(String(t.coopName).slice(0,6),0,-h/2+7);
    }
  }
  function drawTank(t){
    if(t.dead) return;
    if(t.spawnGhost>0 && Math.floor(t.spawnGhost*10)%2===0 && !t.isPlayer) return;
    g.save(); g.translate(t.cx,t.cy); g.rotate(t.dir*Math.PI/2);
    const w=t.w,h=t.h;
    const bulk = (t.isPlayer && t.bulk) ? t.bulk : 0;
    if(t.isPlayer){
      drawPlayerTankBody(t, w, h, bulk);
      g.restore();
      if((t.boatLayers|0)>0){
        const layers=t.boatLayers|0;
        const pad=4+layers, pulse=0.65+0.25*Math.sin(performance.now()/200);
        g.strokeStyle=`rgba(90,190,255,${pulse})`; g.lineWidth=2+layers*0.5;
        g.beginPath(); g.roundRect(t.x-pad,t.y-pad,t.w+pad*2,t.h+pad*2,8); g.stroke();
        g.strokeStyle="rgba(160,220,255,.35)"; g.lineWidth=1.5;
        g.beginPath(); g.roundRect(t.x-pad-3,t.y-pad-3,t.w+pad*2+6,t.h+pad*2+6,10); g.stroke();
        g.fillStyle="#7ab8e8"; g.font="bold 10px sans-serif"; g.textAlign="center";
        g.fillText("⛵×"+layers, t.cx, t.y-pad-4);
      }
      if(t.shield>0){
        const a=0.35+0.25*Math.sin(performance.now()/90);
        g.strokeStyle=`rgba(120,210,255,${a})`; g.lineWidth=2.5;
        g.beginPath(); g.arc(t.cx,t.cy,t.w/2+6,0,Math.PI*2); g.stroke();
        g.strokeStyle=`rgba(255,255,255,${a*0.6})`;
        g.beginPath(); g.arc(t.cx,t.cy,t.w/2+9,performance.now()/300,performance.now()/300+Math.PI); g.stroke();
      }
      if(t.frozen>0){ g.fillStyle="rgba(150,220,255,.25)"; g.fillRect(t.x,t.y,t.w,t.h); }
      return;
    }
    if(t.type==="boss"){
      drawBossTankBody(t, w, h);
      g.restore();
      if(t.shield>0){
        const a=0.35+0.25*Math.sin(performance.now()/90);
        g.strokeStyle=`rgba(120,210,255,${a})`; g.lineWidth=2.5;
        g.beginPath(); g.arc(t.cx,t.cy,t.w/2+6,0,Math.PI*2); g.stroke();
      }
      if(t.frozen>0){ g.fillStyle="rgba(150,220,255,.25)"; g.fillRect(t.x,t.y,t.w,t.h); }
      return;
    }
    if(t.type==="flamecar"){
      drawFlameCarBody(t, w, h);
      g.restore();
      if(t.frozen>0){ g.fillStyle="rgba(150,220,255,.25)"; g.fillRect(t.x,t.y,t.w,t.h); }
      return;
    }
    // —— 敌军：方壳 + 圆炮塔（灰/黄/绿）——
    const vis = enemyVis(t);
    g.scale(Math.min(1, vis.sx), Math.min(1, vis.sy));
    const trackW = Math.min(vis.track, w/2-1);
    const trackShift = Math.floor(t.anim)%2===0?0:2;
    const thickBody = t.type==="armor" || t.type==="mid";
    g.fillStyle=thickBody?"#2a2e38":"#333844";
    g.fillRect(-w/2,-h/2,trackW,h); g.fillRect(w/2-trackW,-h/2,trackW,h);
    g.fillStyle="rgba(255,255,255,.18)";
    for(let i=-h/2+trackShift;i<h/2;i+=5){
      g.fillRect(-w/2+1,i,trackW-2,2); g.fillRect(w/2-trackW+1,i,trackW-2,2);
    }
    let c1,c2;
    const hpTier = Math.max(1, Math.min(3, t.hp|0));
    if(hpTier>=3){ c1="#4a9a32"; c2="#163a14"; }
    else if(hpTier>=2){ c1="#ffd84a"; c2="#a07000"; }
    else { c1="#c8c8d0"; c2="#5a5a68"; }
    if(t.carriesPowerup && Math.floor(performance.now()/100)%2===0){
      c1="#ff3a2a"; c2="#7a0808";
    }
    const gr=g.createLinearGradient(-w/2,-h/2,w/2,h/2);
    gr.addColorStop(0,c1); gr.addColorStop(1,c2);
    g.fillStyle=gr; g.fillRect(-w/2+trackW-1,-h/2+3,w-trackW*2+2,h-6);
    if(thickBody){
      const thick = t.type==="armor";
      g.strokeStyle = t.hp>=3 ? "rgba(120,200,90,.75)" : (t.hp>=2 ? "rgba(240,200,60,.75)" : "rgba(220,220,230,.55)");
      g.lineWidth = thick ? 2.2 : 1.6;
      g.strokeRect(-w/2+trackW,-h/2+4,w-trackW*2,h-8);
      g.fillStyle=t.hp>=3?"#4a8a3a":(t.hp>=2?"#c9a24a":"#b0b0b8");
      const rivets=[[-6,-6],[6,-6],[-6,6],[6,6],[0,-7],[0,7]];
      for(const [rx,ry] of rivets){ g.beginPath(); g.arc(rx,ry,thick?1.5:1.1,0,Math.PI*2); g.fill(); }
    }
    if(t.type==="fast"){
      g.fillStyle="rgba(255,255,255,.45)";
      g.fillRect(-2,-h/2+6,4,h-12);
      g.fillStyle="rgba(255,255,255,.3)";
      g.fillRect(-w/2+trackW+1,-4,w-trackW*2-2,2);
    }
    g.fillStyle=t.carriesPowerup && Math.floor(performance.now()/100)%2===0 ? "#ff9080"
      : (t.hp>=3?"#b8e898":(t.hp>=2?"#ffe080":"#c8c8d0"));
    g.beginPath(); g.arc(0,1,vis.turret,0,Math.PI*2); g.fill();
    const barrelLen = Math.min((h/2-1)*vis.barrel, h/2-1);
    g.fillStyle=t.type==="power"?"#3a3030":"#404858";
    const bw = t.type==="power" ? 3.2 : (t.type==="fast" ? 2.0 : 2.4);
    g.fillRect(-bw, -barrelLen, bw*2, barrelLen+4);
    if(t.carriesPowerup){
      const pulse=0.35+0.35*Math.sin(performance.now()/90);
      g.strokeStyle=`rgba(255,60,40,${pulse})`; g.lineWidth=2.2;
      g.beginPath(); g.arc(0,0,w/2+2,0,Math.PI*2); g.stroke();
    }
    g.restore();
    if(t.shield>0){
      const a=0.35+0.25*Math.sin(performance.now()/90);
      g.strokeStyle=`rgba(120,210,255,${a})`; g.lineWidth=2.5;
      g.beginPath(); g.arc(t.cx,t.cy,t.w/2+6,0,Math.PI*2); g.stroke();
      g.strokeStyle=`rgba(255,255,255,${a*0.6})`;
      g.beginPath(); g.arc(t.cx,t.cy,t.w/2+9,performance.now()/300,performance.now()/300+Math.PI); g.stroke();
    }
    if(t.frozen>0){ g.fillStyle="rgba(150,220,255,.25)"; g.fillRect(t.x,t.y,t.w,t.h); }
  }
  function drawBullet(b){
    if(b.kind==="flame"||b.kind==="ap"){
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      g.save(); g.translate(cx, cy); g.rotate(b.dir*Math.PI/2);
      // 碰撞框始终满宽；外观按 bossBulletVis 缩小（前期小弹便于辨认/Boss 挪位）
      const fullW = ((b.dir===DIR.UP||b.dir===DIR.DOWN) ? b.w : b.h) / 2;
      const fullH = ((b.dir===DIR.UP||b.dir===DIR.DOWN) ? b.h : b.w) / 2;
      const vis = Math.max(0.25, Math.min(1, b.bossBulletVis!=null ? b.bossBulletVis : 1));
      const halfW = fullW * vis, halfH = fullH * (0.7 + vis*0.3);
      if(b.kind==="flame"){
        const glow = g.createLinearGradient(-halfW, 0, halfW, 0);
        glow.addColorStop(0, "rgba(255,40,0,0)");
        glow.addColorStop(0.2, "rgba(255,100,20,.55)");
        glow.addColorStop(0.5, "rgba(255,220,120,.9)");
        glow.addColorStop(0.8, "rgba(255,100,20,.55)");
        glow.addColorStop(1, "rgba(255,40,0,0)");
        g.fillStyle = glow;
        g.fillRect(-halfW-3, -halfH-4, halfW*2+6, halfH*2+10);
        g.fillStyle = "#ff6a20";
        g.beginPath(); g.roundRect(-halfW*0.92, -halfH, halfW*1.84, halfH*2, 3); g.fill();
        g.fillStyle = "#fff2a0";
        g.fillRect(-halfW*0.65, -halfH*0.45, halfW*1.3, halfH*0.9);
      } else {
        const steel = g.createLinearGradient(-halfW, 0, halfW, 0);
        steel.addColorStop(0, "#5a6574");
        steel.addColorStop(0.5, "#e8eef8");
        steel.addColorStop(1, "#5a6574");
        g.fillStyle = steel;
        g.beginPath();
        g.moveTo(-halfW, halfH*0.3);
        g.lineTo(-halfW*0.85, -halfH);
        g.lineTo(halfW*0.85, -halfH);
        g.lineTo(halfW, halfH*0.3);
        g.lineTo(halfW*0.7, halfH);
        g.lineTo(-halfW*0.7, halfH);
        g.closePath(); g.fill();
        g.fillStyle = "#ffd24a";
        g.fillRect(-halfW*0.5, -halfH*0.3, halfW, halfH*0.6);
        g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 1; g.stroke();
      }
      // 抵消耐久提示（大 Boss 4 / 火焰车 2）
      const bh = b.blockHp|0;
      if(bh>1){
        g.fillStyle="rgba(0,0,0,.45)";
        g.fillRect(-halfW*0.6, halfH+2, halfW*1.2, 3);
        g.fillStyle="#ffe080";
        const maxB = b.fromFlameCar ? 2 : 4;
        g.fillRect(-halfW*0.6, halfH+2, halfW*1.2*(bh/maxB), 3);
      }
      g.restore();
      return;
    }
    const gr=g.createRadialGradient(b.x+3,b.y+3,0,b.x+3,b.y+3,6);
    if(b.power>=3){ gr.addColorStop(0,"#fff"); gr.addColorStop(0.4,"#ffd24a"); gr.addColorStop(1,"rgba(255,120,40,0)"); }
    else { gr.addColorStop(0,"#fff"); gr.addColorStop(0.5,"#ffe9a0"); gr.addColorStop(1,"rgba(255,220,120,0)"); }
    g.fillStyle=gr; g.fillRect(b.x-3,b.y-3,12,12);
    g.fillStyle=b.power>=3?"#ffd24a":"#eee";
    g.fillRect(b.x+1,b.y+1,4,4);
  }
  function drawPowerup(pu){
    const x=pu.x,y=pu.y,s=TILE*2;
    if(pu.life<4 && Math.floor(pu.life*6)%2===0) return; // 快消失时闪烁
    const bob=Math.sin(pu.t*4)*2;
    g.save(); g.translate(x+s/2,y+s/2+bob);
    // 底板发光
    const glow=g.createRadialGradient(0,0,2,0,0,s*0.8);
    glow.addColorStop(0,"rgba(255,240,150,.5)"); glow.addColorStop(1,"rgba(255,240,150,0)");
    g.fillStyle=glow; g.fillRect(-s,-s,s*2,s*2);
    g.fillStyle="#1c2030"; g.strokeStyle="#ffd24a"; g.lineWidth=2;
    g.beginPath(); g.roundRect(-s/2+2,-s/2+2,s-4,s-4,5); g.fill(); g.stroke();
    g.textAlign="center"; g.textBaseline="middle";
    // 图标（代码绘制）
    switch(pu.type){
      case PU.STAR: star(0,0,9,"#ffd24a"); break;
      case PU.GUN:
        g.fillStyle="#e8e8f0"; g.fillRect(-9,-4,16,6); g.fillRect(-8,2,5,7);
        g.fillStyle="#ffb02e"; g.fillRect(5,-4,4,6); break;
      case PU.BOAT:
        g.fillStyle="#7ab8e8"; g.beginPath(); g.moveTo(-10,3); g.lineTo(10,3); g.lineTo(5,9); g.lineTo(-5,9); g.closePath(); g.fill();
        g.fillStyle="#fff"; g.beginPath(); g.moveTo(0,-9); g.lineTo(0,2); g.lineTo(8,2); g.closePath(); g.fill(); break;
      case PU.GRENADE:
        drawMineIcon(0,1,1);
        break;
      case PU.HELMET:
        g.fillStyle="#9ad0ff"; g.beginPath(); g.arc(0,2,8,Math.PI,0); g.fill();
        g.fillRect(-8,2,16,3); break;
      case PU.TANK:
        // 小坦克（加命）
        g.fillStyle="#3a4a2a";
        g.fillRect(-10,-6,4,14); g.fillRect(6,-6,4,14);
        g.fillStyle="#d8c84a";
        g.fillRect(-7,-4,14,10);
        g.fillStyle="#8a7a1e";
        g.fillRect(-7,5,14,3);
        g.fillStyle="#eadb6a";
        g.beginPath(); g.arc(0,0,3.5,0,Math.PI*2); g.fill();
        g.fillStyle="#6a5c14";
        g.fillRect(-1.5,-11,3,8);
        break;
      case PU.CLOCK:
        g.strokeStyle="#fff"; g.lineWidth=2; g.beginPath(); g.arc(0,0,8,0,Math.PI*2); g.stroke();
        g.beginPath(); g.moveTo(0,0); g.lineTo(0,-5); g.moveTo(0,0); g.lineTo(4,2); g.stroke(); break;
      case PU.SHOVEL:
        g.fillStyle="#c9a06a"; g.fillRect(-2,-9,4,10);
        g.fillStyle="#98a2b5"; g.beginPath(); g.moveTo(-6,1); g.lineTo(6,1); g.lineTo(4,9); g.lineTo(-4,9); g.closePath(); g.fill(); break;
    }
    g.restore();
  }
  function star(cx,cy,r,color){
    g.fillStyle=color; g.beginPath();
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2===0?r:r*0.45;
      g[i===0?"moveTo":"lineTo"](cx+Math.cos(a)*rr,cy+Math.sin(a)*rr); }
    g.closePath(); g.fill();
  }
  /** 触角水雷：黑圆球 + 长触角钉，一眼是雷不是手雷 */
  function drawMineIcon(cx,cy,sc){
    sc=sc||1;
    g.save();
    g.translate(cx,cy);
    g.scale(sc,sc);
    // 阴影
    g.fillStyle="rgba(0,0,0,.4)";
    g.beginPath(); g.ellipse(0,10,10,2.8,0,0,Math.PI*2); g.fill();
    // 先画触角（从球心伸出）
    for(let i=0;i<8;i++){
      const a=-Math.PI/2 + i*(Math.PI/4);
      const x0=Math.cos(a)*5.2, y0=Math.sin(a)*5.2;
      const x1=Math.cos(a)*12.5, y1=Math.sin(a)*12.5;
      g.strokeStyle="#2a2e34"; g.lineWidth=2.6; g.lineCap="round";
      g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
      g.strokeStyle="#8a909c"; g.lineWidth=1.4;
      g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1*0.92,y1*0.92); g.stroke();
      g.fillStyle="#d0d4dc";
      g.beginPath(); g.arc(x1,y1,1.8,0,Math.PI*2); g.fill();
      g.strokeStyle="#1a1e24"; g.lineWidth=0.8;
      g.beginPath(); g.arc(x1,y1,1.8,0,Math.PI*2); g.stroke();
    }
    // 主体黑钢球
    const ball=g.createRadialGradient(-3,-4,1,0,1,11);
    ball.addColorStop(0,"#6a7080");
    ball.addColorStop(0.35,"#2e3440");
    ball.addColorStop(1,"#0a0c10");
    g.fillStyle=ball;
    g.beginPath(); g.arc(0,0,8.2,0,Math.PI*2); g.fill();
    g.strokeStyle="#9aa0ae"; g.lineWidth=1.2;
    g.beginPath(); g.arc(0,0,8.2,0,Math.PI*2); g.stroke();
    // 高光
    g.fillStyle="rgba(255,255,255,.22)";
    g.beginPath(); g.ellipse(-2.5,-3.2,3.2,2.2, -0.5,0,Math.PI*2); g.fill();
    // 顶盖螺丝
    g.fillStyle="#4a505c";
    g.beginPath(); g.arc(0,-1,2.6,0,Math.PI*2); g.fill();
    g.fillStyle="#c8ccd6";
    g.beginPath(); g.arc(0,-1.4,1.1,0,Math.PI*2); g.fill();
    g.restore();
  }

    g.font="bold 26px sans-serif"; g.fillStyle="#ffd24a";
    g.fillText(endless?"∞":(level+"/"+CAMPAIGN_LEVELS),lx,OFF_Y+54);
    if(debugMode){
      g.font="11px sans-serif"; g.fillStyle="#ffb060";
      g.fillText(debugBossCleared?"Boss 已肃清":("Boss "+debugBossWave+"/"+BOSS_TIERS),lx,OFF_Y+72);
    } else if(endless){ g.font="11px sans-serif"; g.fillStyle="#9fb0d0"; g.fillText("难度 Lv"+level,lx,OFF_Y+72); }
    else if(enemyLootMode){ g.font="11px sans-serif"; g.fillStyle="#ff9d7a"; g.fillText("敌方可吃道具",lx,OFF_Y+72); }
    g.font="bold 15px sans-serif"; g.fillStyle="#dfe6f5";
    g.fillText("生命",lx,OFF_Y+108);
    g.fillStyle="#ff7a6a"; g.font="bold 22px sans-serif"; g.fillText("♥ ×"+Math.max(0,lives),lx,OFF_Y+134);
    // 剩余敌人
    g.fillStyle="#dfe6f5"; g.font="bold 15px sans-serif"; g.fillText("敌军",lx,OFF_Y+176);

    else{ const remain=enemyQueue+enemies.length;
      let ex=lx-30, ey=OFF_Y+192;

    // 右侧：分数与状态
    const rx=OFF_X+FIELD_PX+(OFF_X-8)/2+4;

    g.fillStyle="#7ae0a0"; g.font="bold 20px sans-serif"; g.fillText(score,rx,OFF_Y+52);
    g.fillStyle="#dfe6f5"; g.font="bold 15px sans-serif"; g.fillText("最高",rx,OFF_Y+88);
    g.fillStyle="#c0c8dc"; g.font="bold 18px sans-serif"; g.fillText(hiScore,rx,OFF_Y+112);

    g.fillStyle="#dfe6f5"; g.font="bold 15px sans-serif"; g.fillText("火力",rx,OFF_Y+150);
    for(let i=0;i<4;i++) star(rx-27+i*18,OFF_Y+170,7,i<(player?player.stars:0)?"#ffd24a":"#3a4258");
    if(player&&(player.boatLayers|0)>0){
      g.fillStyle="#7ab8e8"; g.font="bold 14px sans-serif";
      g.fillText("⛵ ×"+(player.boatLayers|0),rx,OFF_Y+200);

  function drawFrame(){
    // 背景渐变
    const bg=g.createLinearGradient(0,0,0,CANVAS_H);
    bg.addColorStop(0,"#12121e"); bg.addColorStop(1,"#0a0a12");
    g.fillStyle=bg; g.fillRect(0,0,CANVAS_W,CANVAS_H);
    g.save();
    if(shake>0) g.translate(rand(-1,1)*shake*12,rand(-1,1)*shake*12);
    // 战场底色
    const fg=g.createLinearGradient(OFF_X,OFF_Y,OFF_X,OFF_Y+FIELD_H*TILE);
    fg.addColorStop(0,"#16181f"); fg.addColorStop(1,"#101218");
    g.fillStyle=fg; g.fillRect(OFF_X,OFF_Y,FIELD_PX,FIELD_H*TILE);
    g.strokeStyle="rgba(120,160,255,.25)"; g.lineWidth=2;
    g.strokeRect(OFF_X-1,OFF_Y-1,FIELD_PX+2,FIELD_H*TILE+2);
    if(grid){
      // 先画非草地块
      for(let r=0;r<FIELD_H;r++) for(let c=0;c<FIELD_W;c++)
        if(grid[r][c]!==T_EMPTY&&grid[r][c]!==T_GRASS) drawTile(r,c);
      for(const pu of powerups) drawPowerup(pu);
      for(const e of enemies) drawTank(e);
      for(const t of friendlyTanks()) drawTank(t);
      for(const b of bullets) drawBullet(b);
      // 草最后画（遮挡坦克）
      for(let r=0;r<FIELD_H;r++) for(let c=0;c<FIELD_W;c++)
        if(grid[r][c]===T_GRASS) drawGrass(r,c);
      for(const pt of particles) pt.draw(g);
      // 分数飘字
      g.textAlign="center"; g.font="bold 13px sans-serif";
      for(const sp of scorePops){ g.globalAlpha=Math.min(1,sp.t*2); g.fillStyle="#ffe9a0";
        g.fillText("+"+sp.v,sp.x,sp.y); }
      g.globalAlpha=1;
    }
    g.restore();
    drawHUD();
    // 顶部提示条
    if(flashTime>0){
      g.globalAlpha=Math.min(1,flashTime*2);
      g.fillStyle="rgba(20,26,44,.85)";
      const w=g.measureText(flashMsg).width+60;
      g.fillRect(CANVAS_W/2-w/2,6,w,26);
      g.fillStyle="#ffe9a0"; g.font="bold 14px sans-serif"; g.textAlign="center";
      g.fillText(flashMsg,CANVAS_W/2,24); g.globalAlpha=1;
    }
    if(stateName==="playing" && clearGrace>0){
      g.fillStyle="rgba(10,14,28,.72)";
      g.fillRect(CANVAS_W/2-90, CANVAS_H-36, 180, 26);
      g.fillStyle="#7ae0a0"; g.font="bold 14px sans-serif"; g.textAlign="center";
      g.fillText("过关倒计时 "+clearGrace.toFixed(1)+"s", CANVAS_W/2, CANVAS_H-18);
    }
    if(stateName==="playing" && debugMode && debugBossDelay>0){
      const sec = Math.ceil(debugBossDelay);
      const next = Math.min(BOSS_TIERS, debugBossWave+1);
      const np = bossProfile(next);
      g.fillStyle="rgba(10,14,28,.78)";
      g.fillRect(CANVAS_W/2-150, CANVAS_H/2-36, 300, 72);
      g.strokeStyle="#ffd24a"; g.lineWidth=2; g.strokeRect(CANVAS_W/2-150, CANVAS_H/2-36, 300, 72);
      g.fillStyle="#ffd24a"; g.font="bold 28px sans-serif"; g.textAlign="center";
      g.fillText(String(sec), CANVAS_W/2, CANVAS_H/2-2);
      g.fillStyle="#c8d0e0"; g.font="bold 13px sans-serif";
      g.fillText("下一只："+np.name+"（"+next+"/"+BOSS_TIERS+"）", CANVAS_W/2, CANVAS_H/2+24);
    }
    // 覆盖层
    if(stateName==="menu") drawMenu();
    else if(stateName==="paused") drawOverlay("暂停","按 L / P 或点击暂停键继续");
    else if(stateName==="levelClear"){
      const done=!endless && level>=CAMPAIGN_LEVELS;
      const waitGuest=coopMode && !coopIsHost;
      let sub;
      if(done) sub=waitGuest?("得分 "+score+"　·　等待房主回标题"):("得分 "+score+"　·　按 开火键 回标题");
      else sub=waitGuest?("得分 "+score+"　·　等待房主进入下一关"):("得分 "+score+"　·　按 开火键 进入下一关");
      drawOverlay(done?"全部通关！":("关卡 "+level+" 通过！"), sub);
    }
    else if(stateName==="gameover") drawOverlay("游 戏 结 束",
      overReason+"　·　得分 "+score+(score>=hiScore?"（新纪录！）":"　·　最高 "+hiScore)+
      (coopMode?(coopIsHost?"　·　房主按 开火键 重开":"　·　等待房主重开"):"　·　按 开火键 重新开始"),true);
  }
  function drawOverlay(title,sub,isOver){

    gr.addColorStop(0,isOver?"#ff8a6a":"#8ad0ff"); gr.addColorStop(1,isOver?"#c23a2a":"#3a7fd0");

    g.fillText(title,CANVAS_W/2,CANVAS_H/2-20);

    g.fillText(sub,CANVAS_W/2,CANVAS_H/2+30);

  }

  /* ---- 主循环 ---- */
  let last=performance.now();
  function loop(now){
    let dt=(now-last)/1000; last=now;
    dt=Math.min(dt,0.05);  // 防止切后台后大步长穿墙
    update(dt);
    drawFrame();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  return {
    beginCampaignFromCoop: function(opts){
      opts=opts||{};
      coopMode=true;
      coopMyPid=opts.myPid||"";
      coopHostPid=opts.hostPid||"";
      coopIsHost=!!opts.isHost || (coopMyPid && coopMyPid===coopHostPid);
      coopSend=typeof opts.send==="function" ? opts.send : null;
      coopRoster=Array.isArray(opts.roster)?opts.roster.slice():[];
      coopRemoteInput={};
      coopStateAcc=0; coopInputAcc=0; coopLastIn={mx:0,my:0}; coopFireHeld=false;
      coopGridSent="";
      endless=false; enemyLootMode=false; debugMode=false;
      level=1; score=0; lives=30; player=null; coopAllies={}; overReason="";
      // 中途加入：先进入 playing，等房主 state 覆盖
      newLevel(); stateName="playing";
      flash(opts.lateJoin ? "中途加入 · 同步战场中…" : (coopIsHost?"联机房主 · 同步中":"联机加入 · 等待房主同步"), 1.6);
    },
    onRemoteInput: function(pid, data){
      if(!coopMode||!coopIsHost||!pid) return;
      coopRemoteInput[pid]={
        mx:data&&data.mx|0,
        my:data&&data.my|0,
        fire:!!(data&&data.fire)
      };
    },
    applyNetState: applyNetState,
    onCoopRoster: onCoopRoster,
    isCoopHost: function(){ return coopMode&&coopIsHost; }
  };
})();

/* ---------------- 合作联机 WebSocket 大厅 ---------------- */
(() => {
  const panel = document.getElementById("coopPanel");
  const rosterEl = document.getElementById("coopRoster");
  const msgEl = document.getElementById("coopMsg");
  let ws = null, myPid = "", room = null, hostPid = "";

  function apiBase(){
    if(typeof siteConfig!=="undefined" && siteConfig.apiBase) return siteConfig.apiBase;
    const host = location.hostname;
    if(host==="localhost"||host==="127.0.0.1") return "http://127.0.0.1:8001";
    return location.origin + "/api";
  }
  function wsUrl(){
    return apiBase().replace(/^http/, "ws") + "/game/tank-coop/ws";
  }
  function setMsg(t){ if(msgEl) msgEl.textContent = t||""; }
  function nodeLabel(){
    const h=location.hostname||"";
    if(h==="111.229.172.111") return "国内测试机 "+h;
    if(/toolbasecamp\.com$/i.test(h)) return "主站 "+h;
    if(h==="localhost"||h==="127.0.0.1") return "本地开发";
    return h||"未知";
  }
  function refreshNode(){
    const el=document.getElementById("coopNode");
    if(el) el.textContent=nodeLabel()+" · "+wsUrl();
  }
  function renderRoster(){
    if(!rosterEl) return;
    if(!room){ rosterEl.textContent = "尚未进入房间"; return; }
    const lines = ["房间 "+room.code+" · "+(room.players||[]).length+"/"+room.maxPlayers];
    (room.players||[]).forEach(p=>{
      lines.push((p.host?"👑 ":"· ")+p.name+(p.pid===myPid?"（我）":""));
    });
    rosterEl.textContent = lines.join("\n");
    const codeInp = document.getElementById("coopCode");
    if(codeInp && room.code) codeInp.value = room.code;
  }
  function normalizeCode(raw){
    const digits=String(raw||"").replace(/\D/g,"");
    return digits ? digits.padStart(6,"0").slice(-6) : "";
  }
  function send(obj){
    if(!ws||ws.readyState!==1){ setMsg("未连接服务器，请先创建/加入房间"); return false; }
    ws.send(JSON.stringify(obj));
    return true;
  }
  function startGame(msg){
    room=msg.room||room;
    if(!room){ setMsg("开战失败：房间数据丢失，请重进房间"); return; }
    hostPid=msg.hostPid||hostPid||((room.players||[]).find(p=>p.host)||{}).pid||"";
    const roster=(room&&room.players)||[];
    const isHost = myPid && myPid===hostPid;
    if(typeof Input!=="undefined" && Input.consume) Input.consume();
    closePanel();
    if(typeof Game!=="undefined" && Game.beginCampaignFromCoop){
      Game.beginCampaignFromCoop({
        myPid, hostPid, isHost, roster,
        lateJoin: !!msg.lateJoin,
        send: function(payload){ send(payload); }
      });
    }
  }
  function ensureWs(){
    return new Promise((resolve, reject)=>{
      if(ws && ws.readyState===1){ resolve(ws); return; }
      if(ws && ws.readyState===0){
        const onOpen=()=>{ ws.removeEventListener("error", onErr); resolve(ws); };
        const onErr=()=>{ setMsg("无法连接服务器"); reject(new Error("ws")); };
        ws.addEventListener("open", onOpen, {once:true});
        ws.addEventListener("error", onErr, {once:true});
        return;
      }
      try{
        ws = new WebSocket(wsUrl());
      }catch(e){ reject(e); return; }
      ws.onopen = ()=> resolve(ws);
      ws.onerror = ()=>{ setMsg("无法连接服务器"); reject(new Error("ws")); };
      ws.onclose = ()=>{ setMsg("连接已断开（请重新创建/加入房间）"); room=null; hostPid=""; renderRoster(); };
      ws.onmessage = (ev)=>{
        let msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
        if(msg.type==="hello"){ myPid=msg.pid; }
        else if(msg.type==="joined"){
          myPid=msg.you; room=msg.room;
          if(msg.hostPid) hostPid=msg.hostPid;
          setMsg((msg.lateJoin?"中途加入 ":"已进入房间 ")+room.code+" · 节点 "+nodeLabel());
          renderRoster();
          if(msg.lateJoin) startGame({ room, hostPid, lateJoin:true });
        }
        else if(msg.type==="roster"){
          const prevN=(room&&room.players||[]).length;
          room=msg.room; renderRoster();
          const n=(room.players||[]).length;
          if(n>prevN){
            const names=(room.players||[]).map(p=>p.name).join("、");
            setMsg("房间人数 "+n+"/"+room.maxPlayers+" · "+names);
          }
          if(typeof Game!=="undefined" && Game.onCoopRoster) Game.onCoopRoster((room&&room.players)||[]);
        }
        else if(msg.type==="start"){ setMsg("开战！"); startGame(msg); }
        else if(msg.type==="input"){
          if(typeof Game!=="undefined" && Game.onRemoteInput) Game.onRemoteInput(msg.from, msg);
        }
        else if(msg.type==="state"){
          if(typeof Game!=="undefined" && Game.applyNetState && !Game.isCoopHost()) Game.applyNetState(msg);
        }
        else if(msg.type==="event"){
          if(msg.name==="restart" && typeof Game!=="undefined" && Game.beginCampaignFromCoop && !Game.isCoopHost()){
            startGame({ room, hostPid, lateJoin:false });
          }
        }
        else if(msg.type==="error"){
          const map={room_not_found:"房间不存在（是否双方网址不同？）",bad_password:"密码错误",room_full:"房间已满",
            already_started:"已开局",host_only:"仅房主可开始",already_in_room:"已在房间中",
            not_in_room:"未在房间中，请重新创建/加入"};
          setMsg(map[msg.message]||msg.message||"错误");
        }
      };
    });
  }
  function open(){
    panel.classList.add("open");
    panel.setAttribute("aria-hidden","false");
    refreshNode();
    const nameInp=document.getElementById("coopName");
    if(nameInp && !nameInp.value){
      try{ nameInp.value = localStorage.getItem("tb_tank_coop_name")||("P"+Math.floor(Math.random()*90+10)); }catch(e){}
    }
    setMsg(""); renderRoster();
  }
  function closePanel(){
    panel.classList.remove("open");
    panel.setAttribute("aria-hidden","true");
  }
  function isOpen(){ return !!(panel && panel.classList.contains("open")); }
  function name(){
    const n=(document.getElementById("coopName").value||"Player").trim().slice(0,16);
    try{ localStorage.setItem("tb_tank_coop_name", n); }catch(e){}
    return n;
  }
  function password(){ return (document.getElementById("coopPass").value||"").slice(0,32); }

  document.getElementById("coopCreate").onclick = async (e)=>{
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(typeof Input!=="undefined" && Input.consume) Input.consume();
    try{
      await ensureWs();
      if(!send({type:"create", name:name(), password:password()})) return;
      setMsg("正在创建房间…");
    }catch(err){ setMsg("连接失败"); }
  };
  document.getElementById("coopJoin").onclick = async (e)=>{
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(typeof Input!=="undefined" && Input.consume) Input.consume();
    const code=normalizeCode(document.getElementById("coopCode").value);
    if(!code){ setMsg("请填写 6 位房间号"); return; }
    document.getElementById("coopCode").value=code;
    try{
      await ensureWs();
      if(!send({type:"join", code, name:name(), password:password()})) return;
      setMsg("正在加入 "+code+"…");
    }catch(err){ setMsg("连接失败"); }
  };
  document.getElementById("coopStart").onclick = (e)=>{
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(typeof Input!=="undefined" && Input.consume) Input.consume();
    if(!room){ setMsg("请先创建或加入房间"); return; }
    if(!(myPid && (myPid===hostPid || (room.players||[]).some(p=>p.pid===myPid&&p.host)))){
      setMsg("仅房主可开始"); return;
    }
    if(!send({type:"start", level:1})) return;
    setMsg("正在开战…");
  };
  document.getElementById("coopClose").onclick = (e)=>{
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(typeof Input!=="undefined" && Input.consume) Input.consume();
    send({type:"leave"});
    try{ if(ws) ws.close(); }catch(err){}
    ws=null; room=null; hostPid=""; closePanel();
  };

  panel.addEventListener("touchstart", e=>e.stopPropagation(), {passive:false});
  panel.addEventListener("pointerdown", e=>e.stopPropagation());
  panel.addEventListener("click", e=>e.stopPropagation());

  window.TankCoop = { open, close: closePanel, isOpen };
})();

/* ---------------- 画布缩放：PC 普通横屏 / 手机竖屏自动旋转横屏 ---------------- */
(() => {
  const cvs = document.getElementById("gameCanvas");
  const stage = document.getElementById("rotWrap");
  window.__tbCssLand = false;

  function isWeChat(){ return /MicroMessenger/i.test(navigator.userAgent || ""); }
  /** 手机/平板触屏（不含普通 PC） */
  function isMobile(){
    if(isWeChat()) return true;
    if(window.matchMedia("(pointer: coarse)").matches) return true;
    if(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "")) return true;
    return ("ontouchstart" in window) && (navigator.maxTouchPoints|0) > 1
      && window.matchMedia("(hover: none)").matches;
  }

  /**
   * PC：窗口内等比适配，不旋转。
   * 手机竖屏：舞台旋转 90° 铺满（微信无法系统横屏时靠这个）。
   * 手机已横持：也不旋转，直接铺满。
   */
  function layout(){
    const vw = window.innerWidth || document.documentElement.clientWidth;
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const portrait = vh > vw;
    const useCssLand = isMobile() && portrait;
    window.__tbCssLand = useCssLand;
    document.body.classList.toggle("cssRotate", useCssLand);

    stage.style.position = "fixed";
    stage.style.overflow = "hidden";
    if(useCssLand){
      stage.style.left = "0";
      stage.style.top = "0";
      stage.style.right = "auto";
      stage.style.bottom = "auto";
      stage.style.width = vh + "px";
      stage.style.height = vw + "px";
      stage.style.transformOrigin = "0 0";
      stage.style.transform = "translate(" + vw + "px,0) rotate(90deg)";
      const scale = Math.min(vh / CANVAS_W, vw / CANVAS_H);
      cvs.style.width = Math.floor(CANVAS_W * scale) + "px";
      cvs.style.height = Math.floor(CANVAS_H * scale) + "px";
    } else {
      stage.style.left = "0";
      stage.style.top = "0";
      stage.style.right = "0";
      stage.style.bottom = "0";
      stage.style.width = "auto";
      stage.style.height = "auto";
      stage.style.transform = "none";
      const scale = Math.min(vw / CANVAS_W, vh / CANVAS_H);
      cvs.style.width = Math.floor(CANVAS_W * scale) + "px";
      cvs.style.height = Math.floor(CANVAS_H * scale) + "px";
    }
  }

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 120));
  if(window.visualViewport) window.visualViewport.addEventListener("resize", layout);

  if(isMobile()){
    document.querySelectorAll(".touchUI").forEach(el => { el.style.display = "block"; });
    const bf = document.getElementById("btnFire");
    const bp = document.getElementById("btnPause");
    if(bf) bf.style.display = "flex";
    if(bp) bp.style.display = "flex";
  }

  layout();

  window.__tbThumbAutoStart = function () {
    if (stateName === "menu") {
      menuSel = 0;
      endless = false;
      enemyLootMode = false;
      debugMode = false;
      coopMode = false;
      newLevel();
      stateName = "playing";
    }
  };
})();
</script>
