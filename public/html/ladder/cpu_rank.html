<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌面处理器跑分榜 - 工具大本营</title>
  <meta name="description" content="桌面 CPU 相对跑分排行" data-i18n-content="tools.ladderCpuRank.desc" />
  <link rel="stylesheet" href="../../css/base.css?v=9" />
  <link rel="stylesheet" href="../../css/docs/docs-common.css?v=9" />
  <link rel="stylesheet" href="../../css/ladder/nb-rank.css?v=5" />
</head>
<body>
  <div class="container">
    <aside class="sidebar"></aside>
    <main class="content">
      <div class="tool-header nb-rank-header">
        <h1 data-i18n="tools.ladderCpuRank.title">桌面处理器跑分榜</h1>
      </div>
      <p id="nb-rank-meta" class="nb-rank-meta"></p>
      <div id="nb-rank-filters" class="nb-rank-filters">
        <button type="button" class="is-active" data-brand="all" data-i18n="tools.ladderCpuRank.filterAll">全部</button>
        <button type="button" data-brand="intel">Intel</button>
        <button type="button" data-brand="amd">AMD</button>
        <button type="button" data-brand="apple">Apple</button>
      </div>
      <div class="tool-card ladder-card">
        <div id="nb-rank-list" class="nb-rank-list"></div>
      </div>
    </main>
  </div>
  <script>
    window.NB_RANK_CONFIG = {
      listId: 'cpu',
      i18nPrefix: 'tools.ladderCpuRank',
      filters: ['intel', 'amd', 'apple']
    };
  </script>
  <script src="../../js/locales/en.js"></script>
  <script src="../../js/locales/zh-CN.js"></script>
  <script src="../../js/i18n.js?v=stats1"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/base.js"></script>
  <script src="../../js/common_ui.js?v=icp1"></script>
  <script src="../../js/ladder/nb-rank.js?v=9"></script>
</body>
</html>
