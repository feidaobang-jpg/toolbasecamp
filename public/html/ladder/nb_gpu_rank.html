<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>笔记本显卡跑分榜 - 工具大本营</title>
  <meta name="description" content="笔记本 GPU 相对跑分排行" data-i18n-content="tools.ladderNbGpuRank.desc" />
  <link rel="stylesheet" href="../../css/base.css?v=5" />

        <button type="button" data-brand="amd">Amd</button>

  </div>
  <script>
    window.NB_RANK_CONFIG = {
      listId: 'nb_gpu',
      i18nPrefix: 'tools.ladderNbGpuRank',
      filters: ['nvidia', 'amd', 'intel']

  </script>
  <script src="../../js/locales/en.js"></script>
