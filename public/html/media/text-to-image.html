<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text to Image - Tool Basecamp</title>
  <meta name="description" content="Generate an image from a text prompt via DashScope. Requires sign-in.">
  <link rel="stylesheet" href="../../css/base.css?v=9" />
  <link rel="stylesheet" href="../../css/docs/docs-common.css?v=9" />
  <link rel="stylesheet" href="../../css/media/image-tools.css?v=17" />
  <link rel="stylesheet" href="../../css/tools-form.css?v=1" />
</head>
<body>
  <div class="container">
    <aside class="sidebar"></aside>
    <main class="content">
      <div class="tool-header">
        <h1 data-i18n="tools.textToImage.title">Text to Image</h1>
        <p data-i18n="tools.textToImage.desc">Describe an image in text. Uses Alibaba DashScope. Requires sign-in and daily quota.</p>
      </div>

      <div class="tool-card img-cloud-gate" id="login-gate" hidden>
        <p data-i18n="tools.imageCloud.loginRequired">Please sign in.</p>
        <div class="action-row" style="justify-content:center">
          <a class="tb-btn" id="login-link" href="../auth/login.html" data-i18n="auth.login">Log in</a>
        </div>
      </div>

      <div id="app" hidden>
        <div class="tool-card tb-form">
          <p class="img-cloud-quota" id="balance-line"></p>
          <p class="img-cloud-quota" id="quota-line"></p>
          <div class="field-row">
            <label class="field-label" for="prompt" data-i18n="tools.textToImage.prompt">Prompt</label>
            <textarea id="prompt" rows="4" maxlength="2000" data-i18n-placeholder="tools.textToImage.promptPh" placeholder="e.g. A cozy cafe with wooden door and flowers by the window, soft daylight…"></textarea>
          </div>
          <div class="field-row">
            <span class="field-label" data-i18n="tools.textToImage.sizeLabel">Size</span>
            <div class="tb-radio-row" id="size-row">
              <label><input type="radio" name="t2i-size" value="square" checked /> <span data-i18n="tools.textToImage.sizeSquare">1:1</span></label>
              <label><input type="radio" name="t2i-size" value="portrait" /> <span data-i18n="tools.textToImage.sizePortrait">3:4 / portrait</span></label>
              <label><input type="radio" name="t2i-size" value="landscape" /> <span data-i18n="tools.textToImage.sizeLandscape">4:3 / landscape</span></label>
            </div>
          </div>
          <div class="field-row">
            <div class="instruct-model-head">
              <span class="field-label" data-i18n="tools.textToImage.modelLabel">Model</span>
              <button type="button" class="instruct-select-all" id="select-all-models" data-i18n="tools.textToImage.selectAllModels">Select all</button>
            </div>
            <div class="tb-radio-row instruct-model-row" id="model-row">
              <label>
                <input type="checkbox" name="t2i-model" value="z-image-turbo" data-price="0.04" checked />
                <span data-i18n="tools.textToImage.modelZTurbo">Z-Image Turbo · ≈¥0.04 (recommended)</span>
              </label>
              <label>
                <input type="checkbox" name="t2i-model" value="wan2.7-image" data-price="0.3" />
                <span data-i18n="tools.textToImage.modelWan27">Wan 2.7 · ≈¥0.3</span>
              </label>
              <label>
                <input type="checkbox" name="t2i-model" value="wan2.7-image-pro" data-price="0.6" />
                <span data-i18n="tools.textToImage.modelWan27pro">Wan 2.7-Pro · ≈¥0.6</span>
              </label>
              <label>
                <input type="checkbox" name="t2i-model" value="qwen-image-2.0" data-price="0.2" />
                <span data-i18n="tools.textToImage.model20">Qwen 2.0 · ≈¥0.2</span>
              </label>
            </div>
            <p class="instruct-cost-hint" id="cost-hint"></p>
          </div>
          <div class="tip-box">
            <b data-i18n="tools.textToImage.tip">Tip:</b>
            <span data-i18n="tools.textToImage.tipBody">Be specific about subject, style and lighting. Multi-select models to compare. Queued with retries.</span>
          </div>
          <div class="action-row">
            <button type="button" class="tb-btn" id="run-btn" disabled data-i18n="tools.lifePlans.generate">Generate</button>
            <button type="button" class="tb-btn" id="clear-btn" data-i18n="tools.textToImage.clear">Clear</button>
          </div>
          <div class="img-cloud-busy" id="busy" hidden>
            <span class="img-cloud-spinner" aria-hidden="true"></span>
            <span data-i18n="tools.imageCloud.processing">Processing...</span>
          </div>
          <div class="error-box" id="error-box" role="alert"></div>
          <div class="instruct-results" id="results-wrap" hidden></div>
        </div>
      </div>
    </main>
  </div>
  <script src="../../js/locales/en.js?v=tools8"></script>
  <script src="../../js/locales/zh-CN.js?v=tools8"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/base.js"></script>
  <script src="../../js/media/image-cloud-client.js?v=10"></script>
  <script src="../../js/media/text-to-image.js?v=2"></script>
</body>
</html>
