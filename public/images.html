    <style>
      .img-hub { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
      .img-hub-title { font-size: 1.35rem; font-weight: 700; color: #0f172a; margin: 0 0 6px; }
      .img-hub-sub { color: #64748b; font-size: 0.95rem; margin: 0; line-height: 1.5; }
      .img-hub-tip { font-size: 0.85rem; color: #94a3b8; margin: 8px 0 16px; line-height: 1.45; }
      .img-hub-busy, .img-hub-empty { color: #64748b; font-size: 0.95rem; margin: 12px 0; }
      .img-hub-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
        align-items: stretch;
      }
      @media (min-width: 640px) {
        .img-hub-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
      }
      .img-hub-card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
        overflow: hidden; display: flex; flex-direction: column; height: 100%;
      }
      .img-hub-thumb-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        flex-shrink: 0;
        background: #f1f5f9;
        overflow: hidden;
      }
      .img-hub-thumb {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        -webkit-touch-callout: default;
      }
      .img-hub-body {
        padding: 10px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      .img-hub-prompt {
        font-size: 0.82rem; color: #475569; line-height: 1.4;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: calc(1.4em * 2);
        max-height: calc(1.4em * 2);
      }
      .img-hub-meta { font-size: 0.75rem; color: #94a3b8; line-height: 1.35;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
      .img-hub-creator { font-size: 0.78rem; color: #334155; line-height: 1.35;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
      .img-hub-tabs { margin: 12px 0 4px; }
      .img-hub-cats {
        display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px;
      }
      .img-hub-cat-chip {
        border: 1px solid #e2e8f0; background: #fff; color: #475569;
        border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; cursor: pointer;
      }
      .img-hub-cat-chip.active {
        background: #2563eb; border-color: #2563eb; color: #fff;
      }
      .img-hub-thumb-wrap--sticker {
        background: repeating-conic-gradient(#e2e8f0 0% 25%, #f8fafc 0% 50%) 50% / 16px 16px;
      }
      .img-hub-card--sticker .img-hub-sticker-img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; object-position: center; display: block;
        -webkit-touch-callout: default;
      }
      .img-hub-card--sticker .img-hub-sticker-title {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: normal;
        min-height: 0;
        max-height: none;
        -webkit-line-clamp: unset;
        -webkit-box-orient: unset;
      }
      .img-hub-sticker-hint {
        font-size: 0.75rem; color: #94a3b8; margin: 0; line-height: 1.4;
      }
      .img-hub-preview {
        position: fixed; inset: 0; z-index: 80;
        background: rgba(15, 23, 42, 0.72);
        display: flex; align-items: center; justify-content: center;
        padding: 16px;
      }
      .img-hub-preview-panel {
        background: #fff; border-radius: 14px; padding: 14px;
        max-width: min(92vw, 560px); width: 100%;
        display: flex; flex-direction: column; gap: 10px;
      }
      .img-hub-preview-tip {
        margin: 0; font-size: 0.85rem; color: #64748b; line-height: 1.4;
      }
      .img-hub-preview-img {
        display: block; width: 100%; max-height: min(70vh, 520px);
        object-fit: contain; background:
          repeating-conic-gradient(#e2e8f0 0% 25%, #f8fafc 0% 50%) 50% / 16px 16px;
        border-radius: 10px;
        -webkit-touch-callout: default;
      }
      .img-hub-preview-actions { margin: 0; }
      .img-hub-card .action-row {
        margin-top: auto;
        padding-top: 8px;
        flex-shrink: 0;
      }
      .error-box { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#2563eb' } } } };
    </script>
