<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images — Tool Basecamp</title>
    <meta name="description" content="Public AI-generated images on Tool Basecamp — browse and download.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script src="vendor/tailwindcss.js?v=minimax1"></script>
    <link href="vendor/font-awesome/css/all.min.css?v=minimax1" rel="stylesheet">
    <link rel="stylesheet" href="css/site-mobile-nav.css?v=minimax1">
    <link rel="stylesheet" href="css/tools-hub.css?v=minimax1">
    <link rel="stylesheet" href="css/base.css?v=minimax1">
    <link rel="stylesheet" href="css/docs/docs-common.css?v=minimax1">
    <link rel="stylesheet" href="css/tools-form.css?v=minimax1">
    <style>
      .img-hub { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
      .img-hub-title { font-size: 1.35rem; font-weight: 700; color: #0f172a; margin: 0 0 6px; }
      .img-hub-sub { color: #64748b; font-size: 0.95rem; margin: 0; line-height: 1.5; }
      .img-hub-tip { font-size: 0.85rem; color: #94a3b8; margin: 8px 0 16px; line-height: 1.45; }
      .img-hub-busy, .img-hub-empty { color: #64748b; font-size: 0.95rem; margin: 12px 0; }
      .img-hub-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
        align-items: stretch;
      }
      @media (min-width: 640px) {
        .img-hub-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
      }
      .img-hub-card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
        overflow: hidden; display: flex; flex-direction: column; height: 100%;
      }
      .img-hub-thumb-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        flex-shrink: 0;
        background: #f1f5f9;
        overflow: hidden;
      }
      .img-hub-thumb {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        -webkit-touch-callout: default;
      }
      .img-hub-body {
        padding: 10px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      .img-hub-prompt {
        font-size: 0.82rem; color: #475569; line-height: 1.4;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: calc(1.4em * 2);
        max-height: calc(1.4em * 2);
      }
      .img-hub-meta { font-size: 0.75rem; color: #94a3b8; line-height: 1.35;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
      .img-hub-creator { font-size: 0.78rem; color: #334155; line-height: 1.35;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
      .img-hub-card .action-row {
        margin-top: auto;
        padding-top: 8px;
        flex-shrink: 0;
      }
      .error-box { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#2563eb' } } } };
    </script>
</head>
<body id="top" class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">
    <header class="bg-white border-b border-gray-100 flex-shrink-0 z-40 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 md:gap-8 min-w-0">
            <a href="index.html" class="flex items-center gap-2 flex-shrink-0 min-w-0 max-w-[58vw] sm:max-w-none group">
                <div class="logo-text w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:bg-blue-700 transition-colors">TB</div>
                <h1 class="site-name text-base sm:text-xl font-bold text-gray-900 tracking-tight truncate">Tool Basecamp</h1>
            </a>
            <nav data-nav="main" data-base-path="" class="hidden md:flex items-center gap-8 text-[15px] font-medium text-gray-600"></nav>
            <div id="site-header-mobile-slot" class="flex items-center gap-1 flex-shrink-0 md:hidden ml-auto"></div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <main class="flex-1 flex flex-col w-0 overflow-y-auto bg-gray-50">
            <div id="main-content"></div>
        </main>
    </div>

    <script src="js/locales/en.js?v=minimax1"></script>
    <script src="js/locales/zh-CN.js?v=minimax1"></script>
    <script src="js/i18n.js?v=minimax1"></script>
    <script src="js/config.js?v=minimax1"></script>
    <script src="js/base.js?v=minimax1"></script>
    <script src="js/common_ui.js?v=minimax1"></script>

      (function () {
        function go() { if (typeof renderImageHub === 'function') renderImageHub(); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
        else go();
      })();
    </script>
</body>
</html>
