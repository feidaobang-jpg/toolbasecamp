<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music — Tool Basecamp</title>
    <meta name="description" content="Public AI-generated music on Tool Basecamp — play, pause, and download.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script src="vendor/tailwindcss.js?v=songTab2"></script>
    <link href="vendor/font-awesome/css/all.min.css?v=songTab2" rel="stylesheet">
    <link rel="stylesheet" href="css/site-mobile-nav.css?v=songTab2">
    <link rel="stylesheet" href="css/tools-hub.css?v=songTab2">
    <link rel="stylesheet" href="css/base.css?v=songTab2">
    <link rel="stylesheet" href="css/docs/docs-common.css?v=songTab2">
    <link rel="stylesheet" href="css/tools-form.css?v=songTab2">
    <style>
      .music-hub { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
      .music-hub-title { font-size: 1.35rem; font-weight: 700; color: #0f172a; margin: 0 0 6px; }
      .music-hub-sub { color: #64748b; font-size: 0.95rem; margin: 0; line-height: 1.5; }
      .music-hub-tabs { margin: 12px 0 4px; }
      .music-hub-tip { font-size: 0.85rem; color: #94a3b8; margin: 8px 0 16px; line-height: 1.45; }
      .music-hub-busy, .music-hub-empty { color: #64748b; font-size: 0.95rem; margin: 12px 0; }
      .music-track-list { display: flex; flex-direction: column; gap: 12px; }
      .music-track-card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
        padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
      }
      .music-track-main { min-width: 0; }
      .music-track-title { font-weight: 700; color: #0f172a; font-size: 1rem; }
      .music-track-creator {
        font-size: 0.82rem; color: #334155; margin-top: 4px; line-height: 1.45;
      }
      .music-track-prompt {
        font-size: 0.85rem; color: #475569; margin-top: 4px; line-height: 1.45;
        word-break: break-word;
      }
      .music-track-lyrics {
        font-size: 0.82rem; color: #64748b; margin-top: 4px; line-height: 1.45;
        word-break: break-word;
      }
      .music-track-meta { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
      .music-track-actions { margin: 0; }
      .music-track-card.is-player-open .music-track-actions,
      .music-track-card.is-player-open .music-track-prompt,
      .music-track-card.is-player-open .music-track-lyrics { display: none; }
      .music-track-player { width: 100%; }
      .music-track-player .tb-mp { margin-top: 4px; }
      [data-music-play][data-loading="1"]::after {
        content: ' ';
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-left: 8px;
        border: 2px solid rgba(255,255,255,0.7);
        border-top-color: #fff;
        border-radius: 50%;
        animation: tbc-spin 0.8s linear infinite;
        vertical-align: -2px;
      }
      @keyframes tbc-spin { to { transform: rotate(360deg); } }
      .error-box { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#2563eb' } } } };
    </script>
</head>
<body id="top" class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">
    <header class="bg-white border-b border-gray-100 flex-shrink-0 z-40 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 md:gap-8 min-w-0">
            <a href="index.html" class="flex items-center gap-2 flex-shrink-0 min-w-0 max-w-[58vw] sm:max-w-none group">
                <div class="logo-text w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:bg-blue-700 transition-colors">TB</div>
                <h1 class="site-name text-base sm:text-xl font-bold text-gray-900 tracking-tight truncate">Tool Basecamp</h1>
            </a>
            <nav data-nav="main" data-base-path="" class="hidden md:flex items-center gap-8 text-[15px] font-medium text-gray-600"></nav>
            <div id="site-header-mobile-slot" class="flex items-center gap-1 flex-shrink-0 md:hidden ml-auto"></div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <main class="flex-1 flex flex-col w-0 overflow-y-auto bg-gray-50">
            <div id="main-content"></div>
        </main>
    </div>

    <script src="js/locales/en.js?v=songTab8"></script>
    <script src="js/locales/zh-CN.js?v=songTab8"></script>
    <script src="js/i18n.js?v=songTab8"></script>
    <script src="js/config.js?v=songTab8"></script>
    <script src="js/base.js?v=songTab8"></script>
    <script src="js/common_ui.js?v=songTab8"></script>
    <script src="js/media/music-player.js?v=songTab8"></script>
    <script src="js/music-hub.js?v=songTab8"></script>
    <script>
      (function () {
        function go() { if (typeof renderMusicHub === 'function') renderMusicHub(); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
        else go();
      })();
    </script>
</body>
</html>
