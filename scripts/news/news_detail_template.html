<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - {{site_name}}</title>
    <meta name="keywords" content="{{keywords}}">
    <meta name="description" content="{{description}}">
    <meta name="robots" content="index,follow">
    <link rel="icon" href="{{main_site}}favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../news.css?v=1">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="../index.html" class="brand">
                <div class="brand-mark">{{site_logo_text}}</div>
                <h1 class="brand-title">{{site_name}}</h1>
            </a>
            <a href="{{main_site}}" class="header-link">工具大本营</a>
        </div>
    </header>

    <main class="main main-narrow">
        <div class="crumb">
            <a href="../index.html">{{news_section_name}}</a>
            <span aria-hidden="true">›</span>
            <span>正文</span>
        </div>

        <article class="article">
            <header>
                <h1 class="article-title">{{title}}</h1>
                <div class="article-meta">
                    <span>{{date}}</span>
                    <span>|</span>
                    <span>{{source}}</span>
                </div>
            </header>
            <div class="article-body">
                {{content}}
            </div>
            <p class="article-source">
                原文：
                <a href="{{original_link}}" target="_blank" rel="noopener noreferrer nofollow">来源链接</a>
            </p>
        </article>
    </main>

    <footer class="site-footer">
        <a href="{{main_site}}">返回工具大本营</a>
    </footer>
    <script src="../news-stats.js?v=1" defer></script>
</body>
</html>
