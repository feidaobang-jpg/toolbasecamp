<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - {{site_name}}</title>
    <meta name="keywords" content="{{keywords}}">
    <meta name="description" content="{{description}}">
    <meta name="robots" content="index,follow">
    <link rel="icon" href="{{main_site}}favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#2563eb' } } } };
    </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3 min-w-0">
            <a href="../index.html" class="flex items-center gap-2 flex-shrink-0 group">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-md">{{site_logo_text}}</div>
                <h1 class="text-base sm:text-xl font-bold text-gray-900 tracking-tight truncate">{{site_name}}</h1>
            </a>
            <div class="ml-auto flex items-center gap-4 text-sm">
                <a href="{{main_site}}" class="text-gray-500 hover:text-blue-600">工具大本营</a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div class="text-sm text-gray-500 mb-8 flex items-center gap-2">
            <a href="../index.html" class="hover:text-blue-600">{{news_section_name}}</a>
            <i class="fas fa-chevron-right text-xs"></i>
            <span class="text-gray-900">正文</span>
        </div>

        <article class="bg-white p-8 md:p-12 rounded-2xl shadow-sm border border-gray-100">
            <header class="mb-6">
                <h1 class="text-2xl md:text-3xl font-bold text-gray-900 leading-snug mb-3">{{title}}</h1>
                <div class="flex flex-wrap items-center gap-3 text-sm text-gray-400">
                    <span>{{date}}</span>
                    <span class="text-gray-300">|</span>
                    <span>{{source}}</span>
                </div>
            </header>
            <div class="prose prose-lg prose-blue max-w-none text-gray-600 leading-8">
                {{content}}
            </div>
            <p class="mt-10 text-xs text-gray-400 border-t border-gray-100 pt-4">
                编译自公开报道，仅供参考。原文：
                <a href="{{original_link}}" target="_blank" rel="noopener noreferrer nofollow" class="text-blue-600 hover:underline break-all">来源链接</a>
            </p>
        </article>
    </main>

    <footer class="bg-white border-t border-gray-100 py-10 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-xs text-gray-400 mb-2">Powered by DeepSeek AI · 内容仅供参考</p>
            <a href="{{main_site}}" class="text-xs text-blue-600 hover:underline">返回工具大本营</a>
        </div>
    </footer>
</body>
</html>
