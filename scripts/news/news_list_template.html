<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <meta name="keywords" content="{{keywords}}">
    <meta name="description" content="{{description}}">
    <meta name="robots" content="index,follow">
    <link rel="icon" href="{{main_site}}favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{asset_prefix}}news.css?v=1">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="{{home_href}}" class="brand">
                <div class="brand-mark">{{site_logo_text}}</div>
                <h1 class="brand-title">{{site_name}}</h1>
            </a>
            <a href="{{main_site}}" class="header-link">工具大本营</a>
        </div>
    </header>

    <main class="main">
        <div class="section-head">
            <h2 class="section-title">
                <span class="section-bar" aria-hidden="true"></span>
                {{news_section_name}}
            </h2>
            <p class="section-sub">海外科技资讯中文编译</p>
        </div>

        <div class="news-grid">
            {{news_items}}
        </div>

        {{pagination}}
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="y"></span> Tool Basecamp</p>
        <a href="{{main_site}}">返回工具大本营</a>
    </footer>
    <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
    <script src="{{asset_prefix}}news-stats.js?v=1" defer></script>
</body>
</html>
